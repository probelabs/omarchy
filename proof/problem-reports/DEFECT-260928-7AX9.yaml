schema_version: 1
id: DEFECT-260928-7AX9
title: Inline JSONC comment tail survived stripping and emptied the whole menu
introduced_in: inception
source:
    type: manual_review
classification:
    surface: config_behavior
    severity: medium
    defect_class: missing_validation
    security_relevant: false
description: |
    MenuModel.js stripJsonc stripped only whole-line comments with a line-anchored regex. An inline comment tail after content survived stripping. JSON.parse then rejected the whole file and the catch returned an empty item set. One trailing comment emptied the entire menu. No error surfaced because the catch swallows the parse failure by design. Reproduced on the pristine quattro baseline ce925cb1 with review/upstream-repro-jsonc-inline-comment.js (rc=1).
root_cause:
    missing_requirement: true
    missing_test_partition: true
    missing_mcdc_variable: true
    notes: |
        No requirement modeled the comment-strip decision. Its condition (comment_in_string) had no exercising test. The comment partition held whole-line comments but no inline tail. 3T3F could not catch this class because the parse failure returns an empty set by design.
impact_analysis:
    affected_requirements:
    - SW-REQ-260922-3T3F
    - SW-REQ-260922-E4J2
    - SYS-REQ-260922-PPDW
    affected_interfaces: []
    affected_code:
    - shell/plugins/menu/MenuModel.js
disposition:
    known_issues:
    - KI-MENU-JSONC-STRIP-GAPS
    - KI-MENU-ITEMS-KEY-AMBIGUITY
    - KI-MENU-JSONC-CR-LINE-ENDINGS
    status: covered_by_requirement
    requirements:
    - SW-REQ-260928-C8W1
    rationale: |-
        Known-issue overlap: KI-MENU-JSONC-STRIP-GAPS (block comments) and KI-MENU-ITEMS-KEY-AMBIGUITY still track live parser gaps on the same requirements. This closure covers only its own class. KI-MENU-JSONC-CR-LINE-ENDINGS (a whole-line // comment in a CR-only file runs to the end of the file) is a third live gap on SW-REQ-260922-E4J2: the scanner ends a comment only at a line feed, and PR omacom/omarchy#13968 does not change that.

        SW-REQ-260928-C8W1 models the decision as an equivalence over comment_in_string. On the pr/13968 mirror the PR omacom/omarchy#13968 scanner drops each // comment outside a string. Witnesses in test/shell.d/menu-test.sh cover the rows, and the node replay runs them again.

        Code MC/DC of stripJsonc is 100%. The line break after a comment stays, so 1//c, a line break and 2 still fails to parse. Report #13493 exits 0, and the PR fixes KI-MENU-JSONC-INLINE-COMMENT. stripJsonc is the single JSONC comment stripper in the menu plugin.
