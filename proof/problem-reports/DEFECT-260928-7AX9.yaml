schema_version: 1
id: DEFECT-260928-7AX9
title: Inline JSONC comment tail survived stripping and emptied the whole menu
introduced_in: inception
source:
    type: manual_review
classification:
    surface: config_behavior
    severity: medium
    defect_class: missing_validation
    security_relevant: false
description: >
    MenuModel.js stripJsonc stripped only whole-line comments with a
    line-anchored regex. An inline comment tail after content survived
    stripping. JSON.parse then rejected the whole file and the catch
    returned an empty item set. One trailing comment emptied the entire
    menu. No error surfaced because the catch swallows the parse
    failure by design. Reproduced on the pristine quattro baseline ce925cb1 with
    review/upstream-repro-jsonc-inline-comment.js (rc=1).
root_cause:
    missing_requirement: true
    missing_test_partition: true
    missing_mcdc_variable: true
    notes: >
        No requirement modeled the comment-strip decision. Its condition
        (comment_in_string) had no exercising test. The comment partition
        held whole-line comments but no inline tail. 3T3F could not catch
        this class because the parse failure returns an empty set by design.
impact_analysis:
    affected_requirements:
        - SW-REQ-260922-3T3F
        - SW-REQ-260922-E4J2
        - SYS-REQ-260922-PPDW
    affected_interfaces: []
    affected_code:
        - shell/plugins/menu/MenuModel.js
