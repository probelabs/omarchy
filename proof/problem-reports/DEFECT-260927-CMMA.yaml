schema_version: 1
id: DEFECT-260927-CMMA
title: String-blind trailing-comma strip silently mutated in-string commas in menu labels and actions
introduced_in: inception
source:
    type: manual_review
classification:
    surface: config_behavior
    severity: medium
    defect_class: missing_validation
    security_relevant: false
description: |
    MenuModel.js stripJsonc used the string-blind regex /,(\s*[}\]])/g to strip JSONC trailing commas. The regex matched zero-width whitespace and never tracked string literals. It deleted in-string commas before a closer even though those commas were data. JSON.parse accepted the stripped text, so the corruption stayed silent. Mode (a) corrupted display labels; mode (b) mutated action commands such as "mv f{.bak,}" brace expansions. omarchy-menu runs action strings with full user privileges, so mutated commands executed without warning.
root_cause:
    missing_requirement: true
    missing_test_partition: true
    missing_mcdc_variable: true
    notes: |
        No requirement modeled the comma-drop decision. Its two conditions (comma_in_string, next_char_closes_json) had no exercising test. No test partition held a comma plus closer inside a string literal. 3T3F could not catch this class because the corrupted text still parsed.
