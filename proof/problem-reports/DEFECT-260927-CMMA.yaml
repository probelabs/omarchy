schema_version: 1
id: DEFECT-260927-CMMA
title: String-blind trailing-comma strip silently mutated in-string commas in menu labels and actions
introduced_in: inception
source:
    type: manual_review
classification:
    surface: config_behavior
    severity: medium
    defect_class: missing_validation
    security_relevant: false
description: >
    MenuModel.js stripJsonc used the string-blind regex /,(\s*[}\]])/g to
    strip JSONC trailing commas. The regex matched zero-width whitespace
    and never tracked string literals. It deleted in-string commas before
    a closer even though those commas were data. JSON.parse accepted the
    stripped text, so the corruption stayed silent. Mode (a) corrupted
    display labels; mode (b) mutated action commands such as "mv f{.bak,}"
    brace expansions. omarchy-menu runs action strings with full user
    privileges, so mutated commands executed without warning.
root_cause:
    missing_requirement: true
    missing_test_partition: true
    missing_mcdc_variable: true
    notes: >
        No requirement modeled the comma-drop decision. Its two conditions
        (comma_in_string, next_char_closes_json) had no exercising test.
        No test partition held a comma plus closer inside a string literal.
        3T3F could not catch this class because the corrupted text still
        parsed.
impact_analysis:
    affected_requirements:
        - SW-REQ-260922-3T3F
        - SW-REQ-260922-E4J2
        - SYS-REQ-260922-PPDW
    affected_interfaces: []
    affected_code:
        - shell/plugins/menu/MenuModel.js
disposition:
    status: covered_by_requirement
    requirements:
        - SW-REQ-260927-66FW
    rationale: >
        SW-REQ-260927-66FW models the decision as an equivalence over
        comma_in_string and next_char_closes_json. All five MC/DC rows
        carry witnesses in test/shell.d/menu-test.sh, replayed 1/1 by
        test/node/menumodel-replay.test.mjs on 2026-09-27. A 20,000-case
        differential fuzz against an independent reference scanner found
        zero mismatches. Sibling sweep on 2026-09-27 found no isomorphic
        site: Menu.qml delegates to MenuModel.stripJsonc.
    evidence:
        verified_by:
            - test/shell.d/menu-test.sh
            - test/node/menumodel-replay.test.mjs
        requirement_mcdc_witnesses:
            - requirement: SW-REQ-260927-66FW
              witness: "comma_in_string=T, next_char_closes_json=T, trailing_comma_dropped=F => TRUE"
        obligation_evidence:
            - requirement: SW-REQ-260927-66FW
              obligation_class: malformed_input
              evidence_type: negative
        reviews:
            - REVIEW-21
            - REVIEW-22
    reviewer: agent:kimi-fix-jsonc-refresh
    reviewed_at: "2026-09-27T19:25:00Z"
hardening:
    new_requirements:
        - SW-REQ-260927-66FW
    strengthened_requirements:
        - SW-REQ-260922-3T3F
    added_obligations:
        - requirement: SW-REQ-260927-66FW
          obligation_class: malformed_input
    regression_tests:
        # Bare paths: the resolver's symbol form targets Go `func TestX(`
        # declarations; these suites are bash/node:test. The regression
        # partition is the string-aware comma assertion block in
        # menu-test.sh (SW-REQ-260927-66FW witness rows), replayed under
        # node:test by menumodel-replay.test.mjs.
        - test/shell.d/menu-test.sh
        - test/node/menumodel-replay.test.mjs
    mcdc_witnesses:
        - requirement: SW-REQ-260927-66FW
          witness: "comma_in_string=T, next_char_closes_json=T, trailing_comma_dropped=F => TRUE"
    sibling_sweep:
        scope:
            - shell/plugins/menu/
            - bin/
        checked_at: "2026-09-27"
        reviewer: agent:kimi-fix-jsonc-refresh
        result: "no isomorphic site: Menu.qml delegates to MenuModel.stripJsonc (Menu.qml:240-241); remaining .replace call sites (MenuModel.js:212,220,228,328) are slug/text normalizers with no JSON-structure semantics"
        found: []
