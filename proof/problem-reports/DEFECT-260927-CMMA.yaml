schema_version: 1
id: DEFECT-260927-CMMA
title: String-blind trailing-comma strip silently mutated in-string commas in menu labels and actions
introduced_in: inception
source:
    type: manual_review
classification:
    surface: config_behavior
    severity: medium
    defect_class: missing_validation
    security_relevant: false
description: >
    MenuModel.js stripJsonc used the string-blind regex /,(\s*[}\]])/g to
    strip JSONC trailing commas. Because \s* matches zero characters and the
    regex never tracked string literals, a comma inside a string value
    followed by } or ] (with any amount of whitespace, including none) was
    deleted even though it was data. JSON.parse accepts the stripped text,
    so nothing ever surfaced an error: the corruption was silent. Two
    observed failure modes. Mode (a) display corruption: a label "x, ]y"
    rendered as "x ]y". Mode (b) command mutation, the realistic payload:
    an action "mv f{.bak,}" became "mv f{.bak}" (brace expansion destroyed;
    mv then targets a literal filename) and "awk '{print $1, }'" became
    "awk '{print $1 }'" (output format silently changed for downstream
    pipelines). omarchy-menu executes action strings with the invoking
    user's full privileges, so a mutated command runs mutated with no
    warning. The defect did not escalate privilege - the user authors the
    config - but it violated the explicit-configuration contract invisibly.
    Reproduced old-vs-new on 2026-09-27 (research-delta doc); fixed on this
    branch by the string-aware single-pass scanner.
root_cause:
    missing_requirement: true
    missing_test_partition: true
    missing_mcdc_variable: true
    notes: >
        No requirement modeled the comma-drop decision, so its two
        conditions (comma_in_string, next_char_closes_json) were unexercised
        variables and no test partition held a comma+closer inside a string
        literal. The 3T3F parse-robustness requirement could never catch
        this class because the corrupted text still parsed successfully.
impact_analysis:
    affected_requirements:
        - SW-REQ-260922-3T3F
        - SW-REQ-260922-E4J2
        - SYS-REQ-260922-PPDW
    affected_interfaces: []
    affected_code:
        - shell/plugins/menu/MenuModel.js
disposition:
    status: covered_by_requirement
    requirements:
        - SW-REQ-260927-66FW
    rationale: >
        SW-REQ-260927-66FW models the decision as an equivalence
        (trailing_comma_dropped <=> !comma_in_string & next_char_closes_json)
        with all five MC/DC rows witnessed or dispositioned
        (test/shell.d/menu-test.sh string-aware block, replayed by
        test/node/menumodel-replay.test.mjs, 1/1 pass 2026-09-27) and a
        20,000-case differential fuzz against an independent reference
        scanner with zero mismatches. Sibling-instance sweep 2026-09-27:
        Menu.qml delegates to MenuModel.stripJsonc (single implementation);
        the remaining .replace call sites are slug/text normalizers with no
        JSON-structure semantics - no isomorphic site exists.
    evidence:
        verified_by:
            - test/shell.d/menu-test.sh
            - test/node/menumodel-replay.test.mjs
        requirement_mcdc_witnesses:
            - requirement: SW-REQ-260927-66FW
              witness: "comma_in_string=T, next_char_closes_json=T, trailing_comma_dropped=F => TRUE"
        obligation_evidence:
            - requirement: SW-REQ-260927-66FW
              obligation_class: malformed_input
              evidence_type: negative
        reviews:
            - REVIEW-21
            - REVIEW-22
    reviewer: agent:kimi-fix-jsonc-refresh
    reviewed_at: "2026-09-27T19:25:00Z"
hardening:
    new_requirements:
        - SW-REQ-260927-66FW
    strengthened_requirements:
        - SW-REQ-260922-3T3F
    added_obligations:
        - requirement: SW-REQ-260927-66FW
          obligation_class: malformed_input
    regression_tests:
        # Bare paths: the resolver's symbol form targets Go `func TestX(`
        # declarations; these suites are bash/node:test. The regression
        # partition is the string-aware comma assertion block in
        # menu-test.sh (SW-REQ-260927-66FW witness rows), replayed under
        # node:test by menumodel-replay.test.mjs.
        - test/shell.d/menu-test.sh
        - test/node/menumodel-replay.test.mjs
    mcdc_witnesses:
        - requirement: SW-REQ-260927-66FW
          witness: "comma_in_string=T, next_char_closes_json=T, trailing_comma_dropped=F => TRUE"
    sibling_sweep:
        scope:
            - shell/plugins/menu/
            - bin/
        checked_at: "2026-09-27"
        reviewer: agent:kimi-fix-jsonc-refresh
        result: "no isomorphic site: Menu.qml delegates to MenuModel.stripJsonc (Menu.qml:240-241); remaining .replace call sites (MenuModel.js:212,220,228,328) are slug/text normalizers with no JSON-structure semantics"
        found: []
affects:
