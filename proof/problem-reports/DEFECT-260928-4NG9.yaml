        # declarations; these suites are bash/node:test. The regression
        # partition is the array-root assertion block in menu-test.sh
        # (SW-REQ-260928-BMFE witness rows), replayed under node:test by
        # menumodel-replay.test.mjs.
        - test/shell.d/menu-test.sh
        - test/node/menumodel-replay.test.mjs
    mcdc_witnesses:
        - requirement: SW-REQ-260928-BMFE
          witness: "array_root_present=T, array_root_rejected=T => TRUE"
    sibling_sweep:
        scope:
            - shell/plugins/menu/
            - bin/
        checked_at: "2026-09-28"
        reviewer: agent:kimi-zero-warnings
        result: "no isomorphic site: parseMenuJsonc is the only JSON.parse root-type gate in the menu plugin. The items-shape check already rejects arrays nested under \"items\" (MenuModel.js:84-86). That check is witnessed as the negative row of SW-REQ-260928-BMFE."
        found: []
