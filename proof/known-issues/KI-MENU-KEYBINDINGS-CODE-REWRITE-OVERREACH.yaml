introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Corruption needs code:N or mouse:N text inside a description or command; shipped binds keep such tokens in the key field only
remediation: 'Confine the substitution to the key field: apply match/sub per CSV field instead of on $0, rewriting only field 2'
