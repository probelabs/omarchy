    reproducer_sketch: 'Reported on a hybrid Intel+NVIDIA laptop with a single internal display (Omarchy 4.0.2-1, Quickshell 0.3.1-1, Hyprland 0.56.2-1), twice in one night with no suspend: idle-lock the session and wait several hours. Expected: the lock surface stays alive, or a dead locker is reported as not secure. Actual: Hyprland''s lockscreen failsafe stays up, the shell logs nothing more, and ''omarchy-shell lock status'' still reports secure:true with a stale lastEventAt. (The 1Password StatusNotifierItem warning logged last is present on healthy idle locks too and is not the trigger.)'
