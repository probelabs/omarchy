id: KI-261016-HTAS
title: Lock view continues rendering while displays are blanked, causing unbounded GPU buffer retention
description: |-
    GPU memory grows for the duration of a locked, DPMS-off session and is released on the next render after wake or unlock; exhausting GPU memory can abort the compositor.

    Trigger: The session remains locked with the output DPMS-off while the lock view keeps committing frames that the compositor does not render and release.

    Where: lock: shell/plugins/lock/LockView.qml rendering and shell/plugins/lock/Service.qml blank handling do not suspend repainting while the output is blanked.

    Reported upstream in omacom/omarchy#10612 (https://github.com/omacom/omarchy/issues/10612). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
