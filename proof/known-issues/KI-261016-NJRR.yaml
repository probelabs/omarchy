id: KI-261016-NJRR
title: Hibernate menu remains available with an invalid resume device, allowing hibernation that loses the session
description: |-
    The menu offers Hibernate even though the configured resume device is empty; hibernation writes an image, but the next boot ignores it and starts a fresh session without warning.

    Trigger: The resume drop-in lacks a valid resume device while the hibernation availability guard's swap-size and resume-hook-presence checks pass.

    Where: menu: default/omarchy/omarchy-menu.jsonc system.hibernate row uses a hibernation-availability guard that does not validate the resume device configuration.

    Reported upstream in omacom/omarchy#12630 (https://github.com/omacom/omarchy/issues/12630). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
