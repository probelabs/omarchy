    reproducer_sketch: 'On a system with the reported empty resume= drop-in but a valid resume_offset, sufficient swap and the resume hook present, open the menu. Expected: Hibernate unavailable or a visible warning until the resume configuration is repaired. Actual: the guard reports success and Hibernate remains offered; the report says a subsequent hibernation writes the image but cold-boots instead of restoring it.'
