id: KI-261016-RSXB
title: omarchy-menu-file lists no files when Pictures or Videos is a symlink
description: |-
    When ~/Pictures or ~/Videos is a symlink to a directory that contains media, the transcode file picker never opens and omarchy-menu-file returns zero files.

    Trigger: Run omarchy transcode, or the menu transcode action, while ~/Pictures or ~/Videos is a symlink to a directory (find is invoked without -L).

    Where: menu: bin/omarchy-menu-file find over Pictures and Videos

    Reported upstream in omacom/omarchy#12665 (https://github.com/omacom/omarchy/issues/12665). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
