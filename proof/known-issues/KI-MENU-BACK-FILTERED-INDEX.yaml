id: KI-MENU-BACK-FILTERED-INDEX
title: Back after drilling in from a filtered search parks the cursor on an unrelated parent row
description: With omacom/omarchy#13012, setActiveMenu saves {menu, index, itemId} where index points into the FILTERED search list and itemId is the row just entered. A deeper submenu entered from a root search (e.g. query font -> install.style.font at filtered index 1) is not a row of the unfiltered root list, so goBack finds no itemId match and keeps the saved index; Back clears the filter, so the cursor lands on whatever root row sits at that index (learn). The baseline reset the cursor to row 0.
