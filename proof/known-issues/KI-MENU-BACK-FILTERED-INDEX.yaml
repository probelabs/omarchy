reproducer_command: node pocs/pr13012-back-from-search.js
introduced_in: 7255fd06
defect_class: new_defect
minimization_status: minimized
mitigation: Cursor placement only; no action runs and the user can move the cursor. Enter on the wrong row would open/run that row.
remediation: Save the index only when filterText is empty (or save the root-level ancestor id of the entered row) so Back after a filtered drill-in starts at row 0 or on the ancestor
