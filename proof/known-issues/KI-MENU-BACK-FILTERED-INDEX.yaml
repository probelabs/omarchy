id: KI-MENU-BACK-FILTERED-INDEX
title: Back after drilling in from a filtered search parks the cursor on an unrelated parent row
description: 'With omacom/omarchy#13012, setActiveMenu saves the selected index and row id; the index points into the FILTERED search list. A deeper submenu entered from a root search is not a row of the unfiltered root list. Example: query font, Enter on install.style.font at filtered index 1. goBack finds no row-id match and keeps the saved index. Back clears the filter, so the cursor lands on the root row at that index (learn). The baseline reset the cursor to row 0.'
affected_requirements:
    - SW-REQ-261001-B4CK
evidence_manifests:
    - proof/evidence/ki-menu-back-filtered-index.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: bash test/shell.d/menu-pointer-lifecycle-test.sh
introduced_in: f4b453f146f5c2b20eba3e311fa12f03f9879589
defect_class: new_defect
minimization_status: minimized
mitigation: Cursor placement only; no action runs and the user can move the cursor. Enter on the wrong row would open/run that row.
remediation: Save the index only when filterText is empty. Alternatively save the root-level ancestor id of the entered row. Back after a filtered drill-in then starts at row 0 or on the ancestor.
