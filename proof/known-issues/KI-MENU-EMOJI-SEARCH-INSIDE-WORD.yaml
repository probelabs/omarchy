id: KI-MENU-EMOJI-SEARCH-INSIDE-WORD
title: The emoji picker puts a match inside an unrelated word first, so Enter picks the wrong emoji
description: |-
    The emoji picker selects the first result while the user types, and Enter picks it. On upstream quattro 393a43d4, filterEmojis in shell/plugins/emojis/EmojiSearch.js (lines 26 to 37) keeps every emoji whose keywords contain the search text anywhere. It keeps them in the order of emojis.json. So a match inside an unrelated word comes first when that emoji is earlier in the file.

    A check in the real shell on 393a43d4 opened the picker the way Super+Ctrl+E does and typed the search text. Enter picked the broken heart for ok (from broken). It picked the face with tears of joy for tea (from tears) and the cold face for fr (from freezing). The same code gives the sleepy face for red (from tired) and the fearful face for car (from scared). For pen it gives the hugging face (from open), and for key the pile of poo (from hankey).
