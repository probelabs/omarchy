severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: bash test/shell.d/emojis-test.sh
tripwire_mutation: 'Put back the single list of upstream 393a43d4 in filterEmojis in shell/plugins/emojis/EmojiSearch.js (push every match to one list in file order and return it): the red reproducer test/shell.d/emojis-test.sh fails at ''emoji filtering ranks whole keywords, then keyword starts, then matches inside a word''.'
introduced_in: inception
defect_class: latent
disclosure: public
minimization_status: minimized
mitigation: Every matching emoji stays in the list. Only the order is wrong. The user can move the cursor with the arrow keys before Enter, or type more of the word.
remediation: 'Fixed by PR #<PR>, which lists whole-keyword matches first, then keyword starts, then matches inside a word (SW-REQ-261004-H41S).'
notes:
    - |-
      Fixed by PR #<PR>. filterEmojis now puts each match in one of three groups as it reads emojis.json: the search text as whole words, then as the start of a keyword, then inside a keyword. Each group keeps the file order. A word ends at any character that is not a letter (a character with a case), a digit or an apostrophe, so man: beard and red_haired_man hold man as a whole word, the quotes in “here” end a word, and o’clock stays one word. Spec: SW-REQ-261004-H41S. The reproducer test/shell.d/emojis-test.sh fails on 393a43d4 and passes with the fix. The in-suite test test/shell.d/menu-emoji-search-bdiff-test.sh runs the picker over the real emojis.json.

      Scope: the same emojis match as before. When more than 1000 emojis match, as for one letter such as e, the picker shows the first 1000 of the ranked list. So for such a letter the shown emojis change too.
