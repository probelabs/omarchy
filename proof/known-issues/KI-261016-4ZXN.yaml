id: KI-261016-4ZXN
title: Hibernate menu offers an action logind refuses because the resume configuration is invalid
description: |-
    Selecting Hibernate from the menu fails immediately with Invalid resume config while CanHibernate returns na.

    Trigger: An empty resume device or stale swapfile resume offset leaves logind unable to hibernate, but the menu still permits selecting Hibernate.

    Where: menu: default/omarchy/omarchy-menu.jsonc system.hibernate row and its hibernation-availability guard

    Reported upstream in omacom/omarchy#14360 (https://github.com/omacom/omarchy/issues/14360). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
