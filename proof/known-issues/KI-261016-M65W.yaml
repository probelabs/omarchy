candidate:
    draft_ref: 'R-2197#fingerprint-suspend-busy-retry'
    reproducer_sketch: 'Enroll a fingerprint, lock, let the lock start fingerprint verification, suspend (reporter: s2idle, FocalTech 2808:a97a, libfprint-git 1.94.100, fprintd 1.94.5), resume and present the finger. Expected: fingerprint unlock works shortly after resume. Actual: ''Cannot run while suspended'' / ''ReleaseDevice failed ... still busy'' before sleep, then every attempt fails with code 9 (one case ~55 attempts over ~15 s) until password unlock. Reporter''s workaround: a system-sleep hook stopping fprintd before sleep and restarting it after resume; then only the first attempt fails.'
