id: KI-261016-M65W
title: Suspend interrupting the lock's fingerprint verification leaves the reader claimed, so fingerprint unlock keeps failing after resume
description: |-
    After resume from suspend the lock screen does not accept the fingerprint: every verification attempt fails at once (PAM 'Authentication service cannot retrieve authentication info', code 9) and only the password unlocks.

    Trigger: The system suspends while the lock screen has a pam_fprintd verification in flight; fprintd reports 'Cannot run while suspended' and the PAM ReleaseDevice fails because the device is still busy, so the interrupted claim survives the resume.

    Where: lock: shell/plugins/lock/Service.qml fingerprint PAM lifecycle across suspend/resume (the in-flight omarchy-lock-fingerprint verification is neither aborted before sleep nor restarted against a reset reader after resume).

    Reported upstream in omacom/omarchy#14089 (https://github.com/omacom/omarchy/issues/14089). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
