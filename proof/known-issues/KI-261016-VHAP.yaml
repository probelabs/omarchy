id: KI-261016-VHAP
title: First menu row stays clipped above the list on initial open
description: |-
    On a scrollable menu list the first row (index 0) is scrolled above the top of the list and stays clipped, so the list looks like it starts at the second row.

    Trigger: Open a menu list with more rows than fit the initial view while the selection is on the first row; revealCursor runs before the list height has settled and its downward adjustment is never undone at index 0.

    Where: menu: shell/plugins/menu/Menu.qml revealCursor()

    Reported upstream in omacom/omarchy#14176 (https://github.com/omacom/omarchy/issues/14176). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
