id: KI-APPLY-LOCK-FPRINT-GATE-FAIL-OPEN
title: 'Fingerprint gate fail-open: substring grep treats not-enrolled or failed fprintd-list probes as enrolled'
description: |-
    Before upstream omacom/omarchy#7158, the fingerprint gate in bin/omarchy-apply-lock grepped fprintd-list output for the substring 'finger'. It discarded stderr and had no pipefail. fprintd's empty-enrollment text ('User alice has no fingers enrolled ...') contains 'fingers'. The gate therefore took the enrolled branch and installed pam_fprintd for a user with zero prints. A failed probe that printed a 'Fingerprints ...' banner also passed, because the pipeline status was grep's.

    #7158 (879d6583d, merged 2026-10-04) replaced the gate, and upstream quattro 035ce29f carries it. bin/omarchy-apply-lock:55-59 captures the probe output with stderr. Line 62 installs the stack only on an enrolled '- #N:' row. Lines 72-80 remove it on an explicit empty enrollment. Lines 81-82 keep the existing configuration when the probe fails.
affected_requirements:
    - SW-REQ-260912-S154
    - SW-REQ-260912-Y0WT
evidence_manifests:
    - proof/evidence/ki-apply-lock-fprint-gate-fail-open.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: ./pocs/crs-260930-g166-c01-c13.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Upstream quattro 035ce29f includes the fix. On an older install, run omarchy-apply-lock again after the update. The new gate removes a fingerprint stack that the old gate installed for a user with no prints.
remediation: 'Fixed by omacom/omarchy#7158 (879d6583d): the gate requires an enrolled ''- #N:'' row and keeps the configuration on a failed probe (SW-REQ-261004-SP65). pocs/crs-260930-g166-c01-c13.sh stays as a regression check. It runs the real helper and exits 0 while the fix holds.'
notes:
    - '2026-10-04: re-checked on upstream quattro 035ce29f. The rewritten reproducer runs the real helper end to end, so it follows the new gate. It exits 0 on 035ce29f: the empty and failed probes install nothing, and the enrolled control installs the stack. It exits 1 on upstream quattro 393a43d4, where both inputs install pam_fprintd. Upstream omacom/omarchy#9551 (Karl Ahlin, 2026-09-01) reported the defect. The maintainers closed it unmerged and shipped its matcher in #7158.'
