id: KI-APPLY-LOCK-FPRINT-GATE-FAIL-OPEN
title: 'Fingerprint gate fail-open: substring grep treats not-enrolled and failed fprintd-list probes as enrolled and installs pam_fprintd'
description: The fingerprint gate (bin/omarchy-apply-lock:47-48) greps fprintd-list output for the substring 'finger' with stderr discarded and no pipefail. Real fprintd empty-enrollment text ('User alice has no fingers enrolled ...') contains 'fingers', so the gate takes the ENROLLED branch and installs pam_fprintd for a user with zero prints; a daemon error banner ('Fingerprints' then non-zero exit) also passes because the pipeline status is grep's. Fingerprint PAM is then configured for an account that can never match a print.
