id: KI-261016-23B1
title: DNS menu marks no active provider when its status helper cannot read the configured DNS
description: |-
    Setup > Network > DNS shows no provider checked even though a DNS provider is configured.

    Trigger: Open the DNS menu as a regular user when the NetworkManager DNS drop-in is unreadable and omarchy-dns aborts without returning provider status.

    Where: menu: checked expressions in default/omarchy/omarchy-menu.jsonc under Setup > Network > DNS consume the empty omarchy-dns status result.

    Reported upstream in omacom/omarchy#15225 (https://github.com/omacom/omarchy/issues/15225). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
