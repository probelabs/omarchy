id: KI-261016-X40K
title: Lock display blanking loses the requested panel brightness on wake
description: |-
    The panel returns brighter than the user-selected level while requested brightness remains unchanged; the next brightness adjustment jumps abruptly from that stale requested level.

    Trigger: The lock's idle blank powers the display down and its backlight controller resets the actual level; waking the panel does not reapply the requested level.

    Where: lock: shell/plugins/lock/Service.qml idle blank and wake sequence, through omarchy-brightness-display off and omarchy-system-wake

    Reported upstream in omacom/omarchy#13890 (https://github.com/omacom/omarchy/issues/13890). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
