candidate:
    draft_ref: 'R-2130#lock-blank-panel-brightness-reset'
    reproducer_sketch: 'As reported on a T2 Mac with gmux_backlight, set brightness to 5%, suspend and resume, leave the lock until it blanks, then press a key. Expected the selected 5%; actual panel 80% while requested brightness stays 5%. Brightness-down abruptly sets 4%. Reapplying requested brightness after display-on restores the chosen level.'
