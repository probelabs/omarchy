    - proof/evidence/ki-menu-guard-batch-stale-apply.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: pocs/menu-qml-static.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Stale commits need a batch crossing an items reload; guards re-run on the next batch, which self-heals the visibility maps
remediation: tag each batch with an items serial and drop stale commits; rebuildDisplay after clearing the maps
