id: KI-MENU-GUARD-BATCH-STALE-APPLY
title: 'Guard batches carry no generation token: a batch computed for the previous items publishes onto the new set, and the empty-script case never re-renders'
description: 'guardProc.onExited publishes collected output with no comparison against the items generation (providerProc has a revision check, guards do not): overlapping ids keep the previous when:false on screen; when the newer script is EMPTY the deferred path clears the maps and returns without rebuildDisplay, so the open menu stays stuck on stale visibility (SX26/C09).'
