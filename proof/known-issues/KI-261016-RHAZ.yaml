id: KI-261016-RHAZ
title: Power menu plugin's powerprofilesctl call fails with ImportError when PATH's python3 lacks PyGObject
description: |-
    The powerprofilesctl CLI that the Quickshell power menu plugin spawns exits at startup with ImportError instead of listing or setting power profiles, so the menu's power-profile action fails.

    Trigger: powerprofilesctl carries the packaged '#!/usr/bin/env python3' shebang (Omarchy's install-time rewrite to /bin/python3 was undone by a power-profiles-daemon reinstall or upgrade) while a python3 without PyGObject (e.g. mise's) is first on PATH.

    Where: menu: shell/plugins/menu/Menu.qml power menu plugin spawning powerprofilesctl (relies on the CLI resolving the system Python)

    Reported upstream in omacom/omarchy#11031 (https://github.com/omacom/omarchy/issues/11031). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
