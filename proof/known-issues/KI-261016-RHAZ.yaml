    reproducer_sketch: 'Fresh Omarchy install with mise providing python3 on PATH; sudo pacman -S power-profiles-daemon; head -1 /usr/bin/powerprofilesctl shows ''#!/usr/bin/env python3''; open the power-profile entry of the Omarchy menu. Expected: profiles listed/set. Actual (per the report''s reasoning, not executed): powerprofilesctl fails with ImportError (no gi module) and the menu''s power action fails. Reported on omarchy 4.0.3-1, power-profiles-daemon 0.30-1, python 3.14.7.'
