id: KI-261016-C61W
title: Lock password field is left without keyboard focus when the lock surface becomes ready after its one-shot focus request
description: |-
    The visible lock password field does not own keyboard focus, so typed input does not reach it although the lock is ready for input.

    Trigger: The lock surface becomes ready for keyboard input after LockView's focus request has already run. Examples: outputs restored or recreated on resume from a suspend taken while locked (on several monitors they can return one after another), or PAM disabling and then re-enabling the field after a failed password attempt.

    Where: shell/plugins/lock/LockView.qml password focus requests (Component.onCompleted / inputEnabled change only) and shell/plugins/lock/Service.qml screen-change handling, which does not re-request focus

    Reported upstream in omacom/omarchy#9180 (https://github.com/omacom/omarchy/issues/9180). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
