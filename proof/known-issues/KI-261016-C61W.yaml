    reproducer_sketch: 'Lock the session, suspend, resume and wait for the displays to return (multi-monitor makes output recreation sequential), then type into the visible password field without clicking. Separately, enter a wrong password and type again once the field re-enables. Expected: the field holds active focus and receives the text. Actual: the field can lack active focus.'
