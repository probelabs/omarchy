minimization_status: minimized
mitigation: 'Replace no-break spaces and other non-ASCII spaces in the menu file with ASCII spaces (for example: sed -i ''s/\xc2\xa0/ /g'' <file>); the shipped default menu carries none.'
remediation: 'Read every JS whitespace character outside a string literal as plain whitespace before JSON.parse, as omacom/omarchy#13968 does (characters inside strings stay data). Close criterion: pocs/menu-jsonc-unicode-whitespace.sh exits 0 and the KI-MENU-JSONC-UNICODE-WHITESPACE tripwires in test/shell.d/menu-test.sh flip red.'
