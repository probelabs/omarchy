id: KI-MENU-JSONC-UNICODE-WHITESPACE
title: Unicode or control whitespace between JSONC tokens empties the whole menu file
description: 'parseMenuJsonc (shell/plugins/menu/MenuModel.js) hands the stripped text to JSON.parse, which accepts only space, tab, LF and CR as whitespace. JavaScript''s \s, which the comment pass uses, is wider: VT, FF, U+00A0 no-break space, U+1680, U+2000 to U+200A, U+2028, U+2029, U+202F, U+205F, U+3000 and U+FEFF. Such a character indenting a whole-line // comment is removed with the comment, but anywhere else between tokens JSON.parse throws, and the catch returns an empty item set for the whole file. A user extension pasted from a web page or a word processor (where no-break spaces are common) therefore silently loses every entry, with no diagnostic. Checked live under Quickshell 0.3.1: FileView keeps these characters as read (it drops only a leading byte-order mark), and the real MenuModel.js parses a file with one U+00A0 or U+000B between tokens to 0 rows. pocs/menu-jsonc-unicode-whitespace.sh reproduces it for all 21 characters against an ASCII-space control; test/shell.d/menu-test.sh pins it as a green tripwire.'
