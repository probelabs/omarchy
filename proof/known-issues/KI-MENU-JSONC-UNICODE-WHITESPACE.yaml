introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Replace no-break spaces and other non-ASCII spaces in the menu file with ASCII spaces. The shipped default menu carries none.
remediation: Fixed by omacom/omarchy#13968 (its second commit b2dae8db reads every JS whitespace character outside a string literal as a space; SW-REQ-261001-BNZG).
notes:
    - 'Fixed on pr/13968 by omacom/omarchy#13968 (b2dae8db): outside string literals stripJsonc emits every JS whitespace character other than a line feed as one ASCII space, so VT, FF, U+00A0, U+1680, U+2000 to U+200A, U+2028, U+2029, U+202F, U+205F, U+3000 and U+FEFF between tokens no longer empty the file; inside strings they stay data. Spec: SW-REQ-261001-BNZG. pocs/menu-jsonc-unicode-whitespace.sh exits 0 for all 21 characters; the in-suite tests tagged Reproduces now assert the entries survive and guard against a return. KI-MENU-JSONC-CR-LINE-ENDINGS stays open: the PR does not change it.'
    - 'Upstream: no issue reports this. Our open PR #13968 fixes it.'
