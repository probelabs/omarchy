id: KI-261016-G4KS
title: Remove > Services omits entries for shipped service removers
description: |-
    Remove > Services shows only the services with menu rows (Dropbox, Tailscale, Microsoft, SSH Agent when present) and offers no row for a service whose remover ships, so that service can only be removed from a terminal by script name.

    Trigger: Install a service that has an install menu row and a shipped remover (e.g. run omarchy-install-service-1password), then open Remove > Services.

    Where: menu: default/omarchy/omarchy-menu.jsonc remove.service entries (the install.service.1password row exists; no remove.service.1password row)

    Reported upstream in omacom/omarchy#15485 (https://github.com/omacom/omarchy/issues/15485). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
