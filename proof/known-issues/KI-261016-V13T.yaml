id: KI-261016-V13T
title: Menu window stops mapping after a panel-tree re-instantiation with no output loss, while menu IPC still answers ok
description: |-
    The menu IPC keeps answering ok and a summon is accepted, but no omarchy-menu overlay surface is created: SUPER+SPACE silently does nothing while the bar stays normal, until the shell is restarted.

    Trigger: The live shell re-instantiates its panel/component tree (a second duplicate-IpcHandler registration batch across built-in and third-party panels) while every output stays present: no no-output / placeholder-screen transition, no update restart, a single quickshell process.

    Where: menu: the menu overlay/summon path (shell/plugins/menu; bin/omarchy-menu summon/toggle answered by shell IPC); the caller of the re-instantiation is not identified

    Reported upstream in omacom/omarchy#14284 (https://github.com/omacom/omarchy/issues/14284). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
