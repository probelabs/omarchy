id: KI-MENU-KEYBINDINGS-STDERR-FAILS-DISPATCH
title: Successful hyprctl dispatch with a stderr warning is treated as a refusal and the exec command runs twice
description: dispatch_lua_expression captures 'hyprctl dispatch ... 2>&1' and accepts only status 0 with an empty or exactly-'ok' body (bin/omarchy-menu-keybindings:605-608). A compositor that succeeds but warns on stderr fails the body test, the function returns 1, and dispatch_exec_binding's '|| hyprctl dispatch exec' (line 620) runs the command a second time - double execution for any warned-but-accepted dispatch.
