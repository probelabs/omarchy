severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: MenuModel.parseMenuJsonc (default and user menu JSONC)
reproducer_command: node --test --test-reporter=spec test/node/menumodel-replay.test.mjs
tripwire_mutation: Copy every JS whitespace character outside a string literal as a plain space in the scanner, and keep line feeds, as omacom/omarchy#13968 does. Then the green tripwire test in test/node/menumodel-replay.test.mjs fails. The KI-MENU-JSONC-COMMENT-INDENT-WHITESPACE tripwires in test/shell.d/menu-test.sh flip red.
introduced_in: a3a661bcf
defect_class: new_defect
minimization_status: minimized
mitigation: Indent comment lines in the menu file with ASCII spaces or tabs only. The shipped default menu indents with ASCII spaces.
remediation: In the scanner, copy any JS whitespace character outside a string as one ASCII space, and keep line feeds. Then the indentation the old regex removed is still accepted. omacom/omarchy#13968 does this in its second commit b2dae8db.
