tripwire_mutation: 'Copy every JS whitespace character outside a string literal as a plain space in the scanner (keep line feeds), as omacom/omarchy#13968 does: the green tripwire pocs/pr6525-comment-indent-whitespace.sh starts exiting 1 and the KI-MENU-JSONC-COMMENT-INDENT-WHITESPACE tripwires in test/shell.d/menu-test.sh flip red.'
introduced_in: dff129dc
defect_class: new_defect
minimization_status: minimized
mitigation: Indent comment lines in the menu file with ASCII spaces or tabs only. The shipped default menu indents with ASCII spaces.
remediation: In the scanner, copy any JS whitespace character outside a string as one ASCII space (keep line feeds), so the indentation the old regex removed is still accepted. omacom/omarchy#13968 does this in its second commit b2dae8db.
