dedup_armor: 'Not a duplicate of KI-MENU-JSONC-UNICODE-WHITESPACE. That one is non-JSON whitespace between tokens, on the baseline and unchanged by #6525. This one is the same characters indenting a whole-line comment, which the baseline accepts and #6525 newly rejects. Not a duplicate of KI-MENU-ITEMS-KEY-AMBIGUITY either: that one is the items wrapper key in parseMenuJsonc, not comment stripping. Also not KI-MENU-JSONC-INLINE-COMMENT, KI-MENU-JSONC-STRIP-GAPS, KI-MENU-JSONC-COMMA-IN-STRING, KI-MENU-JSONC-ARRAY-ROOT or KI-MENU-JSONC-CR-LINE-ENDINGS.'
