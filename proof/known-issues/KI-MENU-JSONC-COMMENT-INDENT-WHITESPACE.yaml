id: KI-MENU-JSONC-COMMENT-INDENT-WHITESPACE
title: 'A comment line indented with Unicode or control whitespace empties the menu file under PR #6525'
description: |-
    With omacom/omarchy#6525, stripJsonc (shell/plugins/menu/MenuModel.js) drops a // comment with a scanner instead of the old line-anchored regex ^\s*\/\/. The regex removed a whole-line comment together with any JS whitespace in front of it. JS \s also matches VT, FF, U+00A0, U+1680, U+2000 to U+200A, U+2028, U+2029, U+202F, U+205F, U+3000 and U+FEFF. The scanner drops only the comment and keeps that character.

    JSON.parse accepts only space, tab, LF and CR as whitespace. So a full-line comment indented with one of those characters now makes the whole file fail to parse. The catch returns an empty item set, and the PR's new console.warn logs the parse error. On the baseline the same file parses to all of its entries.

    We checked this with the real MenuModel.js at the PR head merged onto the baseline. The green tripwire test in test/node/menumodel-replay.test.mjs (menu-node suite) shows it for all 21 characters against an ASCII-indented control. Quickshell's FileView drops a byte-order mark at the very start of the file. So under the shell a leading BOM before a header comment does not trigger it. The same character on any later line does.
affected_requirements:
    - SW-REQ-260922-E4J2
evidence_manifests:
