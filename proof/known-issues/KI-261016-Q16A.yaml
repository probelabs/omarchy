id: KI-261016-Q16A
title: Pre-suspend locking never runs when the event watcher connects to the wrong system bus
description: |-
    The pre-suspend session lock is never requested because the sleep-event watcher cannot connect to the system bus.

    Trigger: The sleep watcher resolves a dbus-monitor from PATH whose default system-bus address does not identify the running system bus.

    Where: lock: pre-suspend request delivery to bin/omarchy-system-sleep-lock; the upstream event source is bin/omarchy-system-sleep-monitor's PATH-resolved dbus-monitor

    Reported upstream in omacom/omarchy#7412 (https://github.com/omacom/omarchy/issues/7412). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
