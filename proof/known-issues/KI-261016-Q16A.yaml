    reproducer_sketch: 'Put a dbus-monitor build using a nonexistent system-bus socket ahead of /usr/bin in the user manager PATH, start the stock sleep-lock service, then suspend. Expected the pre-suspend session-lock request; actual no request, a bus-connection error and repeated service restarts. The reported example uses Homebrew''s dbus-monitor and reports more than 10000 restarts.'
