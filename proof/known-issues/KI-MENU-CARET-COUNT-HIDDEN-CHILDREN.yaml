id: KI-MENU-CARET-COUNT-HIDDEN-CHILDREN
title: childCount counts when-hidden children and duplicate itemOrder entries, so the submenu badge disagrees with what renders
description: childCount has no visibility check and no id dedup. Hidden (when:false) children and duplicated order entries each count once (F20 measured 3 where 1 row renders). The caret badge therefore shows counts the menu will not display.
affected_requirements:
    - SW-REQ-260922-SJ7P
