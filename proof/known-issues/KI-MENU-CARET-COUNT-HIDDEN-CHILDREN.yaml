    - pocs/menu-probes3.js
    - proof/evidence/ki-menu-caret-count-hidden-children.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: node pocs/menu-probes.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: The badge count is advisory only; navigation and activation stay unaffected, so the wrong count misleads but blocks nothing
remediation: count only children passing isVisible and dedupe ids (or trust the merges to dedupe itemOrder)
