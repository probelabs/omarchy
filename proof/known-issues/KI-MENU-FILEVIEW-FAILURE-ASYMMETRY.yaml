id: KI-MENU-FILEVIEW-FAILURE-ASYMMETRY
title: 'Failed menu FileView reloads are asymmetric: the user handler wipes the last good items, the default handler keeps a stale set'
description: 'Only the user menu FileView has onLoadFailed, and it clears userMenuItems to [] before rebuilding (anchors FV1/FV2): a transient read failure of the user extension erases every user entry until the next successful load, while a failed default-file reload silently keeps the old set - neither is the documented behavior for a failed reload.'
