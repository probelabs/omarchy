reproducer_command: pocs/menu-qml-static.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: A failed reload that keeps the stale set leaves the menu usable; the wipe only hits the user file whose failure is otherwise silent
remediation: keep the last good items on failure for both files (drop the wipe), or surface the failure in the menu
