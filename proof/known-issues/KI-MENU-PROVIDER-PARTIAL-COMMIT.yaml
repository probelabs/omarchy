introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: A failed provider leaves partial rows until the next successful run; static menu entries remain available throughout
remediation: check exitCode/exitStatus before merging (keep last good rows otherwise), set providersLoaded only on success, and re-run mergeAppRows when appLibrary appears
notes:
    - 'Upstream: issue #13202 (2026-09-25) reports only the apps-provider leg (Apps shows Nothing here yet). Open fix PRs: #13469 and #13642.'
