id: KI-MENU-PROVIDER-PARTIAL-COMMIT
title: Failed/killed providers commit their partial stdout and stay marked loaded; the apps provider marks itself loaded with no AppLibrary
description: providerProc.onExited merges collected stdout whenever the revision matches, with no exitCode/exitStatus check - the guardProc beside it does check (asymmetry in the same file, anchors PRV1) - so a failed script replaces a good row set with a partial read; providersLoaded is committed BEFORE the process proves itself (PRV2), and never cleared on failure, so the submenu is stuck until a full source rebuild; the apps branch marks providersLoaded unconditionally even when appLibrary is null and mergeAppRows returns empty (PRV3), leaving an empty Apps menu with no retry.
