    reproducer_sketch: 'On a dual-DisplayPort NVIDIA system, trigger suspend (or hibernate) so the sleep path takes the desktop session lock: the lock request begins, each WlSessionLockSurface maps visibly, the compositor reports secure, and only then sleep begins. Expected sleep preparation to stay visually black while acquiring a secure ext-session-lock surface on every output; actual the password prompt flashes before the displays blank.'
