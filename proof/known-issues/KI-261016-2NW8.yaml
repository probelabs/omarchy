id: KI-261016-2NW8
title: Sleep preparation flashes the lock password views before the displays blank
description: |-
    Starting suspend or hibernate briefly exposes the desktop lock password views before the displays enter sleep; the ordering is secure but visually wrong.

    Trigger: Suspend or hibernate engages the desktop session lock via the sleep-lock path (displays still on while the lock surfaces map).

    Where: lock: the sleep-lock handoff — omarchy-system-sleep-lock requesting the session lock and each WlSessionLockSurface in shell/plugins/lock mapping visibly before the displays blank

    Reported upstream in omacom/omarchy#9231 (https://github.com/omacom/omarchy/issues/9231). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
