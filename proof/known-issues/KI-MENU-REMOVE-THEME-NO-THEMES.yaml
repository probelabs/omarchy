affected_api: 'omarchy menu: Remove > Theme (remove.theme row)'
reproducer_command: bash test/shell.d/menu-guards-test.sh
tripwire_mutation: 'Drop the when: from the remove.theme row in default/omarchy/omarchy-menu.jsonc (the a85e29ab row): the red reproducer test/shell.d/menu-guards-test.sh fails at ''Remove > Theme shows exactly when omarchy-theme-remove has a theme to offer'' (missing, empty and symlink-only homes: guard=0 expected=1).'
introduced_in: 5bc151f99420bac724e33534b20c4f4169e0712d
defect_class: new_defect
disclosure: public
minimization_status: minimized
mitigation: 'Nothing breaks and no data changes: the row closes the menu and removes nothing. A user who has installed an extra theme gets the picker as before. omarchy theme remove in a terminal prints the message.'
remediation: 'Fixed by PR #<PR> (omarchy-theme-removable), with SW-REQ-261003-390Z. A new helper lists the themes the remover can remove: directories under ~/.config/omarchy/themes that are not symlinks or dot-directories. A themes folder that is itself a symlink offers nothing. The remove.theme row asks it as its when:, and the remover reads its list from it. So the row and the picker cannot disagree.'
notes:
    - 'Fixed by PR #<PR>, which follows the omarchy-theme-extras shape of Update > Extra Themes. The reproducer is now the in-suite test test/shell.d/menu-guards-test.sh (Reproduces marker). Over twelve HOME shapes it runs the row through the generated guard batch and the remover with a stub picker, and checks that they agree. It fails on upstream quattro 393a43d4 and passes with the fix. Scope of the fix: the menu re-runs the guards on each open and first draws the previous answers, for about half a second. So the first open after the last theme goes away can still show the row until the batch lands. At the first open of a session, before any answer, the row shows. A user menu that overrides remove.theme replaces the whole row, guard included. These windows are the same for every guarded row. A themes folder that is a symlink into a dotfiles directory offers nothing, as before the change.'
