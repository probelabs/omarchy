id: KI-MENU-REMOVE-THEME-NO-THEMES
title: Remove > Theme shows on a stock install, where the remover has no theme to offer and the row only closes the menu
description: |-
    Remove > Theme runs omarchy-theme-remove with no terminal (default/omarchy/omarchy-menu.jsonc:295). The script lists the directories under ~/.config/omarchy/themes that are not symlinks. With none, it prints "No extra themes installed." and exits 1. Nothing shows that line, so the row only closes the menu. On a stock install that folder is empty, so most users get this row.

    The list also includes dot-directories such as .git, which the script then refuses to remove. With only such a directory, the picker offers it, and picking it removes nothing. The Remove siblings hide behind a when: guard until there is something to remove; this row has no guard. Commit 5bc151f9 moved the remover to the menu picker and dropped the floating terminal that showed the line.
