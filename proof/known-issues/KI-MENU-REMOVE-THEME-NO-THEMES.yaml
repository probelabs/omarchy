mitigation: 'Nothing breaks and no data changes: the row closes the menu and removes nothing. A user who has installed an extra theme gets the picker as before. omarchy theme remove in a terminal prints the message.'
remediation: 'Hide the row until the remover has a theme it can remove. #7775 used this shape for Update > Extra Themes. A helper lists the removable themes, the directories that are not symlinks or dot-directories, and exits nonzero when there are none. The row''s when: runs the helper. The remover reads its list from the same helper, so the row and the picker agree.'
