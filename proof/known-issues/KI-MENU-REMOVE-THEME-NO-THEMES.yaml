id: KI-MENU-REMOVE-THEME-NO-THEMES
title: Remove > Theme shows on a stock install, where the remover has no theme to offer and the row only closes the menu
description: 'Remove > Theme runs omarchy-theme-remove with no terminal (default/omarchy/omarchy-menu.jsonc:295). With no theme directory under ~/.config/omarchy/themes that is not a symlink, the script prints "No extra themes installed." and exits 1. Nothing shows that line, so the row only closes the menu. A stock install has only the bundled themes, so most users get this row. Its Remove siblings hide behind a when: guard until there is something to remove; this row has no guard. Commit 5bc151f9 moved the remover to the menu picker and dropped the floating terminal that showed the line.'
affected_requirements:
    - SYS-REQ-260922-47T8
