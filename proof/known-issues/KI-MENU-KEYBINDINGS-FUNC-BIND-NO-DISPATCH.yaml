severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: ./pocs/crs-260930-jvx8-c02.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: none - the rows are visible, selecting them silently does nothing
remediation: Cache a dispatchable expression for function binds (emit the Lua body or register bind_commands entries for the shipped function binds). Then refuse to render rows whose recovered dispatcher is empty
notes:
    - 'Upstream: original fix PR #11851 (2026-09-14); no issue tracks it.'
