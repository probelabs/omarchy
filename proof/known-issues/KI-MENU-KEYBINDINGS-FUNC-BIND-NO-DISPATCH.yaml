    commit_origin: 3b2fc3a08 (2026-05-16, Bring back dispatch from keybindings menu) added the Lua bind cache. Its hl.bind mock records a kind and an arg only for dispatcher tables and strings, so a raw function bind caches an empty dispatcher.
