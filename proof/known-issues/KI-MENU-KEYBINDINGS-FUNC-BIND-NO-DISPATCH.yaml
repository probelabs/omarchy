id: KI-MENU-KEYBINDINGS-FUNC-BIND-NO-DISPATCH
title: Lua function binds (Select all, Universal copy/paste/cut, Zoom in, Reset zoom) render in the menu but dispatch nothing
description: 'Binds whose dispatcher is a raw Lua function never register in o.bind_commands, so build_lua_bind_cache caches them with kind=""/arg="" (bin/omarchy-menu-keybindings:217-219). dynamic_bindings then overwrites the __lua dispatcher with the empty map value (lines 309-312) and the row still prints. dispatch_binding''s empty-dispatcher arm returns 1: the six shipped function binds appear selectable but perform no action.'
