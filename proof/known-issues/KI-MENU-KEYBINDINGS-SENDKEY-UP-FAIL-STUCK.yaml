introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: A refused key-up is rare; the stuck synthetic key clears on the next real key event or on the next compositor focus change
remediation: 'Treat the up failure as a failed dispatch: return its status so the fallback chord runs, or send a compensating key-up before falling back'
