severity: medium
severity_basis: risk
risk: availability
cve_surface: none
affected_api: bin/omarchy-menu-images still-image thumbnail lane
reproducer_command: ./pocs/menu-images-vips-still-no-timeout.sh
introduced_in: inception
defect_class: latent
mitigation: timeout -k 5 10 bounds the video lane. The converter does not inherit the content-hash lock, so a killed generator frees the lock. Lazy conversions run in at most two lanes at lowered CPU and I/O priority, so a stalled converter competes less with the desktop. Manual recovery is to kill the stalled vipsthumbnail process and to move a still that stalls again out of the directory.
remediation: Wrap the vipsthumbnail invocation in timeout (matching the video lane) or add an async kill to the generator. Then close this KI and flip the THMB deferral
