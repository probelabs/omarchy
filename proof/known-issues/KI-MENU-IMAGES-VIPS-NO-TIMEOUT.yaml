id: KI-MENU-IMAGES-VIPS-NO-TIMEOUT
title: vipsthumbnail still-image lane has no timeout; a stalled conversion wedges its lane and, in lazy mode, the shared thumbnail pool
description: |-
    generate_thumbnail sends still images to env VIPS_CONCURRENCY=1 vipsthumbnail without a timeout (bin/omarchy-menu-images:199). The video lane wraps ffmpegthumbnailer in timeout -k 5 10. A still that stalls vips holds its lane forever. A corrupt or pathological file, or a path on a stalled mount, can cause the stall. An eager open, without --lazy-thumbnails or with --cache-only, waits for its whole fan-out before the picker opens. So one stalled still blocks that open.

    Lazy opens queue their stills for one shared background pool per rows cache (upstream #14117). The pool runs at most two converters and finishes each batch before it takes the next. So a stalled still holds the pool, and stills that later opens queue get no thumbnail while the stall lasts. Each later open queues the stalled still again, so a freed lane can stall again. At 393a43d4 each lazy open started its own generators, and later stills still converted.

    The generator holds the content-hash lock while its converter runs. The converter does not inherit the lock, so a killed generator frees it even when the converter hangs. A duplicate job for the stalled file waits 30 seconds on that lock and then gives up. The damage is lost lanes and missing thumbnails, not a lock deadlock.
