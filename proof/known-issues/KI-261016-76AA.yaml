candidate:
    draft_ref: 'R-5359#no-real-screen-lock-gate'
    reproducer_sketch: 'Undock the laptop (remove external display while lid is open), then close the lid to trigger suspend. Expected: session locks before suspend. Actual: lock is requested but requestSessionLock() hits the !hasRealScreen() branch on every 100ms retry and never sets sessionLock.locked = true; after 12s the sleep-lock budget expires and logind suspends with the session unlocked.'
