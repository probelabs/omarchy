id: KI-261016-76AA
title: Lock refuses to engage when no real screen exists, allowing suspend with an unlocked session
description: |-
    A lid-close suspend proceeds with the session unlocked because the lock never engages: requestSessionLock() gates sessionLock.locked on hasRealScreen(), and with zero outputs the gate never passes so the sleep-lock budget expires.

    Trigger: Undock the laptop (external output disappears) while the lid is open, then close the lid to suspend. The lock is requested but hasRealScreen() returns false because Quickshell reports no real screen.

    Where: lock: shell/plugins/lock/Service.qml requestSessionLock() gates sessionLock.locked = true on hasRealScreen()

    Reported upstream in omacom/omarchy#15152 (https://github.com/omacom/omarchy/issues/15152). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
