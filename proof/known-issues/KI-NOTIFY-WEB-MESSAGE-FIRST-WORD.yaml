id: KI-NOTIFY-WEB-MESSAGE-FIRST-WORD
title: A web page's notification loses the first word of its message when it starts with a web address or a dotted word
description: |-
    sanitizeBody in shell/plugins/notifications/NotificationLogic.js (lines 92 to 99 on upstream 393a43d4 and 8e02fc84) cleans the body of a notification from a Chromium-based browser. It chains two replacements. Line 97 removes a leading origin link. Line 98 then removes a leading web address and the white space after it. The second replacement runs on the text that the first one leaves.

    Chromium starts the body of a notification from a web page with the origin of the page. It sends the origin as a link when the notification server takes hyperlinks, and the notification server of the shell takes them. So the body is the origin link, a blank line and then the message.

    After the link goes, the second replacement removes the start of the message when it looks like a web address. A web address, a www. name or a dotted word such as Node.js or README.md is enough. In a check with a real Chromium 148 and the real shell, the message "github.com/omacom/omarchy can you review?" showed as "can you review?". The message "Node.js 24 is out, upgrade today" showed as "24 is out, upgrade today".
