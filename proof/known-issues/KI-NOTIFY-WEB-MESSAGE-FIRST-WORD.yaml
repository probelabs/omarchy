severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: bash test/shell.d/notifications-test.sh
tripwire_mutation: 'Chain the two replacements in sanitizeBody in shell/plugins/notifications/NotificationLogic.js again, as on 393a43d4 (return text.replace(<origin link>, "").replace(<leading web address>, "")): the red reproducer test/shell.d/notifications-test.sh fails at ''notifications strip only the chromium origin link, not a URL that starts the message''.'
introduced_in: dc4618c28cd6987e9fed876d64200ac9805ea447
defect_class: new_defect
disclosure: public
minimization_status: minimized
mitigation: The whole message stays in the web page that sent it. A message that starts with a plain word shows correctly. Only the first word goes, so the rest of the message still shows on the card.
remediation: 'Fixed by PR #<PR>. sanitizeBody returns the body as soon as it removed the origin link. It removes a plain-text origin only when the body has no origin link (SW-REQ-261004-DHZ3).'
notes:
    - |-
      Fixed by PR #<PR>. sanitizeBody now returns the body as soon as the origin link replacement removed text, so the message after the link keeps its first word. Spec: SW-REQ-261004-DHZ3. The reproducer test/shell.d/notifications-test.sh fails with the sanitizeBody of 393a43d4 and passes with the fix.

      Scope: the fix covers the body with the origin link, the form Chromium uses for a web page when the server takes hyperlinks. A body without an origin link still loses a leading web address and the white space after it, before and after the fix. That covers the plain-text origin form and a Chromium notification that comes without the origin. There the cleanup cannot tell a plain-text origin from a web address that starts a message. With the notification server of the shell, Chromium sends a web notification with the origin link. An origin link to localhost, an IP address or a host name with non-ASCII letters stays in the card, before and after the fix.
