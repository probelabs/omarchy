id: KI-261016-X3P4
title: Share > Clipboard sends an empty file when the clipboard has no text representation
description: |-
    omarchy share clipboard hands LocalSend a 0-byte .txt file instead of the clipboard contents.

    Trigger: Share the clipboard while it offers no text type (for example only image/png, as after a screenshot): wl-paste without --type writes nothing and exits non-zero, and the empty temp file is sent anyway.

    Where: menu: bin/omarchy-menu-share clipboard mode (wl-paste with no --type into a hardcoded mktemp --suffix=.txt file, send not gated on a successful read)

    Reported upstream in omacom/omarchy#8340 (https://github.com/omacom/omarchy/issues/8340). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
