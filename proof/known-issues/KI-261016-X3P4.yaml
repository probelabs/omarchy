candidate:
    draft_ref: 'R-1436#share-clipboard-image-empty-file'
    reproducer_sketch: 'Take a screenshot with omarchy screenshot (wl-copy --type image/png); wl-paste -l shows image/png; run omarchy share clipboard. Expected: the image is sent to the target device. Actual: a 0-byte .txt is sent (TEMP_FILE=$(mktemp --suffix=.txt); wl-paste >"$TEMP_FILE" gives size 0, while wl-paste --type image/png returns the full image).'
