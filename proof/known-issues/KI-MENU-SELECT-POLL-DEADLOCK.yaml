id: KI-MENU-SELECT-POLL-DEADLOCK
title: omarchy-menu-select hangs forever when the summoned menu dies before writing done_file
description: 'The done_file poll in bin/omarchy-menu-select (lines 93-95) is unbounded: `while [[ ! -e $done_file ]]; do sleep 0.05; done` carries no deadline, no peer-liveness probe, and no signal beyond the EXIT trap. If the menu process dies after the summon IPC succeeds (Quickshell crash, compositor restart), nothing ever writes the done file and the script loops forever, hanging every caller that invokes it synchronously. The protocol covers user cancel (the cancel path writes done_file) but not peer death. Reproduced live: with omarchy-shell stubbed to exit 0 and nothing writing the done file, the script was killed by an external 3s timeout (repro exits 1 = defect present). The spec gap rides with it: no requirement pins a bounded wait for the poll, so the defect had no contract to violate — the negative-state half of the dmenu protocol was never specified.'
affected_requirements:
    - SW-REQ-260922-Q6ZS
evidence_manifests:
    - test/shell.d/menu-select-poll-deadlock-repro.sh
    - proof/evidence/ki-menu-select-poll-deadlock.yaml
severity: medium
severity_basis: reproducer
cve_surface: none
affected_api: bin/omarchy-menu-select (dmenu select protocol)
reproducer_command: /usr/bin/bash test/shell.d/menu-select-poll-deadlock-repro.sh
introduced_in: inception
defect_class: latent
remediation: 'Fixed on branch fix/issue-9057-menu-select-poll: bin/omarchy-menu-select bounds the done-file poll (OMARCHY_MENU_SELECT_TIMEOUT, default 30s, stderr diagnostic, exit 1) per SW-REQ-260924-AK4Z, and Menu.qml open() resolves an in-flight request as cancelled before replacing it per SW-REQ-260924-CV8S. The bound reproducer now passes (bounded exit 1 at the deadline). Upstream: omacom/omarchy#9057 (supersession trigger), PR #9056 (summon-side only).'
