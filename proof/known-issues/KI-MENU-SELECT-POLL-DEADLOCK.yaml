id: KI-MENU-SELECT-POLL-DEADLOCK
title: omarchy-menu-select hangs forever when the summoned menu dies before writing done_file
description: 'The done_file poll in bin/omarchy-menu-select (lines 93-95) has no deadline and no peer-liveness probe. If the menu process dies after a successful summon IPC, nothing writes the done file. The script loops forever and hangs every synchronous caller. The protocol covers user cancel but not peer death. Reproduced live on 2026-09-23: an external 3s timeout killed the waiting script. No requirement pins a bounded wait, so the defect had no contract to violate.'
affected_requirements:
    - SW-REQ-260922-Q6ZS
    - SW-REQ-260922-9ABD
    - SW-REQ-260922-HR29
    - SW-REQ-260922-KRBH
    - SW-REQ-260922-MP00
    - SW-REQ-260922-MH9B
    - SW-REQ-260922-SWFT
evidence_manifests:
    - test/shell.d/menu-select-poll-deadlock-repro.sh
    - proof/evidence/ki-menu-select-poll-deadlock.yaml
severity: medium
severity_basis: reproducer
cve_surface: none
affected_api: bin/omarchy-menu-select (dmenu select protocol)
reproducer_command: /bin/bash test/shell.d/menu-select-poll-deadlock-repro.sh
introduced_in: inception
defect_class: latent
remediation: 'Fixed by omacom/omarchy#9031. The menu commands record the shell process that took the request. They stop waiting about a second after that process exits or a restart replaces it, with exit 1 and "the shell exited before answering". bin/omarchy-menu-handshake holds the check, and omarchy-menu-select, -input and -images use it.'
notes:
    - 'Upstream: original fix PR #9031 (2026-08-29); no issue tracks it; related open PR #8696 waits on the done file instead of polling.'
    - 'Fixed on pr/9031 by omacom/omarchy#9031: test/shell.d/menu-select-poll-deadlock-repro.sh exits 0 there (the stand-in shell dies 0.3s after taking the request; the script exits 1 after about 1s) with its healthy-answer control. Not part of this issue and not changed by the PR: a summon the shell refuses (it answers "unknown" and omarchy-shell exits 0, for example with omarchy.menu in disabledPlugins) still waits while the shell stays alive.'
review_date: "2026-12-23"
status: fixed
