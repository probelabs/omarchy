id: KI-MENU-SELECT-POLL-DEADLOCK
title: omarchy-menu-select hangs forever when the summoned menu dies before writing done_file
description: 'The done_file poll in bin/omarchy-menu-select (lines 93-95) has no deadline and no peer-liveness probe. If the menu process dies after a successful summon IPC, nothing writes the done file. The script loops forever and hangs every synchronous caller. The protocol covers user cancel but not peer death. Reproduced live on 2026-09-23: an external 3s timeout killed the waiting script. No requirement pins a bounded wait, so the defect had no contract to violate.'
affected_requirements:
    - SW-REQ-260922-Q6ZS
evidence_manifests:
    - test/shell.d/menu-select-poll-deadlock-repro.sh
    - proof/evidence/ki-menu-select-poll-deadlock.yaml
severity: medium
severity_basis: reproducer
cve_surface: none
affected_api: bin/omarchy-menu-select (dmenu select protocol)
reproducer_command: /opt/homebrew/bin/bash test/shell.d/menu-select-poll-deadlock-repro.sh
