id: KI-261016-9JFA
title: Encrypted hibernate resume requires both LUKS and session passwords because the sleep lock engages before S4
description: |-
    On a stock encrypted root installation, hibernate resume requires two authentication prompts: the initramfs LUKS passphrase and then the restored session lock password. Expected one auth step (boot decryption only) for the interactive LUKS hibernate path.

    Trigger: Hibernate on a stock encrypted root using Omarchy's cryptdevice= initramfs flow. The sleep monitor receives PrepareForSleep(true) and invokes omarchy-system-sleep-lock before S4, so the session is locked when the hibernation image is saved.

    Where: lock: omarchy-system-sleep-lock engaging the session lock before hibernate (S4) on every PrepareForSleep(true) without distinguishing hibernate via a marker — the locked state is saved into the hibernation image

    Reported upstream in omacom/omarchy#8909 (https://github.com/omacom/omarchy/issues/8909). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
