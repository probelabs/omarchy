candidate:
    draft_ref: 'R-1212#idle-lock-screensaver-flash'
    reproducer_sketch: 'Let the fullscreen idle screensaver run through the lock deadline. Expected it remains mapped until session-lock is secure; actual the desktop can flash while lock surfaces are still being created (lock-requested precedes secure by roughly 0.6-1.6 s per a commenter). The report describes a bounded secure-state wait before screensaver teardown preventing this flash. On the reporter''s build, composed with the unmerged dismissal monitor of #7780, a dismissal callback at the lock deadline could also tear the screensaver down early.'
