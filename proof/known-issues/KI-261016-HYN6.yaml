id: KI-261016-HYN6
title: Idle lock removes the covering screensaver before session-lock surfaces are secure
description: |-
    The desktop becomes briefly visible after the fullscreen screensaver is removed while native lock surfaces are still being created, before display standby.

    Trigger: The idle lock deadline fires with the fullscreen screensaver running; omarchy-system-lock tears the screensaver down before ext-session-lock reports the lock secure.

    Where: lock: bin/omarchy-system-lock screensaver teardown during the idle-to-lock handoff

    Reported upstream in omacom/omarchy#9184 (https://github.com/omacom/omarchy/issues/9184). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
