id: KI-261016-NV0T
title: Lock display blanking makes a KVM abandon the session and disconnect its input devices
description: |-
    The KVM switches away from the locked machine after its video signal disappears, disconnecting its USB hub; the monitor shows source search and the keyboard and mouse cannot become usable for unlock.

    Trigger: Switch a signal-sensing KVM to a locked Omarchy session and let the lock's display-blank countdown expire while its peripherals are connecting.

    Where: lock: shell/plugins/lock/Service.qml idleBlankTimer and runBlank dispatching omarchy-brightness-display off.

    Reported upstream in omacom/omarchy#14392 (https://github.com/omacom/omarchy/issues/14392). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
