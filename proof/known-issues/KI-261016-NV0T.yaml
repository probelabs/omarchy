candidate:
    draft_ref: 'R-5185#lock-blank-kvm-input-loss'
    reproducer_sketch: 'Switch a KVM carrying video and USB to the locked machine. The lock screen appears, then the five-second blank disables DPMS; the KVM scans to another input and disconnects USB before keyboard/mouse become usable. Expected a usable unlock session. The reported workaround repeatedly re-enables DPMS after monitoradded so the KVM stays selected long enough to enumerate USB and unlock.'
