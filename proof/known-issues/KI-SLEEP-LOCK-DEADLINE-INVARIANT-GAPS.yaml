mitigation: the fixed clamshell bound still stops a multi-second Hyprland stall; logind force-suspends at window end regardless
remediation: Clamp the clamshell timeout to remaining_ms. Start the deadline clock before the derive read (or charge the read to the budget). Wrap the notification send in a short timeout
