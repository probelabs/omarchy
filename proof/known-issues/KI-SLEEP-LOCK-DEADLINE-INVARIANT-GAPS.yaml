id: KI-SLEEP-LOCK-DEADLINE-INVARIANT-GAPS
title: 'Header invariant ''every call bounded by what is left of the budget'' not enforced on three external calls: clamshell sync, the derive read, and the notification send'
description: 'The script header promises the deadline enforces itself on every call, but three sites break it: (1) sync_clamshell uses a fixed timeout 0.4s+0.1s and never consults remaining_ms - with a 100ms budget it runs the script 4x past the deadline; (2) derive''s busctl read is allowed a full 1s timeout but the deadline clock starts only at line 52, so a slow reply consumes exactly the 1000ms reserve held back for logind (lifetime measured at 5102ms against a 5000ms window); (3) report_unsecured''s omarchy-notification-send has no timeout wrapper and ''|| true'' does not bound the sd-bus default (~25s), so the unlocked-suspend warning can stall for the whole remaining window and never land.'
