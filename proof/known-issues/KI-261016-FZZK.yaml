    reproducer_sketch: 'Time Super+K with no menu open, then while the root menu (Super+Space) holds keyboard focus, then again with none open; diff `hyprctl devices | grep ''active keymap:''` between the states and watch ~/.cache/omarchy for keybindings-*.records being rewritten and deleted. Reporter (Hyprland 0.56.2): ~540ms cold rebuilds against ~21-26ms warm reads, the hash alternating with menu focus. The project bot''s comment could not reproduce the menu-focus difference but reproduced the same key flip when a virtual keyboard (`active keymap: none`, e.g. wtype) attaches and detaches.'
