introduced_in: inception
defect_class: latent
disclosure: public
mitigation: Press the hardware keyboard backlight key to turn the light back on. Until a fix lands, avoid a second blank before unlock. A mistyped password re-arms the idle blank and can cause one. A suspend while the screen is already blank can also cause one. Each second blank runs keyboard off again and stores 0.
remediation: In bin/omarchy-brightness-keyboard, make off skip the save when the current level is already 0. Off still sets the LED to 0, and the earlier non-zero saved level stays in place. Restore then returns that earlier level. The lock blank path can also skip keyboard off when the displays are already blank, so off runs once per blank. A person should approve SW-REQ-261009-GW3G, which states that unlock restores the last non-zero keyboard backlight level.
