severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: omarchy-brightness-keyboard off and restore
reproducer_command: bash pocs/reproducers/ki-261009-4mb1/repro.sh
introduced_in: inception
defect_class: latent
disclosure: public
mitigation: 'Press the hardware keyboard backlight key to turn the light back on. Until the saved level is preserved, do not blank twice before unlock: a mistyped password that re-arms the idle blank, or a suspend while the screen is already blank, runs keyboard off again and stores 0.'
remediation: 'In bin/omarchy-brightness-keyboard, do not save a brightness of 0 on off: when the current level is already 0, leave the previously saved non-zero level in place and still set the LED to 0. Restore then returns that earlier level. The lock blank path can also skip keyboard off when the displays are already blank, so off runs once per blank. A person should approve a requirement that unlock restores the last non-zero keyboard backlight level rather than a 0 saved while the LED was already off.'
