id: KI-261009-4MB1
title: Lock keyboard-off saves brightness 0 when the light is already off, so unlock restores darkness
description: |-
    After unlock the keyboard backlight stays at 0. Software restore does not bring back the earlier non-zero level; only the hardware backlight key turns it on.

    Trigger: keyboard off runs brightnessctl -s set 0 while the LED's current brightness is already 0, so the saved restore value becomes 0. The following wake restore applies that saved 0. The lock plugin's blank path (shell/plugins/lock/Service.qml blankProcess) runs `omarchy-brightness-keyboard off`. A later blank, from onAuthenticatingPasswordChanged re-arming the idle timer or from a suspend-frozen timer calling armBlankTimer, runs off again before omarchy-system-wake restores. bin/omarchy-brightness-keyboard off always calls `brightnessctl -sd "$device" set 0`, which saves the current value even when it is already 0.

    The same save-current-zero mechanism covers a firmware idle timeout that zeros the LED before the first off (the anchor) and a second off that overwrites a level the first off saved (the member reports).

    Reports:
    - https://github.com/omacom/omarchy/issues/6667
    - https://github.com/omacom/omarchy/issues/12942
    - https://github.com/omacom/omarchy/issues/14011
