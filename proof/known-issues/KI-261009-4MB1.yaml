        quantitative_impact: after the second off and a restore, the LED brightness is 0 out of 200. The expected value is the earlier level 80.
        control_test: the first off from level 80 must save 80 and set the LED to 0, or the reproducer exits 2 (setup failure). That run shows the single-blank path works.
