id: KI-261016-6BAK
title: Menu and lock controls omit accessibility roles and names
description: |-
    Assistive technology cannot identify and operate menu and lock controls because their item trees contain no accessibility roles or names.

    Trigger: Inspect or use the menu and lock surfaces through Qt's accessibility bridge with assistive technology; window-tree publication must be working to observe the missing metadata.

    Where: Audited menu and lock UI surfaces in shell/plugins/menu/** and shell/plugins/lock/**: missing Accessible.role and Accessible.name metadata, including controls built from the shared Ui kit.

    Reported upstream in omacom/omarchy#12009 (https://github.com/omacom/omarchy/issues/12009). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
