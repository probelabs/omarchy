id: KI-LOCK-SPONTANEOUS-UNLOCK-FAIL-OPEN
title: Compositor-side lock loss with a request outstanding is treated as a finished unlock; no re-lock
description: 'WlSessionLock.onLockStateChanged (shell/plugins/lock/Service.qml:500-507): when locked flips false while lockRequested still holds, the branch clears lockRequested and pendingSessionLock, resets auth state and calls runWake() with no queueSessionLock/beginLock. That locked flip is an ext-session-lock finish/acquire failure delivered by the compositor rather than finishUnlock. finishUnlock sets lockRequested=false BEFORE locked=false, so this branch only runs for an external drop. A spontaneous protocol-level unlock then fails open (session visible, no re-lock attempted), unlike the no-real-screen path which keeps retrying.'
affected_requirements:
    - SYS-REQ-260912-T0XP
evidence_manifests:
    - proof/evidence/ki-lock-spontaneous-unlock-fail-open.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: unlikely
reproducer_command: ./pocs/lock-service-failopen-runtime.sh
introduced_in: inception
defect_class: latent
mitigation: The trigger needs the compositor or quickshell to end a held lock on its own. Upstream triage on Hyprland 0.56.2 found no compositor route to that (omacom/omarchy#10459). If the desktop shows after a wake, lock it again with omarchy-system-lock.
remediation: Re-queue the lock (queueSessionLock) when locked flips false while lockRequested is outstanding, instead of treating it as an unlock
notes:
    - '2026-10-04: re-checked on upstream quattro 035ce29f, where the drop arm is unchanged. pocs/lock-service-failopen-runtime.sh exits 0 (defect present) there and on upstream quattro 393a43d4. Upstream omacom/omarchy#7072 reports a lock that reverts about 4s after it engages. #10459 reports a desktop exposed after an output re-add. PR #11810 re-locked through omarchy-hyprland-session-locked and closed unmerged.'
    - cve_surface is unlikely. The branch fails open whenever the loss happens, so kill_domain stays fail_open. But no party can cause the compositor-side lock loss on demand. Upstream triage on Hyprland 0.56.2 found no compositor route that ends a held lock and kept the lock in 12 attempts. The 'unlocked' event in the field reports comes from finishUnlock, not from this branch.
