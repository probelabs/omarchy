id: KI-MENU-GUARD-ID-INJECTION-BATCH-ABORT
title: 'Guard ids interpolated unquoted into the shared bash batch: metacharacter ids break the protocol or execute commands'
description: 'guardLine splices the id unquoted: guardScript({''my;id'': {when:''true''}}) emits ''echo my;id:w:1'' - a second command and a broken record format (F16a2). The result parser then attributes answers to the wrong ids. Because all guards share ONE script, a single unbalanced expression makes the entire batch fail bash -n. Every row then silently keeps its last answers (F16b2). A boolean when/checked/disabled (normalizeItem preserves it) throws inside generation and aborts the script build entirely (F16c2).'
affected_requirements:
    - SW-REQ-260922-MQ37
    - SW-REQ-260922-Y58B
evidence_manifests:
    - pocs/menu-probes.js
    - pocs/menu-probes2.js
    - pocs/menu-probes3.js
    - proof/evidence/ki-menu-guard-id-injection-batch-abort.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: node pocs/menu-probes3.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Ids come from the user's own menu JSONC, so the injection harms only the user's own config. A broken batch leaves guards stale until the next rebuild
remediation: single-quote the id into the echo (or base64 it) and sanitize/validate expressions at parse time; fail one guard without failing the batch
