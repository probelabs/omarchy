candidate:
    draft_ref: 'R-185#idle-lock-secondary-surface-inert'
    reproducer_sketch: 'With two external outputs and internal panel disabled, use DP-2 at 3840x2160 scale 1.5 and DP-3 at position 2560x0. Verify manual lock mirrors input and unlocks both, then allow idle lock. Actual: no mirrored input on DP-2 and its lock image remains frozen after DP-3 unlocks. Expected both views work and disappear. Reporter says changing stabilization 500 to 1500 ms fixes this; invalid geometry at surface creation remains inferred.'
