id: KI-261016-VDRV
title: Idle lock leaves an output's lock view inert after another output unlocks
description: |-
    One output's lock view does not mirror password input and remains frozen after authentication returns another output to the desktop.

    Trigger: Idle lock engages on multiple connected outputs while their layout is settling; manual lock works in the reported reproduction.

    Where: shell/plugins/lock/Service.qml queueSessionLock, sessionLockStabilizeTimer and requestSessionLock driving per-output WlSessionLockSurface creation

    Reported upstream in omacom/omarchy#12949 (https://github.com/omacom/omarchy/issues/12949). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
