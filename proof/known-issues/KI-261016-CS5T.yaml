id: KI-261016-CS5T
title: Lock-screen fingerprint PAM stack has no clamshell gate, so fingerprint auth runs while the lid is closed
description: |-
    With the laptop lid closed, the lock screen still invokes pam_fprintd.so on every fingerprint attempt instead of skipping fingerprint authentication.

    Trigger: The session is locked, or resumes from suspend, while the lid is closed and a fingerprint is enrolled.

    Where: bin/omarchy-apply-lock's fingerprint PAM install: the tee heredoc that writes /etc/pam.d/omarchy-lock-fingerprint as only 'auth required pam_fprintd.so' with no omarchy-hw-laptop-closed pam_exec gate

    Reported upstream in omacom/omarchy#10096 (https://github.com/omacom/omarchy/issues/10096). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
