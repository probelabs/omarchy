id: KI-MENU-ITEM-PROTOTYPE-LEAK
title: 'Map reads walk Object.prototype: item(), results maps, providersLoaded treat constructor/toString as real entries'
description: 'item() is a raw truthy read (items[id] ? ... : null), so inherited prototype properties look up as menu rows (probe F7). They beat aliases in resolveRoute, defeat the root fallback in openExistingMenu/setActiveMenu, and mark provider menus already-loaded (loadProviderForMenu''s providersLoaded truthiness, SX26/C21). The same class hits results maps: isDisabled/labelFor read disabledResults[id] off a fresh {} and get the inherited function. They dim and check-mark a row whose id collides (HFY2/C16).'
affected_requirements:
    - SW-REQ-260922-PRNV
    - SW-REQ-260922-50RE
evidence_manifests:
    - pocs/menu-probes.js
    - pocs/menu-probes2.js
    - pocs/menu-probes3.js
    - proof/evidence/ki-menu-item-prototype-leak.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: node pocs/menu-probes.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: requires a menu id that collides with an Object.prototype name - user-authored JSONC can do this
remediation: 'hasOwnProperty checks (or null-prototype maps / Object.hasOwn) at every dynamic map read: item(), results lookups, providersLoaded'
