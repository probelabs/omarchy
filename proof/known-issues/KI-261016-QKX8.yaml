id: KI-261016-QKX8
title: Lock screen discards fingerprint PAM guidance messages instead of showing them
description: |-
    Info and error text the fingerprint PAM module sends during a lock-screen verify (such as a prompt to remove the finger and try the sensor again) is relayed to the shell and then discarded. The lock screen shows no message, so a bad press, an unusable image and a timeout look the same.

    Trigger: A fingerprint verify on the lock screen produces a PAM info or error message, including a prompt to remove the finger and try the sensor again.

    Where: lock: shell/plugins/lock/Service.qml fingerprint PamContext message handling (the message text is never stored) and shell/plugins/lock/LockView.qml, which has no element that shows fingerprint PAM text

    Reported upstream in omacom/omarchy#13954 (https://github.com/omacom/omarchy/issues/13954). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
