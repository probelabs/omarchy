    reproducer_sketch: 'Enroll a fingerprint, lock the screen, and press so the module asks the user to remove the finger and try again. Expected that guidance on the lock screen. Actual the journal relays the message and the lock screen shows nothing. The report also says fprintd returns an auth error for verify-remove-and-retry; that daemon behavior is a separate failure and is not this defect.'
