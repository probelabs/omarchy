id: KI-261016-90GM
title: Lock screen persistently renders without the configured wallpaper
description: |-
    The lock view shows a bare password field on a blank background instead of the configured wallpaper. The reporter says input does not restore the wallpaper and the failure persists across a shell restart.

    Trigger: Lock the session in the affected configuration, either manually or across suspend/resume.

    Where: lock: shell/plugins/lock/LockView.qml wallpaper presentation; the image-loading failure mechanism is not established.

    Reported upstream in omacom/omarchy#7416 (https://github.com/omacom/omarchy/issues/7416). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
