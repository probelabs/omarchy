id: KI-MENU-SEARCH-SCORE-RANKING
title: 'searchScore ranking: root exact labels rank below nested twins; cross-field multi-term matches score as unmatched'
description: searchScore in MenuModel.js has two ranking defects. An exact label at root scores base 2, and the same exact label deeper in the tree scores base 0 (F15f). The root row therefore ranks below its nested twin, because the depth tie-break adds only 25 per level against a gap of 2000. matchesQuery accepts a multi-term query that matches across fields, with one term in the label and one in the description. searchScore gives that row 78000, the same as a row that matches nothing (F15e2). It therefore ranks below every single-field match.
affected_requirements:
    - SW-REQ-260922-SJ7P
evidence_manifests:
    - pocs/menu-probes.js
    - pocs/menu-probes2.js
    - pocs/menu-probes3.js
    - proof/evidence/ki-menu-search-score-ranking.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: node pocs/menu-probes3.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Ranking anomalies reorder results but never hide them; the wanted entry stays on the results list
remediation: Score a multi-term query from its per-term matches, so a cross-field match ranks with the other matches. Give root and nested exact labels the same base, so the depth tie-break orders them.
notes:
    - 'PR omacom/omarchy#12223 (head b74292ac, mirrored on pr/12223 over quattro-proof): F15d (the app nudge that contradicts the code comment "App rows sort after all menu items") becomes by-design. The PR rewrites that comment to "apps always rank above menu entries" and raises the app bias to -100, beyond the whole tier range; SW-REQ-260922-SJ7P is updated to match. The pinned probe still reports F15d REAL because it checks app-first ordering, which the PR now intends. F15f (root vs nested exact label) and the multi-term collapse are unaffected by the PR.'
    - 'We withdrew the app-first leg (F15d): merged PR #6383 (merge commit 35ebe2df) ranks an app ahead of an equally matching menu row on purpose.'
