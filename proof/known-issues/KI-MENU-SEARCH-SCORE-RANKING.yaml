id: KI-MENU-SEARCH-SCORE-RANKING
title: 'searchScore ranking anomalies: apps promoted within their tier against the documented ordering, root exact-labels swamped by the nested band, multi-term cross-field matches collapse into the miss band'
description: 'Executed probes: an app and a menu row with equal scores rank app-FIRST (the -5 within-tier nudge) although the code comment contracts ''App rows sort after all menu items'' (F15d); an exact label at root scores base 2 while the identical exact label nested deeper scores base 0, so the root row ranks below its nested twin and the depth tie-break is swamped (F15f); a multi-term query that matchesQuery accepts across fields (one term on the label, one on the description) scores in the unmatched baseline band, below a single-field pure match (F15e2 - measured 78000 for an accepted query).'
