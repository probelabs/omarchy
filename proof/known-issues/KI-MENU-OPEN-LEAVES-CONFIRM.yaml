id: KI-MENU-OPEN-LEAVES-CONFIRM
title: A summon over an open uninstall confirmation leaves it up, and Enter meant for the new prompt uninstalls the app
description: |-
    Delete on an app row opens the uninstall confirmation. Uninstall is the preselected button (shell/Ui/ConfirmDialog.qml selectedIndex 1). Only onOpenedChanged clears the confirmation state, when the menu closes. A summon goes through open() into openDmenu, or into openRoute and openExistingMenu. These replace the rows while opened stays true, and they never clear deleteConfirmOpen or deleteTarget.

    The dialog stays on top of the new rows and still takes every key. Enter then runs confirmDelete. It cancels the summoned request, so an omarchy-menu-select caller exits 1, and it removes the app. A live run on upstream 821ae589 (headless sway and Quickshell) confirmed it. That run lost the desktop file of the app for a select prompt, an input prompt and a route summon.
affected_requirements:
    - SW-REQ-260922-8CQ4
evidence_manifests:
    - proof/evidence/ki-menu-open-leaves-confirm.yaml
severity: medium
severity_basis: risk
risk: data_integrity
cve_surface: none
reproducer_command: bash test/shell.d/menu-uninstall-confirm-test.sh
tripwire_mutation: 'Remove the guarded root.cancelDelete() call at the top of open() in shell/plugins/menu/Menu.qml (the 821ae589 behaviour): the red reproducer test/shell.d/menu-uninstall-confirm-test.sh fails at ''a select prompt summoned over an uninstall confirmation dismisses it''.'
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Only a summon that arrives while the confirmation shows triggers it, for example an omarchy-menu-select caller such as the Super+K keybindings list. Escape or Cancel on the confirmation before the summon avoids it. Menu keybinds that toggle close the menu, and that clears the confirmation.
remediation: Fixed by the upstream change that makes a summon cancel a pending confirmation in open() (SW-REQ-261002-VJR1); mirror pr-A.
notes:
    - 'Fixed on mirror pr-A by the upstream change (open() runs cancelDelete() when a confirmation is pending). Spec: SW-REQ-261002-VJR1, spec conformance REVIEW-261002-MV7M. The reproducer is now the bound in-suite test test/shell.d/menu-uninstall-confirm-test.sh (Reproduces marker); it fails on 821ae589 and passes with the fix. The earlier mitigation understated the impact: Enter defaults to Uninstall, so the first Enter removes the app.'
customer_impact: If something summons the menu while an uninstall question is open, the question stays on top of the new prompt. The dialog preselects Uninstall, so the Enter you meant for the prompt uninstalls the app. Omarchy deletes your own, web-app and TUI launchers with no further prompt; for a package, it opens the uninstall terminal. The prompt's caller gets a cancel, so the action behind it never runs.
