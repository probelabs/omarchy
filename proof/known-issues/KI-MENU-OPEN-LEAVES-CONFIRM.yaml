id: KI-MENU-OPEN-LEAVES-CONFIRM
title: A menu summon leaves a pending uninstall question on top of the new prompt
description: 'Every summon enters through open(), which calls openDmenu(), or openRoute() and then openExistingMenu(). These replace the mode, rows and request files while opened stays true, and none of them clears deleteConfirmOpen or deleteTarget (anchor CNF1). Only onOpenedChanged clears them, when the menu closes. The keyCatcher still sends every key to the dialog, which preselects Uninstall. Enter then runs confirmDelete(): cancel() finishes the new request with no selection, and appLibrary.remove() uninstalls the app.'
affected_requirements:
    - SW-REQ-260922-8CQ4
evidence_manifests:
    - pocs/menu-qml-static.sh
    - proof/evidence/ki-menu-open-leaves-confirm.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: pocs/menu-qml-static.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: It takes an unanswered uninstall question plus a summon, such as a script prompt that appears while you are in the Apps menu. Answering the question with Escape or Cancel, or closing the menu, clears it.
remediation: 'Call cancelDelete() in open(), where every summon enters, when a question is pending. PR #14054 does this.'
customer_impact: If something summons the menu while an uninstall question is open, the question stays on top of the new prompt. The dialog preselects Uninstall, so the Enter you meant for the prompt uninstalls the app. Omarchy deletes your own, web-app and TUI launchers with no further prompt; for a package, it opens the uninstall terminal. The prompt's caller gets a cancel, so the action behind it never runs.
