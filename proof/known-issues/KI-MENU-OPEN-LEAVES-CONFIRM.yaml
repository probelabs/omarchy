        attacker_profitability: 'local-behavioral defect: no attacker gains anything; the trigger is the user''s own uninstall question and a summon'
        reachability_verified: 'local-behavioral defect: the trigger is a summon inside the user''s own session; there is no ingress layer to traverse'
        untrusted_attacker: 'local-behavioral defect: no untrusted party supplies the input'
