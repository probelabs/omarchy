candidate:
    draft_ref: 'R-227#large-background-picker-open-timeout'
    reproducer_sketch: 'Put about 500 images in ~/.config/omarchy/backgrounds/<theme>/ and invoke SUPER+CTRL+SPACE or omarchy-theme-bg-switcher. Expected a working image selector; actual acceptance timeout and no picker. Repeat with OMARCHY_SHELL_IPC_TIMEOUT=15s to see the delayed carousel appear after a few seconds.'
