id: KI-261016-N0BM
title: Menu row guards compare the row's own label literal, so a translated or reworded label breaks the guard
description: |-
    A guarded menu row misreports its state when its label is translated or reworded: the guard expression compares a shell literal equal to the row's label, the comparison silently fails, and e.g. the DNS menu shows nothing selected on a machine whose DNS is fine. Eight rows are affected (low, mid, high, DHCP, Cloudflare, Google, Custom, omp); Custom translated in a live Russian pack was hit in the field.

    Trigger: Translate or reword the label of a menu row whose checked/when/disabled guard compares that label as a shell literal.

    Where: menu: default/omarchy/omarchy-menu.jsonc guard expressions (checked/when/disabled) comparing the row's own label literal, evaluated by the bin/omarchy-menu* readers

    Reported upstream in omacom/omarchy#12345 (https://github.com/omacom/omarchy/issues/12345). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
