id: KI-261016-38J6
title: Shell SIGSEGV in Qt QML garbage collection or object destruction while lock fingerprint authentication is active
description: |-
    The shell (Quickshell) terminates with SIGSEGV whose faulting frames are in Qt QML garbage collection (QV4 mark stack / GC state machine) or QObject/QQuickItem destruction (QQmlData::destroyed via posted deferred-delete events), not in the PAM subprocess; it restarts and recovers the stranded lock.

    Trigger: A lock-screen fingerprint PAM conversation is active and waiting for, or timing out on, the fingerprint reader (including after the reader re-enumerates); no monitor add/remove precedes the crash.

    Where: lock: the fingerprint authentication lifecycle of shell/plugins/lock/Service.qml (omarchy-lock-fingerprint PAM conversation); the fault is in Qt QML GC / object teardown and the QML object is not identified

    Reported upstream in omacom/omarchy#14396 (https://github.com/omacom/omarchy/issues/14396). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
