    reproducer_sketch: 'Enable fingerprint unlock, lock, and leave the fingerprint conversation waiting or timing out (reporter: Validity VFS5011 on a ThinkPad X260, three crashes on one boot, one ~15 s after the reader re-enumerated). Expected the shell to keep running. Actual SIGSEGV in QV4::MarkStack::drain / GCStateMachine::transition or QQmlData::destroyed teardown, followed by lock-stranded recovery and ''Device was already claimed'' fingerprint retries.'
