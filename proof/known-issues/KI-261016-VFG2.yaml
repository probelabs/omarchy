candidate:
    draft_ref: 'R-5367#lock-blank-docked-suspend'
    reproducer_sketch: 'Dock the laptop to external display(s), close the lid, lock (or let the idle lock fire), wait about 35 s. Expected: the docked closed-lid machine stays awake with the displays blanked. Actual: logind''s Docked property goes true -> false on DPMS off (busctl get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager Docked) while /sys/class/drm/*/status stays connected; HandleLidSwitch=suspend suspends at the holdoff, and the cycle repeats after every resume (journal: resume -> ''display sleep detected'' at +6 s -> systemd-logind: Suspending... at +29 s).'
