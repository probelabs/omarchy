id: KI-261016-BYKK
title: Menu opening and action dispatch repeatedly pay login-shell startup overhead
description: |-
    Opening the menu from its bar button and dispatching menu actions are perceptibly delayed by repeated login-shell startup before the requested operation.

    Trigger: Activate the menu bar button or a menu row whose dispatch goes through a fresh login shell and sources profile files on each invocation.

    Where: menu: shell/plugins/menu/BarWidget.qml onPressed and shell/plugins/menu/Menu.qml runAction calling the shell-command dispatch path

    Reported upstream in omacom/omarchy#7093 (https://github.com/omacom/omarchy/issues/7093). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
