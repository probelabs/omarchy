id: KI-261016-JR1H
title: Setup > Network menu has no row that opens the Wi-Fi panel
description: |-
    The Omarchy menu's Setup > Network submenu lists only DNS and QR Code; no row summons the Wi-Fi scan/connect panel, so without the bar's network widget the menu offers no way to pick or switch a Wi-Fi network.

    Trigger: Open Setup > Network in the Omarchy menu; it matters once the bar's network widget is absent (plugin disabled, removed from a custom shell.json, or dragged off the bar).

    Where: menu: the Setup > Network submenu in the menu's item tree (default/omarchy/omarchy-menu.jsonc), which declares no Wi-Fi row.

    Reported upstream in omacom/omarchy#10803 (https://github.com/omacom/omarchy/issues/10803). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
