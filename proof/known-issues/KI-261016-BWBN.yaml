    reproducer_sketch: 'Lock the session (omarchy system lock or idle lock), type a wrong password and submit. Expected: the failure is reported and the field still visibly invites input (placeholder or visible field next to the message). Actual: only the red ''Authentication failed (1)'' shows; clicking changes nothing; typing makes the dot field reappear and the next correct password unlocks. Reported on Omarchy 4.0.4-1, quickshell 0.3.1-1.'
