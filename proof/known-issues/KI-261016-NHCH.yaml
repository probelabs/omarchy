id: KI-261016-NHCH
title: Defaults Editor menu hides installed Zed because its when-guard checks zeditor
description: |-
    Setup → Defaults → Editor does not show Zed as checked, or hides the row, so Neovim looks like the standard editor.

    Trigger: Zed is installed as the Arch binary /usr/bin/zed (no zeditor on PATH) and the menu entry's when is omarchy-cmd-present zeditor.

    Where: menu: default/omarchy/omarchy-menu.jsonc entry setup.default.editor.zed

    Reported upstream in omacom/omarchy#11326 (https://github.com/omacom/omarchy/issues/11326). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
