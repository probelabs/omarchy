severity: high
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: shell/plugins/lock/Service.qml (session lock lifecycle, missing-pam gate)
reproducer_command: ./pocs/crs-260930-ttvk-qml-static.sh
tripwire_mutation: 'Re-check passwordPamConfigured inside requestSessionLock (shell/plugins/lock/Service.qml:87-99) and stand the lock back down on the false transition: the anchored C01 assertions in pocs/crs-260930-ttvk-qml-static.sh flip from PRESENT to ABSENT and the script exits 1'
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: fingerprint PAM (if configured) can still unlock; TTY remains
remediation: Re-check passwordPamConfigured in requestSessionLock before sessionLock.locked = true and stand the lock back down (with the missing-pam notification) when it went false; treat a PAM flip while lockRequested as a teardown trigger
