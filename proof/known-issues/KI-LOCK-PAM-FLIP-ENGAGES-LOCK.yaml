id: KI-LOCK-PAM-FLIP-ENGAGES-LOCK
title: Lock engages when password PAM disappears during the stabilize window; the missing-pam gate runs only at the IPC instant and the stranded watchdog stands down
description: The missing-pam gate (lockIpc.lock, shell/plugins/lock/Service.qml:741-746) checks passwordPamConfigured once; beginLock then schedules requestSessionLock through the 500ms stabilize delay, and requestSessionLock (87-99) re-checks only lockRequested/sessionLock state - never PAM. A FileView reload whose onLoadFailed lands inside that window (config removed / TTY-cleared failsafe) flips the flag after the gate but before line 99 sets sessionLock.locked = true; onPasswordPamConfiguredChanged early-returns on the false transition and checkStrandedLock explicitly stands down once lockRequested is set ('a lock this shell took is nobody's orphan'), so the session locks with no password PAM behind it and nothing releases it.
affected_requirements:
    - SW-REQ-260912-J8SX
    - SYS-REQ-260912-T0XP
evidence_manifests:
