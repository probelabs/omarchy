id: KI-261016-GCVY
title: Lock password field stores and measures an unbounded password
description: |-
    The lock screen accepts a password of any length, builds a repeated-character TextMetrics string the same length, and forwards the whole value into PAM, so allocation and layout grow with the input.

    Trigger: Keyboard or clipboard input of a very long password into the lock screen's password field.

    Where: shell/plugins/lock/LockView.qml password text and TextMetrics, and Service.qml where that value is assigned and sent to PAM

    Reported upstream in omacom/omarchy#10078 (https://github.com/omacom/omarchy/issues/10078). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
