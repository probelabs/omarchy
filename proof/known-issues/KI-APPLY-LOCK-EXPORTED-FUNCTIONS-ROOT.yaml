id: KI-APPLY-LOCK-EXPORTED-FUNCTIONS-ROOT
title: Imported bash functions bypass the trusted-PATH pin in apply-lock's root branch
description: |-
    The EUID==0 branch (bin/omarchy-apply-lock:15) replaces PATH but keeps the rest of the inherited environment. Bash imports exported functions (BASH_FUNC_grep%%, BASH_FUNC_command_not_found_handle%%, ...) into its function table, and bash looks a name up as a function before it searches PATH. An imported grep therefore runs instead of /usr/bin/grep in the fingerprint gate (lines 62 and 72). An imported command_not_found_handle that returns 0 makes 'if omarchy-shell lock status' (line 88) true when the binary is absent (chroot install). SW-REQ-260912-EKJP (trusted_path_only) does not hold for functions: the root branch can still run commands from its environment instead of the pinned ones.

    The defect crosses no privilege boundary. Every route into the root branch drops imported functions or hands over an environment that root already controls. sudo removes variables whose value starts with "()" (sudoers(5), sudo 1.9.17). pkexec starts the helper in a minimal environment. The installer and the upgrade, when they run as root, pass their own environment.

    Only a process that already runs as root can plant the functions. When a normal user runs the helper, grep runs as that user and only steers that user's own fingerprint setup. The defect is a gap in defence-in-depth hardening.
