reproducer_command: ./pocs/crs-260930-g166-c07-c09.sh
tripwire_mutation: 'Unset imported bash functions under EUID 0 in bin/omarchy-apply-lock before any decision point (or run the body via env -i bash --noprofile --norc): the imported grep()/command_not_found_handle no longer execute, pocs/crs-260930-g166-c07-c09.sh flips from SYMPTOM to PASS-REFUTED (exit 1)'
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: sudo removes variables whose value starts with "()", and pkexec starts the helper in a minimal environment. The installer and the upgrade pass their own root environment. Only a process that already runs as root can plant the functions.
remediation: 'Unset imported functions before any decision point: eval ''unset -f $(compgen -A function)'' under EUID 0. Alternatively run the body via env -i bash --noprofile --norc. Use ''command'' for the pinned lookups'
notes:
    - '2026-10-04: re-checked on upstream quattro 035ce29f. The old reproducer extracted fixed line numbers and broke when #7158 moved the gate. The rewritten reproducer runs the real helper in a user namespace, so EUID is 0 and the root branch runs. Both vectors fire on 035ce29f and on upstream quattro 393a43d4. The clean-environment control shows the pinned PATH and no marker.'
