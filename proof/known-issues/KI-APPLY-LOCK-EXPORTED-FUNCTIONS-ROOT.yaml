    notes: |
        real_infrastructure: the PoC extracts the LIVE decision expressions (bin/omarchy-apply-lock lines 48 and 62) verbatim and runs them under the hostile inherited environment - no reimplementation.
        quantitative_impact: both vectors leave a filesystem marker proving caller-supplied code executed at the root helper's decision points (grep hijack in the fingerprint gate; command_not_found_handle returning 0 with the binary absent); the clean-environment control leaves no marker and reads the gate correctly.
        control_test: same extracted condition under a clean environment with an enrolled fprintd-list stub evaluates TRUE via the pinned /usr/bin/grep (pocs/crs-260930-g166-c07-c09.sh control arm).
        untrusted_attacker: the hijack input is caller-controlled exported functions - no privileged role is needed to plant them in the invoking session.
        current_deployment_relevance: the pin at bin/omarchy-apply-lock:15 replaces PATH but not the environment on this branch today; the PoC extracts the live lines at run time.
        honest_severity: high - demonstrated caller-controlled code execution at root privilege inside the lock installer; no higher impact claimed.
        attacker_profitability: cost is control of the calling shell's environment (any session process); revenue is arbitrary code execution as root at every decision point - favorable asymmetry, stated without inflation.
        reproducible: single command ./pocs/crs-260930-g166-c07-c09.sh, deterministic, runs in well under a minute.
        no_inflation: the claim is limited to the demonstrated decision-point execution; no persistence or further escalation is asserted.
        operational_path_verified: the control arm exercises the intended path (pinned lookup, correct gate decision) and shows it intact in a clean environment.
    not_applicable:
        reachability_verified: 'the modeled attacker is the invoking user''s own environment of a local root helper: the trusted-PATH pin IS the ingress layer and the defect itself is its bypass, so a separate end-to-end reachability run through pkexec adds nothing the extracted live decision expressions do not already demonstrate'
