severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: sh pocs/menu-jsonc-block-comment.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Block comments are outside the grammar that docs/menu.md documents (whole-line // comments only). The failure is visible because the entries of the file disappear
remediation: Add a string-aware block-comment pass ahead of the comma pass, or document block comments as unsupported
