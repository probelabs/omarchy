id: KI-MENU-JSONC-STRIP-GAPS
title: 'stripJsonc has no block-comment pass: a /* */ comment empties the whole file'
description: Upstream stripJsonc (shell/plugins/menu/MenuModel.js:2-6) removes whole-line // comments and trailing commas only. A /* */ block comment stays in the text. JSON.parse rejects it, and parseMenuJsonc returns an empty item set for an otherwise valid menu file. docs/menu.md documents whole-line // comments only, so block comments are outside the documented grammar, but nothing tells the user why their entries disappeared. omacom/omarchy#13968 keeps block comments unsupported and documents that, so this issue stays open after it lands. CR-only line endings and non-ASCII whitespace are separate issues (KI-MENU-JSONC-CR-LINE-ENDINGS, KI-MENU-JSONC-UNICODE-WHITESPACE).
affected_requirements:
    - SW-REQ-260922-E4J2
evidence_manifests:
