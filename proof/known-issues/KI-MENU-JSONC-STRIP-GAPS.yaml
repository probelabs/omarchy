introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: a whole-file comment or comma-shape already breaks the menu (parse returns []), which is visible
remediation: strip only the comment bytes, preserving the line break; add a block-comment branch; treat CR as a line terminator
