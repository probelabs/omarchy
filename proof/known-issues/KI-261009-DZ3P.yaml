id: KI-261009-DZ3P
title: Stranded-lock recovery stalls because requestSessionLock treats a stale secure flag as a working lock
description: |-
    The lock surface is gone and Hyprland's lockscreen-app-died wall stays up indefinitely while the shell process stays alive. The lock service logs lock-stranded: recovering, lock-requested, and lock-pending: screen-stabilizing, then nothing, and no password prompt appears. A TTY is required to get out.

    Trigger: the lock surface is destroyed while the session is locked but the shell process keeps running (a file change in a loaded local plugin reloads the shell QML). Stranded-lock recovery then runs, and requestSessionLock returns on every pendingSessionLockTimer retry because sessionLock.secure is true while sessionLock.locked is still false. That pair is not a working lock: the session lock was never taken.

    SW-REQ-260912-WJYM requires the service to take the session lock once when the stranded-lock probe exits 0, the service holds no lock, and password PAM exists, and to log the recovery. The live functions do log the recovery and request the lock, then requestSessionLock returns without setting sessionLock.locked. The requirement does not state that a secure flag without a held session lock must not block that take; the code marks the pair unreachable.

    Reports:
    - https://github.com/omacom/omarchy/issues/6888
    - https://github.com/omacom/omarchy/issues/12080
    - https://github.com/omacom/omarchy/issues/11389
