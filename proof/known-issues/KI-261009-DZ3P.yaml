severity: medium
severity_basis: risk
risk: availability
cve_surface: none
affected_api: lock service requestSessionLock during stranded-lock recovery
reproducer_command: bash pocs/reproducers/ki-261009-dz3p/repro.sh
introduced_in: inception
defect_class: latent
disclosure: public
mitigation: 'From a TTY, clear Hyprland''s crashed-lockscreen wall with hyprctl eval ''hl.clear_crashed_lockscreen()'' and lock again, or restart the shell process. Until requestSessionLock stops treating a secure flag without a held session lock as a working lock, do not write files under a loaded plugin while the session is locked: that reload destroys the lock surface and leaves this stall.'
remediation: 'In shell/plugins/lock/Service.qml requestSessionLock, do not return just because sessionLock.secure is true when sessionLock.locked is false. A secure flag without a held session lock is not a working lock; after the stabilize wait, the service should still set sessionLock.locked so the recovery that already logged lock-stranded: recovering finishes by taking the session lock once. The locked binding (lockRequested || sessionLock.locked || sessionLock.secure) also makes a later checkStrandedLock treat the stall as a healthy lock, so a retry never starts. A person should approve a requirement that states this stale-secure case; SW-REQ-260912-WJYM only requires the take when the service holds no lock and does not mention a secure flag that is true while the session lock is not held.'
