    reproducer_sketch: 'Enroll a fingerprint and wire the native lock PAM. (a) Suspend, resume and scan the enrolled finger immediately; (b) with autologin on, use the first native-lock fingerprint prompt right after session start with no suspend in between. Expected the first scan to unlock. Actual the first attempt is rejected and a second attempt a couple of seconds later succeeds. The resume case''s journal shows ''Cannot run while suspended'' and a failed release because the device is still busy.'
