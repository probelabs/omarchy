id: KI-261016-Q424
title: First lock-screen fingerprint attempt after resume or session start is rejected, then a later one succeeds
description: |-
    The first fingerprint attempt at the native lock screen is rejected, and a second attempt a couple of seconds later succeeds.

    Trigger: Present the enrolled finger at the native lock screen's first fingerprint prompt after a resume, or right after an autologin session starts with no suspend in between.

    Where: lock: the native lock screen's omarchy-lock-fingerprint PAM conversation, Service.qml fingerprint verify

    Reported upstream in omacom/omarchy#10796 (https://github.com/omacom/omarchy/issues/10796). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
