candidate:
    draft_ref: 'R-578#lock-held-no-surface-after-wake'
    reproducer_sketch: 'On the reported Omarchy 4.0.3 setup, lock and confirm secure=true, wait for display blank, then wake it. The reporter sees no lock UI and unusable input, placeholder-screen warnings, and after shell relaunch lock-stranded: recovering followed by lock-pending: no-real-screen until reboot. A later KVM comment reports a live returned HDMI output while the shell still reports realScreens:0. These observations do not establish that retry callbacks are absent.'
