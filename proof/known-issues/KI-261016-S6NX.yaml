id: KI-261016-S6NX
title: Locked session remains without a usable lock surface after outputs disappear and return
description: |-
    After outputs disappear and return during an already locked session, no usable lock surface returns and input cannot unlock the session. The lock remains held; relaunching the shell can leave its recovery pending with no real screen recognized.

    Trigger: All real outputs disappear during a locked session and subsequently return, for example during display blank and wake or an output reconnection.

    Where: lock: shell/plugins/lock/Service.qml session-lock surface lifecycle and pending-request/stranded-lock recovery interacting with Quickshell's real-screen list.

    Reported upstream in omacom/omarchy#11794 (https://github.com/omacom/omarchy/issues/11794). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
