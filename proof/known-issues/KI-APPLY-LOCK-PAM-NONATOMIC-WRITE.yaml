        reproducible: deterministic, three arms, under 1s; byte comparison and inode equality decide every assertion; nothing outside a temp dir is touched and the run refuses to start as root.
        no_inflation: claims limited to the demonstrated torn live file after an interrupted write; no privilege, bypass or remote claims.
