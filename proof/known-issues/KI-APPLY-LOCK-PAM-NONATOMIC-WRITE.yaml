severity: medium
severity_basis: reproducer
risk: availability
cve_surface: none
affected_api: bin/omarchy-apply-lock (writes /etc/pam.d/omarchy-lock-password and omarchy-lock-fingerprint)
reproducer_command: ./pocs/apply-lock-pam-torn-write.sh
tripwire_mutation: |-
    In bin/omarchy-apply-lock, each `as_root tee /etc/pam.d/<stack>` writes `/etc/pam.d/<stack>.tmp` instead. After the heredoc, `as_root mv -f /etc/pam.d/<stack>.tmp /etc/pam.d/<stack>` replaces the live file. Apply this to omarchy-lock-password and omarchy-lock-fingerprint. The interrupted write then tears only the temp file, and the live path keeps the previous complete stack.

    The "torn prefix" and "previous stack gone" assertions in pocs/apply-lock-pam-torn-write.sh fail on both arms, and the tripwire flips red. The control arm does not change.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: The helper runs only at install, at upgrade or at an explicit reconfigure. Each write is a few hundred bytes, so the window is short. A new run of bin/omarchy-apply-lock rewrites both stacks completely. If the lock screen rejects a correct password after an interrupted install or update, switch to a TTY, log in, and run the helper again.
remediation: |-
    Write each stack to a sibling temp file in /etc/pam.d. Then rename the temp file over the live path. The rename stays on one filesystem, so it is atomic. For example, `as_root tee /etc/pam.d/omarchy-lock-password.tmp` followed by `as_root mv -f /etc/pam.d/omarchy-lock-password.tmp /etc/pam.d/omarchy-lock-password`.

    Do the same for omarchy-lock-fingerprint, and optionally fsync before the rename. Then remove the atomic_write deferrals on SYS-REQ-260912-JW2J and SW-REQ-260912-Y0WT and add witnesses. Close criterion: pocs/apply-lock-pam-torn-write.sh flips red, because the interrupted write leaves the previous complete stack on the live path.
notes:
    - '2026-10-04: re-checked on upstream quattro 035ce29f. Since #7158, the fingerprint branch installs the resume hook and drop-in and reloads systemd before its tee. The harness now retargets those paths too and records systemctl. Both arms still leave a torn live stack on 035ce29f and on upstream quattro 393a43d4.'
