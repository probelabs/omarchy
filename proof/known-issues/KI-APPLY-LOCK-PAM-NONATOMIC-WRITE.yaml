id: KI-APPLY-LOCK-PAM-NONATOMIC-WRITE
title: omarchy-apply-lock rewrites the lock PAM stacks in place; an interrupted run leaves a torn stack on the live path
description: 'bin/omarchy-apply-lock writes both lock-screen PAM stacks with `as_root tee /etc/pam.d/omarchy-lock-password` and, when a finger is enrolled, `as_root tee /etc/pam.d/omarchy-lock-fingerprint`, each fed from a heredoc. tee opens the live file with O_TRUNC and rewrites it in place; there is no write to a temp file followed by a rename. From the moment tee opens the file until it finishes, the live path holds a truncated prefix of the new stack, and the previous complete stack is already gone. If the helper is interrupted in that window (installer or update killed, session lost, power cut before the data is flushed), the lock screen is left authenticating against a torn stack. For the password stack that can mean no pam_unix line at all, so password unlock fails until the helper is re-run. For the fingerprint stack the pam_fprintd line can be cut short. The window is short (a few hundred bytes written by one process), so the likelihood is low, but the impact on a lock screen is high. pocs/apply-lock-pam-torn-write.sh reproduces it on the real helper: it freezes each write after 60 bytes and SIGKILLs the run. The live file is then the torn 60-byte prefix (of 549 and 122 bytes), the seeded previous stack is gone, and the inode is unchanged (in-place rewrite). The control arm shows an uninterrupted run writes both stacks byte-identical to the heredocs.'
affected_requirements:
    - SYS-REQ-260912-JW2J
