severity: medium
severity_basis: reproducer
risk: availability
cve_surface: none
affected_api: bin/omarchy-apply-lock (writes /etc/pam.d/omarchy-lock-password and omarchy-lock-fingerprint)
reproducer_command: ./pocs/apply-lock-pam-torn-write.sh
tripwire_mutation: In bin/omarchy-apply-lock, each `as_root tee /etc/pam.d/<stack> >/dev/null <<'EOF'` becomes `as_root tee /etc/pam.d/<stack>.tmp >/dev/null <<'EOF'`, followed after the heredoc by `as_root mv -f /etc/pam.d/<stack>.tmp /etc/pam.d/<stack>`, for both omarchy-lock-password and omarchy-lock-fingerprint. The interrupted write then tears only the temp file, the live path keeps the previous complete stack, the "torn prefix" and "previous stack gone" assertions in pocs/apply-lock-pam-torn-write.sh fail on both arms, and the tripwire flips red. The control arm is unaffected.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: The helper runs only at install, upgrade or an explicit reconfigure, and each write is a few hundred bytes, so the vulnerable window is short. Re-running bin/omarchy-apply-lock rewrites both stacks completely. If the lock screen rejects a correct password after an interrupted install or update, switch to a TTY, log in, and re-run the helper.
remediation: 'Write each stack to a sibling temp file in /etc/pam.d and rename it over the live path (same filesystem, so the rename is atomic), e.g. `as_root tee /etc/pam.d/omarchy-lock-password.tmp >/dev/null <<''EOF'' ... EOF` then `as_root mv -f /etc/pam.d/omarchy-lock-password.tmp /etc/pam.d/omarchy-lock-password`, and the same for omarchy-lock-fingerprint. Optionally fsync before the rename. Then remove the atomic_write deferrals on SYS-REQ-260912-JW2J and SW-REQ-260912-Y0WT and add witnesses. Close criterion: pocs/apply-lock-pam-torn-write.sh flips red because the interrupted write leaves the previous complete stack on the live path.'
