    notes: |
        real_infrastructure: pocs/apply-lock-pam-torn-write.sh runs a scratch copy of the real bin/omarchy-apply-lock in which only the absolute paths (/etc/pam.d/, /usr/bin/fprintd-list and the resume-recovery destinations) are retargeted into a temp dir; reverse substitution must reproduce the product file byte for byte or the harness aborts. The tee that writes the file is the real one; sudo, fprintd-list and omarchy-shell are stubs.
        quantitative_impact: after a SIGKILL during the write the live file is exactly the first 60 bytes of the new stack (of 549 bytes for the password stack, 122 for the fingerprint stack), the seeded previous stack is gone, and the inode is unchanged; the torn password stack carries no pam_unix line.
        control_test: an uninterrupted run writes both stacks byte-identical to the heredocs in the product file, and the sudo stub log shows both as_root writes reached the retargeted live paths.
        operational_path_verified: both write sites are driven through the real as_root wrapper, including the fingerprint branch gated on an enrolled finger.
        current_deployment_relevance: lines 34 and 67 of bin/omarchy-apply-lock carry the in-place tee writes on this branch today.
        honest_severity: medium - high impact (password unlock can fail until the helper re-runs) times low likelihood (an interruption inside a sub-millisecond write window at install or upgrade time); the freeze-and-kill harness widens the window deterministically, it does not claim the window is wide in practice.
        reproducible: deterministic, three arms, under 1s; byte comparison and inode equality decide every assertion; nothing outside a temp dir is touched and the run refuses to start as root.
        no_inflation: claims limited to the demonstrated torn live file after an interrupted write; no privilege, bypass or remote claims.
