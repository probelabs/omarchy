    notes: |
        real_infrastructure: pocs/apply-lock-pam-torn-write.sh runs a scratch copy of the real bin/omarchy-apply-lock in which only the /etc/pam.d/ prefix and the absolute /usr/bin/fprintd-list gate are retargeted into a temp dir; reverse substitution must reproduce the product file byte for byte or the harness aborts. The tee that writes the file is the real one; sudo, fprintd-list and omarchy-shell are stubs.
        quantitative_impact: after a SIGKILL during the write the live file is exactly the first 60 bytes of the new stack (of 549 bytes for the password stack, 122 for the fingerprint stack), the seeded previous stack is gone, and the inode is unchanged; the torn password stack carries no pam_unix line.
        control_test: an uninterrupted run writes both stacks byte-identical to the heredocs in the product file, and the sudo stub log shows both as_root writes reached the retargeted live paths.
        operational_path_verified: both write sites are driven through the real as_root wrapper, including the fingerprint branch gated on an enrolled finger.
        current_deployment_relevance: lines 34 and 50 of bin/omarchy-apply-lock carry the in-place tee writes on this branch today.
