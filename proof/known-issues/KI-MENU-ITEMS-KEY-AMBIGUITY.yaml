id: KI-MENU-ITEMS-KEY-AMBIGUITY
title: A flat menu containing an entry id 'items' is parsed as a wrapper and every sibling entry is silently discarded
description: 'parseMenuJsonc (MenuModel.js:96-98) treats an object-valued top-level ''items'' key as the wrapper form: {''items'': {...}, ''b'': {...}} parses to only the inner rows (F14). A user menu that legitimately names an entry ''items'' loses all siblings with no diagnostic.'
affected_requirements:
    - SW-REQ-260922-E4J2
evidence_manifests:
    - pocs/menu-probes.js
    - pocs/menu-probes2.js
    - pocs/menu-probes3.js
    - proof/evidence/ki-menu-items-key-ambiguity.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: node pocs/menu-probes.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: No shipped menu uses an entry id of items; the ambiguity needs a hand-authored flat document with that exact id
remediation: reserve the wrapper form to documents that carry ONLY an items key (or require an explicit marker), else treat 'items' as an entry id
