id: KI-261016-1ZP2
title: Lock screensaver teardown leaves cursor visibility disabled after unlock
description: |-
    The desktop mouse pointer remains invisible after unlock with cursor:invisible still true.

    Trigger: The lock path terminates a screensaver terminal before the saver can restore the cursor visibility setting it disabled.

    Where: lock: bin/omarchy-system-lock screensaver process and terminal teardown

    Reported upstream in omacom/omarchy#15371 (https://github.com/omacom/omarchy/issues/15371). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
