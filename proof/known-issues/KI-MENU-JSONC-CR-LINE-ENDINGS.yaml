id: KI-MENU-JSONC-CR-LINE-ENDINGS
title: A whole-line comment in a CR-only menu file swallows the rest of the file
description: |-
    The comment pass in stripJsonc (shell/plugins/menu/MenuModel.js) is /^\s*\/\/[^\n]*(\n|$)/gm. With the m flag, ^ also matches after a lone CR. But [^\n]* stops only at LF. Some editors save a file with CR-only line endings (classic Mac style).

    In such a file the first whole-line // comment runs to the end of the file. The pass deletes the rest of the document, JSON.parse fails, and parseMenuJsonc returns an empty item set. We checked this live under Quickshell 0.3.1. FileView keeps CR as read.

    The real MenuModel.js parses a CR-only file with one comment line to 0 rows. LF and CRLF files parse correctly, and so do CR-only files without comments. pocs/menu-jsonc-cr-line-endings.sh reproduces it with LF, CRLF and comment-free controls. test/shell.d/menu-test.sh pins it as a green tripwire.
affected_requirements:
    - SW-REQ-260922-E4J2
evidence_manifests:
    - proof/evidence/ki-menu-jsonc-cr-line-endings.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: MenuModel.stripJsonc comment pass (default and user menu JSONC)
reproducer_command: sh pocs/menu-jsonc-cr-line-endings.sh
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Save the menu file with LF or CRLF line endings. The defect does not affect a CR-only file without comments.
remediation: 'End a // comment at any line terminator that the m flag uses: CR, LF, U+2028 and U+2029. Or normalise CR and CRLF to LF before the comment pass. omacom/omarchy#13968 does not change this, because its comment drop also stops only before LF. Close criterion: pocs/menu-jsonc-cr-line-endings.sh exits 0 and the KI-MENU-JSONC-CR-LINE-ENDINGS tripwire in test/shell.d/menu-test.sh flips red.'
