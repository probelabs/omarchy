id: KI-261016-A4J8
title: omarchy-system-sleep-lock posts a new critical notification per failure instead of replacing the previous one
description: |-
    Each unsecured-suspend report adds another, separate critical 'Screen did not lock before suspend' notification instead of replacing the previous one, so a repeating failure accumulates one identical critical card per occurrence.

    Trigger: report_unsecured() runs repeatedly: the lock budget expires before the session reports secure on successive suspends.

    Where: bin/omarchy-system-sleep-lock report_unsecured(): omarchy-notification-send is called with -u critical but without -r/--replace-id and without keeping the id from -p/--print-id, although omarchy-notification-send supports both.

    Reported upstream in omacom/omarchy#10651 (https://github.com/omacom/omarchy/issues/10651). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
