candidate:
    draft_ref: 'R-861#sleep-lock-report-unsecured-no-replace'
    reproducer_sketch: 'Make report_unsecured fire several times in a row (e.g. a suspend/wake loop where the session cannot reach secure within budget_cap_ms, as on a battery-critical laptop whose drivers are still re-initialising; or invoke the budget-expiry path repeatedly). Expected: one unsecured-suspend card that is replaced (optionally with a count). Actual: one new critical card per failure (the reporter saw 28 for 28 cycles). Because the notification shell keeps critical cards until dismissed and restores them after a restart, they pile up; that persistence lives in the notification shell, not in this script.'
