id: KI-MENU-JSONC-COMMA-IN-STRING
title: stripJsonc trailing-comma regex rewrites string literals that carry a comma before } or ] (omacom/omarchy#13250)
description: 'stripJsonc (shell/plugins/menu/MenuModel.js:2-6) drops trailing commas with the string-blind regex /,(\s*[}\]])/g. The regex does not track string literals, so a comma inside a label or an action that is followed by optional whitespace and } or ] is deleted too. JSON.parse accepts the rewritten text, so nothing fails: the label "x, ]y" renders as "x ]y", and the action "mv f{.bak,}" runs as "mv f{.bak}" with the user''s privileges on row activation. Reported upstream as omacom/omarchy#13250 and validated by report intake (report cmulr8l6h0i461gw40vqqv64c).'
affected_requirements:
    - SW-REQ-260922-E4J2
evidence_manifests:
    - proof/evidence/ki-menu-jsonc-comma-in-string.yaml
severity: medium
severity_basis: risk
risk: data_integrity
cve_surface: none
affected_api: MenuModel.parseMenuJsonc / stripJsonc trailing-comma pass (default and user menu JSONC)
reproducer_command: sh test/reports/report-cmulr8l6h0i461gw40vqqv64c.sh
tripwire_mutation: 'Make the stripJsonc comma pass string-aware (copy string-literal bytes verbatim, as the pr/13255 scanner does): the green tripwires tagged Reproduces KI-MENU-JSONC-COMMA-IN-STRING in test/shell.d/menu-test.sh and test/node/menumodel-replay.test.mjs flip red, and the red reproducer test/reports/report-cmulr8l6h0i461gw40vqqv64c.sh starts exiting 0.'
introduced_in: inception
defect_class: latent
mitigation: Only user- or extension-authored strings that carry a comma directly before } or ] are affected; the shipped default menu has none. A label can avoid the shape by dropping the comma or adding a character between the comma and the closer
remediation: Replace the comma regex with a string-aware pass that copies string literals verbatim (omacom/omarchy PR 13255, fork line pr/13255 with SW-REQ-260927-66FW). Keep the whole-line comment pass first, so a trailing comma followed by comment lines and the closer is still dropped (pinned by the preservation tests)
