severity: medium
severity_basis: risk
risk: data_integrity
cve_surface: none
affected_api: MenuModel.parseMenuJsonc / stripJsonc trailing-comma pass (default and user menu JSONC)
reproducer_command: sh test/reports/report-cmulr8l6h0i461gw40vqqv64c.sh
tripwire_mutation: 'Make the stripJsonc comma pass string-aware (copy string-literal bytes verbatim, as omacom/omarchy#13968 does): the green tripwires tagged Reproduces KI-MENU-JSONC-COMMA-IN-STRING in test/shell.d/menu-test.sh and test/node/menumodel-replay.test.mjs flip red, and the red reproducer test/reports/report-cmulr8l6h0i461gw40vqqv64c.sh starts exiting 0.'
introduced_in: inception
defect_class: latent
mitigation: The defect needs a user or extension string with a comma directly before } or ]. The shipped default menu has no such string. An author can drop the comma or put a character between the comma and the closer
remediation: Fixed by omacom/omarchy#13968 (one string-aware scanner; SW-REQ-260927-66FW).
notes:
    - 'Fixed on pr/13968 by omacom/omarchy#13968 (ff77cd02 + b2dae8db): stripJsonc is one string-aware scanner that copies string contents verbatim, so a comma before } or ] inside a label or action survives. Spec: SW-REQ-260927-66FW (DEFECT-260927-CMMA). Report test/reports/report-cmulr8l6h0i461gw40vqqv64c.sh exits 0; the in-suite tests tagged Reproduces now assert the fixed output and guard against a return.'
    - 'Upstream: original #13250 (ours, 2026-09-25); our fix PR #13255 closed unmerged; open fix PRs #13305 and #13968 (ours).'
customer_impact: 'A menu label or action whose text has a comma directly before } or ] is silently changed: the comma is removed. The label "x, ]y" shows as "x ]y", and the action mv f{.bak,} runs as mv f{.bak}, a different command. No error is shown. The shipped menu has no such text; only entries you write yourself can hit this.'
