id: KI-261016-HN3F
title: Lock IPC derived locked freezes true while its three inputs all read false
description: |-
    The live lock service answers isLocked and status with locked:true although requested, sessionLocked and secure all read false and lastEvent is unlocked. Pollers treat the unlocked session as locked; the follow-up also observes subsequent lock requests returning ok without engaging a lock.

    Trigger: Unlock a previously locked session; the derived locked value remains true even after lockRequested, sessionLock.locked and sessionLock.secure have become false. Suspend/hibernate cycles and shell restarts were part of the original observation, but the follow-up reports that one unlock is sufficient.

    Where: lock: shell/plugins/lock/Service.qml — the derived locked property (lockRequested || sessionLock.locked || sessionLock.secure) and the lock isLocked/status IPC that serve it

    Reported upstream in omacom/omarchy#14588 (https://github.com/omacom/omarchy/issues/14588). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
