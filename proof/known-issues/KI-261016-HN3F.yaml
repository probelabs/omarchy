candidate:
    draft_ref: 'R-5240#derived-locked-stale-true'
    reproducer_sketch: 'On the affected Quickshell 0.3.2 setup, lock and unlock once, then query isLocked/status from the same shell and request another lock. Expected locked:false after unlock and a working next lock. Reported actual: locked:true with all three inputs false; the next request returns ok without locking. The original report observed this after suspend/hibernate and restarts; restarting the shell temporarily clears it.'
