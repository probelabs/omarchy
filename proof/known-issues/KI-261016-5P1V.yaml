id: KI-261016-5P1V
title: Menu app launches do not preserve the invoking workspace
description: |-
    An app launched from one workspace opens on the workspace focused when its window appears instead of the workspace where the launch was initiated.

    Trigger: Launch an app from the menu and switch to another workspace before the application's window appears.

    Where: menu: application activation in shell/plugins/menu/Menu.qml

    Reported upstream in omacom/omarchy#13130 (https://github.com/omacom/omarchy/issues/13130). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
