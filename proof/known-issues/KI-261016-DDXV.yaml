    reproducer_sketch: 'Select a non-US layout (reported: es; confirmed in a comment on de/mac), run omarchy menu keybindings --print. Expected the resize bind on code:20 shown as SUPER + APOSTROPHE (es); actual SUPER + MINUS. SUPER + apostrophe resizes, SUPER + minus does nothing. xkbcli compile-keymap with no args gives minus/equal at AE11/AE12; with --layout es gives apostrophe/exclamdown.'
