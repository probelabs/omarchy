id: KI-MENU-KEYBINDINGS-CSV-DESC-COMMA
title: 'Comma in a binding description shifts every later CSV field: truncated label, wrong dispatcher, failed dispatch'
description: 'dynamic_bindings prints cache rows as raw comma-joined CSV with no quoting (printf ''%s,%s,%s,%s,%s'', bin/omarchy-menu-keybindings:333). parse_binding_records sets FS='','' and takes action=$3/dispatcher=$4, so a description containing a comma (''Save, quit'') shifts every later field: the menu shows the truncated label, and dispatch receives the literal string '' quit'' as dispatcher and ''exec,alacritty'' as arg - which dispatch_binding treats as an unknown dispatcher.'
