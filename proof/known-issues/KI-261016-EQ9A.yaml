candidate:
    draft_ref: 'R-588#lock-wake-process-no-deadline'
    reproducer_sketch: 'Replace omarchy-system-wake with a command that sleeps forever, lock, let the display blank, press a key (first runWake starts the hung process), let the lock re-blank, press a key again. Expected the wake command to run again and light the displays. Actual: runWake skips the start because wakeProcess.running is still true, so nothing wakes the displays until the hung process exits.'
