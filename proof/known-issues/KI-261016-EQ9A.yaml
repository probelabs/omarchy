id: KI-261016-EQ9A
title: A hung wake command makes every later lock wake request a no-op
description: |-
    Once one omarchy-system-wake started by the lock never exits, every later lock wake request (input on a blanked lock) starts nothing, so blanked displays are not woken for the rest of the lock.

    Trigger: An omarchy-system-wake run started by the lock's runWake hangs and never exits, then the user tries to wake the blanked lock again.

    Where: lock: shell/plugins/lock/Service.qml runWake starts wakeProcess only `if (!wakeProcess.running)`, and wakeProcess (omarchy-system-wake) has no timeout or kill

    Reported upstream in omacom/omarchy#11744 (https://github.com/omacom/omarchy/issues/11744). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
