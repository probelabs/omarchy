reproducer_command: node pocs/menu-probes.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: The throw needs a merged row without a label; mergeAppRows-supplied rows carry labels for every in-tree provider
remediation: default label to the id and order to a large sentinel (or Number.isFinite guard) in searchScore; have mergeAppRows require a label
