id: KI-MENU-INPUT-ESCAPE-CLEARS-FILTER
title: Escape in input mode clears the entered text instead of cancelling the request
description: The Escape branch takes setFilter('') whenever filterText is non-empty, with no mode==='input' exception. In input mode the filter IS the submission, so the first Escape neither writes the done file nor cancels; the caller keeps waiting (SX26/C20).
