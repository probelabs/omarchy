introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: The off-card fold needs a near-zero available budget at a row boundary; normal screen sizes keep the fold inside the card
remediation: clamp available at >= 1px, and min the return against available (accepting the lost peek on tiny budgets)
