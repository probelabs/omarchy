id: KI-261016-EEMY
title: Locked display repeatedly wakes and re-blanks after its blanked output drops and returns by hotplug, without user input
description: |-
    While locked, the display repeatedly turns on showing the password field for a few seconds and goes dark again, with no keyboard or mouse input, for as long as the session stays locked.

    Trigger: The lock blanks a monitor that drops hotplug detect in standby. While the session stays locked, that output is removed and re-added and comes back lit; the lock's blank timer then blanks it again, and the cycle repeats with no keyboard or mouse input.

    Where: lock: shell/plugins/lock blank and wake handling when an output is recreated during an already-blanked locked session (Service.qml idle blank timer and blank state; LockView.qml lock surface).

    Reported upstream in omacom/omarchy#13812 (https://github.com/omacom/omarchy/issues/13812). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
