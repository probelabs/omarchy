candidate:
    draft_ref: 'R-2112#lock-hdmi-hotplug-blank-wake-loop'
    reproducer_sketch: 'On a monitor that drops HPD in standby (reporter: HDMI-A-1 on amdgpu), run omarchy system lock and leave input untouched. Expected the display to remain blank after the lock blanks it. Actual the password view returns for a few seconds, the display blanks again, and connector disconnect/reconnect cycles repeat in the Hyprland log. The reporter suspects a pointer enter on the recreated lock surface calls wakeRequested; that path is not required to see the cycle.'
