candidate:
    draft_ref: 'R-1584#slow-dpms-wake-reblank'
    reproducer_sketch: 'Lock the session and wait until a slow DisplayPort monitor enters DPMS standby, then press Shift once. Expected the lock screen to stay visible. Actual the five-second timer blanks the display again before the handshake finishes. Changing that timer from 5 seconds to 15 seconds keeps the lock screen up.'
