id: KI-261016-6CVE
title: 'Menu action routes run their command fire-and-forget: a failing command silently no-ops with success reported and no trace'
description: |-
    Invoking a menu action route — the theme/background switcher keybindings (omarchy-menu toggle theme / toggle background) or a menu row that runs a command — answers ok at the IPC level yet nothing happens: no picker or menu surface appears, the theme/background is not changed, and no error reaches any journal or log. The same command chain run from the session environment (desktop double-click, terminal) works.

    Trigger: The action's command fails when the menu dispatches it detached through a login shell (Util.execDetached -> bash -lc): a stale menu override naming a command that no longer exists, or a login-shell/session OMARCHY_PATH divergence (dev-channel switch or quattro upgrade) so the chain cannot reach the running shell. The silent no-trace behaviour reproduces on stock quattro with a nonexistent command; this reporter's exact trigger is unestablished (machine wiped).

    Where: menu: shell/plugins/menu/Menu.qml runAction — an action route deliberately opens no menu (SW-REQ-260922-N3RM) and dispatches its command fire-and-forget through Util.execDetached with no exit handling, so a command that fails to run leaves no trace anywhere.

    Reported upstream in omacom/omarchy#8262 (https://github.com/omacom/omarchy/issues/8262). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
    - SW-REQ-260922-N3RM
