candidate:
    draft_ref: 'R-1454#theme-bg-action-route-silent-noop'
    reproducer_sketch: 'On stock quattro, add a style.theme override in ~/.config/omarchy/extensions/omarchy-menu.jsonc whose command is not installed, then run omarchy-menu toggle theme: it exits 0 silently, no omarchy-image-selector layer appears, and nothing reaches the journals (reproduced upstream by the project bot 2026-08-28). On a machine whose ~/.config/uwsm/env survived the quattro upgrade, compare echo $OMARCHY_PATH with bash -lc ''echo $OMARCHY_PATH'': where they differ, every menu action dispatched through the login shell finds no shell instance and fails silently.'
