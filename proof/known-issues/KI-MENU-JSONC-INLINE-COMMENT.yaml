severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: MenuModel.parseMenuJsonc / stripJsonc whole-line comment pass
reproducer_command: sh test/reports/report-cmulr8j7w0hy01gw4menggvbx.sh
tripwire_mutation: 'Strip // comments wherever the opener sits outside a string, while keeping a trailing comma that is followed by comment lines and the closer droppable: the green tripwires tagged Reproduces KI-MENU-JSONC-INLINE-COMMENT flip red and the red reproducer test/reports/report-cmulr8j7w0hy01gw4menggvbx.sh starts exiting 0. The fix must keep the preservation tests green (a trailing comma, then a whole-line comment, then the closer keeps every row); the single-pass scanner of the closed omacom/omarchy#13512 broke that and emptied the shipped extension template once its examples were uncommented.'
introduced_in: inception
defect_class: latent
mitigation: 'docs/menu.md documents the limitation, and comments on their own line work. The failure is visible: the user entries disappear. It does not corrupt data silently'
remediation: 'Strip a // comment wherever its opener sits outside a string, without breaking the trailing-comma-then-comment-line shape, as omacom/omarchy#13968 does (SW-REQ-260928-C8W1 on its proof mirror). The earlier single-pass attempt (omacom/omarchy#13512, closed) broke that shape; #13968 supersedes it.'
