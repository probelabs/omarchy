id: KI-MENU-JSONC-INLINE-COMMENT
title: stripJsonc removes only whole-line // comments; an inline comment tail empties the whole file (omacom/omarchy#13493)
description: |-
    The stripJsonc comment pass (shell/plugins/menu/MenuModel.js:4) matches only at the start of a line. A // comment after content on the same line stays in the text. JSON.parse then rejects the file, and parseMenuJsonc returns no rows.

    One inline note in the user extension drops every user entry; in the default file it drops every row. docs/menu.md documents this limitation. Upstream issue: omacom/omarchy#13493. Report intake validated it (report cmulr8j7w0hy01gw4menggvbx).
affected_requirements:
    - SW-REQ-260922-E4J2
evidence_manifests:
    - proof/evidence/ki-menu-jsonc-inline-comment.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: MenuModel.parseMenuJsonc / stripJsonc whole-line comment pass
reproducer_command: sh test/reports/report-cmulr8j7w0hy01gw4menggvbx.sh
tripwire_mutation: 'Strip // comments wherever the opener sits outside a string, while keeping a trailing comma that is followed by comment lines and the closer droppable: the green tripwires tagged Reproduces KI-MENU-JSONC-INLINE-COMMENT flip red and the red reproducer test/reports/report-cmulr8j7w0hy01gw4menggvbx.sh starts exiting 0. The fix must keep the preservation tests green (a trailing comma, then a whole-line comment, then the closer keeps every row); the single-pass scanner of the closed omacom/omarchy#13512 broke that and emptied the shipped extension template once its examples were uncommented.'
introduced_in: inception
defect_class: latent
mitigation: docs/menu.md documents the limitation, and comments on their own line work. The missing entries are visible, but nothing in the menu or the journal says why; nothing changes the user's data.
remediation: 'Strip a // comment wherever its opener sits outside a string, without breaking the trailing-comma-then-comment-line shape, as omacom/omarchy#13968 does (requirement SW-REQ-260928-C8W1 in the proof layer). The earlier single-pass attempt (omacom/omarchy#13512, closed) broke that shape; #13968 supersedes it.'
notes:
    - 'Upstream: PR #6525 (2026-08-02) reported this first. Our issue #13493 (2026-09-28) came later. Our fix PR #13512 was closed unmerged. Open fix PRs: #6525, #13681, #13803 and our #13968.'
customer_impact: 'One // comment after content on a line, for example after an entry, makes the whole menu file unreadable, so every entry in it disappears: all of your own additions in the extension file, or the whole menu in the default file. Nothing in the menu or the journal says why. Comments on their own line work, and no data is changed.'
