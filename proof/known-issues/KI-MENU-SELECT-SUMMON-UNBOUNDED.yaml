id: KI-MENU-SELECT-SUMMON-UNBOUNDED
title: omarchy-menu-select blocks forever inside the omarchy-shell summon call when the IPC never returns
description: bin/omarchy-menu-select:91 executes omarchy-shell shell summon with no timeout wrapper. A hung IPC (summon never returns) blocks the synchronous caller indefinitely - the external-call leg of the bounded-wait obligation. Distinct from KI-MENU-SELECT-POLL-DEADLOCK, which covers the post-summon done_file poll; here the process never even reaches the poll.
