id: KI-261016-W8D0
title: Power-profile submenu invokes a CLI that crashes during Python and D-Bus teardown
description: |-
    The powerprofilesctl subprocess launched to populate the power-profile submenu crashes during interpreter shutdown instead of completing cleanly.

    Trigger: Opening the power-profile submenu invokes powerprofilesctl get/list, whose GObject finalizer can call into the Python interpreter after it has been torn down.

    Where: menu: shell/plugins/menu/Menu.qml power-profile submenu enumeration calls powerprofilesctl get/list; the child crashes during Python/PyGObject shutdown.

    Reported upstream in omacom/omarchy#8596 (https://github.com/omacom/omarchy/issues/8596). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
