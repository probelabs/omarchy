id: KI-261016-QTCD
title: Keybindings menu renders static web-app action rows even when no Chromium browser or extension exists
description: |-
    The SUPER K keybindings menu lists Copy URL from Web App (SHIFT ALT+L) and Download Video from Web App (SHIFT ALT+D) as selectable rows on systems with no Chromium-based browser; selecting them silently does nothing, and no supported user-level mechanism can hide or remove the rows.

    Trigger: The default browser is Firefox or another non-Chromium browser (Chromium not installed) and the keybindings menu is opened (SUPER K): static_bindings() emits the two rows unconditionally, ungated on the bundled extension or a Chromium-based browser being present.

    Where: bin/omarchy-menu-keybindings static_bindings(), which unconditionally emits the two web-app rows

    Reported upstream in omacom/omarchy#8642 (https://github.com/omacom/omarchy/issues/8642). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
