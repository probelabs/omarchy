    reproducer_sketch: 'Run the report''s QML clipboard owner, which copies text and starts a five-second timer before busy-looping its GUI thread for 30 seconds. Within five seconds click the stalled-owner window once. Wait until that window becomes unresponsive, then click the stock Clock widget in the Omarchy bar. Expected: the panel and shell remain responsive. Actual: the Clock panel/bar stops responding for approximately 1–2 seconds, with QWaylandDataOffer pipe-read timeouts in the journal.'
