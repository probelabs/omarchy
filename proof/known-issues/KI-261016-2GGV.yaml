id: KI-261016-2GGV
title: A stalled Wayland clipboard owner freezes the whole shell UI when an always-alive TextInput reads the clipboard on the GUI thread
description: |-
    The whole Quickshell UI stops responding for about 1-2 seconds — the bar and every Shell panel together, while regular application windows stay responsive; the journal prints QWaylandDataOffer pipe timeouts and errors for text/plain.

    Trigger: The current Wayland clipboard owner is temporarily unresponsive (its serving thread stalled) while a shell panel's text input takes focus or the clipboard's dataChanged fires, so the shell GUI thread waits on the owner's pipe while reading clipboard text.

    Where: The shell GUI thread's synchronous clipboard read (QQuickTextInput::q_canPasteChanged -> QClipboard::mimeData -> QWaylandDataOffer), reached through an always-alive non-read-only TextInput — audited: shell/plugins/lock/LockView.qml passwordInput

    Reported upstream in omacom/omarchy#8753 (https://github.com/omacom/omarchy/issues/8753). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
