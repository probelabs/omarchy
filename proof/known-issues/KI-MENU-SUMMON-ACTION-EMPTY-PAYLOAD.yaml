    - proof/evidence/ki-menu-summon-action-empty-payload.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: node pocs/menu-probes.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Only an explicitly quoted empty payload diverges; omitting the group entirely behaves identically on both paths
remediation: distinguish 'absent group' from 'empty string' via match[2] === undefined
