    reproducer_sketch: 'Set idle screensaver/lock to 600/900, let the session lock and initially blank, then let a background inhibitor or activity signal run the idle service wake while nobody touches the lock view. Expected the lock to re-blank after its idle timeout; actual it stays lit. Observe idle-cycle-cancel: activity and process-start: wake in the journal and the lack of prompt re-blanking.'
