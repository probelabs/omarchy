id: KI-261016-55AP
title: The 1password --lock helper spawned by omarchy-system-lock crashes when its run is cut short
description: |-
    The short-lived 1password --lock helper (not the main app, which keeps running) dies with SIGTRAP and a Process crashed notification appears, intermittently.

    Trigger: The detached, timeout-wrapped helper is still alive when its run is ended from outside: on the reported path, suspend freezes user.slice with the helper alive (nothing on the inhibitor path waits for or reaps it) and it is terminated at thaw.

    Where: lock: bin/omarchy-system-lock backgrounded timeout --kill-after=1s 3s 1password --lock helper, not awaited by bin/omarchy-system-sleep-lock before the inhibitor is released

    Reported upstream in omacom/omarchy#7785 (https://github.com/omacom/omarchy/issues/7785). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
