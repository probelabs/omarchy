id: KI-MENU-NORMALIZE-EDGE-CASES
title: 'normalizeItem edge cases: null parent kept, boolean guards preserved, action:0 mis-kinded, numeric labels'
description: normalizeItem infers the parent only when the parent field equals undefined (F17a). An explicit null parent therefore stays null, and the path helpers then coerce it. A boolean when/checked/disabled passes the ||-default and later throws inside guard generation (F17b). Kind derives from truthiness so action:0 yields a menu row (F17c). The code stores a numeric label as a number. A non-string alias stringifies to '[object Object]', which the search index then matches for the term 'object' (F23).
