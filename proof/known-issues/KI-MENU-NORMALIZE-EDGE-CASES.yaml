id: KI-MENU-NORMALIZE-EDGE-CASES
title: 'normalizeItem edge cases: parent:null kept as null, boolean guards preserved (later crashes guard generation), action:0 mis-kinded, numeric labels, object aliases become ''[object Object]'' search text'
description: normalizeItem infers the parent only when it is undefined, so an explicit null parent stays null (F17a) and the path helpers then coerce it; a boolean when/checked/disabled passes the ||-default and later throws inside guard generation (F17b); kind derives from truthiness so action:0 yields a menu row (F17c); a numeric label is stored as a number and a non-string alias stringifies to '[object Object]', which the search index then matches for the term 'object' (F23).
