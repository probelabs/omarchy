introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Every trigger needs malformed user JSONC (null parent, boolean guards, numeric labels); the shipped menus stay well-formed
remediation: treat null like undefined for parent, coerce when/checked/disabled to strings or reject non-strings, String() the label, and filter aliases to strings
