id: KI-261016-5HQH
title: Keybindings cheatsheet cache key omits the locale, so a locale switch serves the previous order
description: |-
    The keybindings cheatsheet cache hash does not include the active locale: measured identical SHA-256 across three locales while a description change moves it. After a locale switch the warm cache keeps serving rows collated under the previous locale (cheatsheet row order depends on LC_COLLATE), until some other hashed input changes.

    Trigger: Switch the active locale/collation while a warm keybindings cheatsheet cache whose rendered order depends on it exists.

    Where: menu: bin/omarchy-menu-keybindings keybindings_cache_key (locale/collation absent from the hashed inputs)

    Reported upstream in omacom/omarchy#12345 (https://github.com/omacom/omarchy/issues/12345). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
