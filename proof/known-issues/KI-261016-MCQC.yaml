id: KI-261016-MCQC
title: Recreated lock surface paints the fallback color instead of the wallpaper on its first frames after resume
description: |-
    A lock surface restored after suspend/resume shows only the flat fallback color (Color.background) for roughly two seconds; the blurred wallpaper appears only after later input causes another frame.

    Trigger: Suspend while the native session lock is active, then resume so that the lock outputs (and their lock surfaces) are recreated.

    Where: lock: shell/plugins/lock/LockView.qml wallpaper Image loaded asynchronously with cache: false; Service.qml does not preload or retain the already-known wallpaper for the output sizes recreated lock surfaces need

    Reported upstream in omacom/omarchy#9182 (https://github.com/omacom/omarchy/issues/9182). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
