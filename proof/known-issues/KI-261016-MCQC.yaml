    reproducer_sketch: 'Lock the session, suspend, and resume on a system whose outputs are recreated during DisplayPort link training (the report: NVIDIA, two DisplayPort outputs); observe the first lock frames before typing. Expected the configured blurred wallpaper on the first visible frame; actual Color.background until a later input forces a frame (the reporter verified that preloading the cache-busted wallpaper URL per output size while unlocked removes the gray frame).'
