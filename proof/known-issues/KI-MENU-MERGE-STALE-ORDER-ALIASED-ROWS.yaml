id: KI-MENU-MERGE-STALE-ORDER-ALIASED-ROWS
title: mergeAppRows/swapProviderRows keep stale .order values and mutate caller-owned rows in place, breaking the declaration-order tiebreak and the engine-safety contract
description: Both merges copy kept rows by reference without restamping .order, so after any row is dropped the survivors' order values no longer match their itemOrder indexes (F11a/F12b) - searchScore's declaration-order tiebreak then compares stale numbers; both merges also write row.order/providerMenu into the CALLER's row objects (F11b), exactly the in-place write the module header says must never happen ('an in-place write into such an object is occasionally dropped by the engine').
