    - pocs/menu-probes3.js
    - proof/evidence/ki-menu-merge-stale-order-aliased-rows.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: node pocs/menu-probes2.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: The tiebreak only mis-sorts rows whose primary scores are equal; visible order otherwise follows declaration order
remediation: shallow-copy kept rows and restamp order for every survivor; never write into the row objects handed in
