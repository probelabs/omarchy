id: KI-261016-X5GT
title: Key presses used to wake a blanked lock screen also edit the password
description: |-
    Wake keystrokes leave unwanted masked characters in the password field before intentional password entry.

    Trigger: Press a character key to wake the blanked display while the session is locked.

    Where: shell/plugins/lock/LockView.qml password input and wake-event handling with shell/plugins/lock/Service.qml

    Reported upstream in omacom/omarchy#12398 (https://github.com/omacom/omarchy/issues/12398). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
