id: KI-MENU-JSONC-ARRAY-ROOT
title: parseMenuJsonc walks a top-level JSON array and renders phantom rows keyed 0, 1, ... (omacom/omarchy#13492)
description: 'parseMenuJsonc (shell/plugins/menu/MenuModel.js:44-66) rejects scalar and null roots only. typeof [] is "object", so an array root reaches the for..in loop, which iterates the array indices: every object element becomes a row with id "0", "1", ... parented to root, carrying the element''s label and action. This holds for the default file and for the user extension file, which go through the same parser and are merged by mergeMenuSources. Reported upstream as omacom/omarchy#13492 and validated by report intake (report cmulr8j7z0hy31gw4pne8v6u4).'
affected_requirements:
    - SW-REQ-260922-3T3F
evidence_manifests:
    - proof/evidence/ki-menu-jsonc-array-root.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: MenuModel.parseMenuJsonc root-type guard
reproducer_command: sh test/reports/report-cmulr8j7z0hy31gw4pne8v6u4.sh
tripwire_mutation: 'Add Array.isArray(parsed) to the parseMenuJsonc root guard (as the pr/13511 line does): the green tripwire tagged Reproduces KI-MENU-JSONC-ARRAY-ROOT flips red and the red reproducer test/reports/report-cmulr8j7z0hy31gw4pne8v6u4.sh starts exiting 0.'
introduced_in: inception
defect_class: latent
mitigation: The trigger is a menu file whose root is an array, which the documented format never uses; the phantom rows are visible in the root menu, so the malformed file is noticed
remediation: Reject an array root like the scalar roots (omacom/omarchy PR 13511, fork line pr/13511 with SW-REQ-260928-BMFE)
