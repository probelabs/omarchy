affected_api: MenuModel.parseMenuJsonc root-type guard
reproducer_command: sh test/reports/report-cmulr8j7z0hy31gw4pne8v6u4.sh
tripwire_mutation: 'Add Array.isArray(parsed) to the parseMenuJsonc root guard (as the pr/13511 line does): the green tripwire tagged Reproduces KI-MENU-JSONC-ARRAY-ROOT flips red and the red reproducer test/reports/report-cmulr8j7z0hy31gw4pne8v6u4.sh starts exiting 0.'
introduced_in: inception
defect_class: latent
mitigation: The trigger is a menu file with an array root, and the documented format never uses one. The phantom rows show in the root menu, so the user sees that the file is wrong
remediation: Fixed by omacom/omarchy#13968 (Array.isArray in the root guard; SW-REQ-260928-BMFE).
notes:
    - 'Fixed on pr/13968 by omacom/omarchy#13968: parseMenuJsonc returns no rows when Array.isArray(parsed), like the scalar and null roots. Spec: SW-REQ-260928-BMFE (DEFECT-260928-4NG9). Report test/reports/report-cmulr8j7z0hy31gw4pne8v6u4.sh exits 0; the in-suite tests tagged Reproduces now assert no rows and guard against a return.'
