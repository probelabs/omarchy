id: KI-MENU-JSONC-ARRAY-ROOT
title: parseMenuJsonc reads a top-level JSON array as entries with ids 0, 1, … (omacom/omarchy#13492)
description: |-
    parseMenuJsonc (shell/plugins/menu/MenuModel.js:44-66) rejects scalar and null roots only. typeof [] is "object", so an array root reaches the for..in loop. The loop iterates the array indices. Each object element becomes a row with id "0", "1", ... under root, with the label and action of the element.

    The default file and the user extension file use the same parser, and mergeMenuSources merges both. Upstream issue: omacom/omarchy#13492. Report intake validated it (report cmulr8j7z0hy31gw4pne8v6u4).
affected_requirements:
    - SW-REQ-260922-3T3F
evidence_manifests:
    - proof/evidence/ki-menu-jsonc-array-root.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: MenuModel.parseMenuJsonc root-type guard
reproducer_command: sh test/reports/report-cmulr8j7z0hy31gw4pne8v6u4.sh
tripwire_mutation: 'Add Array.isArray(parsed) to the parseMenuJsonc root guard (as omacom/omarchy#13968 does): the green tripwire tagged Reproduces KI-MENU-JSONC-ARRAY-ROOT flips red and the red reproducer test/reports/report-cmulr8j7z0hy31gw4pne8v6u4.sh starts exiting 0.'
introduced_in: inception
defect_class: latent
mitigation: The trigger is a menu file with an array root, which the documented format never uses. Label-only elements stay hidden; elements with an action show under the user's own labels, so nothing tells the user the file is wrong.
remediation: Fixed by omacom/omarchy#13968 (Array.isArray in the root guard; SW-REQ-260928-BMFE).
notes:
    - 'Fixed on pr/13968 by omacom/omarchy#13968: parseMenuJsonc returns no rows when Array.isArray(parsed), like the scalar and null roots. Spec: SW-REQ-260928-BMFE (DEFECT-260928-4NG9). Report test/reports/report-cmulr8j7z0hy31gw4pne8v6u4.sh exits 0; the in-suite tests tagged Reproduces now assert no rows and guard against a return.'
    - 'Upstream: our issue #13492 (2026-09-28). Our fix PR #13511 was closed unmerged. Open fix PRs: #13681, #13803 and our #13968.'
customer_impact: If a menu file's top level is a list instead of an object, the menu silently reads the list as entries. Items with an action appear under their own labels, items without one stay hidden, and no error says the file has the wrong shape. The shipped menu is not affected; only a hand-edited file written as a list hits this.
