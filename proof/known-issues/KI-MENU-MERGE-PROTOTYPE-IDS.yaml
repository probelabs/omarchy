    - pocs/menu-probes3.js
    - proof/evidence/ki-menu-merge-prototype-ids.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: node pocs/menu-probes.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Requires a menu id colliding with an Object.prototype name; no shipped or documented menu uses such ids
remediation: use Object.hasOwn / hasOwnProperty for the presence test and a non-prototype map (Object.create(null)) for storage
