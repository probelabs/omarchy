id: KI-LOCK-SCREENS-CHANGE-BLANK-LOST
title: Screen add/remove while locked clears the blank intent and never re-arms the idle blank timer
description: onScreensChanged (shell/plugins/lock/Service.qml:864-874) sets displaysBlank = false (so a returning panel shows the wallpaper) but calls neither armBlankTimer nor runWake. After the one-shot idleBlankTimer has fired, nothing restarts the 5s countdown, and a newly added output falls back to displaysBlank in the DPMS map. So after any hotplug/unplug while locked, all displays stay awake until the next keypress re-runs the idle path.
affected_requirements:
    - SW-REQ-260912-ND55
evidence_manifests:
    - proof/evidence/ki-lock-screens-change-blank-lost.yaml
severity: low
severity_basis: risk
risk: correctness
reproducer_command: ./pocs/crs-260930-ttvk-c04.sh
introduced_in: inception
defect_class: latent
mitigation: any keypress restarts the cycle
remediation: After clearing displaysBlank in onScreensChanged, re-arm the idle blank timer (or runWake-then-arm) so the power path resumes
notes:
    - '2026-10-04: re-checked on upstream quattro 035ce29f, where onScreensChanged is unchanged. The new runtime reproducer pocs/crs-260930-ttvk-c04.sh runs the live handler, runWake and armBlankTimer in node. It exits 0 (defect present) on 035ce29f and on upstream quattro 393a43d4. Upstream omacom/omarchy#8580 reports this defect. PR #8581 re-arms the blank timer, and PR #13129 debounces amdgpu HDMI hotplug instead. #13812 reports the same symptom family. All four are open.'
