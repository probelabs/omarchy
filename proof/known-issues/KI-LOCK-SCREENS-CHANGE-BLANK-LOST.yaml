id: KI-LOCK-SCREENS-CHANGE-BLANK-LOST
title: Screen add/remove while locked clears the blank intent and never re-arms the idle blank timer
description: onScreensChanged (shell/plugins/lock/Service.qml:666-674) sets displaysBlank = false (so a returning panel shows the wallpaper) but calls neither armBlankTimer nor runWake. After the one-shot idleBlankTimer has fired, nothing restarts the 5s countdown, and a newly added output falls back to displaysBlank in the DPMS map - so after any hotplug/unplug while locked, all displays stay awake until the next keypress re-runs the idle path.
affected_requirements:
    - SW-REQ-260912-ND55
