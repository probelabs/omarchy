id: KI-MENU-KEYBINDINGS-NO-TIMEOUT
title: Keybindings menu build has no deadline on hyprctl binds or xkbcli compile-keymap; a stalled callee blocks the menu
description: |-
    bin/omarchy-menu-keybindings builds the keybindings menu from two external calls without a deadline. The first is `hyprctl binds`, which the script reads for the cache key and again in dynamic_bindings. The second is `xkbcli compile-keymap </dev/null`, the keymap_cmd that parse_keycodes reads through gawk getline. A stalled Hyprland IPC or a wedged keymap compile blocks the menu build for as long as the callee blocks. The keybindings menu then never opens, and the script never exits.

    On the stalled-hyprctl path the script calls `hyprctl binds` three times in sequence: cache key, cache refresh, and the uncached fallback after the refresh fails. A per-call bound therefore costs about three times its value. pocs/9dms-keybindings-no-timeout.sh reproduces both arms on the real script in --print mode. With hyprctl stalled, the build is still blocked at a 10s watchdog (rc=124). With xkbcli stalled, the build is still blocked at a 5s watchdog (rc=124). The control arm builds the stubbed bind row in about a second, with its keycode resolved through the stubbed keymap.
