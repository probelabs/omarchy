cve_surface: none
affected_api: 'bin/omarchy-menu-keybindings (keybindings menu build: hyprctl binds, xkbcli compile-keymap)'
reproducer_command: ./pocs/9dms-keybindings-no-timeout.sh
tripwire_mutation: |-
    In bin/omarchy-menu-keybindings, `hyprctl binds` becomes `timeout 2 hyprctl binds` at both call sites (keybindings_cache_key and dynamic_bindings). `keymap_cmd = "xkbcli compile-keymap </dev/null"` becomes `keymap_cmd = "timeout 2 xkbcli compile-keymap </dev/null"`. The hyprctl stall arm then finishes in about 6-7s (three bounded calls), inside its 10s watchdog. The xkbcli stall arm finishes in about 2s, inside its 5s watchdog.

    The rc=124 assertions in pocs/9dms-keybindings-no-timeout.sh fail, and the tripwire flips red. A bound on only one of the two calls flips the matching arm, so a partial fix also turns it red. The control arm does not change.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: The defect affects only the keybindings menu. The blocked build changes and dispatches no binding. To recover, close the menu launcher, or kill the stuck hyprctl or xkbcli process. When the compositor IPC answers again, the next open works. A cached record set then loads without a call to xkbcli.
remediation: |-
    Wrap both external calls in bin/omarchy-menu-keybindings with a timeout. For example, use `timeout 2 hyprctl binds` at both call sites and `keymap_cmd = "timeout 2 xkbcli compile-keymap </dev/null"`. The existing fallback keycode table already covers a missing keymap. Consider one `hyprctl binds` read per run, so that a stall costs one timeout and not three.

    Then remove the SW-REQ-260922-9DMS external_call_timeout_bounded deferral and add a witness for the bounded paths. Close criterion: both stall arms of pocs/9dms-keybindings-no-timeout.sh finish inside their watchdogs, and the tripwire flips red.
