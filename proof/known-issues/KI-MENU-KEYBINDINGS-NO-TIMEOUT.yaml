id: KI-MENU-KEYBINDINGS-NO-TIMEOUT
title: Keybindings menu build has no deadline on hyprctl binds or xkbcli compile-keymap; a stalled callee blocks the menu indefinitely
description: 'bin/omarchy-menu-keybindings builds the keybindings menu from two external calls that carry no deadline: `hyprctl binds` (read for the cache key and again by dynamic_bindings) and `xkbcli compile-keymap </dev/null` (the keymap_cmd that parse_keycodes reads through gawk getline). A stalled Hyprland IPC or a wedged keymap compile therefore blocks the menu build for as long as the callee does: the keybindings menu never opens and the script never exits. On the stalled-hyprctl path the script reaches `hyprctl binds` three times in sequence (cache key, cache refresh, then the uncached fallback after the refresh fails), so even a per-call bound costs about three times its value. pocs/9dms-keybindings-no-timeout.sh reproduces both arms on the real script in --print mode: with hyprctl stalled the build is still blocked at a 10s watchdog, with xkbcli stalled it is still blocked at a 5s watchdog (rc=124 both), while the control arm builds the stubbed bind row, with its keycode resolved through the stubbed keymap, in about a second.'
