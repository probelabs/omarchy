affected_api: 'bin/omarchy-menu-keybindings (keybindings menu build: hyprctl binds, xkbcli compile-keymap)'
reproducer_command: ./pocs/9dms-keybindings-no-timeout.sh
tripwire_mutation: 'In bin/omarchy-menu-keybindings, `hyprctl binds` becomes `timeout 2 hyprctl binds` at both call sites (keybindings_cache_key and dynamic_bindings) and `keymap_cmd = "xkbcli compile-keymap </dev/null"` becomes `keymap_cmd = "timeout 2 xkbcli compile-keymap </dev/null"`: the hyprctl stall arm then finishes in about 6-7s (three bounded calls) inside its 10s watchdog and the xkbcli stall arm in about 2s inside its 5s watchdog, the rc=124 assertions in pocs/9dms-keybindings-no-timeout.sh fail, and the tripwire flips red. Bounding only one of the two calls flips the matching arm, so a partial fix also turns it red. The control arm is unaffected.'
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Only the keybindings menu is affected; no binding is changed or dispatched while the build is blocked. Closing the menu launcher, or killing the stuck hyprctl or xkbcli process, recovers. Once the compositor IPC answers again the next open works, and a previously cached record set is served without calling xkbcli.
remediation: 'Wrap both external calls in bin/omarchy-menu-keybindings with a timeout, e.g. `timeout 2 hyprctl binds` at both call sites and `keymap_cmd = "timeout 2 xkbcli compile-keymap </dev/null"` (the existing fallback keycode table already covers a missing keymap). Consider reading `hyprctl binds` once per run so a stall is paid once rather than three times. Then remove the SW-REQ-260922-9DMS external_call_timeout_bounded deferral and add a witness for the bounded paths. Close criterion: both stall arms of pocs/9dms-keybindings-no-timeout.sh finish inside their watchdogs and the tripwire flips red.'
