id: KI-APPLY-LOCK-TARGET-USER-DEGRADES-ROOT
title: Failed PKEXEC_UID/user mapping silently degrades target_user to root; lock PAM and fingerprint probe configured for the wrong account
description: 'target_user resolution (bin/omarchy-apply-lock:18-22) has no pipefail and no abort on a failed getent: with OMARCHY_INSTALL_USER and SUDO_USER unset and PKEXEC_UID unmappable, cut yields the empty string and line 22 falls back to $USER - root under pkexec/env -i. The fprintd probe and both PAM files are then configured for the wrong account (usually root), leaving the installing user''s lock authentication misconfigured.'
