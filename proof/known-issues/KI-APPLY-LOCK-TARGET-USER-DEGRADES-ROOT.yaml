introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: callers set OMARCHY_INSTALL_USER explicitly (install scripts do; ad-hoc pkexec callers do not always set it)
remediation: Abort with a diagnostic when the mapping yields an empty target_user instead of falling back to $USER; never configure PAM for uid 0
notes:
    - '2026-10-04: re-checked on upstream quattro 035ce29f. The rewritten reproducer runs the real helper with a failing getent and records the account that the probe asks about. On 035ce29f and on upstream quattro 393a43d4, the probe asks about root. On 035ce29f, the helper then removes the fingerprint stack of the installing user. Upstream omacom/omarchy#9569 and #9572 report the same root-under-pkexec class in removal scripts, not in this helper.'
