id: KI-APPLY-LOCK-TARGET-USER-DEGRADES-ROOT
title: Unmappable PKEXEC_UID degrades target_user to root, so the fingerprint probe asks about the wrong account
description: |-
    target_user resolution (bin/omarchy-apply-lock:18-22) has no pipefail and no abort on a failed getent. With OMARCHY_INSTALL_USER and SUDO_USER unset and PKEXEC_UID unmappable, cut yields the empty string and line 22 falls back to $USER - root under pkexec/env -i. The fprintd enrollment probe (line 56) then asks about the wrong account (root unless $USER maps elsewhere). The password PAM stack does not depend on the account, so only the fingerprint decision is wrong.

    Since upstream omacom/omarchy#7158, the empty enrollment of root takes the remove branch (lines 72-80). The helper then deletes the fingerprint stack and resume hook of the installing user. That user has no fingerprint unlock until the helper runs again with the right account.
