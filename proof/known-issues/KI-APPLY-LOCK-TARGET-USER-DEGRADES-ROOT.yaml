cve_surface: none
reproducer_command: ./pocs/crs-260930-g166-c05-c06.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: callers set OMARCHY_INSTALL_USER explicitly (install scripts do; ad-hoc pkexec callers do not always set it)
remediation: Abort with a diagnostic when the mapping yields an empty target_user instead of falling back to $USER; never configure PAM for uid 0
