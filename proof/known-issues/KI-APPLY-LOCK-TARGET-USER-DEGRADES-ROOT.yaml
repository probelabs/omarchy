id: KI-APPLY-LOCK-TARGET-USER-DEGRADES-ROOT
title: Failed PKEXEC_UID/user mapping silently degrades target_user to root, so the fingerprint decision is made for the wrong account
description: 'target_user resolution (bin/omarchy-apply-lock:18-22) has no pipefail and no abort on a failed getent. With OMARCHY_INSTALL_USER and SUDO_USER unset and PKEXEC_UID unmappable, cut yields the empty string and line 22 falls back to $USER - root under pkexec/env -i. The fprintd enrollment probe (line 48) then asks about the wrong account (root unless $USER maps elsewhere). The password PAM stack does not depend on the account, so only the fingerprint decision is wrong: an installing user with enrolled prints gets no fingerprint PAM until the helper runs again with the right account.'
