id: KI-APPLY-LOCK-TARGET-USER-DEGRADES-ROOT
title: Failed PKEXEC_UID/user mapping silently degrades target_user to root, configuring PAM for the wrong account
description: target_user resolution (bin/omarchy-apply-lock:18-22) has no pipefail and no abort on a failed getent. With OMARCHY_INSTALL_USER and SUDO_USER unset and PKEXEC_UID unmappable, cut yields the empty string and line 22 falls back to $USER - root under pkexec/env -i. The script then configures the fprintd probe and both PAM files for the wrong account (root unless $USER maps elsewhere). The installing user's lock authentication then stays misconfigured.
affected_requirements:
    - SW-REQ-260912-EKJP
