id: KI-MENU-PENDING-INITIAL-MENU-DEAD
title: 'pendingInitialMenu is stored and never read: a route summoned before the JSONC loads opens root and stays there'
description: |-
    The shell queues a summon that arrives before the menu plugin loads. It hands the summon to open() as soon as the plugin loads. Neither menu FileView has read its JSONC file then, and the user extension usually answers first. So openRoute cannot resolve the route, and openExistingMenu falls back to root.

    On 821ae589 nothing opens the route when the files land. openRoute writes the route to pendingInitialMenu, but nothing reads that property. The reader went away with the bash menu's replay (edfd68d4, 4cd6593b). A summon during startup (Super+Escape right after login or a shell restart) shows the main menu. An action alias such as reminder-set never runs. Seen live on 821ae589 in every cold-start run.
affected_requirements:
    - SW-REQ-260922-N3RM
    - SW-REQ-260922-50RE
    - SW-REQ-261002-DK0D
evidence_manifests:
    - proof/evidence/ki-menu-pending-initial-menu-dead.yaml
    - test/shell.d/menu-startup-route-test.sh
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: bash test/shell.d/menu-startup-route-test.sh
tripwire_mutation: remove root.openRoute(pending) from rebuildItemsFromSources -> menu-startup-route-test.sh fails at 'a route summoned before the default menu file loads opens once it does'
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: The race needs a summon landing before the JSONC loads (a sub-second window at session start); reopening lands on the intended route
remediation: Fixed upstream on pr-B (SW-REQ-261002-DK0D). A route that fell back to root stays pending. A later menu file load that makes it resolve opens it.
notes:
    - 'Fixed by the upstream change on pr-B (43d787d4, "Open a menu route summoned during startup once the menu files load"): openExistingMenu keeps the route pending only when it fell back to root, and rebuildItemsFromSources opens it through openRoute once a load makes it resolve, while the menu still shows root with nothing typed (SW-REQ-261002-DK0D). Reproducer: bash test/shell.d/menu-startup-route-test.sh (red: fails on 821ae589, passes with the fix). The PIM1 anchor left pocs/menu-qml-static.sh.'
customer_impact: A menu key pressed while the shell is starting opens the main menu instead of the menu you asked for. This happens right after login, or after omarchy-restart-shell, which omarchy update runs. An action shortcut such as Super+Ctrl+R also opens the main menu, and its action never runs. Pressing it again a second later works.
