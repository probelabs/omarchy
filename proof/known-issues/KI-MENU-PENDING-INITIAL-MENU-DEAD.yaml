severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: bash test/shell.d/menu-startup-route-test.sh
tripwire_mutation: remove root.openRoute(pending) from rebuildItemsFromSources -> menu-startup-route-test.sh fails at 'a route summoned before the default menu file loads opens once it does'
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: The race needs a summon landing before the JSONC loads (a sub-second window at session start); reopening lands on the intended route
remediation: 'Fixed upstream on pr-B: keep the route pending when the menu fell back to root and open it once a menu file load makes it resolve (SW-REQ-261002-DK0D)'
notes:
    - 'Fixed by the upstream change on pr-B (43d787d4, "Open a menu route summoned during startup once the menu files load"): openExistingMenu keeps the route pending only when it fell back to root, and rebuildItemsFromSources opens it through openRoute once a load makes it resolve, while the menu still shows root with nothing typed (SW-REQ-261002-DK0D). Reproducer: bash test/shell.d/menu-startup-route-test.sh (red: fails on 821ae589, passes with the fix). The PIM1 anchor left pocs/menu-qml-static.sh.'
customer_impact: A menu key pressed while the shell is starting opens the main menu instead of the menu you asked for. This happens right after login, or after omarchy-restart-shell, which omarchy update runs. An action shortcut such as Super+Ctrl+R also opens the main menu, and its action never runs. Pressing it again a second later works.
