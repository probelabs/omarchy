    commit_origin: edfd68d48 (2026-05-14, Strip the bash-bin compatibility layer from Menu.qml) removed the onLoaded replay of pendingInitialMenu that 0e135bbb7 added. Since 4cd6593ba (2026-05-23, Use plugin IPC routes), openRoute writes the property and nothing reads it.
