id: KI-MENU-PENDING-INITIAL-MENU-DEAD
title: 'pendingInitialMenu is stored and never read: a route summoned before the JSONC loads opens root and stays there'
description: 'openRoute stores the resolved id in pendingInitialMenu (Menu.qml:975) and nothing reads it (anchor PIM1: exactly two occurrences). With items still empty at summon time, resolveRoute returns the literal, item() misses, openExistingMenu rewrites to root, and after onLoaded nothing applies the stored route. A misspelled route also silently becomes root, undoing resolveRoute''s documented literal fallthrough in the same turn.'
affected_requirements:
    - SW-REQ-260922-N3RM
    - SW-REQ-260922-50RE
evidence_manifests:
    - pocs/menu-qml-static.sh
    - proof/evidence/ki-menu-pending-initial-menu-dead.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: pocs/menu-qml-static.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: The race needs a summon landing before the JSONC loads (a sub-second window at session start); reopening lands on the intended route
remediation: 'Apply pendingInitialMenu once both menu files have loaded, or block the first open until they load. PR #14055 does the first.'
customer_impact: A menu key pressed while the shell is starting opens the main menu instead of the menu you asked for. This happens right after login, or after omarchy-restart-shell, which omarchy update runs. An action shortcut such as Super+Ctrl+R also opens the main menu, and its action never runs. Pressing it again a second later works.
