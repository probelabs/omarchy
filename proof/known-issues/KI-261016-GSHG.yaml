    reproducer_sketch: 'Install chromium and librewolf (the report also names vivaldi, waterfox; a commenter names helium); xdg-settings set default-web-browser librewolf.desktop; open Omarchy menu → Setup → Defaults → Browser. Expected: LibreWolf listed and checked. Actual: only "Chromium", unchecked; LibreWolf absent.'
