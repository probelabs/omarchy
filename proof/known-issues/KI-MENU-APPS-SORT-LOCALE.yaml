id: KI-MENU-APPS-SORT-LOCALE
title: Apps submenu sorts with code-unit < on lowercased labels while search sorts with localeCompare
description: The apps comparator uses aLabel < bLabel (UTF-16 code units), so labels above U+007A sort after 'z' - accented app names land at the end. The search path instead uses localeCompare on the same rows (anchor SRT1).
