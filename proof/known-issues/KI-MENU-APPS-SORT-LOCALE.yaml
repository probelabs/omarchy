id: KI-MENU-APPS-SORT-LOCALE
title: The Apps menu lists names that start with an accented letter after Z
description: |-
    The Apps menu sorts its rows in rebuildDisplay with its own comparator, because DesktopEntries can reorder the apps. On upstream a85e29ab the comparator compares the lowercased names with < and >, that is by UTF-16 code unit. So every name that starts with a letter above U+007A sorts after z. The search sort in the same function uses localeCompare. AppSearch.sortedEntries, which gives the same list to plugins, compares the names in the same way.

    App names come from the Name of each desktop entry for the user's language. On a French desktop, Écrans and Éditeur de texte show after Zed at the end of the list. A check in the real shell with LANG=fr_FR.UTF-8 on a85e29ab showed this order. On a Russian, Greek or Chinese desktop, the names in that script also show after Z, where the locale puts them first. Every app stays in the list and search still finds it.
affected_requirements:
    - SW-REQ-260922-Z680
    - SW-REQ-261003-B7ZA
evidence_manifests:
    - proof/evidence/ki-menu-apps-sort-locale.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: bash test/shell.d/menu-apps-order-test.sh
tripwire_mutation: 'Put the code-unit comparison back in the Apps comparator of rebuildDisplay in shell/plugins/menu/Menu.qml (if (aLabel < bLabel) return -1 and if (aLabel > bLabel) return 1 in place of localeCompare, the a85e29ab behaviour): the red reproducer test/shell.d/menu-apps-order-test.sh fails at ''apps menu files an accented name under its letter, not after Z''.'
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Every app stays in the list, and search finds an app by its name in any order. Only the place of names that start outside a to z is wrong. That covers names with an accented Latin first letter, and on a Russian, Greek or Chinese desktop the names in that script. On an English desktop most names are plain ASCII.
remediation: 'Fixed by PR #<PR>, which makes the Apps comparator and AppSearch.sortedEntries order the names with localeCompare (SW-REQ-261003-B7ZA).'
notes:
    - |-
      Fixed by PR #<PR>. The Apps comparator in rebuildDisplay and AppSearch.sortedEntries now order the names with localeCompare; the id tie-break is unchanged. Spec: SW-REQ-261003-B7ZA. The reproducer is the in-suite test test/shell.d/menu-apps-order-test.sh. It fails on a85e29ab and passes with the fix. The SRT1 anchor is out of pocs/menu-qml-static.sh.

      Scope, checked in the real shell: under ru_RU, el_GR and zh_CN the script of the language now comes first, before the Latin names. Under en_US and fr_FR other scripts still follow the Latin names. Under C and C.UTF-8 Qt keeps UTF-16 code-unit order, the same as before the fix, so the fix changes nothing there.
