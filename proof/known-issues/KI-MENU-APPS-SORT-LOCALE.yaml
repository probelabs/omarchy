id: KI-MENU-APPS-SORT-LOCALE
title: The Apps menu lists names that start with an accented letter after Z
description: |-
    The Apps menu sorts its rows in rebuildDisplay with its own comparator, because DesktopEntries can reorder the apps. On upstream a85e29ab the comparator compares the lowercased names with < and >, that is by UTF-16 code unit. So every name that starts with a letter above U+007A sorts after z. The search sort in the same function uses localeCompare.

    App names come from the Name of each desktop entry for the user's language. On a French desktop, Écrans and Éditeur de texte show after Zed and Zellij at the end of the list. A live run on the box (Quickshell, LANG=fr_FR.UTF-8) on a85e29ab showed this order. Every app stays in the list and search still finds it.
affected_requirements:
    - SW-REQ-260922-Z680
    - SW-REQ-261003-B7ZA
evidence_manifests:
