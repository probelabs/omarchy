    notes: |
        real_infrastructure: #14154 records the live run: the shell from the tree under Quickshell with LANG=fr_FR.UTF-8 lists Éditeur de texte after Zed. The test of fix PR #14155 (test/shell.d/menu-apps-order-test.sh) runs the comparator taken from the real Menu.qml; on this tree it puts Éditeur de texte and Übersetzer after Zed. pocs/menu-qml-static.sh pins the mechanism (anchor SRT1).
        quantitative_impact: 2 of 6 labels sort after Zed (Éditeur de texte, Übersetzer); the 4 ASCII labels keep alphabetical order.
        control_test: in the same run the ASCII labels Calculatrice, Fichiers, Terminal and Zed keep alphabetical order. With LANG=en_US.UTF-8 the live Apps menu shows the English names in order (#14154).
        current_deployment_relevance: the comparator is unchanged on upstream quattro 035ce29f; this tree differs from it only in proof annotations.
        honest_severity: low - the Apps list on a non-English desktop puts accented names after Z; every app stays listed and launchable, and search order is correct.
        reproducible: pocs/menu-qml-static.sh is one deterministic command under one second; the comparator test runs under one second with node.
        no_inflation: the claim is limited to row order; no row is lost and no action changes.
        operational_path_verified: the intended path, an English desktop, ran live in #14154 and sorts correctly.
