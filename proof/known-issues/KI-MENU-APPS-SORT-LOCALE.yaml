severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: bash test/shell.d/menu-apps-order-test.sh
tripwire_mutation: 'Put the code-unit comparison back in the Apps comparator of rebuildDisplay in shell/plugins/menu/Menu.qml (if (aLabel < bLabel) return -1 and if (aLabel > bLabel) return 1 in place of localeCompare, the a85e29ab behaviour): the red reproducer test/shell.d/menu-apps-order-test.sh fails at ''apps menu files an accented name under its letter, not after Z''.'
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Every app stays in the list, and search finds an app by its name in any order. Only the place of names that start with an accented or non-Latin letter is wrong; on an English desktop most names are plain ASCII.
remediation: Fixed by the upstream change that makes the Apps comparator order the names with localeCompare (SW-REQ-261003-B7ZA); mirror pr/new-D.
notes:
    - 'Fixed on mirror pr/new-D by the upstream change (the Apps comparator in rebuildDisplay orders the lowercased names with localeCompare; the id tie-break is unchanged). Spec: SW-REQ-261003-B7ZA, spec conformance REVIEW-261003-JTMM. The reproducer is now the bound in-suite test test/shell.d/menu-apps-order-test.sh (Reproduces marker); it fails on a85e29ab and passes with the fix. The SRT1 anchor is out of pocs/menu-qml-static.sh.'
