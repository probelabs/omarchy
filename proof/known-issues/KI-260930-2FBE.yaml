id: KI-260930-2FBE
title: omarchy-system-lock exits 0 when lock engagement fails, leaving the dismissed Lock row silent
description: 'bin/omarchy-system-lock line 10 runs `omarchy-shell lock lock >/dev/null` and never checks the exit status. A refused engagement (omarchy-shell exits non-zero) or an absent binary (exit 127) therefore passes silently. The script runs its side-effect steps and exits 0 on every path. The menu Lock row (default/omarchy/omarchy-menu.jsonc:38) dismisses the menu on activation, and no surface reports the failure. The user walks away from a session they believe locked; the WC89 hazard_review (batch D) grades this medium on high impact times near-zero likelihood. pocs/wc89-silent-lock-exit0.sh reproduces it: the real script exits 0 on both failure arms while the control arm confirms the invocation wiring.'
affected_requirements:
    - SYS-REQ-260927-WC89
evidence_manifests:
    - proof/evidence/ki-260930-2fbe.yaml
severity: medium
severity_basis: reproducer
cve_surface: none
affected_api: bin/omarchy-system-lock (menu Lock row callee, WC89 interface)
reproducer_command: ./pocs/wc89-silent-lock-exit0.sh
tripwire_mutation: 'bin/omarchy-system-lock line 10 `omarchy-shell lock lock >/dev/null` becomes `omarchy-shell lock lock >/dev/null || exit 1` (with the user-visible failure surfacing owned by the lock component, SYS-REQ-260912-T0XP family): the tripwire''s two failure arms (engagement refused, binary absent) then exit non-zero, the assertions in pocs/wc89-silent-lock-exit0.sh fail, and the tripwire flips red. The control arm is unaffected.'
introduced_in: inception
defect_class: latent
mitigation: 'Verify a suspicious lock before walking away: run omarchy-hyprland-session-locked (exit 0 locked, 1 unlocked) or look at the lock surface. Re-trigger the failure deliberately in a terminal, where omarchy-system-lock shows the callee stderr directly.'
remediation: 'bin/omarchy-system-lock must propagate the omarchy-shell lock exit instead of exiting 0. The lock component (SYS-REQ-260912-T0XP family) owns engagement and failure surfacing per the WC89 obligation_delegations record. Raise a visible failure surface (desktop notification with a non-zero CLI exit); the menu side stays fire-and-forget by design. Close criterion: pocs/wc89-silent-lock-exit0.sh flips red, with both failure arms exiting non-zero.'
notes:
    - '2026-10-04: re-checked on upstream quattro 035ce29f, where bin/omarchy-system-lock is unchanged. pocs/wc89-silent-lock-exit0.sh exits 0 on every arm there and on upstream quattro 393a43d4. Upstream omacom/omarchy#9734 reported the same mechanism, but its reporter closed it as not planned after retracting the timeline.'
