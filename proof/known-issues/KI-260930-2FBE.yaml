id: KI-260930-2FBE
title: omarchy-system-lock exits 0 when lock engagement fails, leaving the dismissed Lock row silent
description: bin/omarchy-system-lock line 10 runs `omarchy-shell lock lock >/dev/null` and never checks the reply or the exit status. The shell answers a refused lock with missing-pam or failed and exit 0. A stopped shell makes omarchy-shell exit 1, and an absent binary exits 127. The script then exits 0 on every path, and the dismissed menu Lock row (default/omarchy/omarchy-menu.jsonc:38) reports nothing. The user walks away from a session they believe locked; the WC89 hazard_review grades this medium (high impact, near-zero likelihood). pocs/wc89-silent-lock-exit0.sh exits 0 on all three failure arms, while its control arm locks cleanly.
affected_requirements:
    - SYS-REQ-260927-WC89
evidence_manifests:
    - proof/evidence/ki-260930-2fbe.yaml
severity: medium
severity_basis: reproducer
cve_surface: none
affected_api: bin/omarchy-system-lock (menu Lock row callee, WC89 interface)
reproducer_command: ./pocs/wc89-silent-lock-exit0.sh
tripwire_mutation: 'bin/omarchy-system-lock line 10 `omarchy-shell lock lock >/dev/null` becomes `omarchy-shell lock lock >/dev/null || exit 1` (with the user-visible failure surfacing owned by the lock component, SYS-REQ-260912-T0XP family): the tripwire''s stopped-shell and absent-binary arms then exit non-zero, the assertions in pocs/wc89-silent-lock-exit0.sh fail, and the tripwire flips red. The control arm is unaffected.'
introduced_in: inception
defect_class: latent
mitigation: 'Verify a suspicious lock before walking away: run omarchy-hyprland-session-locked (exit 0 locked, 1 unlocked) or look at the lock surface. Re-trigger the failure deliberately in a terminal, where omarchy-system-lock shows the callee stderr directly.'
remediation: 'Fixed by omacom/omarchy#9429. At head 3a590ca0 bin/omarchy-system-lock sends one tracked lock request and waits up to 10 s for that request''s own outcome from the shell (lock result). It exits 0 only once the request is secured; a refused, untracked, dropped or stalled request exits 1 with a critical "Screen did not lock" notification, and the screensaver stays up. The alternative #13756 also makes the failure arms exit non-zero, but reports only through the exit code.'
notes:
    - '2026-10-04: re-checked on upstream quattro 035ce29f, where bin/omarchy-system-lock is unchanged. pocs/wc89-silent-lock-exit0.sh exits 0 on every arm there and on upstream quattro 393a43d4. Upstream omacom/omarchy#9734 reported the same mechanism, but its reporter closed it as not planned after retracting the timeline.'
    - 'Upstream: fix PRs #9429 (2026-08-31) and #13756 (2026-09-29) are open alternatives. Issue #10299 reports a related state: the shell answers ok to every lock but never secures the session. Only #9429 detects it, because it waits until lock status reports secure.'
    - '2026-10-05: the reproducer now models the shell protocol. A refused lock answers missing-pam with exit 0, which is a new arm. The healthy control answers ok and then reports secure:true to lock status. A fix that waits for a secure session therefore keeps the control green. Upstream quattro 035ce29f exits 0 with every arm green. #9429 at 3fa17d48 and #13756 at bf2c22ec, each merged onto it, exit 1 with every failure arm non-zero.'
    - 'Fixed on pr/9429 by omacom/omarchy#9429 at 3fa17d48. On this tree pocs/wc89-silent-lock-exit0.sh exits 1: the three failure arms exit 1 and the control exits 0. test/shell.d/system-lock-test.sh covers the same paths. It also covers a request that the shell accepts but never secures.'
    - '2026-10-09: #9429 moved to head 3a590ca0 (a shell-side request receipt: lock request / lock result, shell/plugins/lock/LockRequestModel.js). The reproducer stub now also answers lock request and lock result. On this tree pocs/wc89-silent-lock-exit0.sh exits 1: the three failure arms exit 1 and the control exits 0. Baseline quattro-proof 1e433732 still exits 0 with every arm green; #13756 at bf2c22ec still exits 1.'
