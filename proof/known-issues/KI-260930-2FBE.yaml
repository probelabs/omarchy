    notes: |
        real_infrastructure: pocs/wc89-silent-lock-exit0.sh runs the real bin/omarchy-system-lock; only the side-effect commands (omarchy-shell, hyprctl, pgrep, pkill, timeout, pidwait, flock, omarchy-notification-send, omarchy-cmd-present) are stubbed on PATH, never the binary under test. The omarchy-shell stub answers lock lock and lock status, and the tracked-request lock request and lock result, the way the lock plugin's IPC does.
        quantitative_impact: the metric is the callee exit status - all three failure arms (refused with missing-pam, shell stopped, binary absent) exit 0, byte-identical to the success arm, so the observable cannot distinguish a locked session from a failed one.
        control_test: arm 4 is the negative control - a healthy engagement (ok then lock status secure:true, or a pending receipt then a secured lock result) exits 0 AND the stub log proves the lock verb was invoked with exact args (argc=2 args=[lock lock] or [lock request]), so the harness demonstrably exercises the real invocation wiring; the identical exit across arms is the masked impact. A fix that waits for a secure session keeps the control green; a broken control exits 2.
        operational_path_verified: control + failure arms drive the real operational path (Lock row action string -> bin/omarchy-system-lock -> omarchy-shell lock lock) end to end.
        current_deployment_relevance: bin/omarchy-system-lock line 10 carries the unchecked engagement call on this branch today.
        honest_severity: medium - high impact (one-way visibility loss on a security control) times near-zero likelihood (default-set binary invariant), exactly the WC89 hazard_review grade; no escalation claimed.
        reproducible: deterministic stub harness, four arms, about 2s on the defect (a fix that waits for a secure session takes up to its own deadline per failure arm); exit code alone decides every assertion.
        no_inflation: claims limited to the demonstrated silent exit-0 on engagement failure; no privilege, data, or network claims.
