risk: correctness
cve_surface: none
reproducer_command: ./pocs/crs-260930-3vzg-menu.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: jq is a core dependency; failure is rare
remediation: Build the payload first with a status check (payload=$(menu_payload ...) || exit 1) and refuse to exec with an empty payload
