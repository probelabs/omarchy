candidate:
    draft_ref: 'R-1177#lock-password-im-wedge-swallows-input'
    reproducer_sketch: 'Default install with omarchy-fcitx5.service enabled; lock the session, suspend (lid close), leave suspended a while, resume and type at the lock prompt. Expected: the password is accepted. Actual (reporter: 3 of 5 cycles on an ASUS ROG Strix G18, NVIDIA, s2idle): every keystroke vanishes while hyprctl stays responsive; ''systemctl --user restart omarchy-fcitx5.service'' restores input instantly, and a resume-restart workaround eliminated recurrences. Not a confirmed reproducer.'
