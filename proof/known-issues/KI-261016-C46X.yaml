id: KI-261016-C46X
title: Idle-triggered system-lock exits successfully without requesting session lock
description: |-
    The desktop stays unlocked and accessible after idle.lock expires, although the spawned lock command exits 0 and no lock-requested or secure transition is logged.

    Trigger: Allow the configured idle.lock timeout to elapse without user input; manual locking and suspend locking still work.

    Where: Idle invocation of bin/omarchy-system-lock and its omarchy-shell lock lock IPC call

    Reported upstream in omacom/omarchy#9480 (https://github.com/omacom/omarchy/issues/9480). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
