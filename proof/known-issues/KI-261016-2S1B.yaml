id: KI-261016-2S1B
title: Lock screen password field types no numpad digits while NumLock is on until NumLock is toggled twice
description: |-
    With NumLock on, numpad keys produce no digits in the Quickshell lock-screen password field; toggling NumLock off and on restores keypad entry for that prompt.

    Trigger: Enter password digits using the numeric keypad at a Quickshell lock screen whose keypad handling is out of sync with active NumLock, including when resume raises the lock screen.

    Where: lock: shell/plugins/lock/LockView.qml password-field keypad input handling.

    Reported upstream in omacom/omarchy#7162 (https://github.com/omacom/omarchy/issues/7162). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
