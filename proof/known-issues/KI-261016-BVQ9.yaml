id: KI-261016-BVQ9
title: Kept cloned menu loses its injected shell facade and permanently loses application rows
description: |-
    A cloned menu's shell object becomes null after initial injection; Apps remains empty and installed applications disappear from search while other submenus work.

    Trigger: Clone omarchy.menu and restart the shell; the scoped shell API is destroyed after loading and never reinjected into the keepLoaded menu.

    Where: menu: shell/plugins/menu/Menu.qml mergeAppRows in the cloned menu (a copy of the audited plugin), whose app rows vanish because root.shell is null; caused by the panel Loader/scoped PluginShellApi lifecycle in shell/shell.qml revoking the facade and never re-injecting it

    Reported upstream in omacom/omarchy#12989 (https://github.com/omacom/omarchy/issues/12989). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
