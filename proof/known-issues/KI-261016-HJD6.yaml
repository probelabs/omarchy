id: KI-261016-HJD6
title: Lock blank's display-off DPMS dispatch reports success but leaves every output powered on
description: |-
    After lock the displays never power off and every output keeps dpmsStatus true; the display-off DPMS dispatch the lock blank runs returns ok but changes nothing, also when run by hand with no input in between.

    Trigger: Lock the session (omarchy system lock or the idle lock) and leave it untouched past the blank timeout, so the lock's blank runs omarchy-brightness-display off.

    Where: lock: shell/plugins/lock/Service.qml idleBlankTimer -> runBlank()/blankProcess display-off path, through the DPMS-off dispatch it invokes (bin/omarchy-brightness-display off)

    Reported upstream in omacom/omarchy#7456 (https://github.com/omacom/omarchy/issues/7456). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
