candidate:
    draft_ref: 'R-1664#lock-initial-blank-no-effect'
    reproducer_sketch: 'Run omarchy system lock (or let the idle lock engage) and leave input untouched for a minute; over SSH or a TTY, hyprctl monitors -j shows dpmsStatus true on every output. Then run hyprctl dispatch ''hl.dsp.dpms({ action = "disable" })'' by hand with no input: expected dpmsStatus false, reported true. Reported on Hyprland 0.56.2 with two Dell panels on NVIDIA+AMD and confirmed on a second 0.56.2 system; one commenter''s AMD system and a bot''s worker blank fine, so the condition is build/driver dependent. The reporter''s theory (the table form is ignored; switch to the string form) is disputed (the bot reads the string form as a toggle) and is not part of this definition.'
