mitigation: DEBUG=1 on omarchy-menu-keybindings prints the failing require
remediation: 'Isolate each bind registration from unrelated config code: run the dofile with a fully permissive mock (never-throwing comparisons) or scan binds via a per-require pcall boundary so one throwing module cannot drop unrelated binds'
