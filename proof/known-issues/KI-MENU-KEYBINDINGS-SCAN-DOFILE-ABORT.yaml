id: KI-MENU-KEYBINDINGS-SCAN-DOFILE-ABORT
title: Lua bind scan aborts on the first throwing require; every later Lua bind silently vanishes from the menu cache
description: build_lua_bind_cache dofiles the user hyprland.lua under a single pcall (bin/omarchy-menu-keybindings:241). config/hypr/hyprland.lua:14 requires default.hypr.omarchy BEFORE hypr.bindings (line 21); omarchy loads qconsole whose console_monitor() evaluates mon.scale > 0 against the scanner's noop mock - a table-vs-number comparison that throws and kills the whole scan. hypr.bindings is then never processed, so every user Lua bind (rebinds and new binds alike) is missing from the keybindings menu; only a DEBUG=1 stderr line records why.
