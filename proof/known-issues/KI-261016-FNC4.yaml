    reproducer_sketch: 'Suspend with the lid closed and an external monitor, undock so the clamshell poll stops, then resume. Expected the internal panel to be re-enabled. Actual eDP-1 stays disabled, the lock is secure, and password submissions are logged while the panel stays black until a hard reboot. With the external monitor still connected the watcher re-enables the panel after a few seconds.'
