severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: ./pocs/crs-260930-gzq0-c01-c02-c10.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: default 5s window stays unaffected; only logind drop-ins with windows <= 1s hit the chain
remediation: Floor the derived budget at 1ms (or clamp the reserve to window-1ms). Make the heal guard substitute a safe constant instead of re-deriving. Surface lock_ipc's refusal instead of swallowing it
