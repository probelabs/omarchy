id: KI-SLEEP-LOCK-BUDGET-NONPOSITIVE
title: 'Non-positive sleep-lock budget for logind windows <= 1s: heal guard re-derives the same value, lock_ipc refuses silently, suspend proceeds with no lock attempt'
description: 'derive_budget_ms reserves max(window/5, 1000ms) with no floor (bin/omarchy-system-sleep-lock:37-40): a 1s InhibitDelayMaxUSec yields budget 0 and any sub-second window yields a NEGATIVE budget. The line-45 heal guard re-derives instead of flooring - a second identical busctl read that reinstalls the same illegal value. With budget <= 0 the deadline is already past, so every lock_ipc hits the remaining<=0 guard and returns 1 with empty stdout, request_lock''s case silently falls through, and the machine suspends with the lock NEVER attempted - only a ''within 0ms'' notification marks it.'
