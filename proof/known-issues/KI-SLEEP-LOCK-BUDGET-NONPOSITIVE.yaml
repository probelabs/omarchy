mitigation: default 5s window is unaffected; only logind drop-ins with windows <= 1s hit the chain
remediation: Floor the derived budget at 1ms (or clamp the reserve to window-1ms), make the heal guard substitute a safe constant instead of re-deriving, and surface lock_ipc's refusal instead of swallowing it
