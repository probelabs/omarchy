id: KI-LOCK-STALE-POSTER-INPLACE-OVERWRITE
title: In-place video wallpaper overwrite during a running poster job keeps the stale poster frame
description: refreshPoster drops the new request while posterProc is running (running guard, Service.qml:150) without queueing, and posterProc.onExited (715-722) commits whenever sourcePath === backgroundPath. An in-place overwrite (same path, new bytes) therefore keeps the poster hashed from the pre-overwrite stat. BackgroundVersion changes the URL but the jpeg bytes are stale, and the code schedules no second refresh.
affected_requirements:
    - SYS-REQ-260912-T0XP
evidence_manifests:
    - proof/evidence/ki-lock-stale-poster-inplace-overwrite.yaml
severity: low
severity_basis: risk
risk: correctness
reproducer_command: ./pocs/crs-260930-ttvk-qml-static.sh
introduced_in: inception
defect_class: latent
mitigation: another wallpaper change or re-lock regenerates it
remediation: Queue (or re-arm) the poster request when the running guard fires. Then compare the stat signature - not just the path - in onExited before committing
