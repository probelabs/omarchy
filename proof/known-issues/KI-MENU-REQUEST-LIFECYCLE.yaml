id: KI-MENU-REQUEST-LIFECYCLE
title: dmenu request lifecycle drops waiters on re-summon, on a busy resultProc, and for doneFile-only requests
description: A second open without close() replaces selectionFile/doneFile/requestActive with no write to the previous done file - the first caller waits forever (SX26/C06/C07; openExistingMenu/openDmenu bodies). finishRequest wipes requestActive and both paths BEFORE resultProc.running = true. Quickshell therefore ignores a command change while the previous write runs, and the new selection disappears (SX26/C14; the empty-selectionFile redirect variant is SX26/C15 and HFY2/C36).
affected_requirements:
    - SW-REQ-260922-FGZQ
    - SW-REQ-260922-C8HX
    - SW-REQ-260922-3VTN
evidence_manifests:
    - pocs/menu-qml-static.sh
    - proof/evidence/ki-menu-request-lifecycle.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: pocs/menu-qml-static.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: A dropped waiter loses at most one prompt; the next summon re-handshakes cleanly and no stale selection is ever dispatched
remediation: finish (or sentinel) the outstanding request before replacing its files; queue the write when resultProc is running; treat a doneFile-only request as cancel-only
notes:
    - 'PR omacom/omarchy#9056 (head 0b4fe292, reviewed on pr/9056 over baseline e797ba5b): the re-summon leg (SX26/C06/C07, upstream #9057) is mitigated by the guard in open() that answers an active request as cancelled before dispatch - witnessed in test/shell.d/menu-summon-cancel-test.sh (fails on the baseline, passes with the PR) and governed by SW-REQ-260925-XTGG. The busy-resultProc leg (SX26/C14/C15) and the doneFile-only leg are NOT addressed by the PR and stay open. Note: the declared reproducer pocs/menu-qml-static.sh does not probe the re-summon mechanism, so its green tripwire does not flip on the PR.'
