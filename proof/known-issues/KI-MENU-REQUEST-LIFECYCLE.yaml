mitigation: A dropped waiter loses at most one prompt; the next summon re-handshakes cleanly and no stale selection is ever dispatched
remediation: finish (or sentinel) the outstanding request before replacing its files; queue the write when resultProc is running; treat a doneFile-only request as cancel-only
