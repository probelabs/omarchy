id: KI-MENU-REQUEST-LIFECYCLE
title: dmenu request lifecycle drops waiters on re-summon, on a busy resultProc, and for doneFile-only requests
description: |-
    On upstream quattro, a second open without close() replaces selectionFile/doneFile/requestActive and writes nothing to the previous done file. The first caller then waits forever (SX26/C06/C07; openExistingMenu/openDmenu bodies). This is omacom/omarchy#9057. The behavioural reproducer test/reports/report-cmulr95nw0kqr1gw46i7f50xj.sh drives two real omarchy-menu-select callers through the real Menu.qml open/openDmenu/cancel bodies. On quattro the superseded caller never gets its done file and polls forever. Upstream e332dc97 has no cancel-prior guard; #9056 adds one, and on this mirror the reproducer exits 0.

    On upstream quattro, finishRequest wipes requestActive and both paths BEFORE resultProc.running = true. Quickshell therefore ignores a command change while the previous write runs, and the new selection disappears (SX26/C14). #9056 head b7bd59c4 writes each answer through its own process, which fixes this leg on this mirror. Still open here: the empty-selectionFile redirect variant (SX26/C15 and HFY2/C36), the doneFile-only leg, and a caller whose menu process dies (omarchy-menu-select has no deadline).
