id: KI-MENU-REQUEST-LIFECYCLE
title: 'dmenu request lifecycle drops waiters: re-summon overwrites the handshake files without writing the previous done sentinel, a busy resultProc silently loses the write, and a doneFile-only request stores the selection nowhere'
description: A second open without close() replaces selectionFile/doneFile/requestActive with no write to the previous done file - the first caller waits forever (SX26/C06/C07; openExistingMenu/openDmenu bodies). finishRequest wipes requestActive and both paths BEFORE resultProc.running = true, so a command change while the previous write runs is ignored by Quickshell and the new selection is lost (SX26/C14; the empty-selectionFile redirect variant is SX26/C15 and HFY2/C36).
