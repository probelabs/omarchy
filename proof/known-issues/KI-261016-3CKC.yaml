id: KI-261016-3CKC
title: Idle lock SIGSEGV when one QQuickItem is reused across lock-screen windows
description: |-
    At the idle lock timeout, Quickshell logs that the same QQuickItem is used on different windows and then terminates with SIGSEGV in QQuickItem setParentItem / window reparenting; the shell restarts and the crash repeats on the next lock timeout.

    Trigger: The idle timeout initiates session locking with multiple outputs connected; cross-window QQuickItem warnings and a QML binding/reparenting stack immediately precede the crash. The identity and ownership of the reparented item are not established.

    Where: lock: session-lock engagement through shell/plugins/lock/Service.qml and Quickshell WlSessionLock; the observed fault is Qt Quick's setParentItem/refWindow path. The report does not identify the item or establish whether Omarchy QML or Quickshell moved it.

    Reported upstream in omacom/omarchy#8973 (https://github.com/omacom/omarchy/issues/8973). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
