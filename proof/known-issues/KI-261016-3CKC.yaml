    reproducer_sketch: 'Connect two monitors and leave the stock shell idle until the lock timeout (reported with lock 300 s on Quickshell 0.3.1 / Qt 6.11.2, hybrid Intel+NVIDIA). Expected: each output has its own lock visual tree and the shell stays up. Actual: repeated ''Cannot use same item on different windows at the same time'' warnings, then SIGSEGV in setParentItem/refWindow, and the shell restarts. The project bot could not reproduce on a two-output worker without NVIDIA; a symbolized backtrace is needed to name the shared item.'
