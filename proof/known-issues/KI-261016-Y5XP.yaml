id: KI-261016-Y5XP
title: Interrupted keybindings cache refresh leaves its temporary file behind
description: |-
    Temporary keybindings.XXXXXX files accumulate in the Omarchy cache directory after cache refreshes hang or are terminated before completion.

    Trigger: A keybindings cache refresh creates its temporary output file, then hangs or is terminated before the ordinary success or error cleanup path runs.

    Where: bin/omarchy-menu-keybindings refresh_keybindings_cache: tmp_file is moved on success or removed on returned failure, without an EXIT/INT/TERM cleanup trap

    Reported upstream in omacom/omarchy#14243 (https://github.com/omacom/omarchy/issues/14243). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
