    reproducer_sketch: 'Press Super+Ctrl+Space (background switcher) or Super+Shift+Ctrl+Space (theme switcher) twice: expected the picker opens, then closes; actual the picker opens again on the second press. The upstream thread notes the Set reminder shortcut (another action route) behaves the same; pr/7445 is an in-flight fix for the image-picker switchers.'
