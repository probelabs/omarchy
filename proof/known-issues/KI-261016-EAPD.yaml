candidate:
    draft_ref: 'R-1608#lock-blank-process-latched-running'
    reproducer_sketch: 'In the affected long-running shell, invoke omarchy-shell lock lock and poll hyprctl monitors -j beyond five seconds: dpmsStatus stays true across repeated locks. Run the same blank command directly while locked: it powers off and stays off. Restart shell and repeat: automatic blanking returns. Reported after roughly 24 hours. A reused Process remaining running is a suspected explanation, not a measured condition; no failed wake was observed.'
