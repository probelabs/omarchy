id: KI-261016-EAPD
title: Lock display blanking stops across successive lock cycles until the shell is restarted
description: |-
    The locked display remains powered on past the blank timeout across repeated locks in a long-running shell, while direct execution of the blank command still powers it off. Restarting the shell restores automatic blanking.

    Trigger: Lock the session after the running shell has entered the persistent blanking-failure state, and leave it without input past the lock blank timeout; the event that first enters this state is not established.

    Where: lock: shell/plugins/lock/Service.qml idleBlankTimer to runBlank and its reused blankProcess command path.

    Reported upstream in omacom/omarchy#7652 (https://github.com/omacom/omarchy/issues/7652). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
    - SW-REQ-260912-ND55
