id: KI-261016-QCEG
title: Native lock repeatedly verifies a failed fingerprint reader without backoff
description: |-
    After the reader reports that it is disabled, the lock keeps starting verify about once a second for many minutes with no backoff.

    Trigger: While the native lock is active, fingerprint verification fails immediately because the reader reports a device error.

    Where: lock: shell/plugins/lock/Service.qml fingerprint PAM completion and error retry handling

    Reported upstream in omacom/omarchy#10796 (https://github.com/omacom/omarchy/issues/10796). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
