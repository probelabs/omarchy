candidate:
    draft_ref: 'R-260#menu-file-arg-maxlen'
    reproducer_sketch: 'Put enough media under ~/Pictures or ~/Videos that the path list exceeds 128KB (about 1500 files in the report), then run omarchy transcode. Expected: a picker (the reporter''s fix caps it to the 500 most recent). Actual: the payload exceeds MAX_ARG_STRLEN (E2BIG) and no picker opens.'
