id: KI-261016-AA2E
title: omarchy-menu-select cannot open a picker whose option list exceeds the single-argument limit
description: |-
    With a large media library the select payload built from the option list exceeds MAX_ARG_STRLEN (128KB), so the transcode file picker cannot be opened with it.

    Trigger: omarchy-menu-file pipes a large file listing (every matching file under Pictures and Videos, uncapped) on stdin into omarchy-menu-select, which passes the whole encoded option list as one command-line argument when it builds and sends the select payload.

    Where: menu: bin/omarchy-menu-select payload build (options JSON and payload each passed as a single argv string), reached from bin/omarchy-menu-file

    Reported upstream in omacom/omarchy#12665 (https://github.com/omacom/omarchy/issues/12665). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
