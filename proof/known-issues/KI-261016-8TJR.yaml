id: KI-261016-8TJR
title: Startup lock silently ends a prompting PAM exchange without authentication feedback
description: |-
    At the startup lock, submitting input for a prompting authentication module enters the authenticating state and then returns to the password field without failure feedback or completion of that module's authentication. The reporter's follow-up says a real password unlocks the same startup dialog, and the prompting exchange works on a later manual lock.

    Trigger: Submit the prompting PAM exchange at the lock observed just after session startup; the same exchange succeeds after manually locking the running session.

    Where: lock: the password PamContext conversation and its completion/error feedback in shell/plugins/lock/Service.qml; the underlying cause of the early conversation termination is not established.

    Reported upstream in omacom/omarchy#8762 (https://github.com/omacom/omarchy/issues/8762). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
