candidate:
    draft_ref: 'R-1309#startup-lock-pam-silent-return'
    reproducer_sketch: 'The reporter configured a pam_irlume.so consent module before the stock omarchy-lock-password stack. Cold boot with autologin on that machine, type yes and Enter at the observed startup lock: activity appears, then the password field returns with no failure flash and no face-daemon request or downstream pam_unix attempt. A real password unlocks; later manual locking and submitting yes engages the camera and unlocks. The startup-lock entry path and exact conversation teardown mechanism remain unconfirmed.'
