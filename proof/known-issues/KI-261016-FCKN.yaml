id: KI-261016-FCKN
title: Menu summon reports success without a surface or user feedback when graphics-context allocation fails
description: |-
    The menu command acknowledges success but creates no usable menu surface and gives no user-visible explanation when the graphics backend cannot initialize; repeated summons remain silent while graphics resources are unavailable.

    Trigger: Summon or toggle the menu while GPU memory pressure prevents allocation of its EGL/GL graphics context.

    Where: menu: shell/plugins/menu/Menu.qml open/openRoute and its omarchy-menu OverlayWindow presentation path do not surface the graphics-context creation failure to the user.

    Reported upstream in omacom/omarchy#10880 (https://github.com/omacom/omarchy/issues/10880). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
