candidate:
    draft_ref: 'R-804#menu-graphics-allocation-silent-failure'
    reproducer_sketch: 'Occupy GPU memory with other applications until a menu summon cannot allocate its context. Invoke omarchy-menu toggle root or summon and observe command success with no menu surface, accompanied by graphics-context allocation/RHI errors in the journal. Expected a visible menu or explicit failure feedback; actual silent nonpresentation. The subject reports recovery by restarting the shell, and a commenter reports recovery when GPU memory is freed.'
