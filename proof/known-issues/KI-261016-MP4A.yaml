id: KI-261016-MP4A
title: Lock screen renders black when QtQuick Color shadows the shell palette singleton
description: |-
    The native lock screen loses its theme colors and renders black instead of its normal themed interface.

    Trigger: Run the shell with a QtQuick module exposing a Color type that shadows the shell's unqualified qs.Commons Color singleton, then display the lock screen.

    Where: lock: unqualified shell palette references in the audited native lock screen under shell/plugins/lock/**

    Reported upstream in omacom/omarchy#15134 (https://github.com/omacom/omarchy/issues/15134). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
