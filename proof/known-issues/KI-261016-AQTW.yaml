candidate:
    draft_ref: 'R-12#menu-first-open-other-monitor'
    reproducer_sketch: 'Two monitors. Open the menu with Super+Space on monitor A and close it; move focus to monitor B; press Super+Space. Expected: the menu opens visibly on B on the first press. Actual: nothing visible (hyprctl layers -j shows namespace omarchy-menu on B at level 1 / bottom, full size); a second press closes it, a third shows it on top.'
