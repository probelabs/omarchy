id: KI-261016-6TK3
title: Lock-screen wake requests repeatedly apply a conflicting monitor scale, causing display flicker
description: |-
    The lit lock display flickers as wake handling repeatedly applies a scale different from the active layout and that layout restores its scale.

    Trigger: User input invokes lock wake while the internal panel's active scale differs from the scale inferred from monitors.lua and repeated reconciliation cannot make that inferred scale stick.

    Where: shell/plugins/lock/LockView.qml wakeRequested and shell/plugins/lock/Service.qml runWake invoke the full system-wake/clamshell monitor-scale reconciliation path on lock input.

    Reported upstream in omacom/omarchy#10290 (https://github.com/omacom/omarchy/issues/10290). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
