id: KI-261016-BZH1
title: Under Qt 6.12 the shell's Color palette singleton resolves to undefined, so the Omarchy menu opens as a fully black screen
description: |-
    Opening the Omarchy menu (Super+Space or omarchy-menu toggle) shows a fully black screen instead of the menu UI while hyprctl layers shows the omarchy-menu layer at full size; the shell log reports TypeError 'Cannot read property background of undefined' and 'scrim of undefined' in plugins/menu/Menu.qml and 'menu.border-alpha of undefined' in Commons/Border.qml from shell startup.

    Trigger: Run the Omarchy shell on Qt 6.12 (qt6-base/qt6-declarative/qt6-wayland 6.12.0), then open the menu; the shell's unqualified Color palette references then evaluate to undefined.

    Where: menu: the Color palette lookups in shell/plugins/menu/Menu.qml (Color.menu.background / scrim, lines 87/91) and shell/Commons/Border.qml (menu.border-alpha), which reference the shell's Color singleton unqualified

    Reported upstream in omacom/omarchy#14635 (https://github.com/omacom/omarchy/issues/14635). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
