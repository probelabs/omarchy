candidate:
    draft_ref: 'R-5254#qt612-color-singleton-shadow'
    reproducer_sketch: 'Update qt6-base/qt6-declarative/qt6-wayland to 6.12.0 (the quickshell build, 0.3.1 or 0.3.2, does not matter per a second reporter), restart the shell and press Super+Space. Expected the themed menu UI; actual a fully black screen with the omarchy-menu layer mapped and the Menu.qml/Border.qml undefined-property errors in `qs log`. A commenter''s pass/fail: `journalctl -b -t omarchy-shell | grep -c ''WARN scene''` is 0 on Qt 6.11.2 and 233 on 6.12.0. The reporter suspected a pragma Singleton change; merged PR #14553 instead names a new QtQuick Color type shadowing the unqualified singleton and qualifies the references as Commons.Color.'
