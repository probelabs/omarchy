id: KI-LOCK-EMPTY-READLINK-WIPES-WALLPAPER
title: Failed/empty readlink result stored as backgroundPath, wiping a good lock-screen wallpaper
description: readlinkProc's handler (shell/plugins/lock/Service.qml:499-507) takes lines[0] of the collector output with no non-empty guard; the embedded bash prints only after a successful readlink, so a missing currentBackgroundLink or a readlink error yields next = ''. The next !== backgroundPath branch then clears videoPosterPath, stores backgroundPath = '', and bumps backgroundVersion - a transient wallpaper race (theme switch) blanks the lock background until a later refresh succeeds.
affected_requirements:
    - SYS-REQ-260912-T0XP
evidence_manifests:
    - proof/evidence/ki-lock-empty-readlink-wipes-wallpaper.yaml
severity: low
reproducer_command: ./pocs/crs-260930-ttvk-qml-static.sh
mitigation: next refreshBackground with a good link restores it
remediation: Keep the previous backgroundPath (and signature) when the readlink output is empty, and retry via a short timer instead of committing the empty result
status: open
