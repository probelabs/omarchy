id: KI-261016-EEV6
title: Update lock survives in daemonized descendants and blocks subsequent updates
description: |-
    A later update reports that one is already running even though the updater has exited, because a surviving daemon holds its lock descriptor.

    Trigger: An update spawns a long-lived descendant that inherits the update lock file descriptor and keeps it open after the updater exits.

    Where: lock: bin/omarchy-update-lock descriptor lifetime across exec and descendant processes

    Reported upstream in omacom/omarchy#8077 (https://github.com/omacom/omarchy/issues/8077). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
