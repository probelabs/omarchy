    - proof/evidence/ki-menu-sticky-fontfamily.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: pocs/menu-qml-static.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Stickiness needs two callers with different fonts in one session; the standard launcher uses a single font
remediation: reset fontFamily to the Style default in cancel()/openRoute when the payload omits it
