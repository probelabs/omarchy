affected_api: omarchy transcode (bin/omarchy-transcode -> bin/omarchy-menu-file -> bin/omarchy-menu-select)
reproducer_command: bash pocs/reproducers/ki-261010-hy1b/repro.sh
introduced_in: inception
defect_class: latent
disclosure: public
mitigation: Run omarchy transcode with at least one picture or video in ~/Pictures or ~/Videos (or pass --path and an input file). If the usage line appears, it means those directories hold no media; nothing has gone wrong beyond the missing empty-state message. From the menu, check ~/Pictures and ~/Videos before picking Transcode, since the entry gives no feedback when they are empty.
remediation: In bin/omarchy-menu-file, report the empty listing to the user instead of piping an empty list into omarchy-menu-select — a "No files found" notification naming the searched paths — and exit 1, so omarchy transcode and the menu's Transcode entry say why nothing happened and omarchy-games-retro-install gets the same notice. A person should approve draft requirement SW-REQ-261010-DFDW, which states that caller-level empty-state behaviour; until then no requirement governs it (SW-REQ-260922-B839 mandates the helper's usage+exit-1 on an empty option list and is satisfied there, and SW-REQ-260922-HR29 is silent on an empty listing).
