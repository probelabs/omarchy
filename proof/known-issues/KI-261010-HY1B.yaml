id: KI-261010-HY1B
title: Empty media directories make transcode print omarchy-menu-select's usage
description: |-
    With empty ~/Pictures and ~/Videos (the state of a fresh install), `omarchy transcode` prints `Usage: omarchy-menu-select <prompt> [option...] [-- menu args...]` and exits 1 — an internal usage string for a command the user never typed — and picking Transcode from the menu is a silent no-op.

    Trigger: ~/Pictures and ~/Videos exist and are empty, so bin/omarchy-menu-file's find over those paths matches no media file and pipes an empty option list into bin/omarchy-menu-select. omarchy-menu-select cannot tell an empty piped list from "the caller passed no options": `if (( ${#options[@]} == 0 )) && [[ ! -t 0 ]]; then mapfile -t options; fi` reads zero lines, and the next check prints its usage and exits 1. omarchy-transcode's `input=$(omarchy-menu-file ...)` then dies under set -e with that usage on stderr. From the menu entry trigger.transcode there is no terminal, so stderr goes nowhere.

    The same empty-directory path reaches bin/omarchy-games-retro-install (~/Games/roms), which swallows the exit code with `|| exit 0` and so fails silently instead.

    Reports:
    - https://github.com/omacom/omarchy/issues/7114
affected_requirements:
    - SW-REQ-261010-DFDW
