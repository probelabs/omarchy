severity: low
severity_basis: reproducer
risk: availability
cve_surface: none
affected_api: bin/omarchy-hyprland-session-locked (lock-state probe used by stranded-lock recovery)
reproducer_command: ./pocs/eh0k-hyprctl-monitors-no-timeout.sh
tripwire_mutation: 'bin/omarchy-hyprland-session-locked line 17 `monitors=$(hyprctl -j monitors 2>/dev/null) || exit 2` becomes `monitors=$(timeout 2 hyprctl -j monitors 2>/dev/null) || exit 2`: the stall arm then returns exit 2 (undetermined) after about 2s instead of being killed by the external 5s watchdog, the rc=124 assertion in pocs/eh0k-hyprctl-monitors-no-timeout.sh fails, and the tripwire flips red. The two control arms (exit 0 locked, exit 1 unlocked) are unaffected.'
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: 'The session never unlocks because of this defect: a stalled probe only delays stranded-lock recovery, and the Hyprland failsafe lock screen remains in place. Once the compositor IPC answers again, the next probe run returns a real verdict. Manual recovery is to kill the stuck hyprctl process or switch to a TTY and restart the lock.'
remediation: 'Bound the IPC call in bin/omarchy-hyprland-session-locked, e.g. `monitors=$(timeout 2 hyprctl -j monitors 2>/dev/null) || exit 2`, so a stalled compositor maps onto the existing exit 2 (undetermined) contract that callers already handle. Then remove the SW-REQ-260912-EH0K external_call_timeout_bounded deferral and add a witness for the bounded path. Close criterion: pocs/eh0k-hyprctl-monitors-no-timeout.sh flips red because the stall arm returns exit 2 inside the watchdog.'
