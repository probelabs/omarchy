id: KI-LOCK-PROBE-HYPRCTL-NO-TIMEOUT
title: omarchy-hyprland-session-locked has no deadline on hyprctl -j monitors; a stalled compositor IPC hangs the lock-state probe
description: 'bin/omarchy-hyprland-session-locked asks the compositor for lock state with `monitors=$(hyprctl -j monitors 2>/dev/null) || exit 2` and puts no deadline on that call. When the Hyprland IPC socket accepts the request but never answers (a stalled compositor, which happens in practice around lid and monitor transitions), the probe blocks for as long as hyprctl does instead of returning exit 2 (undetermined). Its caller, the stranded-lock recovery path, then waits on a probe that never reports, so recovery makes no progress for the duration of the stall. The Hyprland failsafe lock screen is the backstop: the session stays locked rather than exposed. pocs/eh0k-hyprctl-monitors-no-timeout.sh reproduces it: with hyprctl stalled, the real probe is still blocked when an external 5s watchdog kills it (rc=124), while the control arms answer 0 (locked) and 1 (unlocked) immediately.'
affected_requirements:
    - SW-REQ-260912-EH0K
evidence_manifests:
