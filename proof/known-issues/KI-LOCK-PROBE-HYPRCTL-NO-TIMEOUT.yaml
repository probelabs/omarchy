id: KI-LOCK-PROBE-HYPRCTL-NO-TIMEOUT
title: omarchy-hyprland-session-locked has no deadline on hyprctl -j monitors; a stalled compositor IPC hangs the probe
description: |-
    bin/omarchy-hyprland-session-locked asks the compositor for the lock state with `monitors=$(hyprctl -j monitors 2>/dev/null) || exit 2`. Nothing puts a deadline on that call. Sometimes the Hyprland IPC socket accepts the request but never answers. This happens in practice around lid and monitor transitions. The probe then blocks for as long as hyprctl blocks, instead of returning exit 2 (undetermined).

    The stranded-lock recovery path calls this probe. That path then waits on a probe that never reports, so recovery makes no progress for the duration of the stall. The Hyprland failsafe lock screen is the backstop, so the session stays locked. pocs/eh0k-hyprctl-monitors-no-timeout.sh reproduces the defect. With hyprctl stalled, an external 5s watchdog kills the real probe (rc=124). The control arms answer 0 (locked) and 1 (unlocked) immediately.
affected_requirements:
    - SW-REQ-260912-EH0K
evidence_manifests:
    - proof/evidence/ki-lock-probe-hyprctl-no-timeout.yaml
severity: low
severity_basis: reproducer
risk: availability
cve_surface: none
affected_api: bin/omarchy-hyprland-session-locked (lock-state probe used by stranded-lock recovery)
reproducer_command: ./pocs/eh0k-hyprctl-monitors-no-timeout.sh
tripwire_mutation: In bin/omarchy-hyprland-session-locked line 17, `monitors=$(hyprctl -j monitors 2>/dev/null) || exit 2` becomes `monitors=$(timeout 2 hyprctl -j monitors 2>/dev/null) || exit 2`. The stall arm then returns exit 2 after about 2s, before the external 5s watchdog fires. The rc=124 assertion in pocs/eh0k-hyprctl-monitors-no-timeout.sh fails, and the tripwire flips red. The two control arms (exit 0 locked, exit 1 unlocked) do not change.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: This defect never unlocks the session. A stalled probe only delays stranded-lock recovery, and the Hyprland failsafe lock screen stays in place. When the compositor IPC answers again, the next probe returns a real verdict. To recover by hand, kill the stuck hyprctl process, or switch to a TTY and restart the lock.
remediation: 'Bound the IPC call in bin/omarchy-hyprland-session-locked, for example `monitors=$(timeout 2 hyprctl -j monitors 2>/dev/null) || exit 2`. A stalled compositor then maps to the existing exit 2 (undetermined), which callers already handle. Then remove the SW-REQ-260912-EH0K external_call_timeout_bounded deferral and add a witness for the bounded path. Close criterion: pocs/eh0k-hyprctl-monitors-no-timeout.sh flips red, because the stall arm returns exit 2 inside the watchdog.'
notes:
    - '2026-10-04: re-checked on upstream quattro 035ce29f. The probe is unchanged, and pocs/eh0k-hyprctl-monitors-no-timeout.sh still reproduces the stall there and on upstream quattro 393a43d4. Upstream omacom/omarchy#6888 reports a stranded-lock recovery that never completes, but from a sessionLock.secure early return.'
