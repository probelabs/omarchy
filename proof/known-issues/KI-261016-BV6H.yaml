    reproducer_sketch: 'Run omarchy menu keybindings --print, take the line for Super+Shift+S (printed SUPER SHIFT + S), write hl.unbind("SUPER SHIFT + S") in ~/.config/hypr/bindings.lua, save and reload. Expected: the default bind is removed. Actual: nothing is removed and the shortcut stays active; hl.unbind("SUPER + SHIFT + S") works.'
