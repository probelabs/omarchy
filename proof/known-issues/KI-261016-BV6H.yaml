id: KI-261016-BV6H
title: keybindings --print shows key combos in a dialect hl.unbind / o.bind do not accept
description: |-
    omarchy menu keybindings --print shows modifiers joined by spaces with a single plus only before the key (SUPER SHIFT + S), not the plus-separated form the Lua config uses (SUPER + SHIFT + S). Pasting a printed combo into hl.unbind silently removes nothing, so the default shortcut stays active; o.bind rejects it.

    Trigger: Copy a combo printed by omarchy menu keybindings --print into hl.unbind(...) or o.bind(...) in the Lua bindings config, as the bindings.lua comment suggests.

    Where: menu: bin/omarchy-menu-keybindings --print key-string formatting (modifier mask rendered back to text, a single ' + ' before the key)

    Reported upstream in omacom/omarchy#7627 (https://github.com/omacom/omarchy/issues/7627). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
