id: KI-MENU-SEARCH-TEXT-NORMALIZATION-MISSES
title: 'Search text misses: whole-word description matching drops punctuation-glued words and hyphenated alias forms'
description: termInSearchWords requires whole-word equality, so a description word with trailing punctuation ('system.') never matches the term (F24a). A mixed-case term likewise never matches the lowercased haystack (F24b). matchesQuery's name path only sees the separator-folded rewrite of aliases and leaf ids. Querying the exact hyphenated form ('power-menu') therefore misses even though the author declared the alias that way.
affected_requirements:
    - SW-REQ-260922-DQ9P
evidence_manifests:
    - pocs/menu-probes.js
    - pocs/menu-probes2.js
    - pocs/menu-probes3.js
    - proof/evidence/ki-menu-search-text-normalization-misses.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: node pocs/menu-probes.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: case handling is correct for every in-tree caller (all pre-lowercase); only punctuation and exact-form matching are defective
remediation: strip edge punctuation before the whole-word compare and keep the untokenized alias/id text as an additional nameText component
notes:
    - 'Upstream: open PR #11962 (2026-09-15) reports and fixes only the hyphenated-alias leg.'
