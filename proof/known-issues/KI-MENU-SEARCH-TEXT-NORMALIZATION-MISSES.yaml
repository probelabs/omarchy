id: KI-MENU-SEARCH-TEXT-NORMALIZATION-MISSES
title: 'Search text misses: whole-word description matching drops punctuation-glued words, and separator folding drops exact hyphenated alias/leaf forms'
description: termInSearchWords requires whole-word equality, so a description word with trailing punctuation ('system.') never matches the term (F24a) and a mixed-case term never matches the lowercased haystack (F24b); matchesQuery's name path only sees the separator-folded rewrite of aliases and leaf ids, so querying the exact hyphenated form ('power-menu') misses even though the alias is declared that way.
