id: KI-261016-4TDB
title: Apps menu misses newly installed Flatpak entries until the shell restarts despite correct search paths
description: |-
    A newly installed Flatpak's valid, unhidden desktop entry is absent from Apps search despite export directories already being present in the running shell's search paths; restarting the shell makes it appear.

    Trigger: Install a Flatpak while the shell is running with the Flatpak export search paths already configured, then search for its newly exported desktop entry.

    Where: menu: shell/plugins/menu/Menu.qml Apps list and onAppsChanged/mergeAppRows integration with the AppLibrary/DesktopEntries live discovery feed; the precise upstream watcher cause is not established here.

    Reported upstream in omacom/omarchy#8650 (https://github.com/omacom/omarchy/issues/8650). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
