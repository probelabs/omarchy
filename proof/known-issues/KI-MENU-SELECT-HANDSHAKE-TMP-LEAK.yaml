id: KI-MENU-SELECT-HANDSHAKE-TMP-LEAK
title: 'Failed second mktemp leaks the selection handshake temp file: cleanup trap installed only after both files exist'
description: prepare_handshake_files creates selection_file (line 72) then done_file (line 73) but installs the EXIT cleanup trap only at line 75. If the second mktemp fails, set -e exits before the trap exists. The first temp file - the private selection file - stays behind in TMPDIR.
affected_requirements:
    - SW-REQ-260922-Q6ZS
evidence_manifests:
    - proof/evidence/ki-menu-select-handshake-tmp-leak.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: ./pocs/crs-260930-k02d-c08.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: The leak is one temp file per failed second mktemp (disk full or /tmp mode change); a reboot clears /tmp
remediation: Install the EXIT trap before the first mktemp, wiring the variables as the code assigns them (trap 'rm -f "${selection_file:-}" "${done_file:-}"' EXIT)
