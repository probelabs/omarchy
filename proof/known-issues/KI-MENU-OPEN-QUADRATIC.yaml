id: KI-MENU-OPEN-QUADRATIC
title: Opening a select menu walks its rows quadratically (omacom/omarchy#10601)
description: |-
    rebuildDmenuDisplay (shell/plugins/menu/Menu.qml) appends rows to displayModel one at a time. The visibleRowsHeight binding evaluates again after each append. Each pass calls foldedListHeight over the full row list.

    A menu of N rows thus costs about N(N+1)/2 row visits. 231 rows take 232 height passes and 27,027 row visits. 462 rows take 463 passes and 107,415 visits.

    The Super+K keybindings menu is the realistic large case. Upstream issue: omacom/omarchy#10601. Report intake validated it (report cmulr8ysi0jwr1gw4fjmt9khq). Upstream PR 10631 does not change the counts.
affected_requirements:
    - SW-REQ-260922-B757
evidence_manifests:
    - proof/evidence/ki-menu-open-quadratic.yaml
severity: low
severity_basis: risk
risk: performance
cve_surface: none
affected_api: Menu.qml rebuildDmenuDisplay + visibleRowsHeight binding (omarchy-menu-select summon)
reproducer_command: sh test/reports/report-cmulr8ysi0jwr1gw4fjmt9khq.sh
tripwire_mutation: Build the display rows in one batch, or suspend the visibleRowsHeight binding during the rebuild. Then a summon folds the list a bounded number of times. The red reproducer test/reports/report-cmulr8ysi0jwr1gw4fjmt9khq.sh starts exiting 0, and the expected failure in test/node/report-reproducers.test.mjs flips red.
introduced_in: inception
defect_class: latent
mitigation: Menus of typical size (tens of rows) open without a visible delay. The cost grows only for very long select lists such as the keybindings menu
remediation: Append the rows in one model update, or defer the height binding until the rebuild ends. Also add a requirement that bounds the menu-open cost; none exists today
notes:
    - 'Upstream: issue #10601 (2026-09-07). Fix PR #10631 was closed unmerged; it did not change the counts.'
customer_impact: Opening a long select menu does work that grows with the square of its length, because the menu measures the whole list again after each row is added. Menus of tens of rows open without a visible delay, but the 231-row keybindings menu (Super+K) costs 27,027 row visits each time it opens. Nothing breaks; the menu only opens more slowly.
