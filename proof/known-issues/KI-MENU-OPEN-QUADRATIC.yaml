    - proof/evidence/ki-menu-open-quadratic.yaml
severity: low
severity_basis: risk
risk: performance
cve_surface: none
affected_api: Menu.qml rebuildDmenuDisplay + visibleRowsHeight binding (omarchy-menu-select summon)
reproducer_command: sh test/reports/report-cmulr8ysi0jwr1gw4fjmt9khq.sh
tripwire_mutation: 'Build the display rows in one batch (or suspend the visibleRowsHeight binding during the rebuild) so a summon folds the list a bounded number of times: the red reproducer test/reports/report-cmulr8ysi0jwr1gw4fjmt9khq.sh starts exiting 0 and the expected failure in test/node/report-reproducers.test.mjs flips red.'
introduced_in: inception
defect_class: latent
mitigation: Menus of typical size (tens of rows) open without a visible delay; the cost grows only for very long select lists such as the keybindings menu
remediation: Append the rows in one model update or defer the height binding until the rebuild finishes; add a requirement that bounds menu-open cost (none exists today)
