id: KI-MENU-OPEN-QUADRATIC
title: 'Opening a select menu walks its rows quadratically: the height binding re-folds the whole list on every appended row (omacom/omarchy#10601)'
description: 'rebuildDmenuDisplay (shell/plugins/menu/Menu.qml) appends rows to displayModel one at a time, and the visibleRowsHeight binding re-evaluates on every append. Each pass calls foldedListHeight over the full row list, so a menu of N rows costs about N(N+1)/2 row visits: 231 rows take 232 height passes and 27,027 row visits, 462 rows 463 passes and 107,415 visits. The Super+K keybindings menu (omarchy-menu-select) is the realistic large case. Reported upstream as omacom/omarchy#10601 and validated by report intake (report cmulr8ysi0jwr1gw4fjmt9khq); upstream PR 10631 does not change the counts.'
affected_requirements:
    - SW-REQ-260922-B757
