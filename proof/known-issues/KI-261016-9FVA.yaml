    reproducer_sketch: 'Let the idle lock engage, then make Hyprland abort (reported: a renderer assert/SIGABRT in makeSnapshotFB during window unmap under amdgpu VM exhaustion, Hyprland 0.56.2, Radeon 780M) so its watchdog relaunches it with --safe-mode --locked. Expected: an Omarchy lock surface (or an offered/documented recovery path) lets the user authenticate. Actual: lockdead screen, panels off, Omarchy shell dead, no local unlock until hl.clear_crashed_lockscreen() is run from a TTY, DPMS is woken and the shell restarted.'
