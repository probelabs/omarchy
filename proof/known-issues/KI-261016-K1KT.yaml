id: KI-261016-K1KT
title: Lock display blanking leaves the video link unusable until a power cycle
description: |-
    After the lock blanks the display, input does not restore the picture; the video link remains unusable until the display or computer is power-cycled.

    Trigger: The lock's five-second idle blank dispatches display DPMS disable on an external display connection.

    Where: lock: shell/plugins/lock/Service.qml idleBlankTimer and blankProcess invoke omarchy-brightness-display off without a safe blanking path for a display link that fails to recover.

    Reported upstream in omacom/omarchy#12518 (https://github.com/omacom/omarchy/issues/12518). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
