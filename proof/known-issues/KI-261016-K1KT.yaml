candidate:
    draft_ref: 'R-323#lock-blank-video-link-no-recovery'
    reproducer_sketch: 'Reported on an Apple Studio Display over USB4, amdgpu Radeon 780M, Omarchy 4.0.4-1. Lock with Super+Ctrl+L, wait about ten seconds, then press a key or move the mouse. The panel stays black and amdgpu reports DPIA AUX failed; power-cycling the display or PC restores the picture.'
