title: Menu filter rejects printable keys carrying keypad or layout modifiers
description: |-
    A typed printable character such as '+' does not appear in the menu search field, preventing queries containing it.

    Trigger: Entering printable text with a keypad or layout modifier that the menu's no-modifier-or-Shift-only input gate rejects.

    Where: menu: shell/plugins/menu/Menu.qml printable-text branch in Keys.onPressed

    Reported upstream in omacom/omarchy#7629 (https://github.com/omacom/omarchy/issues/7629). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
