candidate:
    draft_ref: 'R-2221#menu-images-untrusted-decode'
    reproducer_sketch: 'Write an SVG document to a file named fake.jpg and run vipsthumbnail on it: a PNG is produced (loader chosen by content). Place such a file, or a large-dimension image, as a theme preview (the report plants it via aether --handle-url ''aether://apply?wallpaper=<url>&silent=true'' on 4.0.4-1) and run omarchy-menu-images --lazy-thumbnails on that theme directory: strace shows openat() on the planted preview and a thumbnail written to ~/.cache/omarchy/image-selector/. Expected: decode restricted to expected formats and resource-capped; actual: uncapped content-sniffed decode. The report''s 566MB / 4.75s figure was measured on ImageMagick in omarchy-bar-text-color, not on vipsthumbnail.'
