id: KI-261016-TC4V
title: Image picker thumbnails untrusted images through content-sniffed vipsthumbnail with no format allowlist or resource cap
description: |-
    omarchy-menu-images hands still images it thumbnails (theme previews and wallpapers, including files of web origin) to vipsthumbnail, which chooses its loader from the file content rather than the extension (an SVG named .jpg is loaded via rsvg), with no format allowlist and no memory or resource cap, so every loader libvips has compiled in parses the untrusted bytes.

    Trigger: The image picker generates a thumbnail for an image file whose content is untrusted, e.g. a theme preview or wallpaper imported from the web into a picker directory.

    Where: menu: bin/omarchy-menu-images generate_thumbnail() still-image lane -> vipsthumbnail (content-sniffed loaders such as svgload/rsvg, jp2kload, gifload); thumbnails cached in ~/.cache/omarchy/image-selector/

    Reported upstream in omacom/omarchy#14167 (https://github.com/omacom/omarchy/issues/14167). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
affected_requirements:
