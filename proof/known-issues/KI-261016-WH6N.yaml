id: KI-261016-WH6N
title: Lock shell dies requesting a lock surface on an output Hyprland removed, crash-looping through stranded recovery while the session stays locked
description: |-
    While a session lock is active, output removal during lock-surface creation terminates the shell's Wayland connection. The compositor retains the lock and shows its crashed-lockscreen fallback; shell relaunch and stranded-lock recovery can repeat, and unsuccessful recovery leaves no working password prompt.

    Trigger: A display output disappears while the shell is creating or maintaining session-lock surfaces, including output transitions during idle blanking or suspend/resume.

    Where: lock: shell/plugins/lock/Service.qml session-lock surface lifecycle and stranded-lock recovery, interacting with Quickshell WlSessionLock surfaces and the compositor's handling of surfaces requested for removed outputs.

    Reported upstream in omacom/omarchy#7478 (https://github.com/omacom/omarchy/issues/7478). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
