    reproducer_sketch: 'Lock the session and remove its output while locked: let the lock''s idle blank run on a display that drops its link, suspend/resume while locked, or with the session locked run hyprctl output create headless guard then hyprctl output destroy guard ~50ms later (the project bot''s worker-VM reproduction, no monitor needed). Expected: the lock screen holds or rebuilds its surface. Actual: ''Could not create EGL surface'' then ''The Wayland connection experienced a fatal error: Invalid argument'', shell exits 255, relaunches into ''lock-stranded: recovering'', looping; sometimes Hyprland''s crashed-lockscreen fallback needing TTY recovery.'
