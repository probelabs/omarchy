affected_api: 'shell/plugins/menu/Menu.qml evaluateGuards / guardProc (when:, checked:, disabled: guard batch)'
reproducer_command: ./pocs/47t8-guard-batch-no-deadline.sh
tripwire_mutation: 'In shell/plugins/menu/Menu.qml evaluateGuards(), `guardProc.command = ["bash", "-lc", script]` becomes `guardProc.command = ["timeout", "-k", "1", "2", "bash", "-lc", script]`: the blocked batch then exits (code 124) after about 2s, so the "still running with zero exits" assertion in pocs/47t8-guard-batch-no-deadline.sh fails, the pending evaluation starts a new batch (spawns become 3), guardsPending clears, and the tripwire flips red. A per-guard timeout in MenuModel.guardLine flips it the same way, since the harness runs the real MenuModel.js. A QML Timer-based watchdog is NOT observed by this node harness, which instantiates no QML Timer; such a fix needs the harness extended alongside it. The control arm is unaffected.'
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: 'Only guard freshness is affected: rows keep their last complete answers and actions still run what the row says. Removing or fixing the blocking guard expression in the user menu file and restarting the shell (or killing the stuck guard bash process) restores evaluation; the default menu ships no blocking guards.'
remediation: 'Give the guard batch a deadline: either wrap the child (e.g. `guardProc.command = ["timeout", "-k", "1", "2", "bash", "-lc", script]`) or a Process-side watchdog Timer that stops guardProc after a bound and re-arms the pending evaluation, or a per-guard timeout in MenuModel.guardLine so one slow guard cannot take the rest of the batch with it. Pair it with an explicit staleness policy for the answers of a killed batch. Then remove the SYS-REQ-260922-47T8 external_call_timeout_bounded deferral and add a witness. Close criterion: pocs/47t8-guard-batch-no-deadline.sh flips red because the blocked batch exits inside the observation window.'
