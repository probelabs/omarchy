tripwire_mutation: |-
    In shell/plugins/menu/Menu.qml evaluateGuards(), `guardProc.command = ["bash", "-lc", script]` becomes `guardProc.command = ["timeout", "-k", "1", "2", "bash", "-lc", script]`. The blocked batch then exits with code 124 after about 2s. The "still running with zero exits" assertion in pocs/47t8-guard-batch-no-deadline.sh fails, and the tripwire flips red. The pending evaluation starts a new batch (3 spawns), and guardsPending clears.

    A per-guard timeout in MenuModel.guardLine flips it the same way, because the harness runs the real MenuModel.js. The node harness creates no QML Timer, so it does not see a Timer-based watchdog. Such a fix needs a harness extension. The control arm does not change.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: The defect affects only guard freshness. Rows keep their last complete answers, and actions still run what the row shows. To restore evaluation, remove or fix the blocking guard expression in the user menu file, then restart the shell. Killing the stuck guard bash process also works. The default menu ships no blocking guards.
remediation: |-
    Give the guard batch a deadline. One option wraps the child, for example `guardProc.command = ["timeout", "-k", "1", "2", "bash", "-lc", script]`. Another option is a watchdog Timer that stops guardProc after a bound and re-arms the pending evaluation. A third option is a per-guard timeout in MenuModel.guardLine, so that one slow guard cannot stall the rest of the batch.

    Pair the fix with an explicit staleness policy for the answers of a killed batch. Then remove the SYS-REQ-260922-47T8 external_call_timeout_bounded deferral and add a witness. Close criterion: pocs/47t8-guard-batch-no-deadline.sh flips red, because the blocked batch exits inside the observation window.
