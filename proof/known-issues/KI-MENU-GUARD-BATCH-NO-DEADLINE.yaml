id: KI-MENU-GUARD-BATCH-NO-DEADLINE
title: Menu guard batch runs as one bash child with no deadline; a blocking guard expression freezes guard answers for the session
description: 'Menu.qml evaluateGuards() runs every when:, checked: and disabled: guard of the menu as one child process, `guardProc.command = ["bash", "-lc", script]`, and nothing puts a deadline on it. While guardProc.running is true, every later evaluateGuards() call only sets guardsPending and returns, so it is deferred until the batch exits. A single guard expression that blocks (waiting on a lock, a slow probe or a hung device query) therefore keeps the batch alive indefinitely. No later evaluation ever starts, and the menu keeps showing the last complete answer set for the rest of the session: rows checked, visible or dimmed for a state that no longer holds. A killed batch keeps the last complete set rather than adopting a half-read one, and a when: only hides on an explicit false, so the failure is stale-but-visible rather than hidden rows. pocs/47t8-guard-batch-no-deadline.sh reproduces it with the real evaluateGuards() and guardProc handlers extracted from Menu.qml and the real MenuModel.guardScript(). After a guard that waits on a held lock is added, the batch is still running at 4s with zero exits, a re-evaluation spawns nothing (guardsPending=true), and a row''s checked answer stays false after the state it describes has turned true. The control arm shows a healthy batch landing its answers and refreshing after a state flip.'
