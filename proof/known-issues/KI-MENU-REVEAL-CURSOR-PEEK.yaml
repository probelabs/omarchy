id: KI-MENU-REVEAL-CURSOR-PEEK
title: 'revealCursor loses the directional peek: an uninstantiated delegate skips it and the underhang write undoes it'
description: itemAtIndex returning null (delegate not built) aborts before any adjustment (anchor REV1). With a delegate, the overhang (down) and underhang (up) writes both run unconditionally. On a short viewport the second therefore undoes the first, and the cursor row parks flush with the viewport edge. That is the exact state the Contain comment forbids. positionViewAtIndex can also apply deferred contentY over the manual tweak.
