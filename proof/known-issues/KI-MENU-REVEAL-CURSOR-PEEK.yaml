minimization_status: candidate
mitigation: The lost peek only affects scroll anchoring at list edges; keyboard navigation still moves the selection correctly
remediation: carry travel direction into select()/revealCursor and apply only the matching side; force delegate instantiation (or compute from geometry) before adjusting
