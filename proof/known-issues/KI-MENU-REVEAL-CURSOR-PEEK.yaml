id: KI-MENU-REVEAL-CURSOR-PEEK
title: 'revealCursor loses the directional peek: an uninstantiated delegate skips the adjustment and the unconditional underhang write undoes the forward peek'
description: itemAtIndex returning null (delegate not built) aborts before any adjustment (anchor REV1); with a delegate, the overhang (down) and underhang (up) writes both run unconditionally, so on a short viewport the second undoes the first and the cursor row parks flush with the viewport edge - the exact state the Contain comment forbids; positionViewAtIndex can also apply deferred contentY over the manual tweak.
