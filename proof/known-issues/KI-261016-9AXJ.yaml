    reproducer_sketch: 'Show a layer-shell OSK (e.g. wvkbd), open the Omarchy menu with Super+Space (or omarchy menu summon / the bar icon), and tap OSK keys. Expected the menu stays open and OSK keystrokes type into the search filter like a physical keyboard; actual the first tap dismisses the menu and no text is entered. The report''s validated local fix (keyboardFocus OnDemand, ExclusionMode.Auto in Menu.qml) restores OSK typing.'
