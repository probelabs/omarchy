id: KI-261016-ESTF
title: 'Menu Bitwarden install aborts the package transaction: bitwarden-cli''s nodejs-lts-jod conflicts with an installed nodejs package'
description: |-
    The menu-launched Bitwarden install aborts the whole package transaction ("unresolvable package conflicts detected") and installs nothing: neither the Bitwarden desktop package nor bitwarden-cli lands, although the desktop package alone would install fine.

    Trigger: Install Bitwarden from the Omarchy menu while the repository nodejs package is already present, however it got there (a manual install, or an earlier menu install that depends on nodejs).

    Where: menu: default/omarchy/omarchy-menu.jsonc install.service.bitwarden action, which requests 'bitwarden bitwarden-cli' in one package transaction

    Reported upstream in omacom/omarchy#12726 (https://github.com/omacom/omarchy/issues/12726). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
