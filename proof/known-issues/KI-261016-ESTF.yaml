    reproducer_sketch: 'On a system where the nodejs package is installed (e.g. after Install > Editor > Zed, which depends on nodejs and npm), select Install > Service > Bitwarden and authenticate. Expected: the Bitwarden desktop package installs. Actual: pacman stops at ''nodejs-lts-jod-22.23.2-1 and nodejs-26.8.1-2 are in conflict. Remove nodejs? [y/N]'' and aborts with ''error: unresolvable package conflicts detected''; neither bitwarden nor bitwarden-cli is installed.'
