id: KI-261016-2Z87
title: Editable lock input eagerly reads whole clipboard offers with no byte bound, growing shell memory without a paste
description: |-
    Shell memory grows with the entire offered clipboard text even when no user pastes or types into the field.

    Trigger: Another application changes the Wayland clipboard to a large text offer while an editable shell TextInput exists.

    Where: Audited shell/plugins/lock/LockView.qml password input exposes QQuickTextInput::q_canPasteChanged synchronous whole-offer clipboard reads; unaudited shell TextFields also expose the same path.

    Reported upstream in omacom/omarchy#15083 (https://github.com/omacom/omarchy/issues/15083). This is a candidate: the defect is reported but not yet reproduced. No reproducer has been written or run for it yet.
