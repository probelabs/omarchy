id: KI-MENU-ISDESCENDANT-ROOT-ALWAYS
title: isDescendantOf reports every non-root id as a descendant of root, including ids absent from the menu
description: 'isDescendantOf walks parents and treats an unknown/missing parent chain as reaching root (F19: item ''missing-id'' with parent ''not-in-tree'' reports true). The search current-vs-drilldown partition therefore groups unknown routes under the root menu, and reveal logic inherits the wrong grouping.'
affected_requirements:
    - SW-REQ-260922-DQ9P
evidence_manifests:
    - pocs/menu-probes.js
    - pocs/menu-probes2.js
    - pocs/menu-probes3.js
    - proof/evidence/ki-menu-isdescendant-root-always.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: node pocs/menu-probes.js ../shell/plugins/menu/MenuModel.js
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Root is every real row's ancestor, so the always-true answer only misleads for ids that are absent from the menu entirely
remediation: return false when the walk cannot find the claimed ancestor through existing rows
