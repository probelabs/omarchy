id: KI-SLEEP-LOCK-BUDGET-ARG-OCTAL
title: argv budget with a leading zero (08/09) bypasses the validation guard via an octal arithmetic error
description: 'The argv budget guard (bin/omarchy-system-sleep-lock:45) matches ^[0-9]+$ then evaluates (( budget_ms < 1 )) in bash arithmetic, which reads a leading zero as octal. ''08''/''09'' raise ''value too great for base'', the guard compound goes false, and the script keeps the literal token as its budget. The deadline assignment at line 52 errors the same way, and every lock_ipc fails its remaining guard. The run ends in report_unsecured claiming ''within 08ms'' with no lock request issued. ''010'' is silently accepted as octal 8.'
affected_requirements:
    - SW-REQ-260912-FAWV
evidence_manifests:
    - proof/evidence/ki-sleep-lock-budget-arg-octal.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
reproducer_command: ./pocs/crs-260930-gzq0-c03.sh
introduced_in: inception
defect_class: latent
minimization_status: candidate
mitigation: Leading-zero budgets only arrive from hand-typed commands; keybinds and scripts pass plain decimal or no argument
remediation: Force decimal (10#) in the guard and deadline arithmetic, or reject any budget token bash cannot evaluate in base 10 with a usage error
