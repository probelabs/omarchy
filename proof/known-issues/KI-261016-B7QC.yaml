    reproducer_sketch: 'Reported setup: NVIDIA GTX 1080, dual DisplayPort, Quickshell 0.3.1, Qt 6.11.2, idle screensaver=150 / lock=300. Leave the session idle into lock. Expected: the screensaver hands off to a usable lock screen. Actual: lock-requested, lock-pending: screen-stabilizing, QWaylandGLContext::makeCurrent eglError 0x3003, Failed to create RHI, FATAL Failed to initialize graphics backend for OpenGL, seven SIGABRT cores, ''Giving up on the Omarchy shell after 6 relaunches''. Commenters see the same fatal on wake from a locked session and on output re-add with no lock; VRAM pressure is a disputed aggravator. A forced zero-output transition (disable the only monitor, reload) is a commenter''s fast reproducer.'
