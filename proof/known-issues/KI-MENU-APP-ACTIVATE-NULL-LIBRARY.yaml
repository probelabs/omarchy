id: KI-MENU-APP-ACTIVATE-NULL-LIBRARY
title: Activating an app row while appLibrary is null closes the menu and skips the launch
description: activateIndex sets opened=false before the launch guard. With appLibrary null at activation time (the code built the rows while it existed), the click only dismisses the menu. No launch, no reopen (SX26/C29).
