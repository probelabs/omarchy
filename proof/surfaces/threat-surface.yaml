      - {q: L2, tag: universal, answer: "resolve -> cache -> dispatch, one-way; no feedback into the Lua config"}
      - {q: L3, tag: universal, answer: "conservation: non-function dispatchers are byte-identical old-vs-new (differential witness); the branch adds, never rewrites"}
      - {q: L4, tag: universal, answer: "equivalence_contract v1 above, defined before the battery ran"}
