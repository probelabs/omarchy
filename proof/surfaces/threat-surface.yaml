surfaces:

  - id: menu-jsonc-config
    kind: parser
    disposition:
      status: reviewed
      ref: SW-REQ-261001-BNZG
      reason: >
        pr/13968 re-review (2026-10-01, quattro-proof 6fe078f2 + omacom/omarchy
        #13968 at ff77cd02 + the pending efa5170b). The PR replaces the two
        string-blind regex passes with one string-aware scanner and rejects an
        array root, which fixes KI-MENU-JSONC-COMMA-IN-STRING (#13250),
        KI-MENU-JSONC-ARRAY-ROOT (#13492) and KI-MENU-JSONC-INLINE-COMMENT
        (#13493). The rules are SW-REQ-260927-66FW (commas, look-ahead skips
        whitespace and // comments), SW-REQ-260928-BMFE (array root),
        SW-REQ-260928-C8W1 (comments, line break kept) and SW-REQ-261001-BNZG
        (input domain: any JS \s character outside strings is whitespace, a
        leading byte order mark is accepted, strings verbatim). Only
        KI-MENU-JSONC-STRIP-GAPS (block comments) stays open on this surface.
      reviewed_by: agent:claude-pr-13968
      reviewed_at: "2026-10-01T18:30:00Z"
    summary: >
      User-authored JSONC menu definitions (~/.config/omarchy/extensions/
      omarchy-menu.jsonc + shipped default) parsed by MenuModel.stripJsonc +
      parseMenuJsonc into the menu model. Under PR #13968 the stripper copies
      string contents verbatim, so action: command strings that omarchy-menu
      executes with the user's privileges are no longer rewritten (the upstream
      mutation mv f{.bak,} -> mv f{.bak} is gone). The input domain is any
      text; Unicode whitespace outside strings (incl. a byte order mark) is read
      as a space, so an editor-saved file no longer loses every row.
    entrypoints:
      - shell/plugins/menu/MenuModel.js (stripJsonc, parseMenuJsonc)
      - shell/plugins/menu/Menu.qml (FileView onLoaded delegates)
    error_posture: recover        # L1 — parse failure yields empty menu via 3T3F catch, never a crash
    boundaries: [strip, parse, model]   # L2 — one-way; model never re-serialized
    invariants:                   # L3
      - "the parsed model equals the declared entries for any text in the JSONC grammar (E4J2 with 66FW, C8W1, BNZG; string literals survive verbatim, incl. comma+closer, // and Unicode spaces)"
      - "invalid input degrades to an empty or skipped item set with no escaping exception (3T3F)"
    equivalence_contract:         # L4 — hard gate, defined before any relational oracle
      version: 1
      comparison_surface: "parsed menu model (ordered item list with label/action/aliases fields) for a fixed config byte stream"
      sanctioned_normalizations:
        - "insignificant whitespace and line formatting"
        - "object key ordering"
        - "// comments and trailing commas outside strings (JSONC syntax, not data)"
        - "Unicode whitespace outside strings (JS \\s, incl. a byte order mark) read as ASCII whitespace"
    oracle_families_armed:
      - valid-subset-survives / invalid-superset-degrades (L6) — menu-test.sh preservation block + node replay
      - metamorphic pairs (L7) — adding/removing full-line comments and legal trailing commas must not change the model (holds upstream, incl. comma -> comment line -> closer)
      - differential fuzz vs independent reference models (L5/L7) — 2000-case seeded documented-grammar property test plus a 3000-case seeded token-level differential with inline comments, comma+closer strings, array roots and all 19 non-ASCII \s characters, both in-suite and green on pr/13968; out of suite 200k-document Unicode differential vs c05d9019 (0 upstream-correct inputs parsed differently)
    oracle_families_blocked:
      - crash oracles — DEAD on a recovery-posture surface (L1)
      - live differential vs a second production parser — none exists (verified: no bin/ script parses the menu JSONC)
    candidate_vectors:
      - V-MENU-JSONC-INPUT
    ladder:
      - {q: L1,  tag: universal, answer: "recover: any parse failure -> empty menu (3T3F catch); crash oracles dead by posture. The dangerous mode is NOT a crash but silent success on mutated text - fixed by PR #13968 (66FW), formerly KI-MENU-JSONC-COMMA-IN-STRING"}
      - {q: L2,  tag: universal, answer: "strip -> parse -> model, one-way; no re-serialization cycle, so fixpoint/idempotence families do not arm"}
      - {q: L3,  tag: universal, answer: "conservation: string-literal characters are data and survive verbatim (66FW, C8W1, BNZG); invalid input never produces phantom success, and a top-level array yields no rows (BMFE; #13492 fixed by PR #13968)"}
      - {q: L4,  tag: universal, answer: "equivalence_contract v1 above; armed before the metamorphic/differential lanes ran"}
      - {q: L5,  tag: domain_parameterized, answer: "no second production implementation (verified bin/ tree); an INDEPENDENT reference scanner was written for the campaign's 20k-case differential fuzz instead"}
      - {q: L6,  tag: domain_parameterized, answer: "grammar: JSONC = JSON + // comments anywhere outside strings + trailing commas, over any text (Unicode whitespace outside strings is whitespace, BNZG). Remaining degradation edge: block comments (KI-MENU-JSONC-STRIP-GAPS). Fixed by PR #13968: inline comments (#13493), top-level arrays (#13492), comma+closer in strings (#13250)"}
      - {q: L7,  tag: domain_parameterized, answer: "metamorphic: comment, trailing-comma and Unicode-whitespace insertion outside strings preserves the model - holds on PR #13968 incl. comma -> comment -> closer (the #13512/#13681 regression shape) and a byte order mark before a leading comment (the ff77cd02 regression fixed by efa5170b)"}
      - {q: L8,  tag: na, na_reason: "parser is stateless per load; FileView reload re-runs the pure function; no object lifecycle"}
      - {q: L9,  tag: universal, answer: "governance: the three fixed KnownIssues keep their Reproduces-tagged tests as regression guards and their report scripts now exit 0 (test/node/report-reproducers.test.mjs); fix records DEFECT-260927-CMMA, -4NG9, -7AX9; the remaining edge KI-MENU-JSONC-STRIP-GAPS keeps its tripwire; intake gate is report intake + the claims lifecycle"}
      - {q: L10, tag: na, na_reason: "parsing is locale/tz/fs independent (pure byte scan + JSON.parse)"}
      - {q: L11, tag: domain_parameterized, answer: "resource bounds: configs are small operator-authored files; scanner is O(n) single pass; no depth recursion; no limits enforced or needed at this scale"}
      - {q: L12, tag: domain_parameterized, answer: "the rendered menu rows are user-visible and spec-regulated through the model requirements; pixel rendering is out of scope (no rendering oracle in the harness)"}

  - id: menu-action-dispatch
    kind: command-dispatch
    added: "2026-09-28 (upstream-sync 324f0ba5, agent:kimi-upstream-watch)"
    disposition:
      status: reviewed
      ref: CRS-0021
      reason: >
        Worked 2026-09-28 in this refresh: the in-process summon fast path
        (MenuModel.summonAction + Menu.qml runAction) is governed by new
        SW-REQ-260928-8VJQ with an exact bash-equivalence clause. Claims
        session CRS-0021 emitted 4 attack claims against the equivalence;
        all 4 dismissed with executed refutations (empty-payload upgrade
        unreachable+benign, refusal path shared-code, charset exclusion
        safe-direction, trailing-whitespace fallback executed). Vector
        V-MENU-SUMMON-DISPATCH exited closed-null.
      reviewed_by: agent:kimi-upstream-watch
      reviewed_at: "2026-09-28T08:20:00Z"
    summary: >
      Menu rows carry action: command strings that run with the user's full
      privileges on activation. The absorbed upstream change adds an
      in-process fast path: actions exactly matching 'omarchy-shell shell
      summon <id> ['<payload>']' bypass bash and call shell.summon directly.
      The danger class is MIS-DISPATCH: an action taking the fast path whose
      bash interpretation would differ (payload mutation, argument split,
      metacharacter reinterpretation).
    entrypoints:
      - shell/plugins/menu/MenuModel.js (summonAction, line 554)
      - shell/plugins/menu/Menu.qml (runAction fast path, line 146)
    error_posture: recover        # refusal (falsy summon) falls through to the unchanged bash path
    boundaries: [match, dispatch]  # one-way decision; no re-dispatch cycle
    invariants:
      - "fast path fires only on the strict summon grammar; everything else keeps the pre-existing bash path verbatim (8VJQ)"
      - "in-process argv equals bash argv for every matched string, including the '{}' payload default (bin/omarchy-shell:51)"
    equivalence_contract:
      version: 1
      comparison_surface: "argv delivered to shell.summon (plugin id + payload string) for a fixed action byte string"
      sanctioned_normalizations:
        - "absent payload defaults to '{}' on both paths"
    oracle_families_armed:
      - edge battery (L6) — 10/10 grammar cases + trailing-whitespace and empty-quotes probes, 2026-09-28
      - shared-handler convergence (L5) — bash/socket path terminates in the same shell.summon (shell.qml:1841)
      - shape assertion (L7 metamorphic anchor) — menu-test.sh regex pins runAction's fast-path/fall-through structure
    oracle_families_blocked:
      - live process differential — the two paths differ BY DESIGN in spawn mechanics; equivalence is defined on delivered argv, not on process trees
    candidate_vectors:
      - V-MENU-SUMMON-DISPATCH
    ladder:
      - {q: L1, tag: universal, answer: "recover: falsy summon falls through to execDetached; no crash path added"}
      - {q: L2, tag: universal, answer: "match -> dispatch, one-way; no feedback into the model"}
      - {q: L3, tag: universal, answer: "conservation: non-matching actions are byte-preserved into the bash path; the fast path never rewrites the action string"}
      - {q: L4, tag: universal, answer: "equivalence_contract v1 above, defined before the battery ran"}
      - {q: L5, tag: domain_parameterized, answer: "convergence oracle: both paths end in shell.summon, so post-entry behavior is shared code (shell.qml:1841 -> 1144)"}
      - {q: L6, tag: domain_parameterized, answer: "grammar battery: compound commands, substitutions, unbalanced quotes, empty/trailing-space payloads, foreign verbs - 10/10 + 2 probes take the expected path"}
      - {q: L7, tag: domain_parameterized, answer: "metamorphic: adding characters outside the grammar flips dispatch to bash and nowhere else"}
      - {q: L8, tag: na, na_reason: "dispatch decision is stateless per activation"}
      - {q: L9, tag: universal, answer: "governance: claims lifecycle CRS-0021 (4/4 dismissed with executed refutations); intake gate stands"}
      - {q: L10, tag: na, na_reason: "regex over a byte string; locale/tz/fs independent"}
      - {q: L11, tag: domain_parameterized, answer: "O(n) regex on short action strings; no resource surface"}
      - {q: L12, tag: domain_parameterized, answer: "dispatch outcome is plugin-visible (panel summoned or not); rendering out of scope"}

  - id: lock-wallpaper-poster
    kind: subprocess-pipeline
    added: "2026-09-28 (upstream-sync 324f0ba5, agent:kimi-upstream-watch)"
    disposition:
      status: reviewed
      reason: >
        Reviewed statically 2026-09-28: poster.sh runs ffmpegthumbnailer on the
        configured wallpaper under an flock with a 10s timeout and -k 1 5s
        exec timeout, writes to a temp file and mv -f atomically, prunes only
        other keys' posters, and every failure exit propagates to
        videoPosterPath='' (graceful still-image fallback in Service.qml).
        Input is the operator's own wallpaper path; no new privilege boundary
        crossed (same user, same file the lock already decodes). No claims
        session warranted: not a spec'd component change, covered here at
        surface level.
      reviewed_by: agent:kimi-upstream-watch
      reviewed_at: "2026-09-28T08:20:00Z"
    summary: >
      Lock screen video wallpapers now get a thumbnail poster via a new
      bash pipeline (poster.sh: stat signature -> sha256 cache key ->
      flock-serialized ffmpegthumbnailer -> atomic mv -> prune stale keys).
      Failure modes (missing ffmpegthumbnailer, timeout, un-readable source)
      all exit non-zero and degrade to the still-image lock.
    entrypoints:
      - shell/plugins/lock/poster.sh
      - shell/plugins/lock/Service.qml (posterProc, refreshPoster)
    error_posture: recover
    boundaries: [extract, cache, display]
    invariants:
      - "poster cache writes are atomic (temp + mv -f) and serialized (flock -w 10)"
      - "any pipeline failure yields videoPosterPath='' and the lock still draws its still background"
    equivalence_contract:
      version: 1
      comparison_surface: "poster file path emitted for a fixed (source path, size, mtime, ctime) signature"
      sanctioned_normalizations: ["cache location", "jpeg quality of the thumbnail"]
    oracle_families_armed:
      - failure-injection review (L6) — missing tool/timeout/empty output all traced to the graceful fallback
    oracle_families_blocked:
      - rendering oracles — no rendering oracle in this harness (documented dogfood debt)
    candidate_vectors: []
    ladder:
      - {q: L1, tag: universal, answer: "recover: non-zero exit -> empty poster -> still-image lock"}
      - {q: L2, tag: universal, answer: "extract -> cache -> display, one-way"}
      - {q: L3, tag: universal, answer: "cache key is content-addressed (path+size+mtime+ctime); a changed file gets a new key, never a stale poster"}
      - {q: L4, tag: universal, answer: "equivalence_contract v1 above"}
      - {q: L5, tag: na, na_reason: "single implementation; ffmpegthumbnailer is the system tool"}
      - {q: L6, tag: domain_parameterized, answer: "failure injection reviewed statically; runtime exercise needs the graphical lock, deferred as dogfood-harness debt"}
      - {q: L7, tag: na, na_reason: "no metamorphic pair identified for a thumbnail cache"}
      - {q: L8, tag: universal, answer: "lifecycle: refreshPoster re-runs when the source path changed under the process (sourcePath !== backgroundPath re-queue)"}
      - {q: L9, tag: universal, answer: "governance: surface-level review this refresh; runtime oracles remain dogfood-harness debt"}
      - {q: L10, tag: na, na_reason: "stat signature is locale-independent"}
      - {q: L11, tag: domain_parameterized, answer: "flock -w 10 and timeout -k 1 5 bound the subprocess; cache self-prunes to the current key"}
      - {q: L12, tag: na, na_reason: "pixel output out of harness scope"}

  - id: menu-keybindings-dispatch
    kind: command-dispatch
    added: "2026-09-28 (upstream-sync de63134b, agent:kimi-upstream-watch)"
    disposition:
      status: reviewed
      ref: CRS-0022
      reason: >
        Worked 2026-09-28 in this refresh: the bind_commands branch resolves
        Lua function binds (Hyprland reports them only as __lua) to the
        command helpers.lua registered for them. Claims session CRS-0022
        emitted 4 attack claims against the extension; all 4 dismissed, three
        by EXECUTION against the real merged sandbox chunk under luajit
        (registered bind resolves to exec omarchy-launch-terminal; old-vs-new
        differential shows exactly one row changed; nil dispatcher falls
        through without error), one by inspection (cache-key v14 bump makes
        pre-delta caches key-unreachable). No vector warranted: the Lua
        config is already fully trusted user code executing inside Hyprland,
        so the path crosses no trust boundary.
      reviewed_by: agent:kimi-upstream-watch
      reviewed_at: "2026-09-28T12:30:00Z"
    summary: >
      The keybindings menu re-executes the user's Lua config in a sandbox
      (stubbed hl, real helpers.lua) to render rows as
      modmask/description/key/kind/arg records; picking a row runs kind/arg.
      The delta adds a third resolution branch: function dispatchers
      registered in o.bind_commands (function-identity keys) resolve to
      kind=exec with the mapped command. Danger class is MIS-DISPATCH: a
      bind running a command other than the one its closure would run.
    entrypoints:
      - bin/omarchy-menu-keybindings (sandboxed hl.bind, lines 201-224)
      - default/hypr/helpers.lua (o.launch_terminal, o.bind_commands registration)
    error_posture: recover        # unresolved dispatchers render with empty kind/arg (no exec), as pre-delta
    boundaries: [resolve, cache, dispatch]  # one-way; records cache re-keyed by content + version
    invariants:
      - "bind_commands is keyed by function identity: two binds can never collide on the same key, so cross-bind command confusion is structurally impossible"
      - "the new branch fires only for dispatchers that previously fell through with empty kind (order after the table and string branches)"
      - "records caches are version-keyed (v14): pre-delta cache files are unreachable post-upgrade"
    equivalence_contract:
      version: 1
      comparison_surface: "records row (kind, arg) emitted for a fixed bind triple (keys, dispatcher, description)"
      sanctioned_normalizations:
        - "registered function binds that previously rendered kind='' now render kind=exec with the registered command (the intended fix)"
    oracle_families_armed:
      - differential execution (L5) — pre-delta sandbox (3-line deletion, diff-verified) vs merged sandbox over a 5-case corpus: exactly one row changed
      - edge battery (L6) — registered function / unregistered function / string / command_from table / nil dispatcher, all executed under luajit
      - negative control (L6) — nil-key read on o.bind_commands returns nil, sandbox rc=0 empty stderr
    oracle_families_blocked:
      - live compositor differential — Hyprland's own __lua reporting needs a running session (dogfood-harness debt, same class as menu-action-dispatch process oracles)
    candidate_vectors: []
    ladder:
