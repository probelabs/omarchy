title: Concurrent-summon abandoned-caller angle residual (upstream e332dc97 has no cancel-prior guard)
description: 'Theme residual delta for hazard classes concurrent+atomicity. Fix-sibling sweep 2026-09-25: the only isomorphic request/done-file site, shell/plugins/image-picker/ImagePicker.qml, ALREADY carries the same mitigation shape (openSelector finishes the prior doneFile before re-arming, :211; cancel()/closeSelector() finishDoneFile too) — no sibling fix needed. Reopen if the Phase-2 live harness reaches the resultProc busy-drop (promote to KI) or a new summon entry bypasses open(). REOPENED 2026-10-01 (quattro-clean): the provisional kill assumed the PR #9056 cancel-prior guard, which upstream e332dc97 does not carry. The engine-executed reproducer test/reports/report-cmulr95nw0kqr1gw46i7f50xj.sh (omacom/omarchy#9057) drives two real omarchy-menu-select callers through the real Menu.qml open/openDmenu/cancel bodies: the superseded caller never gets a done file and polls forever. That interleaving is KI-MENU-REQUEST-LIFECYCLE, not a residual.'
