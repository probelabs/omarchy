id: L-MENU-JSONC-001
title: JSONC grammar residency of upstream stripJsonc within the documented grammar
description: 'Clean-baseline re-disposition (2026-10-01, quattro-clean on upstream e332dc97). The previous record claimed the residual for the fork string-aware scanner (fix branches 0d93b9e7/f443c9e2/500b31bd); that code is not on this baseline and the old claim was wrong anyway - its fuzz never generated a comment between a trailing comma and its closer, the shape the fork scanner (and upstream PR #13512) breaks for 1,021 of 20,000 inputs. Upstream ships two string-blind regex passes (whole-line comments first, then trailing commas). Within the grammar docs/menu.md documents, upstream parses every input to its declared entries. Everything outside that grammar that upstream gets wrong is a KnownIssue, not part of this residual. Fix-sibling sweep: Menu.qml delegates to MenuModel.stripJsonc; no bin/ script parses menu JSONC. Reopen if a fix branch replaces the two-pass strip, or a new grammar edge class surfaces.'
status: closed
severity: low
kill_number: 0 divergences from an independent reference model in 20000 seeded fuzz cases of the documented grammar (review/fuzz-upstream-grammar.js against shell/plugins/menu/MenuModel.js at e332dc97; the fork e797ba5b scanner diverges on 8222 of the same inputs), pinned in-suite by a 2000-case seeded property test in test/node/menumodel-replay.test.mjs
kill_domain: 'Menu JSONC configs within the grammar docs/menu.md documents: object root, whole-line // comments (indented or not, LF or CRLF), trailing commas before } or ] (also across whole-line comments), string literals with JSON escapes that never carry a comma followed by optional whitespace and } or ]. Excluded and tracked as KnownIssues: comma+closer inside a string literal (KI-MENU-JSONC-COMMA-IN-STRING, #13250), top-level array root (KI-MENU-JSONC-ARRAY-ROOT, #13492), inline // comment tails (KI-MENU-JSONC-INLINE-COMMENT, #13493), block comments (KI-MENU-JSONC-STRIP-GAPS).'
sample_table:
    - pair: trailing_comma_outside_string
      notes: dropped-witnessed
    - pair: comma_then_whole_line_comment_then_closer
      notes: dropped-rows-preserved-witnessed-incl-shipped-extension-template
    - pair: commented_out_entry_after_last_entry
      notes: rows-preserved-witnessed
    - pair: comment_slashes_inside_string
      notes: preserved-verbatim-witnessed
    - pair: escaped_quote_then_slashes_inside_string
      notes: preserved-verbatim-witnessed
    - pair: crlf_comment_lines
      notes: stripped-witnessed
    - pair: plain_comma_inside_string
      notes: preserved-verbatim-witnessed
    - pair: comma_and_closer_inside_string
      notes: excluded-KI-MENU-JSONC-COMMA-IN-STRING
    - pair: top_level_array_root
      notes: excluded-KI-MENU-JSONC-ARRAY-ROOT
    - pair: inline_comment_tail
      notes: excluded-KI-MENU-JSONC-INLINE-COMMENT
kill_method: analytic (two regex passes, comment pass first) + preservation witnesses in menu-test.sh and menumodel-replay.test.mjs + seeded differential fuzz vs an independent reference model
