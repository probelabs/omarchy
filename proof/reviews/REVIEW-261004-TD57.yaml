comment: 'Read shell/plugins/emojis/EmojiSearch.js at upstream 393a43d4. filterEmojis walks the emojis once. A limit that is missing, null or not a number becomes 1000, a negative one becomes 0, and a limit of 0 returns an empty list at once. In the loop it skips an entry that is missing or has no emoji (its e field) before anything else. It then pushes the entry when the search text is empty or the lowercased keywords contain it; normalizedQuery trims and lowercases the search text and keywordText lowercases the k field. After each push it stops once the list holds the limit. So emoji_listed holds exactly when emoji_present, query_in_keywords and emoji_within_limit hold, where the room is counted in the order the loop sees the emojis. The four violation rows need the skip, the match test or the stop removed; they are dispositioned defensive. parseEmojis returns the parsed value only when it is an array and an empty list otherwise. The requirement leaves the order out: upstream lists matches in the order of emojis.json. Witnesses in test/shell.d/menu-emoji-picker-test.sh: matching emojis listed for a word, a padded capitalised and an empty search text and with the default limit; non-matching, emoji-less and over-limit entries not listed; parseEmojis on an array, an object and bad text.'
