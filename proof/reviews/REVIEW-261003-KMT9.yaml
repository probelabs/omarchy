comment: Re-review for the upstream commit 5582883a, the final revision. Its EmojiSearch.js differs from 241f3191 only in a comment line above isWordChar (the shipped keywords are English), so every cited line moves down by one and no behaviour changes; the upstream test only tightens names and fixtures. isWordChar counts digits, the apostrophes ' and U+2019 and every character with a case as part of a word; matchRank keeps the best place the search text shows; filterEmojis ranks into the whole-word, keyword-start and inside groups in file order, cuts at the limit and rounds a fractional limit up; parseEmojis and normalizedQuery are as stated. The description matches this, and the witness test (all sixteen emoji inputs, an oracle check of 34 listed states, direct checks of separators, quotes, apostrophes, accents, digits, a later whole word and the fractional limit) passes. The guarantee-violation row stays structurally unreachable.
