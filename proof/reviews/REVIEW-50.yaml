comment: Read finishRequest. Past the no-active-request guard, a selection is written shell-quoted to the selection file, the done file is created, and only then opened=false closes the menu — the write pair precedes the close, as the description states. finish_requested models the guarded main path (the early return is 3VTN's condition). Formula conforms to the code. Re-read on the PR #9056 mirror (head b7bd59c4, 2026-10-01): the write now starts through Quickshell.execDetached instead of the shared resultProc, and the resultProc.onExited re-close is gone; applyDmenuSelection already sets opened=false itself before it calls finishRequest, on the baseline and on b7bd59c4 alike, so the write-then-close order this requirement describes is unchanged in what callers observe (the done file appears after the selection file).
citations:
    - shell/plugins/menu/Menu.qml:130@finishRequest
