comment: 'Read default/omarchy/omarchy-menu.jsonc, bin/omarchy-theme-remove and shell/plugins/menu/MenuModel.js on the pr/new-C tree (quattro-proof 87c3ca68, the baseline KI commits 85b95ae3/7c45c642, plus upstream-style fix db375766). The remove.theme row now carries a when: that runs find "$HOME/.config/omarchy/themes" -mindepth 1 -maxdepth 1 -type d ! -xtype l ! -name ''.*'' -print -quit: the predicate omarchy-theme-remove lists its picker options with (bin/omarchy-theme-remove:8), less the dot-names it refuses (bin/omarchy-theme-remove:26). The guard batch (guardScript) answers it as remove.theme:w:0 when the directory is missing, empty, or holds only symlinks or dot-directories, and isVisible hides a row whose when: answered false, so with nothing removable the row is hidden. With a copied, cloned or worktree theme, or .git beside a real theme, the guard answers 1, the row shows, and the remover offers that theme; so remove_theme_row_shown equals remover_has_removable_theme once remove_menu_guards_applied. Both violation rows need the guard and the remover predicate to diverge: a shown row with nothing to remove (the a85e29ab row with no when:) and a hidden row with a theme to remove (a guard narrower than the remover); both are dispositioned defensive and the shown-side homes fail on the second. Before the batch answers, isVisible keeps the row (no-action row, witnessed in the mirror test). Witnesses in test/shell.d/menu-guards-test.sh parse the shipped row through parseMenuJsonc, run it through the generated guard batch (guardScript), and run the real remover with a stub picker over nine HOME shapes, counting only non-dot names as offered; they fail on a85e29ab.'
citations:
