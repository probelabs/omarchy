comment: 'Read default/omarchy/omarchy-menu.jsonc, bin/omarchy-theme-remove and shell/plugins/menu/MenuModel.js on the pr/new-C tree (quattro-proof 39746e65, the baseline KI commits 61a001d3/89990ddd, plus upstream-style fix 4859cd49). The remove.theme row now carries a when: that runs find "$HOME/.config/omarchy/themes" -mindepth 1 -maxdepth 1 -type d ! -xtype l ! -name '.*' -print -quit: the predicate omarchy-theme-remove lists its picker options with (bin/omarchy-theme-remove:8), less the dot-names it refuses (bin/omarchy-theme-remove:26). The guard batch (guardScript) answers it as remove.theme:w:0 when the directory is missing, empty, or holds only symlinks or dot-directories, and isVisible hides a row whose when: answered false, so remover_has_no_theme leads to remove_theme_row_hidden. With a copied, cloned or worktree theme the guard answers 1 and the row shows, and the remover asks the picker. The violation row (row shown, nothing to offer) needs the guard and the remover predicate to diverge, which is the a85e29ab row with no when:; it is dispositioned defensive. Witnesses in test/shell.d/menu-guards-test.sh parse the shipped row through parseMenuJsonc, run it through the generated guard batch (guardScript), and run the real remover with a stub picker over seven HOME shapes, counting only non-dot names as offered; they fail on a85e29ab.'
citations:
