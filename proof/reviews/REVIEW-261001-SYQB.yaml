decision: approved
comment: 'Read open() and finishRequest on the PR #9056 tree. The guard if (root.requestActive) root.finishRequest(null) runs first in open(), before the openDmenu/openRoute dispatch that overwrites or clears selectionFile/doneFile/requestActive. requestActive is set only by openDmenu as !!doneFile, so requestActive implies a done file and the guard antecedent is exactly menu_open_called & !no_active_request. finishRequest(null) passes its own no-active-request early return, captures the done-file path, clears state, and issues the done-only write (: > doneFile) through resultProc, which is prior_request_cancelled. The violation row (open called, request active, no cancel) needs the guard call removed, so it is dispositioned defensive. The guard-false path leaves state untouched. Out of the structural model: the write goes through the shared resultProc; a command change while resultProc is still running a previous write is tracked as the busy-resultProc leg (SX26/C14) of KI-MENU-REQUEST-LIFECYCLE and is not closed by this guard.'
citations:
