comment: Read panel.freezeCardTop and onShownChanged. setFilter and setActiveMenu call freezeCardTop while the card is shown, pinning cardTop to the centered top and maxRowsHeight to the current rows height; onShownChanged resets both to -1 when the surface unmaps on close. menu_interacted models the first interaction, card_top_frozen the pinned pair cleared by close. Formula conforms to the code.
