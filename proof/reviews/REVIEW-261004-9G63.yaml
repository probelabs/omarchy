comment: 'Re-review after the second independent review of the mirror (product 1f764b03 unchanged). The hyphen witness now discriminates: rex matched one emoji and passed at the base too, so its input is replaced by mail, where e-mail holds mail as a whole word only because a hyphen ends a word; the fix lists it first, the base listed the love letter (email) first. The one-letter case now checks the shown set: read from the description, every whole and every start match of e, then inside matches in file order, up to 1000; the harness set digest equals it and differs from the first 1000 matches in file order. Cases that print the same at the base are labelled as controls, and the snapshot counts are labelled as a snapshot of the shipped data. A mutant that applies the limit before the ranking, one without the curly apostrophe, and one that ends a word only at a space each fail the witness. The description and the guarantee-violation disposition are unchanged.'
