comment: Re-review for the revised upstream commit 241f3191. isWordChar counts digits, the apostrophes ' and U+2019, and every character that has a case as part of a word. So a space, an underscore, a hyphen, a colon, a curly quote and the end of the keywords end a word, while an accented letter or an apostrophe stays inside it (café, o’clock, woman’s); the description states this rule with these examples. matchRank, filterEmojis, the rounding of a fractional limit and the helpers are unchanged from REVIEW-261003-APYX. The witness oracle implements the stated rule and agrees with the harness on all 34 listed states; the witness checks curly quotes, an accented letter and both apostrophes on filterEmojis directly. With the ad8ecc2b rule put back (no apostrophe), the witness fails at the o step, where o’clock would hold o as a whole word. The guarantee-violation row stays structurally unreachable.
