comment: 'Read finishRequest on the PR #9056 tree at head b7bd59c4. After the no-active-request early return it captures activeSelectionFile and activeDoneFile, clears requestActive/selectionFile/doneFile, and hands the answer to Quickshell.execDetached in both branches (done-only for a cancel, printf to the selection file then the done file for a selection). execDetached starts a fresh detached process on every call and reads no state of an earlier one, so an answer issued while an earlier write still runs starts its own write at once: finish_requested & prior_answer_write_running gives answer_write_started_concurrently. The violation row (an answer while a write runs, and no write of its own) needs a shared Process back in place of execDetached, which is exactly the 0b4fe292 code where a start on a running Process was ignored; it is dispositioned defensive. Witnesses in test/shell.d/menu-test.sh run the real open/finishRequest/openDmenu/openExistingMenu/openRoute bodies under node vm with writes held in flight; the back-to-back witness fails on the 0b4fe292 Menu.qml (one write of three) and passes on b7bd59c4 (three writes, the second and third concurrent). Out of the structural model: whether Quickshell really starts every execDetached process (no fork failure) is a runtime property; the live 20-summon burst left 0 callers stuck on b7bd59c4.'
citations:
    - shell/plugins/menu/Menu.qml:130@finishRequest
    - shell/plugins/menu/Menu.qml:145
