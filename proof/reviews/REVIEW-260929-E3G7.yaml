comment: Read item() in Menu.qml. The accessor returns root.items[id] or null, so a present id yields its item and any other id yields null; the lookup always answers and never returns a dangling entry. item_requested models the caller by-id lookup, item_by_id_resolved the coherent answer. Formula conforms to the code.
