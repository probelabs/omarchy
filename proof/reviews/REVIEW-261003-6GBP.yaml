comment: 'Re-review for the upstream commit dbbfa62c, the final revision. matchRank now returns 0 (whole) for an empty search text itself, and filterEmojis calls it for every emoji; before, filterEmojis gave 0 for an empty search text without calling matchRank. Through filterEmojis the result is the same: with no search text every emoji goes to the whole-word group, the loop stops when that group holds the limit, and the picker lists emojis.json in file order up to 1000, the no-action row, which the witness checks against the file by its order digest (seq-emoji-empty). matchRank on its own no longer loops forever on an empty search text (indexOf of an empty string at the same place). isWordChar, the ranking, the cut at the limit, the rounding of a fractional limit and the helpers are as REVIEW-261003-KMT9 states, at lines that move down by two. The description matches; the witness test passes; the guarantee-violation row stays structurally unreachable.'
