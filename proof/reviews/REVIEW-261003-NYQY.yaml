comment: 'The formula says: when the search text is not empty, the picker lists its matches ranked. filterEmojis matches the description. It trims and lowercases the search text, wraps the keywords in spaces, and puts each match in the whole-word list when the search text has a space on each side, else in the keyword-start list when it follows a space, else in the inside list. It returns the three lists joined, cut at the limit, so each group keeps the file order. It stops early only when the whole-word list holds the limit, which only an empty search text reaches. With an empty search text every emoji goes to the whole-word list, so the picker lists emojis.json in file order up to 1000: the no-action row. The match test is the same as before, so the same emojis match; with more than 1000 matches, as for e, the shown 1000 come from the ranked list. The witness test asserts every emoji input and checks the full list of each step against an oracle written from the description. The guarantee-violation row is structurally unreachable: a non-empty search text has only the ranked path.'
