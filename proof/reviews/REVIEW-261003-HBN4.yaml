comment: 'Re-review for the revised upstream commit a1e56f38. isWordChar counts a to z, 0 to 9 and every character above U+007F as part of a word, so a space, an underscore, a hyphen, a colon or the end of the keywords ends one; a curly apostrophe or quote (above U+007F) does not, and the description says so. matchRank walks every place the search text shows and keeps the best group (0 whole, 1 start, 2 inside), stopping at a whole word; so a later whole word beats an earlier inside match, as the description says. filterEmojis puts each match in groups[rank] in file order and returns the three groups joined and cut at the limit; it stops early only when the whole group holds the limit, which only an empty search text reaches. Math.ceil rounds a fractional limit up, as the old loop did. parseEmojis, normalizedQuery and keywordText are unchanged. The witness test asserts all sixteen emoji inputs, checks every listed state against an oracle that implements the boundary rule with a regular expression, and checks the separators, digits, a later whole word and the fractional limit on filterEmojis directly. The guarantee-violation row stays structurally unreachable: a search text that is not empty has only the ranked path.'
