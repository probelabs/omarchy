comment: 'Read the delete flow at Menu.qml:841-875. requestDeleteSelected ignores invalid cursors and non-app rows, opens a confirmation naming the app (deleteTarget.label). cancelDelete closes the dialog, restores focus, removes nothing. confirmDelete closes the menu and removes via appLibrary.remove. delete_key_on_app -> uninstall_confirmed_flow matches: the key on an app row always leads to the confirmed/cancelled uninstall flow, never a direct delete.'
