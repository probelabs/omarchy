comment: 'Re-review for the revised upstream commit ad8ecc2b. isWordChar now counts digits and every character that has a case (toLowerCase differs from toUpperCase) as part of a word. So a space, an underscore, a hyphen, a colon, a curly quote or apostrophe and the end of the keywords end a word, while an accented letter such as é stays inside it; the description states exactly this rule and its examples (man: beard, red_haired_man, t-man, o’clock, café). matchRank, filterEmojis, the rounding of a fractional limit and the helpers are unchanged from REVIEW-261003-HBN4. The witness test''s oracle implements the stated rule (digit, or a character with a case) and agrees with the harness on all 34 listed states; it also checks curly quotes and an accented letter directly. With the a1e56f38 rule put back, the witness fails at the o step (o’clock) and the upstream test fails at its quotes case. The guarantee-violation row stays structurally unreachable.'
