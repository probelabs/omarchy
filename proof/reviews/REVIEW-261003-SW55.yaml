comment: 'Re-review after the three helpers of EmojiSearch.js joined the trace (the audit flagged them as code with no requirement once the file entered the scope). parseEmojis reads emojis.json and returns the parsed array, or an empty list when the text does not parse or is not an array; the description now says so, and the witness test checks the real file and three texts that are not arrays. normalizedQuery trims and lowercases the search text and keywordText lowercases the keywords: that is the ''trims the search text and ignores case'' clause. filterEmojis is unchanged from REVIEW-261003-NYQY: whole-word, keyword-start and inside lists in file order, joined and cut at the limit; it stops early only when the whole-word list holds the limit, which only an empty search text reaches. The guarantee-violation row stays structurally unreachable.'
