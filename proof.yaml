project:
    name: Omarchy Lock Dogfood
    purpose: External codebase audit
    scope: Incrementally model externally-owned source code, tests, and documentation before enforcing release gates.
    specs:
        - path: specs/stakeholder
          prefix: STK-REQ
          type: stakeholder
        - path: specs/system
          prefix: SYS-REQ
          type: system
          parent_spec: specs/stakeholder
        - path: specs/software
          prefix: SW-REQ
          type: subsystem
          parent_spec: specs/system
    id_format:
        pattern: '{prefix}-{date:YYMMDD}-{rand:4}'
        auto_increment: false
    default_assurance_level: C
    obligation_classes:
        - nominal
        - error_handling
        - malformed_input
        - boundary
        - empty_input
        - edge_case
        - concurrent
        - access_denied
        - determinism
        - idempotency
        - commutativity
        - monotonicity
        - totality
        - atomicity
        - invariant_preservation
        - nil_safety
        - overflow_safety
        - encoding_safety
    signals:
        defaults: auto
    evidence_classes:
        - example
        - boundary
        - malformed
        - property
        - fuzz
        - differential
        - review
        - formal
    verification_scope:
        include:
            - bin/omarchy-*lock*
            - shell/plugins/lock/**
            - test/shell.d/*lock*-test.sh
            - test/shell.d/apply-lock-test.sh
        completeness:
            production_include:
                - bin/omarchy-*lock*
                - shell/plugins/lock/**
            production_exclude:
                - '**/*_test.go'
                - '**/testdata/**'
                # Omitted production roots, intentionally out of the dogfood
                # universe (lock screen authentication component only):
                - test/**
                - migrations/**
                - install/**
                - default/**
                # shell/ is partially in scope (plugins/lock); exclude every
                # other shell sub-root so the root is fully dispositioned:
                - shell/Commons/**
                - shell/Ui/**
                - shell/services/**
                - shell/shell.qml
                - shell/README.md
                - shell/plugins/README.md
                - shell/plugins/agents/**
                - shell/plugins/background/**
                - shell/plugins/bar/**
                - shell/plugins/clipboard/**
                - shell/plugins/dev-gallery/**
                - shell/plugins/emojis/**
                - shell/plugins/image-picker/**
                - shell/plugins/menu/**
                - shell/plugins/notifications/**
                - shell/plugins/osd/**
                - shell/plugins/panels/**
                - shell/plugins/polkit/**
                - shell/plugins/reminders/**
                - shell/plugins/services/**
            rationale: Scoped to the omarchy lock screen authentication component for bash/qml dogfooding.
    commands:
        build: >-
            for f in bin/omarchy-apply-lock bin/omarchy-system-lock bin/omarchy-update-lock bin/omarchy-hyprland-session-locked bin/omarchy-system-sleep-lock; do /opt/homebrew/bin/bash -n "$f" || exit 1; done
        tests:
            lock-shell:
                language: bash
                command: >-
                    set -e; B=/opt/homebrew/bin/bash;
                    for t in apply-lock system-lock sleep-lock hyprland-session-locked lock-blank-fingerprint lock-fingerprint-indicator lock-password-overflow lock-stranded-recovery lock-missing-pam; do "$B" "test/shell.d/$t-test.sh"; done;
                    if command -v flock >/dev/null 2>&1 && [ -d /proc ]; then "$B" test/shell.d/update-lock-test.sh; else echo "SKIP update-lock-test.sh: requires Linux flock and /proc"; fi
    tools:
        probe:
            path: /Users/buger/go/src/probe-wt-bashqml/target/debug/probe
    lint:
        exclude:
            - .git/**
            - vendor/**
            - third_party/**
            - node_modules/**
            - dist/**
            - build/**
            - coverage/**
            - .proof/**
    checks:
        slow_tests:
            enabled: true
        code_mcdc:
            advisory: false
            min_statement_percent: 100
            min_decision_percent: 100
            min_condition_percent: 100
            targets:
                # Disabled: the harness never executes the shipped
                # omarchy-apply-lock (it writes /etc/pam.d and pins absolute
                # system paths; tests run patched fixture copies instead, which
                # instrumentation cannot credit), so no test command can ever
                # produce observations for this file. See dogfood report
                # Phase 6 per-file table.
                - id: lock-bash-apply
                  enabled: false
                  language: bash
                  scope: bin/omarchy-apply-lock
                  test_command: lock-shell
                - id: lock-bash-system
                  enabled: true
                  language: bash
                  scope: bin/omarchy-system-lock
                  test_command: lock-shell
                # Disabled on this platform: update-lock-test.sh requires Linux
                # flock + /proc and SKIPs elsewhere, so the measurement gets
                # zero observations on macOS. Re-enable on Linux CI.
                - id: lock-bash-update
                  enabled: false
                  language: bash
                  scope: bin/omarchy-update-lock
                  test_command: lock-shell
                - id: lock-bash-session
                  enabled: true
                  language: bash
                  scope: bin/omarchy-hyprland-session-locked
                  test_command: lock-shell
                - id: lock-bash-sleep
                  enabled: true
                  language: bash
                  scope: bin/omarchy-system-sleep-lock
                  test_command: lock-shell
                # Disabled: no QML test runner exists on this platform
                # (qmltestrunner/qml/qml6 all absent) and the project ships no
                # tst_*.qml harness. The analyzer inventory run (80 decisions
                # across 2 files in shell/plugins/lock) is recorded in the
                # dogfood report; re-enable when a QML test harness exists.
                - id: lock-qml
                  enabled: false
                  language: qml
                  scope: shell/plugins/lock
        property_fixtures_exist:
            enabled: true
        flip_fixtures_exist:
            enabled: true
        fixture_staleness_clean:
            enabled: true
        code_signal_obligations_reviewed:
            enabled: true
        code_signal_unbindable:
            enabled: true
        change_evidence_complete:
            enabled: true
        plan_of_record_current:
            enabled: true
        disabled:
            - documentation_coverage
    approval:
        agent_autonomous_for:
            all: true
    documentation:
        sources:
            - path: docs/
              type: manual
        threshold: 80
    trace_policy:
        mode: source_native
