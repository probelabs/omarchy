project:
    catalog:
        version: "1.11.0"
    name: Omarchy Lock Dogfood
    purpose: External codebase audit
    scope: Incrementally model externally-owned source code, tests, and documentation before enforcing release gates.
    specs:
        - path: specs/stakeholder
          prefix: STK-REQ
          type: stakeholder
        - path: specs/system
          prefix: SYS-REQ
          type: system
          parent_spec: specs/stakeholder
        - path: specs/software
          prefix: SW-REQ
          type: subsystem
          parent_spec: specs/system
    id_format:
        pattern: '{prefix}-{date:YYMMDD}-{rand:4}'
        auto_increment: false
    default_assurance_level: C
    obligation_classes:
        - nominal
        - error_handling
        - malformed_input
        - boundary
        - empty_input
        - edge_case
        - concurrent
        - access_denied
        - determinism
        - idempotency
        - commutativity
        - monotonicity
        - totality
        - atomicity
        - invariant_preservation
        - nil_safety
        - overflow_safety
        - encoding_safety
    signals:
        defaults: auto
    evidence_classes:
        - example
        - boundary
        - malformed
        - property
        - fuzz
        - differential
        - review
        - formal
    verification_scope:
        include:
            - bin/omarchy-*lock*
            - shell/plugins/lock/**
            - test/shell.d/*lock*-test.sh
            - test/shell.d/apply-lock-test.sh
            - bin/omarchy-menu*
            - shell/plugins/menu/**
            - default/omarchy/omarchy-menu.jsonc
            # Theme remover and its helper (Remove > Theme reads them through
            # its when: guard and action), and the app index the Apps menu
            # sorts (AppSearch.sortedEntries).
            - bin/omarchy-theme-remov*
            - shell/services/AppSearch.js
            # The emoji picker's search (the menu's Trigger > Emoji row opens
            # the picker, and bin/omarchy-menu-emoji-insert inserts its pick),
            # part of the menu component (SW-REQ-261004-JATY). The picker's
            # QML and its emoji data stay out. Its upstream test runs in
            # plugins-shell.
            - shell/plugins/emojis/EmojiSearch.js
            - test/shell.d/emojis-test.sh
            - test/shell.d/*menu*-test.sh
            - test/shell.d/keybindings-menu-test.sh
            # Node suites (menu-node, menu-reports): in scope so their
            # REQ:class:evidence tags reach the obligation corpus and join
            # the combined JUnit report (P3 observed obligation results).
            - test/node/**
            # Files the in-scope tests reach only indirectly. The engine
            # reads the scope literally (it does not follow `source`, the
            # suite runners or the harness), so a change to one of these
            # must count as in scope for review freshness:
            # - the menu-shell catch-all runs every menu-*-test.sh
            - test/shell.d/menu-*-test.sh
            # - sourced by every shell test, and the fixtures the lock and
            #   menu tests read
            - test/shell.d/base-test.sh
            - test/shell.d/fixtures/sudo-boundary-test.sh
            - test/shell.d/fixtures/lock-fingerprint-indicator/**
            - test/shell.d/fixtures/lock-password-overflow/**
            - test/shell.d/fixtures/owe-lock/**
            - test/shell.d/fixtures/tray-menu-activation/**
            # - JUnit writer, merger and the live-session runner (menu-live)
            - test/junit/*
            - test/junit/live-session.sh
            # - the behaviour-diff harness and its corpus
            - test/bdiff/*
            - test/bdiff/**
            # - the lock-qml runner
            - test/qml/lock/**
            # Not listed: test/reports/*.sh. The menu-reports suite runs them
            # through test/node/report-reproducers.test.mjs (in scope above),
            # so the JUnit report has no testcase per script. In scope, the
            # engine counts each traced script as a test of its own with no
            # observed outcome (test_outcome_unobserved on a change that
            # edits one).
        completeness:
            production_include:
                - bin/omarchy-*lock*
                - shell/plugins/lock/**
                - bin/omarchy-menu*
                - shell/plugins/menu/**
                - default/omarchy/omarchy-menu.jsonc
                - bin/omarchy-theme-remov*
                - shell/services/AppSearch.js
                - shell/plugins/emojis/EmojiSearch.js
            production_exclude:
                - '**/*_test.go'
                - '**/testdata/**'
                # Omitted production roots, intentionally out of the dogfood
                # universe (lock + menu components only):
                - pocs/**
                # review/ holds our audit research artifacts (PoCs, fuzz and
                # product-diff scripts), not product code.
                - review/**
                - test/**
                - migrations/**
                - install/**
                # default/ is in scope only for omarchy-menu.jsonc; exclude the
                # rest of the tree so the root is fully dispositioned:
                - default/omarchy/launcher.hides
                - default/agents/**
                - default/alacritty/**
                - default/applications/**
                - default/audio/**
                - default/bash/**
                - default/bashrc
                - default/chromium/**
                - default/environment.d/**
                - default/firefox/**
                - default/fontconfig/**
                - default/fonts/**
                - default/foot/**
                - default/ghostty/**
                - default/gpg/**
                - default/hypr/**
                - default/libalpm/**
                - default/limine/**
                - default/nautilus-python/**
                - default/pacman/**
                - default/plymouth/**
                - default/sddm/**
                - default/snapper/**
                - default/systemd/**
                - default/tensaku/**
                - default/themed/**
                - default/udev/**
                - default/uwsm/**
                - default/v4l2-relayd/**
                - default/voxtype/**
                - default/wayland-sessions/**
                - default/wireplumber/**
                - default/xcompose
                - default/xdg-terminal-exec/**
                # shell/ is partially in scope (plugins/lock); exclude every
                # other shell sub-root so the root is fully dispositioned:
                - shell/Commons/**
                - shell/Ui/**
                - shell/services/**
                - shell/shell.qml
                - shell/README.md
                - shell/plugins/README.md
                - shell/plugins/agents/**
                - shell/plugins/background/**
                - shell/plugins/bar/**
                - shell/plugins/clipboard/**
                - shell/plugins/dev-gallery/**
                - shell/plugins/emojis/**
                - shell/plugins/image-picker/**
                - shell/plugins/notifications/**
                - shell/plugins/osd/**
                - shell/plugins/panels/**
                - shell/plugins/polkit/**
                - shell/plugins/reminders/**
                - shell/plugins/services/**
            rationale: Scoped to the omarchy lock screen authentication and menu components for bash/qml dogfooding.
    commands:
        build: >-
            for f in bin/omarchy-apply-lock bin/omarchy-system-lock bin/omarchy-update-lock bin/omarchy-hyprland-session-locked bin/omarchy-system-sleep-lock bin/omarchy-menu bin/omarchy-menu-select bin/omarchy-menu-input bin/omarchy-menu-plugin bin/omarchy-menu-share bin/omarchy-menu-timezone bin/omarchy-menu-file bin/omarchy-menu-emoji-insert; do /usr/bin/bash -n "$f" || exit 1; done; node --check shell/plugins/menu/MenuModel.js
        # Every command records its results through test/junit/junit.sh into
        # ONE combined JUnit report, .proof/test-results/junit.xml
        # (project.checks.test_results below): one <testcase> per shell test
        # script (file="test/shell.d/<script>", <failure> + output excerpt on a
        # non-zero exit), node --test results via its junit reporter. A failing
        # script no longer stops its suite; junit_end still exits non-zero.
        tests:
            lock-shell:
                language: bash
                command: >-
                    set -e; B=/usr/bin/bash; . test/junit/junit.sh; junit_begin lock-shell;
                    for t in apply-lock system-lock sleep-lock hyprland-session-locked lock-blank-fingerprint lock-fingerprint-indicator lock-password-overflow lock-stranded-recovery lock-missing-pam; do junit_run "$B" "test/shell.d/$t-test.sh"; done;
                    if command -v flock >/dev/null 2>&1 && [ -d /proc ]; then junit_run "$B" test/shell.d/update-lock-test.sh; else junit_skip test/shell.d/update-lock-test.sh "requires Linux flock and /proc"; fi;
                    junit_end
            # menu-shell also runs every other test/shell.d/menu-*-test.sh,
            # so a menu test that a pull request adds runs in the audit of its
            # mirror without a proof.yaml change (mirrors never touch it).
            menu-shell:
                language: bash
                command: >-
                    set -e; B=/usr/bin/bash; . test/junit/junit.sh; junit_begin menu-shell;
                    for t in menu menu-pointer-lifecycle tray-menu menu-plugin menu-dispatcher menu-dmenu menu-timezone menu-share menu-guards; do junit_run "$B" "test/shell.d/$t-test.sh"; done;
                    if command -v flock >/dev/null 2>&1 && [ -d /proc ]; then junit_run "$B" test/shell.d/menu-images-test.sh; else junit_skip test/shell.d/menu-images-test.sh "requires Linux flock and /proc"; fi;
                    if command -v lua >/dev/null 2>&1; then junit_run "$B" test/shell.d/keybindings-menu-test.sh; else junit_skip test/shell.d/keybindings-menu-test.sh "requires lua"; fi;
                    if find /dev/null -printf '' >/dev/null 2>&1; then junit_run "$B" test/shell.d/menu-file-test.sh; else junit_skip test/shell.d/menu-file-test.sh "requires GNU find (-printf)"; fi;
                    for t in test/shell.d/menu-*-test.sh; do case "${t##*/}" in menu-test.sh|menu-pointer-lifecycle-test.sh|menu-plugin-test.sh|menu-dispatcher-test.sh|menu-dmenu-test.sh|menu-timezone-test.sh|menu-share-test.sh|menu-guards-test.sh|menu-images-test.sh|menu-file-test.sh|menu-compositor-test.sh|menu-acceptance-test.sh) ;; *) junit_run "$B" "$t" ;; esac; done;
                    junit_end
            # plugins-shell runs the emoji picker's upstream test
            # (test/shell.d/emojis-test.sh; the picker's search belongs to the
            # menu component, see the verification scope). It reads no host
            # setting: it passes unchanged under C, C.UTF-8, tr_TR, et_EE,
            # th_TH and ja_JP and another time zone (2026-10-04), so the
            # command pins nothing.
            plugins-shell:
                language: bash
                command: >-
                    set -e; B=/usr/bin/bash; . test/junit/junit.sh; junit_begin plugins-shell;
                    junit_run "$B" test/shell.d/emojis-test.sh;
                    junit_end
            menu-node:
                language: js
                command: >-
                    set -e; . test/junit/junit.sh; junit_begin menu-node;
                    node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$JUNIT_PART" test/node/menumodel-replay.test.mjs test/node/emojisearch-replay.test.mjs || junit_fail $?;
                    junit_end
            # Compositor-bound menu suites: the live Menu.qml interaction
            # test (real IPC summons + wtype key events against a running
            # quickshell) and the stakeholder acceptance test. Each script
            # runs in its own PRIVATE headless sway started by
            # test/junit/live-session.sh, which checks its prerequisites
            # first (sway, quickshell, wtype, socat, jq, python3): when one is
            # missing every script is a JUnit <skipped> naming it, never a
            # pass; once the session is up a script that still skips is a
            # failure (outcome not observed).
            menu-live:
                language: bash
                command: >-
                    /usr/bin/env bash test/junit/live-session.sh menu-live test/shell.d/menu-compositor-test.sh test/shell.d/menu-acceptance-test.sh
            # Issue-report reproducers (test/reports/, from the fork
            # report/<id> branches) as a regression net: expected failures
            # bound to their known issues, skipped only when a runtime the
            # script needs (Qt qml, perl, bash>=4) is absent.
            menu-reports:
                language: js
                command: >-
                    set -e; . test/junit/junit.sh; junit_begin menu-reports;
                    node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$JUNIT_PART" test/node/report-reproducers.test.mjs || junit_fail $?;
                    junit_end
            lock-qml:
                language: qml
                command: >-
                    set -e; . test/junit/junit.sh; junit_begin lock-qml;
                    junit_run bash test/qml/lock/run.sh;
                    junit_end
    lint:
        exclude:
            # Post-quattro upstream additions (herdr 03b825f5, tmux 3edf254a):
            # unmodeled menu entry points with no requirement coverage,
            # surfaced by the merged-main orphan detector. Parked as
            # pre-existing baseline debt, mirroring the parking on
            # audit/pr-9056-refresh (0eb84406).
            - bin/omarchy-menu-herdr-keybindings
            - bin/omarchy-menu-tmux-keybindings
            - .git/**
            - vendor/**
            - third_party/**
            - node_modules/**
            - dist/**
            - build/**
            - coverage/**
            - .proof/**
    checks:
        under_modeled_requirements:
            # Documented budget disposition (2026-09-28, agent
            # kimi-zero-warnings): all ten findings reviewed individually
            # against their matched code. The eight
            # requirement_under_modeled findings are deliberate
            # spec-summary style, not missing decomposition -- the spec
            # prose enumerates the behavior and the extra decisions are
            # mechanical dispatch inside one physical function:
            #   JRW1  guard view application     12 decisions / 2 vars = 6.0
            #   SJ7P  searchScore ranking tiers   9 / 2 = 4.5
            #   66FW  stripJsonc scanner states   9 / 3 = 3.0
            #   (66FW moved out 2026-10-01 with the fork JSONC fixes)
            #   4EWA/KRBH/QMWP picker verb filter 6 / 2 = 3.0
            #   MQ37/Y58B guard script building   6 / 2 = 3.0
            # The two family_under_modeled findings share the same gate
            # (a family is examined only when a member trips the
            # code-rich ratio): stripJsonc siblings 3T3F/46HY/E4J2 top
            # out at E4J2 13 / 2 = 6.5, the corpus maximum;
            # mergeProviderRows siblings EFNR/Z680 sit in the 3--6 band
            # (family clears at multiplier 6). All ten requirements are
            # witnessed green in the 298/298 code-level MC/DC campaign.
            # Multiplier raised 3 -> 8: truthful current maximum (6.5)
            # plus headroom, mirroring the proof_complexity_clean
            # disposition above. 7 would sit one decision above E4J2 and
            # re-fire on any single added guard branch. Revisit if a
            # requirement's ratio grows past 8 -- that is real new
            # behavior deserving decomposition, not a budget problem.
            code_rich_decision_multiplier: 8
        proof_complexity_clean:
            # Documented budget disposition (2026-09-28, agent
            # kimi-zero-warnings): specs/software/menu holds 111 variables
            # against the default max_variables budget of 100. The menu
            # component is one physical code unit (shell/plugins/menu +
            # bin/omarchy-menu*), so a proof-slice split would invent
            # component boundaries the code does not have. The budget's
            # purpose is solver-runtime predictability; measured solver
            # cost is far from the risk zone: realize specs/software/menu
            # 4.4s wall (per-slice <=93ms), specs/system/menu 0.8s, all
            # slices realizable with connected-component pruning. Budget
            # raised to the truthful current size plus headroom; revisit
            # if the plugin is ever split for real.
            # 128 -> 130 (2026-10-01): room for the consolidated JSONC requirements + the input-domain requirement.
            # 130 -> 140 (2026-10-03): the app library (shell/services/AppSearch.js) joined the menu scope with
            # SW-REQ-261003-C9GM (3 variables, 123 in specs/software/menu). PR mirrors add their own requirements
            # on top (up to 9 variables, #13968), so 130 left no room for them.
            max_variables: 140
        test_results:
            # P3 observed obligation results: tests_pass links this report and
            # writes its run record (<report>.run.json), which the evidence
            # assembler's currency check requires. Written by every test
            # command through test/junit/junit.sh (see project.commands.tests).
            auto_link: true
            report_path: .proof/test-results/junit.xml
            format: junit
            # Every command that writes part of the report. tests_pass runs
            # each of them in every audit path: the shared code-level MC/DC
            # run executes only the commands its targets bind, so without this
            # list menu-reports (the issue-report reproducers) never reached
            # the report in a full audit.
            commands: [lock-shell, menu-shell, plugins-shell, menu-live, menu-node, menu-reports, lock-qml]
        slow_tests:
            enabled: true
            # A <testcase> in the combined report is a WHOLE test script or
            # harness (test/junit/junit.sh), not one assertion: lock-qml drives
            # a headless sway + quickshell session (~100s on the loaded audit
            # box), sleep-lock-test.sh ~30s. The engine does not mark the
            # bash/qml shared code-level MC/DC run's timings as instrumented
            # (only go's), so the default 5s per-test budget would fail on
            # whole-suite durations. 300s flags a hung or runaway script.
            threshold_seconds: 300
        defect_review_current:
            # Scoped by the upstream_refresh_v1 campaign on
            # fix/jsonc-trailing-comma-in-strings (2026-09-27, agent
            # kimi-fix-jsonc-refresh): the defect-claim lifecycle governs
            # exactly the specs this campaign's delta touches — the new
            # 66FW comma decision and the two parse specs whose
            # implementation stripJsonc/parseMenuJsonc changed or was
            # re-reviewed (3T3F delta-touched prose, E4J2 pipeline owner).
            # All three ran full claims sessions (CRS-0017/0019/0020,
            # agent-review): 7 claims dismissed with refutations, 5
            # deferred as pre-existing baseline debt with PoC
            # (review/poc-parse-edges.mjs). The remaining no-stamp/stale
            # specs (incl. the 3 lock sessions CRS-0004/5/6 whose cells
            # were wiped) pre-date this campaign and are out of its
            # charter; severity info keeps that debt visible without
            # blocking the scoped gate. Widen this list as the
            # baseline-debt track clears more specs.
            # 2026-09-28 (upstream-sync 324f0ba5, agent
            # kimi-upstream-watch): + SW-REQ-260928-8VJQ, the guarantee
            # authored for the absorbed summonAction fast path.
            # 2026-09-28 (upstream-sync de63134b, agent
            # kimi-upstream-watch): + SW-REQ-260922-0W96, whose dispatch
            # mechanism the delta extended (bind_commands); claims
            # session CRS-0022, 4/4 dismissed with executed refutations
            # (luajit differential harness, real sandbox + helpers.lua).
            # 2026-10-01 (quattro-clean): SW-REQ-260927-66FW moved out
            # with the fork JSONC fixes (belongs to pr/13255).
            specs:
                - SW-REQ-260922-3T3F
                - SW-REQ-260922-E4J2
                - SW-REQ-260928-8VJQ
                - SW-REQ-260922-0W96
            severity: info
        code_mcdc:
            advisory: false
            min_statement_percent: 100
            # 2026-09-29: floors raised to the 100/100 requirement — every
            # enabled target must prove full MC/DC, no measured-baseline
            # pins below it. Audits run on the Linux box, where the
            # formerly mac-disabled Linux-capable targets are re-enabled;
            # targets whose harness cannot exist on any current platform
            # (quickshell-interactive paths, fixture-copy instrumentation
            # gap, QML-side execution) stay explicitly disabled with their
            # rationale inline.
            min_decision_percent: 100
            min_condition_percent: 100
            targets:
                # Disabled: the harness never executes the shipped
                # omarchy-apply-lock (it writes /etc/pam.d and pins absolute
                # system paths; tests run patched fixture copies instead, which
                # instrumentation cannot credit), so no test command can ever
                # produce observations for this file. See dogfood report
                # Phase 6 per-file table.
                - id: lock-bash-apply
                  enabled: false
                  language: bash
                  scope: bin/omarchy-apply-lock
                  test_command: lock-shell
                - id: lock-bash-system
                  enabled: true
                  language: bash
                  scope: bin/omarchy-system-lock
                  test_command: lock-shell
                  min_decision_percent: 100
                  min_condition_percent: 100
                # Disabled on this platform: update-lock-test.sh requires Linux
                # flock + /proc and SKIPs elsewhere, so the measurement gets
                # zero observations on macOS. Re-enable on Linux CI.
                - id: lock-bash-update
                  enabled: true
                  language: bash
                  scope: bin/omarchy-update-lock
                  test_command: lock-shell
                  min_decision_percent: 100
                  min_condition_percent: 100
                - id: lock-bash-session
                  enabled: true
                  language: bash
                  scope: bin/omarchy-hyprland-session-locked
                  test_command: lock-shell
                  min_decision_percent: 100
                  min_condition_percent: 100
                - id: lock-bash-sleep
                  enabled: true
                  language: bash
                  scope: bin/omarchy-system-sleep-lock
                  test_command: lock-shell
                  min_decision_percent: 100
                  min_condition_percent: 100
                # Enabled: test/qml/lock is a purpose-built harness that
                # drives LockView.qml + Service.qml under a private headless
                # sway (PanelWindow/WlrLayershell/WlSessionLock need a live
                # compositor), a private /etc/pam.d mount namespace for the
                # PAM branches, and PATH stubs for the process-driven branches.
                # The engine rewrites the plugin sources and harvests
                # __REQPROOF_MCDC__ markers from the harness stdout. Structural
                # residue (ext-session-lock secure/held coupling, quickshell
                # 0.3.1 signal quirks, spawn-resolution and stall limits) is
                # dispositioned via //mcdc:ignore in the two plugin files.
                # One target per file: the audit target-evidence association
                # exact-matches the target scope against the measured suite
                # packages, and the QML engine emits file-level packages.
                - id: lock-qml-view
                  enabled: true
                  language: qml
                  scope: shell/plugins/lock/LockView.qml
                  test_command: lock-qml
                  min_decision_percent: 100
                  min_condition_percent: 100
                - id: lock-qml-service
                  enabled: true
                  language: qml
                  scope: shell/plugins/lock/Service.qml
                  test_command: lock-qml
                  min_decision_percent: 100
                  min_condition_percent: 100
                # --- MENU system targets (menu dogfood Phase 4b) ---
                # Thresholds are measured baselines, not aspirations: they pin
                # the live MC/DC level the Phase 4 harness actually reaches so
                # any regression fails, and the real numbers are recorded in
                # the dogfood report Phase 4/6 tables. The global 100% floor
                # stays in force for the lock targets above, whose tests were
                # purpose-written for full MC/DC.
                - id: menu-js-menumodel
                  enabled: true
                  language: js
                  runner: node
                  scope: shell/plugins/menu
                  js_glob: MenuModel.js
                  test_command: menu-node
                  min_decision_percent: 100
                  min_condition_percent: 100
                # The emoji picker's search (menu component, SW-REQ-261004-JATY).
                # test/node/emojisearch-replay.test.mjs replays the JS bodies of
                # test/shell.d/emojis-test.sh and menu-emoji-picker-test.sh under
                # node:test, as menumodel-replay does for MenuModel.js, so the
                # engine instruments EmojiSearch.js through an ESM import.
                - id: menu-js-emojisearch
                  enabled: true
                  language: js
                  runner: node
                  scope: shell/plugins/emojis
                  js_glob: EmojiSearch.js
                  test_command: menu-node
                  min_decision_percent: 100
                  min_condition_percent: 100
                # menu-plugin-test.sh executes bin/omarchy-menu-plugin once per
                # verb — the only menu bash script with a live execution path
                # on this platform. Baseline measured 2026-09-22: 2/6
                # decisions fully covered (33.3%), 2/10 conditions proven
                # (20.0%).
                - id: menu-bash-plugin
                  enabled: true
                  language: bash
                  scope: bin/omarchy-menu-plugin
                  test_command: menu-shell
                  min_decision_percent: 100
                  min_condition_percent: 100
                # Disabled: the harness never executes the menu entry-point
                # scripts. menu-test.sh asserts them by source grep and by
                # replaying MenuModel.js under node (covered by
                # menu-js-menumodel); the omarchy-menu dispatcher and its
                # select/input/share/timezone/file subprocesses only run
                # inside a live quickshell Wayland session, and the Linux
                # audit box is headless (no compositor / WAYLAND_DISPLAY),
                # so no batch test command can produce observations. Same
                # disposition class as lock-bash-apply.
                - id: menu-bash-entry
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu
                  test_command: menu-shell
                - id: menu-bash-select
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-select
                  test_command: menu-shell
                - id: menu-bash-input
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-input
                  test_command: menu-shell
                - id: menu-bash-share
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-share
                  test_command: menu-shell
                - id: menu-bash-timezone
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-timezone
                  test_command: menu-shell
                - id: menu-bash-file
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-file
                  test_command: menu-shell
                # Enabled 2026-09-29: audits run on the Linux box (flock +
                # /proc present), where this target executes and measures.
                - id: menu-bash-images
                  enabled: true
                  language: bash
                  scope: bin/omarchy-menu-images
                  test_command: menu-shell
                  min_decision_percent: 100
                  min_condition_percent: 100
                # Enabled 2026-09-29: lua exists on the Linux audit box.
                - id: menu-bash-keybindings
                  enabled: true
                  language: bash
                  scope: bin/omarchy-menu-keybindings
                  test_command: menu-shell
                  min_decision_percent: 100
                  min_condition_percent: 100
                # Disabled (true blocker, 2026-09-29 feasibility spike): the
                # qml MC/DC engine itself works headless (synthetic project
                # 100/100 under qmltestrunner offscreen; lock plugin
                # harvested via quickshell offscreen + private headless sway
                # — see the lock-qml-view/service targets). Menu.qml cannot
                # be instantiated outside the production quickshell
                # plugin-loader: offscreen fails "No PanelWindow backend
                # loaded" (OverlayWindow :1146), and headless sway fails the
                # external WlrLayershell attach ("Could not create attached
                # properties object") or blocks the event loop after
                # mapping. ~158 decisions (Menu.qml + BarWidget.qml) stay
                # outside the executable gate; tracked upstream at
                # probelabs/reqproof issues for the headless harness recipe
                # and partial-scope support.
                - id: menu-qml
                  enabled: false
                  language: qml
                  scope: shell/plugins/menu
        property_fixtures_exist:
            enabled: true
        flip_fixtures_exist:
            enabled: true
        fixture_staleness_clean:
            enabled: true
        code_signal_obligations_reviewed:
            enabled: true
        code_signal_unbindable:
            enabled: true
        change_evidence_complete:
            enabled: true
        plan_of_record_current:
            enabled: true
        disabled:
            - documentation_coverage
    approval:
        agent_autonomous_for:
            all: true
    documentation:
        sources:
            - path: docs/
              type: manual
        threshold: 80
    trace_policy:
        mode: source_native
    review:
        authority: advisory
        # Behaviour-diff harness (`proof change behavior-diff`): runs at base and
        # head in throwaway worktrees over the same inputs; every output
        # difference is recorded. See test/bdiff/README.md. The command runs in
        # each revision's worktree, so the harness file comes from THAT
        # revision; a revision without test/bdiff/harness.mjs exits 127 (the
        # engine then records the run as unavailable, never as compatible).
        # OMARCHY_BDIFF_HARNESS=<absolute path> runs one fixed harness copy
        # against older revisions instead.
        behavior_diff:
            harness: 'h="${OMARCHY_BDIFF_HARNESS:-test/bdiff/harness.mjs}"; [ -f "$h" ] || { echo "behaviour-diff harness missing at this revision: $h" >&2; exit 127; }; exec node "$h" {rev} {input}'
            version: "v1"
            paths:
                - shell/plugins/menu/MenuModel.js
                - shell/plugins/menu/Menu.qml
            corpus:
                - default/omarchy/omarchy-menu.jsonc
                - config/omarchy/extensions/omarchy-menu.jsonc
                - pocs/reproducers/**/*.jsonc
                - test/bdiff/corpus/jsonc/*.jsonc
            input_extension: ".jsonc"
            timeout_seconds: 20
            partitions:
                # DATA: every JS \s char at start / per line, BOM, CRLF, CR,
                # empty, huge, invalid UTF-8 — of these three seeds (engine cap: 3).
                - name: data
                  kind: data
                  generator: builtin_data
                  corpus:
                      - default/omarchy/omarchy-menu.jsonc
                      - config/omarchy/extensions/omarchy-menu.jsonc
                      - test/bdiff/corpus/jsonc/u-issue-11211-1.jsonc
                # CORPUS: shipped menu, shipped sample extension, reproducer
                # fixtures, real user snippets from public issues / PRs.
                - name: corpus
                  kind: corpus
                # Every menu request-lifecycle sequence, run once.
                - name: lifecycle
                  kind: corpus
                  corpus:
                      - test/bdiff/corpus/lifecycle/*.events
                # SCALE: 8 concurrent harness runs per seed; the summon burst
                # itself (1, 2, 20 summons before an answer) is in the file.
                - name: scale
                  kind: scale
                  generator: scale
                  n: 8
                  corpus:
                      - test/bdiff/corpus/lifecycle/burst-*.events
                # TIMING: 8 harness runs staggered 2 ms apart per seed; the
                # interleavings (summons while an answer write runs) are in the file.
                - name: timing
                  kind: timing
                  n: 8
                  interval_ms: 2
                  corpus:
                      - test/bdiff/corpus/lifecycle/interleave-*.events
