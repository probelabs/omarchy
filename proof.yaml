project:
    name: Omarchy Lock Dogfood
    purpose: External codebase audit
    scope: Incrementally model externally-owned source code, tests, and documentation before enforcing release gates.
    specs:
        - path: specs/stakeholder
          prefix: STK-REQ
          type: stakeholder
        - path: specs/system
          prefix: SYS-REQ
          type: system
          parent_spec: specs/stakeholder
        - path: specs/software
          prefix: SW-REQ
          type: subsystem
          parent_spec: specs/system
    id_format:
        pattern: '{prefix}-{date:YYMMDD}-{rand:4}'
        auto_increment: false
    default_assurance_level: C
    obligation_classes:
        - nominal
        - error_handling
        - malformed_input
        - boundary
        - empty_input
        - edge_case
        - concurrent
        - access_denied
        - determinism
        - idempotency
        - commutativity
        - monotonicity
        - totality
        - atomicity
        - invariant_preservation
        - nil_safety
        - overflow_safety
        - encoding_safety
    signals:
        defaults: auto
    evidence_classes:
        - example
        - boundary
        - malformed
        - property
        - fuzz
        - differential
        - review
        - formal
    verification_scope:
        include:
            - bin/omarchy-*lock*
            - shell/plugins/lock/**
            - test/shell.d/*lock*-test.sh
            - test/shell.d/apply-lock-test.sh
            - bin/omarchy-menu*
            - shell/plugins/menu/**
            - default/omarchy/omarchy-menu.jsonc
            - test/shell.d/*menu*-test.sh
            - test/shell.d/keybindings-menu-test.sh
        completeness:
            production_include:
                - bin/omarchy-*lock*
                - shell/plugins/lock/**
                - bin/omarchy-menu*
                - shell/plugins/menu/**
                - default/omarchy/omarchy-menu.jsonc
            production_exclude:
                - '**/*_test.go'
                - '**/testdata/**'
                # Omitted production roots, intentionally out of the dogfood
                # universe (lock + menu components only):
                - test/**
                - migrations/**
                - install/**
                # default/ is in scope only for omarchy-menu.jsonc; exclude the
                # rest of the tree so the root is fully dispositioned:
                - default/omarchy/launcher.hides
                - default/agents/**
                - default/alacritty/**
                - default/applications/**
                - default/audio/**
                - default/bash/**
                - default/bashrc
                - default/chromium/**
                - default/environment.d/**
                - default/firefox/**
                - default/fontconfig/**
                - default/fonts/**
                - default/foot/**
                - default/ghostty/**
                - default/gpg/**
                - default/hypr/**
                - default/libalpm/**
                - default/limine/**
                - default/nautilus-python/**
                - default/pacman/**
                - default/plymouth/**
                - default/sddm/**
                - default/snapper/**
                - default/systemd/**
                - default/tensaku/**
                - default/themed/**
                - default/udev/**
                - default/uwsm/**
                - default/v4l2-relayd/**
                - default/voxtype/**
                - default/wayland-sessions/**
                - default/wireplumber/**
                - default/xcompose
                - default/xdg-terminal-exec/**
                # shell/ is partially in scope (plugins/lock); exclude every
                # other shell sub-root so the root is fully dispositioned:
                - shell/Commons/**
                - shell/Ui/**
                - shell/services/**
                - shell/shell.qml
                - shell/README.md
                - shell/plugins/README.md
                - shell/plugins/agents/**
                - shell/plugins/background/**
                - shell/plugins/bar/**
                - shell/plugins/clipboard/**
                - shell/plugins/dev-gallery/**
                - shell/plugins/emojis/**
                - shell/plugins/image-picker/**
                - shell/plugins/notifications/**
                - shell/plugins/osd/**
                - shell/plugins/panels/**
                - shell/plugins/polkit/**
                - shell/plugins/reminders/**
                - shell/plugins/services/**
            rationale: Scoped to the omarchy lock screen authentication and menu components for bash/qml dogfooding.
    commands:
        build: >-
            for f in bin/omarchy-apply-lock bin/omarchy-system-lock bin/omarchy-update-lock bin/omarchy-hyprland-session-locked bin/omarchy-system-sleep-lock bin/omarchy-menu bin/omarchy-menu-select bin/omarchy-menu-input bin/omarchy-menu-plugin bin/omarchy-menu-share bin/omarchy-menu-timezone bin/omarchy-menu-file bin/omarchy-menu-emoji-insert; do /usr/bin/bash -n "$f" || exit 1; done; node --check shell/plugins/menu/MenuModel.js
        tests:
            lock-shell:
                language: bash
                command: >-
                    set -e; B=/usr/bin/bash;
                    for t in apply-lock system-lock sleep-lock hyprland-session-locked lock-blank-fingerprint lock-fingerprint-indicator lock-password-overflow lock-stranded-recovery lock-missing-pam; do "$B" "test/shell.d/$t-test.sh"; done;
                    if command -v flock >/dev/null 2>&1 && [ -d /proc ]; then "$B" test/shell.d/update-lock-test.sh; else echo "SKIP update-lock-test.sh: requires Linux flock and /proc"; fi
            menu-shell:
                language: bash
                command: >-
                    set -e; B=/usr/bin/bash;
                    "$B" test/shell.d/menu-test.sh;
                    "$B" test/shell.d/tray-menu-test.sh;
                    "$B" test/shell.d/menu-plugin-test.sh;
                    "$B" test/shell.d/menu-dispatcher-test.sh;
                    "$B" test/shell.d/menu-dmenu-test.sh;
                    "$B" test/shell.d/menu-timezone-test.sh;
                    "$B" test/shell.d/menu-share-test.sh;
                    "$B" test/shell.d/menu-guards-test.sh;
                    if command -v flock >/dev/null 2>&1 && [ -d /proc ]; then "$B" test/shell.d/menu-images-test.sh; else echo "SKIP menu-images-test.sh: requires Linux flock and /proc"; fi;
                    if command -v lua >/dev/null 2>&1; then "$B" test/shell.d/keybindings-menu-test.sh; else echo "SKIP keybindings-menu-test.sh: requires lua"; fi;
                    if find /dev/null -printf '' >/dev/null 2>&1; then "$B" test/shell.d/menu-file-test.sh; else echo "SKIP menu-file-test.sh: requires GNU find (-printf)"; fi
            menu-node:
                language: js
                command: >-
                    node --test test/node/menumodel-replay.test.mjs
    lint:
        exclude:
            - .git/**
            - vendor/**
            - third_party/**
            - node_modules/**
            - dist/**
            - build/**
            - coverage/**
            - .proof/**
    checks:
        slow_tests:
            enabled: true
        defect_review_current:
            # Scoped by the upstream_refresh_v1 campaign (2026-09-25, branch
            # audit/pr-9056-refresh): the defect-claim lifecycle governs
            # exactly the menu specs this refresh reviewed (CRS-0017..0026,
            # all via agent-review with dispositioned claims). Lock-package
            # specs are out of campaign scope by charter, and the remaining
            # unreviewed menu backlog is pre-existing baseline debt from the
            # quattro dogfood wave — tracked in
            # review/pr-9056-research-delta.md, not this delta. Widen this
            # list as the baseline-debt track clears more specs.
            specs:
                - SW-REQ-260925-XTGG
                - SW-REQ-260922-Q6ZS
                - SW-REQ-260922-C8HX
                - SW-REQ-260922-3VTN
                - SW-REQ-260922-FGZQ
                - SW-REQ-260922-50RE
                - SW-REQ-260922-T257
                - SW-REQ-260922-DQ9P
                - SW-REQ-260922-E4J2
                - SW-REQ-260922-SJ7P
            # The only residual findings after CRS-0027..0031 are three
            # no-stamp lock-package sessions (EKJP/FAWV/J8SX from planned
            # CRS-0004/5/6, cells wiped) — lock is out of campaign scope by
            # charter and pre-dates this refresh. info keeps that debt
            # visible without blocking the menu-scoped step gate.
            severity: info
        code_mcdc:
            advisory: false
            min_statement_percent: 100
            # Global floors are the measured project aggregate, pinned
            # 2026-09-22 (35.3% decisions / 39.5% conditions across all
            # enabled targets). Every enabled target ALSO carries an explicit
            # per-target floor at its designed or measured level — the lock
            # targets keep their purpose-built 100% gates, the menu targets
            # pin their Phase-4b measured baselines — so a coverage drop in
            # any single target fails its own gate and a broad regression
            # fails this aggregate gate.
            min_decision_percent: 35
            min_condition_percent: 39
            targets:
                # Disabled: the harness never executes the shipped
                # omarchy-apply-lock (it writes /etc/pam.d and pins absolute
                # system paths; tests run patched fixture copies instead, which
                # instrumentation cannot credit), so no test command can ever
                # produce observations for this file. See dogfood report
                # Phase 6 per-file table.
                - id: lock-bash-apply
                  enabled: false
                  language: bash
                  scope: bin/omarchy-apply-lock
                  test_command: lock-shell
                - id: lock-bash-system
                  enabled: true
                  language: bash
                  scope: bin/omarchy-system-lock
                  test_command: lock-shell
                  min_decision_percent: 100
                  min_condition_percent: 100
                # Disabled on this platform: update-lock-test.sh requires Linux
                # flock + /proc and SKIPs elsewhere, so the measurement gets
                # zero observations on macOS. Re-enable on Linux CI.
                - id: lock-bash-update
                  enabled: false
                  language: bash
                  scope: bin/omarchy-update-lock
                  test_command: lock-shell
                - id: lock-bash-session
                  enabled: true
                  language: bash
                  scope: bin/omarchy-hyprland-session-locked
                  test_command: lock-shell
                  min_decision_percent: 100
                  min_condition_percent: 100
                - id: lock-bash-sleep
                  enabled: true
                  language: bash
                  scope: bin/omarchy-system-sleep-lock
                  test_command: lock-shell
                  min_decision_percent: 100
                  min_condition_percent: 100
                # Disabled: no QML test runner exists on this platform
                # (qmltestrunner/qml/qml6 all absent) and the project ships no
                # tst_*.qml harness. The analyzer inventory run (80 decisions
                # across 2 files in shell/plugins/lock) is recorded in the
                # dogfood report; re-enable when a QML test harness exists.
                - id: lock-qml
                  enabled: false
                  language: qml
                  scope: shell/plugins/lock
                # --- MENU system targets (menu dogfood Phase 4b) ---
                # Thresholds are measured baselines, not aspirations: they pin
                # the live MC/DC level the Phase 4 harness actually reaches so
                # any regression fails, and the real numbers are recorded in
                # the dogfood report Phase 4/6 tables. The global 100% floor
                # stays in force for the lock targets above, whose tests were
                # purpose-written for full MC/DC.
                - id: menu-js-menumodel
                  enabled: true
                  language: js
                  runner: node
                  scope: shell/plugins/menu
                  js_glob: MenuModel.js
                  test_command: menu-node
                  min_decision_percent: 33
                  min_condition_percent: 38
                # menu-plugin-test.sh executes bin/omarchy-menu-plugin once per
                # verb — the only menu bash script with a live execution path
                # on this platform. Baseline measured 2026-09-22: 2/6
                # decisions fully covered (33.3%), 2/10 conditions proven
                # (20.0%).
                - id: menu-bash-plugin
                  enabled: true
                  language: bash
                  scope: bin/omarchy-menu-plugin
                  test_command: menu-shell
                  min_decision_percent: 33
                  min_condition_percent: 20
                # Disabled: the harness never executes the menu entry-point
                # scripts. menu-test.sh asserts them by source grep and by
                # replaying MenuModel.js under node (covered by
                # menu-js-menumodel); the omarchy-menu dispatcher and its
                # select/input/share/timezone/file subprocesses only run
                # interactively inside quickshell, which does not exist on
                # this platform. Same disposition class as lock-bash-apply.
                - id: menu-bash-entry
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu
                  test_command: menu-shell
                - id: menu-bash-select
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-select
                  test_command: menu-shell
                - id: menu-bash-input
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-input
                  test_command: menu-shell
                - id: menu-bash-share
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-share
                  test_command: menu-shell
                - id: menu-bash-timezone
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-timezone
                  test_command: menu-shell
                - id: menu-bash-file
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-file
                  test_command: menu-shell
                # Disabled on this platform: menu-images-test.sh requires
                # Linux flock + /proc and SKIPs elsewhere, so the measurement
                # gets zero observations on macOS. Re-enable on Linux CI.
                - id: menu-bash-images
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-images
                  test_command: menu-shell
                # Disabled on this platform: keybindings-menu-test.sh requires
                # lua and SKIPs elsewhere, so the measurement gets zero
                # observations on macOS. Re-enable where lua exists.
                - id: menu-bash-keybindings
                  enabled: false
                  language: bash
                  scope: bin/omarchy-menu-keybindings
                  test_command: menu-shell
                # Disabled: first live QML-engine MC/DC attempt is recorded as
                # the menu dogfood milestone outcome — structural mismatch.
                # The qml engine instruments inline JS inside .qml files only
                # (MenuModel.js gets zero markers), and menu-test.sh
                # source-greps Menu.qml for exact JS patterns that probe
                # rewriting breaks, so the run harvests 0 observations. The
                # analyzer inventory (158 decisions across Menu.qml +
                # BarWidget.qml) is recorded in the dogfood report; re-enable
                # when a QML-side execution harness (qmltestrunner) exists.
                - id: menu-qml
                  enabled: false
                  language: qml
                  scope: shell/plugins/menu
        property_fixtures_exist:
            enabled: true
        flip_fixtures_exist:
            enabled: true
        fixture_staleness_clean:
            enabled: true
        code_signal_obligations_reviewed:
            enabled: true
        code_signal_unbindable:
            enabled: true
        change_evidence_complete:
            enabled: true
        plan_of_record_current:
            enabled: true
        disabled:
            - documentation_coverage
    approval:
        agent_autonomous_for:
            all: true
    documentation:
        sources:
            - path: docs/
              type: manual
        threshold: 80
    trace_policy:
        mode: source_native
