component: notifications
variables:
    - name: web_notification_received
      type: bool
      direction: input
      description: A Chromium-based browser sent a web notification, with the origin of the page before the message.
    - name: page_message_shown
      type: bool
      direction: output
      description: The card shows the message that the page sent, without the origin before it and with the first word of the message.
