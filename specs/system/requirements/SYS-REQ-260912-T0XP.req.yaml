id: SYS-REQ-260912-T0XP
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when user_lock_requested the lock_component shall eventually satisfy session_lock_engaged & keyboard_layout_default & screensaver_stopped
description: When the user locks the session, the system shall engage the session lock through the shell IPC. The system shall reset the keyboard layout to the default. The system shall stop the ttfx screensaver and wait for it to exit before closing its terminal. The system shall lock 1Password when it is running.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: STK-REQ-260912-XJ5D
component: lock
rationale: 'bin/omarchy-system-lock is the user-facing lock entry point. It delegates the lock to the Quickshell lock plugin and cleans up interactive session state. Nominal floor: this guarantee is the positive-path lock engagement. STK-REQ-260912-XJ5D AC-001 exercises it. This child carries the nominal obligation class for the stakeholder checklist.'
