    evidence: ""
    verified: false
parent: STK-REQ-260912-XJ5D
component: lock
rationale: Install and upgrade callers start this helper as root. A user-writable PATH entry or a PATH-resolved fprintd-list would run attacker-controlled code with root privileges.
