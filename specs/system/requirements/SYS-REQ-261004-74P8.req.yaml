id: SYS-REQ-261004-74P8
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when web_notification_received the notification_card shall immediately satisfy page_message_shown
description: A Chromium-based browser can send a web notification whose body starts with an origin link that the card recognises. Then the card removes that link and shows the whole message, from its first word. The card knows the browser by the app name or the app icon. It recognises a link to a plain host name such as web.whatsapp.com, whose last label has two or more letters. This requirement does not cover any other origin link. Such a link, for example to localhost, an IP address or a host name with non-ASCII letters, stays before the message.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: STK-REQ-261004-6HJ2
component: notifications
rationale: "Chromium starts the body of a web notification with the origin of the page. It sends the origin as a link when the notification server takes hyperlinks, and the notification server of the shell takes them. A real Chromium 148 sent the body as the origin link, a blank line and then the message (ME-261004-E1CR). The message can start with a web address or with a dotted word, such as Node.js. The card must keep that first word."
tags: []
variables:
    - web_notification_received
    - page_message_shown
