    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - nominal
            - edge_case
            - empty_input
          not_applicable:
            - boundary
            - input_domain
            - concurrency_scale
          rationale: 'nominal: a web notification from Chromium with the origin link shows the whole message without that link. edge_case: the message starts with a web address (with or without a scheme, or with www.) or with a dotted word such as Node.js or README.md; Brave, Chrome and Edge send the same form; an origin without a dot, an IP address or a non-ASCII host name stays. empty_input: an empty message leaves no body line on the card. boundary not applicable: no numeric limit or size threshold is involved. input_domain not applicable at this level: the forms of the link and of the body are stated on SW-REQ-261004-DHZ3. concurrency_scale not applicable: each card cleans its own body once, with no shared state.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
          rationale: 'determinism: the same app name, app icon and body give the same card text on every machine. The cleanup uses only regular expressions without the u flag, toLowerCase and string slicing, so the locale and the time zone do not change it (checked under C, C.UTF-8, en_US, tr_TR, et_EE and th_TH).'
        - category: structural
          disposition: not_applicable
          rationale: String replacement with fixed regular expressions on the body text that the D-Bus server hands to the card; no memory, numeric, format-string or encoding surface.
        - category: domain
          disposition: not_applicable
          rationale: The card shows text from a program of the same user on the session bus; no trust boundary, privilege, network call or credential is involved, and the cleanup removes text only.
interface:
    caller: chromium
    callee: notifications
    type: dbus
    signature: org.freedesktop.Notifications.Notify(app_name, replaces_id, app_icon, summary, body, actions, hints, expire_timeout) -> id
    protocol: D-Bus method call on the session bus. The shell's notification server lists body, body-markup and body-hyperlinks in GetCapabilities.
    assumptions: For a web notification, Chromium sends its own name (or the name of another Chromium-based browser) as app_name, and a body made of the origin link, a blank line and the message.
    guarantees: For a body that starts with an origin link the card recognises (a plain host name whose last label has two or more letters), the card drops that link and shows the whole message, from its first word. Any other origin link stays in the card.
    external_parties:
        - chromium
