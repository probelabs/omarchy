          rationale: 'determinism: the same pick answers the same payload - glyph stripping and key extraction are pure string functions of the chosen row; delivery order (exit code, answer file content) is fixed by the protocol, not by timing. idempotency: rewriting the answer file with the same pick converges; a second pick overwrites the first, which is the documented last-writer contract.'
        - category: structural
          disposition: not_applicable
          rationale: 'payload is a stripped string written to a file: no memory/pointer/format surface; encoding is preserved byte-wise by the shell write path, and the shape guard on the caller side is dispositioned under scenario.malformed_input.'
