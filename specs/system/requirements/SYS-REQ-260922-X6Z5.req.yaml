          rationale: 'Worst case graded above (peer death after summon hangs the synchronous caller - medium, tracked at the children under the KI). error_handling: cancellation reaches the caller as a clean no-selection (exit 1) rather than an error, so cancel is a protocol answer, not a failure; the answer file empty-vs-absent distinction is the no-selection contract. malformed_input: the picked value is delivered glyph-stripped with subtext preserved as the stable key, so decorative drift in labels cannot corrupt the payload; unknown/empty payloads are refused by the payload-shape child rather than passed through. boundary: single-select and multi-select modes answer through one delivery path so the caller needs no mode-specific wait logic. Catalog 1.11.0 re-review: input_domain applied, input_domain is on its obligation checklist and covered by SW-REQ-260922-Q6ZS (stdin lines as options). concurrency_scale applied, select and input prompts can be summoned while another request is active; the stranded-caller defect is KI-MENU-REQUEST-LIFECYCLE (omacom/omarchy#9057).'
