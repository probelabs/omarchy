          disposition: reviewed
          rationale: 'external_call_timeout_bounded evaluated: the wait-on-answer-file poll inside the dmenu flow is exactly the KI-MENU-SELECT-POLL-DEADLOCK mechanism, and it is deferred at the children that carry the poll (9ABD and Q6ZS under the KI, with reproducer); the parent adds no duplicate deferral - decomposition keeps the debt row where the fix will land, and obligation_decomposition stays honest because both children carry the class. cancel-as-answer means the protocol never relies on a timeout for its normal path. No trust boundary: the answer travels from the user own picker surface to their own script through a mode-600 file in the session tmpdir.'
