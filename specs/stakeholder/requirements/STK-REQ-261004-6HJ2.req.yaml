id: STK-REQ-261004-6HJ2
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: ""
description: |-
    Users see the notifications that applications and web pages send. The shell shows each notification as a card with its title and its message. It also keeps a history of them. For a web notification from a page on a named host, the card shows the message of the page. It does not show the address of the page that the browser adds before the message.

    One known exception stays open. A Chromium notification with no origin before the message can still lose a first word that looks like a web address (KI-NOTIFY-NO-ORIGIN-FIRST-WORD).
formalization_strategy: informal
informal_verification:
    method: ""
    evidence: ""
    verified: false
component: notifications
rationale: "A notification tells the user about a new message or event. A card that drops the start of a message gives the user wrong information. A card that repeats the address of the page adds noise to every web notification."
