rationale: 'Upstream PR omacom/omarchy#9031 (commits bc8f540d and aa732d0f, head aa732d0f) adds this guard at the top of openDmenu and openExistingMenu. finishDoneFile queues the done file of the displaced request, and releaseNextDoneFile writes it through releaseProc, a Process apart from resultProc. This fixes the re-summon leg of KI-MENU-REQUEST-LIFECYCLE (upstream #9057).'
