    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - concurrent
            - concurrency_scale
            - boundary
          not_applicable:
            - input_domain
          rationale: 'concurrent: a new summon or a regular menu can arrive while a picker request still waits; the guard answers the waiting request before the new one overwrites its fields. concurrency_scale: a burst of summons displaces one request after another; each displaced done file is queued and releaseProc writes them in order, one at a time (witnessed with three summons in a row). boundary: the same request summoned again (same done file) is not a displacement and is not answered. Worst case without the guard: the displaced caller polls its done file forever. input_domain not applicable: the guard reads only requestActive, doneFile and the incoming done file; payload parsing belongs to SW-REQ-260922-50RE.'
        - category: property
          disposition: reviewed
          applied:
            - atomicity
          rationale: 'atomicity: the displaced done file is captured and queued before openDmenu or openExistingMenu change any request field, so the answer always names the displaced request and never the new one.'
        - category: domain
          disposition: not_applicable
          rationale: No domain workload tags; the menu request protocol is a local QML plugin plus bash callers with no network, crypto or privilege surface.
        - category: structural
          disposition: not_applicable
          rationale: QML/JS (garbage collected) plus bash writing a constant-format truncation of a shell-quoted path; no manual memory, pointers or binary framing.
