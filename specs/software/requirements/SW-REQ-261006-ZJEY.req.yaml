fretish: when request_displaced the dmenu_protocol shall eventually satisfy displaced_request_answered
description: 'A new select or input request, or a regular menu, can replace a request that is still waiting. The menu then answers the waiting request as cancelled: it writes that request''s done file alone. The caller of the waiting request then exits and does not wait forever.'
formalization_strategy: fretish
