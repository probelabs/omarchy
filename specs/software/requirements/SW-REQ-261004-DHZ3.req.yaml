          rationale: 'edge_case: the message after the origin link starts with a bare host and path, a scheme URL, www., or a dotted word (Node.js, README.md); the message is plain text or has two lines; white space comes before the link; the app is Brave or Chrome by name, or Edge by icon; the app is not a browser (Slack, notify-send). empty_input: the message is empty or only white space, so the body is empty and the card shows no body line. input_domain: the link text is a host name with a dot (removed), or localhost, an IP address or a non-ASCII host name (kept); the body without a link starts with a plain-text origin or a web address, which the second replacement removes as before. boundary not applicable: no length or count limit. concurrency_scale not applicable: one pure call per card.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
            - totality
          rationale: 'determinism: sanitizeBody is a pure function of the body, the app name and the app icon; it uses regular expressions without the u flag, toLowerCase and string slicing, so no locale or time zone changes the result (the behaviour-diff inputs give the same output under C, C.UTF-8, en_US, tr_TR, et_EE and th_TH, and in three time zones). totality: every string body gives a defined result, including an empty body and a body that is only an origin link.'
        - category: structural
          disposition: not_applicable
          rationale: Two fixed regular-expression replacements and a string comparison on the body text; no memory, numeric, format-string or encoding transform. The body is already a JavaScript string when it reaches the card.
        - category: domain
          disposition: not_applicable
          rationale: Display text inside the shell only; no trust boundary, privilege, network call or process. The cleanup only removes a leading origin, and image tags go before it as for every body.
