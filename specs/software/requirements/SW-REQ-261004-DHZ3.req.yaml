id: SW-REQ-261004-DHZ3
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when chromium_sender & origin_link_at_start the notification_card shall immediately satisfy message_after_link_kept
description: |-
    For a notification from a Chromium-based browser, sanitizeBody removes the origin that the browser puts at the start of the body. The app name or the app icon must contain chrom, brave, vivaldi, microsoft-edge or opera; case does not matter. When the body starts with an origin link, sanitizeBody removes only that link, the white space before it and all the white space after it. It keeps the rest of the body, which is the message, with its first word. This holds also when the message starts with a web address or a dotted word, such as Node.js. White space that the message starts with goes with the link.

    A link is an origin link when its content is only a web address of one form. It can start with http://, https:// or www. Then come labels of ASCII letters, digits and hyphens, each followed by a dot, and a last label of two or more ASCII letters. A port and a path that holds no < or white space can follow. Any other link stays in the body, for example localhost, an IP address, foo.x1 or a link with markup inside.

    A body without an origin link loses a leading web address and the white space after it. That is the origin when the browser sends it as plain text. sanitizeBody removes image tags from every body first, and the card shows the result through styledBody.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-261004-74P8
component: notifications
rationale: |-
    Upstream omacom/omarchy quattro 393a43d4 has this defect, and so does 8e02fc84. In shell/plugins/notifications/NotificationLogic.js, sanitizeBody chains two replacements for a Chromium-based app. The first removes a leading origin link. The second removes a leading web address and the white space after it. The second replacement runs on what the first one leaves, and after the link that is the message.

    A real Chromium 148 sent the body as the origin link, a blank line and then the message (ME-261004-E1CR). So the message "github.com/omacom/omarchy can you review?" showed as "can you review?", and "Node.js 24 is out, upgrade today" showed as "24 is out, upgrade today".

    The fix returns the body as soon as the link replacement removed text. The plain-text replacement runs only when the body has no origin link. Chromium sends the origin either as a link or as plain text, never as both.

    The PR test test/shell.d/notifications-test.sh asserts both messages, but no audit test command runs it. The behaviour-diff harness runs the real NotificationLogic.js of each revision on the notification inputs, and test/bdiff/notifications-card-test.sh asserts the card lines it prints.

    This requirement does not change the body without an origin link. There the cleanup cannot tell a plain-text origin from a web address at the start of a message.
