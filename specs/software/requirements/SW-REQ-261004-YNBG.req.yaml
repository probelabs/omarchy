          rationale: 'Worst case: fingerprint authentication is installed without the resume recovery, so the reader stays wedged after the first suspend and every fingerprint unlock fails. error_handling: install is run under set -e before the stack is written, so a missing hook or drop-in source stops the helper with no fingerprint stack (witnessed: "failed recovery installation cannot create fingerprint PAM", once per source). boundary: the removal branch removes the hook always and the drop-in only when present, reloading systemd only then, so a chroot install without systemd does not fail. input_domain not applicable: fixed source and destination paths. concurrency_scale not applicable: one helper run writes a fixed set of files. edge_case covered by the boundary rows.'
        - category: property
          disposition: reviewed
          applied:
            - idempotency
          rationale: 'idempotency: install -D and systemctl daemon-reload give the same files when rerun.'
        - category: structural
          disposition: not_applicable
          rationale: install, rm and systemctl calls on fixed paths.
        - category: domain
          disposition: reviewed
          rationale: The hook runs as root from systemd-sleep on every resume and only enqueues a try-restart of fprintd.service; it reads no user input. The drop-in only sets TimeoutStopSec=3s. Both are installed root-owned with fixed modes (0755, 0644).
