id: SW-REQ-261004-YNBG
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when fingerprint_pam_installed the apply_lock shall always satisfy resume_recovery_installed
description: Before omarchy-apply-lock writes the PAM fingerprint stack, it shall install the fprintd resume hook (/usr/lib/systemd/system-sleep/fprintd-resume) and the fprintd stop-timeout drop-in, and reload systemd. When either install fails, the helper shall stop before it writes the stack. When it removes the stack for an empty enrollment, it shall also remove the resume hook, and the drop-in when present.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-JW2J
component: lock
rationale: "Suspend can wedge fprintd's device claim (libfprint/fprintd#173). Upstream #7158 restarts fprintd from a system-sleep hook after resume and caps its stop time with a drop-in, and installs both beside the PAM fingerprint stack so setup and upgrades cannot leave fingerprint authentication configured without its recovery. The empty-enrollment branch removes them again."
