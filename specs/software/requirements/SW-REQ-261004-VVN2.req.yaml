id: SW-REQ-261004-VVN2
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: the lock_view shall always satisfy key_press_dropped <=> (key_autorepeat & !key_erases)
description: The lock view's password field shall consume an auto-repeated key press without editing the text, except for Backspace and Delete. A key held while a blanked display wakes then cannot fill the field with one character.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-T0XP
component: lock
rationale: "Waking a DPMS-blanked display can stall the compositor for seconds while the monitor modesets. The release of the wake key then arrives late, and client-side key repeat floods the password field. Upstream #7806 (merged 00cee6d3) drops auto-repeated presses in the field. Holding Backspace or Delete to clear the field stays useful."
