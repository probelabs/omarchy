rationale: Draft for a human. SW-REQ-260912-WJYM requires taking the session lock once when the probe exits 0 and the service holds no lock, but it does not state that sessionLock.secure without sessionLock.locked is not a held lock. The implementation treats that pair as unreachable and returns from requestSessionLock.
