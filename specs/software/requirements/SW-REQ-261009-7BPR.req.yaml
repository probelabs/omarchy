description: When stranded-lock recovery has begun because the stranded-lock probe exited 0, password PAM is configured, and the service does not hold a session lock, the lock service shall take the session lock once even if sessionLock.secure is already true. A secure flag while sessionLock.locked is false is not a working lock and shall not make requestSessionLock return without taking the session lock.
