fretish: when json_invalid the menu_model shall eventually satisfy empty_item_set & !parse_error_raised
description: Unparseable input (after stripping), non-object JSON, and non-object entries yield an empty or skipped item set; no exception escapes the parser. Trailing-comma stripping is string-aware. It preserves commas inside string literals verbatim. It drops only a comma outside any string whose next non-whitespace character is } or ] (trailing_comma_dropped = !comma_in_string && next_char_closes_json).
