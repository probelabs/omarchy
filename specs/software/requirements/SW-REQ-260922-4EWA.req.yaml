          rationale: 'Worst case: the pick resolves to the wrong target - cut -f2 on a selection line whose id contains a tab or the row label itself contains a tab yields a truncated or shifted token, and for the remove verb that wrong token is passed to omarchy-plugin-remove, a destructive action on a plugin the user did not select. malformed_input: plugin ids are directory-derived and user-clonable, so odd identifiers are reachable input, and the unconditional field-2 cut is the declared parse policy. boundary: exactly-two-field lines are the well-formed case; one-field (missing tab) and three-plus-field lines are the edges where the cut silently mangles the id. edge_case: two plugins sharing a display name is the subject and is witnessed; the arguments are shell-quoted with printf %q at the terminal-launch sinks, so no injection chain composes onto the wrong-token case beyond the wrong-target removal graded here. Catalog 1.11.0 re-review: input_domain not applicable, plugin ids come from the installed plugin list, not from a parsed text file. concurrency_scale not applicable, one run per user action that owns its own temp files and shares no state with a concurrent run.'
        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: Every row the picker emits (Label<TAB>id) resolves through the same unconditional field-2 cut to a defined id string that the verb command receives; no selection shape leaves the pick unresolved or falls through to acting on a name.
        - category: structural
          disposition: not_applicable
          rationale: Bash string cutting and printf %q quoting; no arithmetic, memory, or encoding round-trip surface - the tab-delimited line is ASCII-structured and never re-encoded.
        - category: domain
          disposition: not_applicable
          rationale: Local picker over the installed-plugin inventory dispatching to local omarchy-plugin-* commands through a quoted terminal launch; no network, IPC-channel, crypto, or privilege-boundary surface, and no domain tag fires.
