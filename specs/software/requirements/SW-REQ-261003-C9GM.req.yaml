id: SW-REQ-261003-C9GM
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: the app_library shall always satisfy (app_listed <=> (app_displayable & query_terms_matched))
description: The app library lists an installed app exactly when the app is displayable and every query term matches it. An app is displayable when it has a name or an id, is not marked NoDisplay, and the library does not hide it. A term matches the name, id, generic name, comment or keywords, or its acronym when the term has five characters or fewer. An empty query matches every app. The Apps menu asks with an empty query.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-0M8A
component: menu
rationale: shell/services/AppSearch.js builds the list that AppLibrary.sortedEntries returns to the Apps menu and the launcher. This requirement states which apps the list holds, as the upstream code behaves. It does not state the order. The code ranks rows by fuzzyScore when there is a query, then by the lowercased name in code-unit order. KI-MENU-APPS-SORT-LOCALE records that this order puts accented names after z.
tags: []
variables:
    - app_displayable
    - query_terms_matched
    - app_listed
