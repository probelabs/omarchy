    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - boundary
            - edge_case
          not_applicable:
            - concurrency_scale
            - error_handling
          rationale: 'Worst case: an app the user can launch is missing from the Apps menu, or a NoDisplay or hidden entry shows. boundary: an empty query lists every displayable entry (fuzzyScore returns 0 before matching); a term of five characters matches the acronym, a longer term does not. edge_case: an entry with no name falls back to its id; with neither, sortedEntries drops it. concurrency_scale not applicable: one call per menu build over an in-memory list. error_handling not applicable: keywordText catches a non-array keywords value and the rest are pure string operations.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
            - idempotency
          rationale: 'determinism: for a given entry list, query and hidden callback, the returned set is fixed. idempotency: asking twice returns the same set; sortedEntries does not change its input.'
        - category: structural
          disposition: not_applicable
          rationale: GC'd JavaScript (the QML JS engine); no manual memory, binary framing or format strings.
        - category: domain
          disposition: not_applicable
          rationale: In-memory desktop-entry fields only; no network, crypto, secrets or privilege surface.
