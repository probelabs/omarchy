          rationale: 'Worst case: the picker shows an empty list for a linked media folder, or it fails after the user picked a file. boundary: a start point that is a link is followed, a link met below a start point is not (find -H, not -L). edge_case: a link loop below a followed root (witnessed: exit 0, the pick is returned); a start point that is a link to a regular file is listed as one file when its name matches a format (-H dereferences every start point). error_handling: a link to a missing target is rejected with Path not found and exit 1 before any listing ([[ -e ]] follows the link). Open, not covered by this requirement: an unreadable directory below a followed root makes find exit 1 while it still prints the readable rows, so under pipefail the picker can exit 1 after a pick; the same holds for a real-directory root at the base. input_domain not applicable: the requirement is about path arguments, not file contents. concurrency_scale not applicable: one run per user action, no shared state.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
            - totality
          rationale: 'determinism: the rows for a followed link root are the same files the target directory gives, in the same mtime order. totality: every path argument ends in the listing or in the Path not found rejection; a link loop below a root cannot end the run.'
        - category: structural
          disposition: not_applicable
          rationale: 'Bash over GNU find: the start points go into the argument array unchanged; no eval, no word splitting of file data.'
        - category: domain
          disposition: not_applicable
          rationale: 'Local filesystem reads only; no network, crypto, secrets or privilege surface.'
