id: SW-REQ-261002-FFTQ
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when symlink_root_given the file_picker shall eventually satisfy symlink_root_listed
description: The file picker follows each given path that is a symbolic link to a directory. It lists the matching files under the link target as for any other root. Inside a root the picker does not follow a symbolic link to a directory. A link loop below a root thus cannot make the listing fail.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-6642
component: menu
rationale: |-
    Upstream PR omacom/omarchy#13197 (head cc710e11, issue #12665) adds this behaviour to bin/omarchy-menu-file. By default GNU find does not follow a symbolic link that it gets as a start point. A picker over a linked ~/Videos thus offered no file, and omarchy transcode had nothing to pick.

    The PR runs find -H. With -H, find follows each start point that is a link and keeps each link inside a root as a link. With -L, find would follow every link, and a link loop would make find exit 1, which fails the picker under pipefail. SW-REQ-260922-HR29 still states format matching, dotfile pruning, order and missing-path rejection for every root.
tags: []
