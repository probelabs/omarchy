      reason: the marker is an empty file created by a single :> creat - there is no partial-write window to close, unlike the rows cache where write-temp-rename applies (and is owned by the sibling 43HQ/MH9B reviews); the thumbnail itself is published by mv, already atomic
      suppressed_by: human:Leonid Bugaev
