      framework_refs:
        - CWE CWE-362,CWE-367
        - NIST-800-53 SI-7
        - OWASP-ASVS-v4 V11.1.5
    - id: errors_propagated
      reason: generator failures are deliberately consumed by the xargs fan-out children (|| true) so one bad file cannot abort a batch; the .failed marker IS the propagation channel this req mandates - a converter refusal reaches the user as a withheld row, which is the documented observable, and a timeout deliberately propagates as retry-by-absence instead
      suppressed_by: human:Leonid Bugaev
      suppressed_at: "2026-09-30T08:02:59Z"
      framework_refs:
