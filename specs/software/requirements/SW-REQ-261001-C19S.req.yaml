    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - concurrent
          rationale: 'This is the mitigation for the concurrent-answer hazard: several summons arriving together each answer the request before them while the first answer write is still running. Worst case without it: a caller polls its done file forever because its answer was set on a busy shared Process and ignored. With one detached process per answer the writes run side by side; each targets its own caller-unique done file (omarchy-menu-select and omarchy-menu-input use mktemp paths), so concurrent writes cannot cross. Residual: a write process that fails to start (fork failure) is not observed or retried; the peer-death trigger (the shell dies after a summon) is outside this requirement and stays tracked on KI-MENU-REQUEST-LIFECYCLE.'
        - category: property
          disposition: reviewed
          applied:
            - atomicity
          rationale: finishRequest captures both file paths and clears requestActive/selectionFile/doneFile before it starts the write, so a later summon can never redirect an in-flight answer; the selection write orders printf to the selection file before the done-file truncation inside one bash command.
        - category: domain
          disposition: not_applicable
          rationale: No domain workload tags; the menu dmenu protocol is a local QML plugin plus bash scripts with no network, crypto, or privilege surface.
        - category: structural
          disposition: not_applicable
          rationale: QML/JS (GC'd) plus bash writing shell-quoted paths; no manual memory, pointers, or binary framing.
