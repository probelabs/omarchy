id: SW-REQ-261001-C19S
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when finish_requested & prior_answer_write_running the dmenu_protocol shall eventually satisfy answer_write_started_concurrently
description: 'The menu can issue an answer while the write for an earlier answer still runs. Several summons that arrive together cause this, because each summon cancels the request before it. The menu then starts a new write process for that answer at once, beside the running one. The menu never makes an answer wait for an earlier write, and it never drops an answer. Every caller thus gets its done file.'
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-X6Z5
component: menu
rationale: '@omarchybot pushed head b7bd59c4 of upstream PR omacom/omarchy#9056. That head replaces the shared resultProc Process in finishRequest with Quickshell.execDetached, one fresh process per answer. On the earlier head 0b4fe292 a burst of summons stranded callers. Each cancel set resultProc.command and running = true while the previous write still ran. Quickshell ignores that, so the answer never reached its done file.


    In a live burst of 20 concurrent omarchy-menu-select calls, 7-12 callers stayed stuck on 0b4fe292, 19 on quattro and 0 on b7bd59c4. This closes the busy-resultProc leg (SX26/C14) of KI-MENU-REQUEST-LIFECYCLE.'
