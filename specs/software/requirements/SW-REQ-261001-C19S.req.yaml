component: menu
rationale: 'Upstream PR omacom/omarchy#9056 head b7bd59c4 (pushed by @omarchybot) replaces the shared resultProc Process in finishRequest with Quickshell.execDetached, one fresh process per answer. On the earlier head 0b4fe292 a burst of summons stranded callers: each cancel set resultProc.command and running = true while the previous write was still running, which Quickshell ignores, so that answer was never written (live burst of 20 concurrent omarchy-menu-select: 7-12 of 20 callers stuck on 0b4fe292, 19 of 20 on quattro, 0 on b7bd59c4). This closes the busy-resultProc leg (SX26/C14) of KI-MENU-REQUEST-LIFECYCLE.'
