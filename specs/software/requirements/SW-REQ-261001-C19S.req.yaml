category: functional
req_type: guarantee
fretish: when finish_requested & prior_answer_write_running the dmenu_protocol shall eventually satisfy answer_write_started_concurrently
description: The menu can issue an answer (a cancel or a selection) while the write for an earlier answer is still running, for example when several summons arrive together and each one cancels the request before it. The menu then starts a new write process for that answer at once, beside the running one. No answer waits for, or is dropped behind, an earlier answer write, so every caller gets its done file.
formalization_strategy: fretish
