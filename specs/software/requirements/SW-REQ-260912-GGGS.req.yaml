          rationale: 'Worst case: a stuck Hyprland IPC call during a lid transition consumes the lock window before Quickshell begins securing the session, so the machine suspends unlocked. error_handling: the reconciliation helper is bounded at 0.4s with kill-after and its failure is absorbed, so a stalled IPC cannot consume the budget. edge_case: the lid transition that temporarily stalls Hyprland IPC is exactly the trigger condition, and the ordering requirement is what keeps it from pre-empting the lock request.'
