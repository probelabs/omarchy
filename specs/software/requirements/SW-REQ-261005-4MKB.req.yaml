fretish: when function_bind_picked the keybindings_menu shall eventually satisfy function_bind_called <=> (one_bind_matches_identity & !lua_state_reloaded)
description: A picked keybindings menu row for a Lua function bind calls the function through the registry ref Hyprland reports. The call happens only when one reported bind, and no other, matches the row and Hyprland did not reload its Lua state after the lookup.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-6642
component: menu
rationale: Upstream PR omacom/omarchy#11851 (head 03cbacb8) dispatches Lua function binds from the menu. Before it, such rows showed but ran nothing (KI-MENU-KEYBINDINGS-FUNC-BIND-NO-DISPATCH). The row keeps an encoded identity. A pick resolves the current ref from hyprctl binds and leaves a mark in the Lua registry. The call runs only while that mark is present.
