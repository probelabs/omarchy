    reviewed_against_catalog_version: 1.11.0
    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - malformed_input
            - boundary
            - concurrent
            - error_handling
            - input_domain
          not_applicable:
            - concurrency_scale
          rationale: 'malformed_input: a cached identity that does not decode, and a bind reported without a numeric ref, are refused and call nothing. boundary: two reported binds with the same identity are refused rather than guessed between; binds that differ only in submap or modifiers are told apart. concurrent: a reload between the lookup and the call clears the Lua registry, so the mark check refuses the call; an overlapping selection keeps the other selection mark. error_handling: a failed hyprctl binds or a refused mark stops the pick with exit 1 before any call. input_domain: the identity and the ref come from the menu cache and hyprctl binds, machine-written text whose malformed forms are the cases above. concurrency_scale not applicable: one pick dispatches at most one bind.'
        - category: property
          disposition: reviewed
          applied:
            - atomicity
            - determinism
          rationale: 'atomicity: the call and the mark removal happen in one Lua expression, after the mark check, so a pick either calls its bind once or calls nothing. determinism: the same cached identity and the same hyprctl binds output resolve to the same ref.'
        - category: domain
          disposition: not_applicable
          rationale: 'No new trust boundary: the menu runs a function the user already bound in their own Hyprland config, inside the user session, through the same hyprctl IPC the menu used before.'
        - category: structural
          disposition: not_applicable
          rationale: Bash, awk and Lua run inside Hyprland; the identity is base64 text, and the ref is a decimal checked by a regex before it is placed in the Lua expression. No manual memory, pointers or binary framing.
