rationale: 'Raised by omacom/omarchy#11411 (proof inbox R-655). The validation (report/cmulr8v3s0je91gw4wt4k3bat, rval-1de6fd92d7df97879d5e2230af3730de) reproduced the blank 5.0 s after the resume-time fire and the immediate blank in the 5-7 s window with the real Service.qml timer. SW-REQ-260912-ND55 specifies the re-arm, while its own rationale states the intent not to blank the freshly woken unlock screen: the requirement and its intent disagree. The reporter''s follow-up in the issue tested a 60 s blank interval on a Thunderbolt dock.'
