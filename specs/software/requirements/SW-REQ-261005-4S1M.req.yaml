description: 'OPEN DECISION (awaiting the Omarchy maintainers): after a resume from suspend, what shall the lock screen do with the displays? Current behaviour (upstream quattro 035ce29f): idleBlankTimer (Service.qml:730-748, interval 5000 ms) re-arms when wall-clock time shows the countdown froze through a suspend (Service.qml:739-742), so with no input the displays blank 5 s after the resume; a resume between 5 s and 7 s after arming takes neither branch and blanks at once. This is what SW-REQ-260912-ND55 says today. Options: (A) keep the current behaviour; (B) after a resume the displays shall stay lit until the next user input; (C) after a resume the displays shall stay lit for a grace period chosen by the maintainers, then blank. Separately: whether a resume 5-7 s after arming counts as a resume. Approving this draft means choosing one option; it then amends the suspend clause of SW-REQ-260912-ND55.'
