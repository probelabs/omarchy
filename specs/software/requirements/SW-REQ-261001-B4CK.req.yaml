fretish: when back_navigated & remembered_row_present the menu_navigation shall eventually satisfy remembered_row_selected
description: Drilling into a submenu records the parent menu, the selected index, and the selected row id. Back returns to the parent menu and puts the cursor on the remembered row when that row is still listed and selectable. Otherwise the cursor starts from the saved index and settles off disabled rows. A forward drill-in starts on the first row.
