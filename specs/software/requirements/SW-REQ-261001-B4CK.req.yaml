    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - boundary
            - edge_case
          rationale: 'boundary: the remembered row disabled or gone on return - the id loop skips non-selectable rows and the saved index is settled off disabled rows by rebuildDisplay, witnessed in menu-back-selection-test.sh. edge_case: a drill-in from a filtered search saves an index into the filtered list while Back clears the filter, so the fallback index can land on an unrelated parent row (pocs/pr13012-back-from-search.js reproduces it; the baseline started at row 0) - tracked as KI-MENU-BACK-FILTERED-INDEX. Provider-backed parents that load rows asynchronously follow the id only once at restore; later rebuilds keep the index. All consequences are cursor placement only, no action runs.'
        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: Every Back yields a defined cursor - the remembered row, the settled saved index, or row 0 for a forward drill-in; the navigation record shape change stays inside Menu.qml (navStack readers are setActiveMenu/goBack and the resets in openExistingMenu/openDmenu).
        - category: domain
          disposition: not_applicable
          rationale: Pure in-shell navigation state; no IPC, file, network, crypto, or privilege surface.
        - category: structural
          disposition: not_applicable
          rationale: Array concat/slice of small records plus integer indices; no manual memory, pointers, or binary framing.
