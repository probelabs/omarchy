    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - boundary
            - edge_case
            - concurrent
            - concurrency_scale
          not_applicable:
            - input_domain
          rationale: 'Worst case: rows served from cache describe image files that no longer exist or have changed - a user picks an entry whose target was deleted or renamed under a preserved mtime. The fast signature (dir path + dir mtime) gates reuse; a lost fast-signature file falls back to the per-image size:mtime full compare, which vouches for the same rows without a rebuild. boundary: missing rows cache, missing fast signature, empty image dir, and the v3->v4 schema bump are the tested partition edges. edge_case: an edit that preserves both size and mtime slips past both signatures - the honest residual of mtime-based coherence, graded low because the actor is the same user and the cost is a stale picker row, not a wrong write. concurrent: two selectors opening the same cache must not interleave a half-written rows file with its signature - rows and signatures publish together under the cache lock, and the concurrent-runs scenario is witnessed. Catalog 1.11.0 re-review: input_domain not applicable, it compares directory paths and mtimes, not file contents. concurrency_scale applied, the rows cache and signatures are shared state across invocations and concurrent opens.'
        - category: property
          disposition: reviewed
          applied:
            - idempotency
          rationale: A reuse run over unchanged dirs is observably identical to the previous run - same rows, no thumbnail regeneration, no signature rewrite; the vipsthumbnail-spy witness proves the second run performs no rebuild. Determinism of the signature string (fixed stat format, sorted find order) is what makes the cmp gate sound.
        - category: structural
          disposition: not_applicable
          rationale: Bash stat/cmp string building over trusted cache-path components; no arithmetic beyond line counts, no encoding transform, no memory surface. The one stat-race (file vanishing between find and stat) is dispositioned in the code as a bare continue with a tooling-limit record.
        - category: domain
          disposition: reviewed
          applied:
            - cache_version_coherent
          rationale: 'The rows cache is version-dependent data: the signature files carry explicit schema versions (v4 full, v3 fast) that the witness asserts on the first line, so a stale-schema cache cannot be served after the row format changes - the generation-gated lookup this class demands is implemented, not just claimed. Worst case it closes: an old-format cache left by a previous release silently parsed as new rows, mislabeling or mislaunching every image entry.'
