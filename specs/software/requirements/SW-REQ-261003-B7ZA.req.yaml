            - concurrency_scale
          rationale: 'Worst case: an app whose name starts with an accented or non-Latin letter shows after Z, so a user who scans the list by letter does not find it where it belongs. edge_case: precomposed accents (É, Ü), a decomposed accent (E plus a combining mark), non-Latin scripts, mixed case and two equal names; each case sorts by localeCompare and an equal pair keeps id order (witnessed). empty_input: an entry with no name gives the empty string, which sorts first as before. boundary not applicable: the comparator has no range or limit. input_domain not applicable: the names reach the comparator as decoded strings from DesktopEntries; it parses nothing. concurrency_scale not applicable: one synchronous sort on the GUI thread per rebuild.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
            - totality
          rationale: 'determinism: the same names and ids give the same order on every rebuild, whatever order DesktopEntries returns them in, because a tie on the name falls back to the id. totality: the comparator returns a defined result for every pair of rows, including equal names, empty names and names in any script.'
        - category: structural
          disposition: not_applicable
          rationale: One string comparison inside an array sort; no memory, numeric or encoding transform. The names are already decoded strings when they reach the comparator.
        - category: domain
          disposition: not_applicable
          rationale: Display order of rows inside the shell window only; no trust boundary, privilege, network, crypto or process surface.
