id: SW-REQ-261003-B7ZA
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when apps_rows_rebuilt the menu_view shall immediately satisfy apps_rows_in_letter_order
description: 'The Apps menu orders its rows by the collation of the user''s locale and ignores case. A name that starts with an accented Latin letter, such as Écrans or Übersetzer, sorts under its base letter. Names in other scripts sort where the collation puts them; for Greek, Cyrillic, Arabic and Han names that is after the Latin names. Two equal names keep their id order. Qt supplies the collation: under the C or C.UTF-8 locale it keeps code-point order.'
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-0M8A
component: menu
rationale: |-
    Upstream omacom/omarchy quattro a85e29ab has this defect. rebuildDisplay sorts the Apps rows with its own comparator, because DesktopEntries can reorder its values when an application starts. The comparator compares the lowercased names with < and >, that is by UTF-16 code unit. So every name that starts with a letter above U+007A goes after z.

    App names come from the Name of each desktop entry for the user's language. On a French desktop, Écrans and Éditeur de texte show after Zed and Zellij. A live run on the box with LANG=fr_FR.UTF-8 showed this order on a85e29ab.

    The fix compares the names with localeCompare, as the search sort in the same function already does. The fix keeps the tie-break on the id. The live run with the fix shows the two names under E.

    The node witnesses (test/shell.d/menu-apps-order-test.sh, the behaviour-diff harness and test/shell.d/menu-apps-order-bdiff-test.sh) run the comparator under the ICU collation of Node. They pin the comparator, not the collation of Qt.

    A real-shell run on the box covers Qt. Under fr_FR.UTF-8 the accented names move under their base letter. Under C.UTF-8 the order stays as on a85e29ab. Under en_US, names that start with a symbol, such as _Under, (beta) X or ~Tilde, now sort before digits and letters. This requirement accepts that change as part of the locale order.
