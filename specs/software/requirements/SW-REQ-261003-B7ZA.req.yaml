id: SW-REQ-261003-B7ZA
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when apps_rows_rebuilt the menu_view shall immediately satisfy apps_rows_in_letter_order
description: |-
    The Apps menu orders its rows by the collation of the locale and ignores case. A name that starts with an accented Latin letter, such as Écrans or Übersetzer, sorts under its base letter. Names in other scripts sort where the collation of the locale puts them. In the Apps menu, two equal names keep their id order.

    Under ru_RU, el_GR or zh_CN the script of that language comes first, before the Latin names. Under en_US or fr_FR other scripts come after the Latin names. Qt supplies the collation. Under C or C.UTF-8 it keeps code-point order.

    AppSearch.sortedEntries, which gives the same list to plugins, uses the same comparison. There, two different names that collate equal, such as a composed and a decomposed É, keep a fixed order. Identical names keep their input order, as before.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-0M8A
component: menu
rationale: |-
    Upstream omacom/omarchy quattro a85e29ab has this defect. rebuildDisplay sorts the Apps rows with its own comparator, because DesktopEntries can reorder its values when an application starts. The comparator compares the lowercased names with < and >, that is by UTF-16 code unit. So every name that starts with a letter above U+007A goes after z.

    App names come from the Name of each desktop entry for the user's language. On a French desktop, Écrans and Éditeur de texte show after Zed. A check in the real shell with LANG=fr_FR.UTF-8 showed this order on a85e29ab.

    The fix compares the names with localeCompare, as the search sort in the same function already does. The fix keeps the tie-break on the id. With the fix, the real shell shows the two names under E.

    AppSearch.sortedEntries, which gives the same list to plugins, now uses localeCompare too. It keeps the old < and > comparison as the tie-break. So two different names that collate equal, such as a composed and a decomposed É, keep one order. Two identical names keep their input order, as on a85e29ab; sortedEntries has no id tie-break.

    The node witnesses (test/shell.d/menu-apps-order-test.sh, the behaviour-diff harness and test/shell.d/menu-apps-order-bdiff-test.sh) run the comparator under the ICU collation of Node. They pin the comparator, not the collation of Qt.

    Checks in the real shell cover Qt. Under fr_FR.UTF-8 the accented names move under their base letter. Under ru_RU, el_GR and zh_CN the script of the language now comes first; on a85e29ab it came after Z. Under en_US and fr_FR other scripts still follow the Latin names. Under C.UTF-8 the order stays as on a85e29ab.

    Under en_US, names that start with a symbol, such as _Under, (beta) X or ~Tilde, now sort before digits and letters. This requirement accepts these changes as the order of the locale.
tags: []
variables:
    - apps_rows_rebuilt
    - apps_rows_in_letter_order
