description: 'OPEN DECISION (awaiting the Omarchy maintainers): what shall the password field show after a failed attempt? Current behaviour (upstream quattro 035ce29f): handlePasswordFailure sets failureMessage ''Authentication failed (N)'' (Service.qml:346-355); with an empty field the overlay text shows that message instead of the ''Enter Password'' placeholder (LockView.qml:225), the text cursor is hidden (LockView.qml:42, :188) and the border uses the error colour (LockView.qml:43); the field still accepts typing and the first character clears the message (LockView.qml:195-201). Options: (A) keep the current behaviour; (B) the lock view shall show the failure message and the password prompt together; (C) the lock view shall show the failure message for a time chosen by the maintainers, then the prompt again; (D) the failure message shall appear outside the field. Approving this draft means choosing one option; its text then replaces this description.'
