    evidence: ""
    verified: false
component: menu
rationale: Draft for a human. SW-REQ-260922-B839 mandates omarchy-menu-select's usage diagnostic and exit 1 when no options are given from arguments or stdin, and the empty piped list satisfies it at that layer; SW-REQ-260922-HR29 states only omarchy-menu-file's listing shape and a nonexistent-path rejection. No approved requirement states the caller-level empty-list outcome, so omarchy transcode leaks the helper's internal usage string and the menu's Transcode entry is a silent no-op (R-1777 / omacom/omarchy#7114). A person should approve this requirement rather than leave the gap unstated.
