description: When omarchy-menu-file's paths contain no file matching the requested formats, the user shall be told there is nothing to pick — a message naming the searched paths, such as a 'No files found' desktop notification — instead of piping an empty option list into omarchy-menu-select. omarchy menu select's usage diagnostic shall never surface as the outcome of a file-pick request; omarchy transcode with empty ~/Pictures and ~/Videos shall report that there is nothing to transcode. From a menu entry with no terminal the same empty state shall reach the user, so picking Transcode is never a silent no-op.
