    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-T0XP
component: lock
rationale: "A reader that fprintd cannot claim (wedged after suspend, or held by another client) used to be retried every 250 ms for as long as the screen stayed locked, with no sign to the user. Upstream #7158 (FingerprintModel.js and Service.qml) backs off, keeps fprintd's 30 s idle exit free so a wedged claim can clear, reports the reader unavailable after 3 misses (the lock view crosses the icon out and says so, SW-REQ-260912-41VV), restarts after a resume, and bounds a claim that never prompts."
