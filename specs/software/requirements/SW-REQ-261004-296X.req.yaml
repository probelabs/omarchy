id: SW-REQ-261004-296X
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: the lock_service shall always satisfy fingerprint_reader_unavailable <=> (probe_miss_streak_reached | (fingerprint_auth_configured & !attempt_usable & attempt_miss_streak_reached))
description: |-
    The lock service shall report the reader unavailable after 3 probe answers in a row that are neither a listed print nor a definite none. When the service treats fingerprint authentication as configured, 3 unusable attempts in a row shall also cause the report. A usable attempt shows a finger prompt and does not end in a device error within 2 s of the prompt. An attempt that shows a prompt clears the report.

    After a usable attempt, the service shall start the next attempt after 250 ms. After n unusable attempts, it shall wait 1 s times 2 to the power n-1, at most 40 s. It shall abort an attempt that shows no prompt within 20 s. It shall count a miss within 5 s after a resume as the first miss. It shall restart an attempt or a wait that spans a suspend within 250 ms.

    User activity shall shorten a longer wait to 250 ms. It shall do so at most once per 2 s or once per current wait, whichever is longer. At the 40 s cap, it shall do so only 32 s after the last attempt ended.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-T0XP
component: lock
rationale: "A reader that fprintd cannot claim, for example wedged after suspend or held by another client, made the lock screen retry every 250 ms. The retries continued while the screen stayed locked, and the user saw no sign. Upstream #7158 (FingerprintModel.js and Service.qml) backs off and leaves fprintd its 30 s idle exit, so a wedged claim can clear. It reports the reader unavailable after 3 misses, and the lock view crosses the icon out (SW-REQ-260912-41VV). It also restarts after a resume and stops a claim that never prompts."
