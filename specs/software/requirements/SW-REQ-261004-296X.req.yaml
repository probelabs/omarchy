          not_applicable:
            - input_domain
          rationale: "Worst case: the lock screen hammers a wedged reader forever, or shows \"Fingerprint reader unavailable\" for a reader that works, or never retries after a resume. error_handling: a device error, a start failure or a claim with no prompt within 20 s is a miss and backs off. boundary: the notice needs 3 misses in a row; the backoff caps at 40 s, above fprintd's 30 s idle exit; a device error within 2 s of a prompt is a miss. edge_case: a miss inside the 5 s resume grace stays at the first tier; a clock stepped backwards counts neither as a sleep nor as an idle stretch. concurrency_scale: onError and onCompleted can both fire for one attempt and the attempt settles once; a nudge never starts a second attempt while one runs. input_domain not applicable: the inputs are timer ticks, PAM signals and wall-clock times. All model rows are witnessed in lock-fingerprint-retry-test.sh (replayed for code-level MC/DC) and the service rows in the lock harness."
        - category: property
          disposition: reviewed
          applied:
            - monotonicity
            - determinism
          rationale: 'monotonicity: the retry delay never shrinks while the miss streak grows (witnessed for streaks 1..20). determinism: the model functions depend only on their arguments.'
        - category: structural
          disposition: reviewed
          applied:
            - overflow_safety
          rationale: 'overflow_safety: Math.pow(2, streak - 1) grows without bound for long outages but is clamped by Math.min to the 40 s cap before it reaches a timer (witnessed for streak 50).'
        - category: domain
          disposition: not_applicable
          rationale: Timing and display state of the lock screen only; authentication itself stays with pam_fprintd.
