fretish: the lock_service shall always satisfy fingerprint_reader_unavailable <=> (probe_miss_streak_reached | (fingerprint_auth_configured & !attempt_usable & attempt_miss_streak_reached))
description: The lock service shall report the fingerprint reader unavailable after 3 probe answers in a row that were neither a listed fingerprint nor a definite none, or, while fingerprint authentication is configured, after 3 fingerprint attempts in a row that were not usable. A usable attempt shows a finger prompt and does not end in a device error within 2 s of it. The report clears when an attempt shows a prompt. The service shall retry an attempt 250 ms after a usable one; after n unusable attempts it shall wait 1 s times 2 to the power n-1, at most 40 s. It shall abort an attempt that shows no prompt within 20 s. A miss within 5 s after a resume shall count as the first miss, and an attempt or wait that spans a suspend shall be restarted within 250 ms. User activity shall shorten a longer wait to 250 ms at most once per 2 s or the current wait, whichever is longer, and at the 40 s cap only 32 s after the last attempt ended.
