    reviewed_at: "2026-10-03T09:40:00Z"
    reviewed_by: agent:claude-pr-new-C
    reviewed_against_catalog_version: 1.11.0
    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - edge_case
            - boundary
            - input_domain
          not_applicable:
            - concurrency_scale
          rationale: 'Worst cases: the row shows with nothing to remove and only closes the menu, or the row hides while a theme could be removed (a guard narrower than the remover, for example a when: of false). edge_case: each shape of the themes directory is a case. Hidden: missing, empty, a symlinked working copy only, only .git, only .backup, only a stray file. Shown: a copied theme, a cloned theme, a worktree with a .git file, .git beside a real theme, and a theme named -n. All eleven are witnessed. boundary: zero versus one removable directory; the empty and copied homes witness both sides. input_domain applied: the entry kinds decide it. A symlink never counts, a plain file never counts, and a name with a leading dot never counts. A real directory counts whatever else sits beside it (mixed home), and the picker then offers only that directory. Names with a newline or a leading -- are pre-existing remover behaviour, outside this change and outside this requirement. concurrency_scale not applicable: each open re-runs the batch. The menu first draws the previous answers for about half a second, as for every guarded row. So a theme added or removed shows when the batch for that open lands.'
        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: 'Every HOME shape gives one defined answer once the batch has answered, row shown or row hidden. That answer equals whether the remover offers a name it would remove. No shape shows the row with nothing to offer or hides it with a theme to offer. Before the batch answers, the row keeps the previous answer (shown at the first open), as every guarded row does.'
        - category: structural
          disposition: not_applicable
          rationale: 'One JSONC string and one find predicate; no memory, encoding or numeric surface. The escaped quotes in the JSONC string are covered by the witness, which parses the shipped row.'
        - category: domain
          disposition: not_applicable
          rationale: 'The guard reads the user''s own HOME with user privileges and removes nothing. The removal is the remover script''s own, unchanged.'
