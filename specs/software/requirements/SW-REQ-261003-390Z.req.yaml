fretish: when remove_menu_guards_applied the menu_view shall immediately satisfy (remove_theme_row_shown <=> remover_has_removable_theme)
description: 'Once the guard batch for an open has answered, the Remove menu lists Theme exactly when omarchy-theme-remove has a theme it can remove. omarchy-theme-removable names those themes: the directories under ~/.config/omarchy/themes that are not symlinks or dot-directories. The row asks the helper as its when:, and the remover reads its list from it. Until the batch answers, the menu draws the previous answers, as for every guarded row.'
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-47T8
component: menu
rationale: |-
    Upstream omacom/omarchy quattro a85e29ab has this defect. The remove.theme row runs omarchy-theme-remove with no terminal and has no when: guard. The script lists the theme directories that are not symlinks. With none, it prints "No extra themes installed." and exits 1, and nothing shows that line.

    A stock install has only the bundled themes, so the row only closes the menu for most users. Commit 5bc151f9 moved the remover to the menu picker and dropped the floating terminal that showed the line.

    The fix names the removable themes once, as omarchy-theme-extras does for Update > Extra Themes. omarchy-theme-removable lists them and exits nonzero when there are none. The row asks it as its when:, and the remover reads its list from it, so the two cannot disagree. The picker also stops offering a dot-directory, which the remover refuses.

    Each open re-runs the guards. The menu first draws the previous answers and updates when the batch lands, about half a second later. A user menu that overrides remove.theme replaces the whole row, guard included.
tags: []
variables:
    - remove_menu_guards_applied
    - remover_has_removable_theme
    - remove_theme_row_shown
