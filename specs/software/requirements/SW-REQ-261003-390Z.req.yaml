id: SW-REQ-261003-390Z
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when remover_has_no_theme the menu_view shall immediately satisfy remove_theme_row_hidden
description: 'The Remove menu lists Theme only when omarchy-theme-remove has a theme it can remove. That is a directory under ~/.config/omarchy/themes that is not a symlink and has no leading dot. With none, the guard batch answers the row''s when as false and the menu hides the row. So the row never runs a remover that has nothing to offer and closes the menu with no answer.'
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-47T8
component: menu
rationale: |-
    Upstream omacom/omarchy quattro a85e29ab has this defect, as does 821ae589, which this baseline carries. The remove.theme row runs omarchy-theme-remove with no terminal and has no when: guard. The script lists the directories under ~/.config/omarchy/themes that are not symlinks. With none, it prints "No extra themes installed." and exits 1, and nothing shows that line.

    A stock install has only the bundled themes, so the row only closes the menu for most users. Commit 5bc151f9 moved the remover to the menu picker and dropped the floating terminal that showed the line.

    The fix gives the row a when: that asks what the remover can act on. It lists only non-symlink directories, and it refuses a name with a leading dot. The guard batch then hides the row until the remover has a theme it can remove. The engine does not scan .jsonc annotations, so the Implements line on the row is inert. The requirement traces to isVisible, which applies the answer. A live run on the box hid the row with no themes and with a symlink-only theme, and showed it after a theme install.
tags: []
