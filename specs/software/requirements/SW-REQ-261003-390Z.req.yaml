hazard_review:
    reviewed_at: "2026-10-03T09:40:00Z"
    reviewed_by: agent:claude-pr-new-C
    reviewed_against_catalog_version: 1.11.0
    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - edge_case
            - boundary
            - input_domain
          not_applicable:
            - concurrency_scale
          rationale: 'Worst cases: the row shows with nothing to remove and only closes the menu, or the row hides while a theme could be removed (a guard narrower than the remover, for example a when: of false). edge_case: each shape of the themes directory is a case. Hidden: missing, empty, a symlinked working copy only, only .git, only .backup. Shown: a copied theme, a cloned theme, a worktree with a .git file, and .git beside a real theme. All nine are witnessed. boundary: zero versus one removable directory; the empty and copied homes witness both sides. input_domain applied: the entry kinds decide it. A symlink never counts, and a name with a leading dot never counts, because the remover refuses it; a real directory counts whatever else sits beside it (mixed home). Names with a newline or a leading -- are pre-existing remover behaviour, outside this change and outside this requirement. concurrency_scale not applicable: the batch runs again on each evaluation, so a theme added or removed shows at the next one, as for every sibling guard.'
        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: 'Every HOME shape gives one defined answer once the batch has answered, row shown or row hidden. That answer equals whether the remover offers a name it would remove. No shape shows the row with nothing to offer or hides it with a theme to offer. Before the first answer the row shows, as every guarded row does.'
        - category: structural
          disposition: not_applicable
          rationale: 'One JSONC string and one find predicate; no memory, encoding or numeric surface. The escaped quotes in the JSONC string are covered by the witness, which parses the shipped row.'
        - category: domain
          disposition: not_applicable
          rationale: 'The guard reads the user''s own HOME with user privileges and removes nothing. The removal is the remover script''s own, unchanged.'
