          rationale: 'Worst case: a script invoked with missing arguments proceeds silently and summons a menu nobody can answer, or worse exits 0 so the caller interprets no-answer as a legitimate empty input; the two unconditional usage+exit 1 gates (argv below the prompt floor, options map empty after parsing both argv and stdin paths) are the guard, and the diagnostic on stderr keeps stdout clean for pipelines. boundary: exactly-zero options versus one option is the tested floor; prompt-only invocation (options empty through the stdin mapfile path) is the second gate''s edge. error_handling is the requirement''s own declared class - usage failure is loud, exits 1, and never reaches the summon. Catalog 1.11.0 re-review: input_domain applied, inherited from SYS-REQ-260922-X6Z5; its partition is the empty stdin, witnessed on SW-REQ-260922-Q6ZS (usage and exit 1). concurrency_scale not applicable, one argument check per invocation.'
        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: Every argv/stdin shape resolves to one of two defined endings - usage diagnostic with exit 1 before any IPC, or a proceeded invocation with a prompt and at least one option - no shape reaches the summon half-configured.
        - category: structural
          disposition: not_applicable
          rationale: Arg counting and an echo to stderr; no parsing of user content, no arithmetic beyond count checks, no encoding surface.
        - category: domain
          disposition: not_applicable
          rationale: Pre-IPC argument validation only; the usage path performs no summon, no file, and no network operation, so no domain class applies_when fires.
