id: SW-REQ-261002-9H5Y
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when same_file_reached_twice the file_picker shall eventually satisfy file_listed_once
description: When two given paths reach the same file under the same file name, the file picker lists that file in one row. One root can be a symbolic link to another root, or a caller can give the same root twice. The picker keys a row on the device and inode numbers plus the file name, so hard links under different names stay separate rows.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-6642
component: menu
rationale: |-
    Upstream PR omacom/omarchy#13197 (head cc710e11) adds this behaviour to bin/omarchy-menu-file. When find follows link roots, a root linked to another given root lists each file twice, under two paths. Pictures linked to Videos is the example in the PR.

    The PR prints the device and inode number of each file. After the newest-first sort it keeps the first row for each device, inode and file name. Commit cc710e11 added the file name to the key; the maintainers' bot pushed it, and the PR author agreed. Two hard links under different names now stay separate rows, because transcode and the retro installer derive their output from the chosen name. A file reached through aliased roots always keeps its name, so it still gives one row.

    Known limitation, kept on purpose in the PR discussion: two hard links with the same name in different directories also give one row, so only one of the two paths can be picked. Both paths hold identical content. One find -printf call cannot tell the parent directories apart, so the key does not hold them.
tags: []
