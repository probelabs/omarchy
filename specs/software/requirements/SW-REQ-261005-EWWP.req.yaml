description: 'OPEN DECISION (awaiting the Omarchy maintainers): shall the lock screen show the fingerprint stack''s PAM messages, for example ''Remove your finger, and try touching the sensor again''? Current behaviour (upstream quattro 035ce29f): the fingerprint PamContext relays the message, but its onPamMessage handler only records that the reader was reached (Service.qml:557-559); no property keeps the text, and LockView.qml has no element for it (the indicator, LockView.qml:241-255, is a glyph). Options: (A) keep the current behaviour, indicator only; (B) the lock view shall show a PAM info message as a transient line near the password field; (C) show only PAM error messages; (D) show them in the notice slot under the field, where ''Fingerprint reader unavailable'' appears today. Approving this draft means choosing one option; its text then replaces this description.'
