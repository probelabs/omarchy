    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - boundary
            - edge_case
            - malformed_input
          not_applicable:
            - input_domain
            - concurrency_scale
          rationale: 'Worst case: an installed app keyword shadows a menu route (htop ships Keywords=system), so typing a menu id launches an unrelated app instead - closed structurally by skipping kind==app in the alias scan so app aliases can never enter route resolution, while exact ids are checked first against the item map apps never join. boundary: the zero cases are pinned - empty input and the reserved words go/menu route to root before any lookup. edge_case: two menu items sharing one id resolve to whichever entry the merged item map holds (collision semantics owned by the merge sibling), duplicate aliases resolve by itemOrder position (deterministic but config-order dependent), and the id normalizer (lowercase, underscore-to-dash) means ids outside that folded space match only verbatim; unknown strings fall through as literal input by design so misspellings still attempt their id. Catalog 1.11.0 re-review: input_domain not applicable, it reads no external text input. concurrency_scale not applicable, a pure function of its arguments, recomputed on each load or keystroke: no state across calls, no process, timer or lock.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
            - totality
          rationale: 'determinism: resolution walks itemOrder in order after the single exact-id map hit, so the same items and input always route identically. totality: every input string resolves to exactly one target - exact id, first matching alias, root for reserved words, or verbatim passthrough - with no input leaving the router undefined.'
        - category: structural
          disposition: not_applicable
          rationale: A lowercased string compare over a bounded alias list with the same normalization applied to both sides; no eval, regex over user input, or pointer work.
        - category: domain
          disposition: not_applicable
          rationale: Routing picks which user-owned action to run; no new authority is granted by the choice, and the traced resolver carries no network, crypto, or privilege surface.
