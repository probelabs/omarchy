          rationale: 'Worst case: a confirmation notification fires for a timezone that was never set (user trusts a wrong clock until it matters) - closed by the set -e ladder ordering: sudo failure aborts before the clock refresh and the confirmation, so a sent notification implies a completed set. boundary: the zero case is the cancel arm - no pick exits 1 before sudo runs, touching nothing. edge_case: the picked value originates from timedatectl list-timezones (system tz database names) and is still double-quoted into the sudo call, so even a corrupted zone list cannot re-enter shell parsing; a stale zone list entry that timedatectl rejects aborts mid-ladder with no notification, which is the honest direction. Catalog 1.11.0 re-review: input_domain not applicable, the picked timezone is passed through, not parsed. concurrency_scale not applicable, one run per user action that owns its own temp files and shares no state with a concurrent run.'
        - category: property
          disposition: reviewed
          applied:
            - atomicity
          rationale: The apply is a strict four-step sequence - pick, set, refresh, notify - where every failure before the notification aborts with nonzero and leaves the prior timezone intact, so the observable state transitions only on full success and the notification can never precede the commit.
        - category: structural
          disposition: not_applicable
          rationale: Four fixed commands with the only variable data (the zone string) quoted end to end; no arithmetic, parsing of command output, or dynamic dispatch.
        - category: domain
          disposition: reviewed
          rationale: 'The slice contains the scripts one privileged step, sudo timedatectl set-timezone, with the zone argument quoted and the privilege shape fixed to exactly that whitelisted binary invocation - no shipped catalog class covers quoted-argument sudo hygiene, so the category records the review: least-privilege holds by construction, the menu context supplies no terminal for a password prompt (a sudo failure aborts, it never retries), and no network egress exists in the traced file. The menu-select upstream wait is dispositioned under the deferral below.'
