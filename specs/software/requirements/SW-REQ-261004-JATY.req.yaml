id: SW-REQ-261004-JATY
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: the emoji_picker shall always satisfy (emoji_listed <=> (emoji_present & query_in_keywords & emoji_within_limit))
description: |-
    The emoji picker's search lists an emoji exactly when three things hold. The entry has an emoji. Its keywords contain the search text. The list still has room for it.

    The search trims the search text and ignores case. An empty search text matches every emoji. Text that is not a JSON array gives an empty list.

    The list has room while fewer than the limit of matching emojis come before the entry in the picker's order. The limit is 1000 unless the caller gives a number. A limit of 0 or less lists nothing. This requirement does not state the order of the list.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-6642
component: menu
rationale: |-
    shell/plugins/emojis/EmojiSearch.js holds the search that the emoji picker (Emojis.qml) runs on every keystroke. parseEmojis reads emojis.json. filterEmojis builds the list with normalizedQuery and keywordText.

    The picker selects the first entry of the list, and Enter hands it to bin/omarchy-menu-emoji-insert, a menu action script (SYS-REQ-260922-6642). This requirement states which emojis the list holds, as the upstream code behaves. It does not state the order. Upstream keeps the order of emojis.json, so a match inside an unrelated word can come first.
