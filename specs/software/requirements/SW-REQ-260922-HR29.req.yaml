    reviewed_at: "2026-10-01T21:26:18Z"
    reviewed_by: agent:claude-baseline-pass
    reviewed_against_catalog_version: 1.11.0
    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - boundary
            - edge_case
            - error_handling
          not_applicable:
            - input_domain
            - concurrency_scale
          rationale: 'Worst case: a hostile directory layout makes the picker lie - a dot-directory prune miss leaks hidden files into a user-facing pick list, and a case-fold mismatch silently drops files the caller asked for. boundary: dotfile vs dot-directory pruning is the exact partition (files named .jpg are dropped by the ! -name .*, dot-directories are pruned except the search roots themselves via ! -name ., and -iname matches case-insensitively while the prune stays case-sensitive). edge_case: filenames containing tabs or newlines collide with the %T@ tab record format, mangling single rows (cosmetic row loss, no crash, no wrong file selected); an empty formats word lands in the usage guard. error_handling: every nonexistent path element rejects with stderr and exit 1 before any listing (tested); find stderr is suppressed so an unreadable subdirectory yields a silently partial listing rather than an abort - honest gap, consequence limited to a truncated pick list. Catalog 1.11.0 re-review: input_domain not applicable, it lists file names and modification times and reads no file contents. concurrency_scale not applicable, one run per user action that owns its own temp files and shares no state with a concurrent run.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
            - totality
          rationale: 'determinism: rows order solely by sort -rn over the %T@ epoch float; equal timestamps fall to the whole-line reverse string compare, which is stable for a given directory state. totality: every (paths, formats) input resolves to one defined ending - usage exit 1, missing-path exit 1, or the filtered listing - with no input leaving the picker half-drawn.'
        - category: structural
          disposition: not_applicable
          rationale: 'Bash over GNU find: arguments are built as an array so a format word like -o -type d is passed as a single -iname glob operand, never re-parsed as an option; no eval, no IFS word-splitting of file data, no arithmetic.'
        - category: domain
          disposition: not_applicable
          rationale: Local-filesystem reads plus the omarchy-menu-select IPC summon owned by the protocol siblings (SW-REQ-260922-Q6ZS/9ABD); no network egress, crypto, secrets, or privilege surface in the listing slice this requirement governs.
