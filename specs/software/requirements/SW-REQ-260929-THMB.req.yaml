id: SW-REQ-260929-THMB
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when thumbnail_missing the image_selector shall eventually satisfy thumbnail_generated
description: |-
    The pipeline detects video paths by extension and sends each media file to a format-appropriate converter. Videos go to ffmpegthumbnailer under a timeout, and still images go to single-threaded vipsthumbnail. A content-hash lock serializes the generators per file. The generator reaps an aged legacy directory lock and leaves a fresh one to its owner. The finished thumbnail lands at the content-hash cache path, and its row serves it.

    An eager open queues every missing thumbnail and converts the queue before it answers. Still images fill every core, and videos get one lane per four cores. A lazy open uses --lazy-thumbnails without --cache-only. It answers at once with each still as its own stand-in and adds the still jobs to a shared queue under a queue lock. One background pool per rows cache owns a pool lock and drains that queue in batches until it is empty. The pool runs one converter per two cores, at least one and at most two, at lowered CPU and I/O priority.

    A lazy open that finds the pool busy leaves its jobs in the queue for that pool. Videos in a lazy open still take the eager video lanes.
