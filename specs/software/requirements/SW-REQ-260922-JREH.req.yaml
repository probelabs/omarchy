obligation_suppressions:
    - id: error_handling
      reason: 'Same artifact-wide contract as SW-REQ-260922-8ERH: bin/omarchy-menu-share must observe the chooser exit status (captured via || status=$?) to distinguish cancel from chooser-failure. This req implements the failure branch (critical notification + exit 1). It depends on set -e NOT aborting before the script inspects the status.'
      suppressed_by: agent:kimi-dogfood
      suppressed_at: "2026-09-22T17:37:30Z"
    - id: external_call_timeout_bounded
      reason: The chooser is omarchy-file-select, the portal D-Bus client that declares its total wait deadline internally (ANSWER_TIMEOUT_SEC=600, documented as the no-answer guard); the share script synchronous wait inherits that bounded callee, and the unbounded done_file poll mechanism behind KI-MENU-SELECT-POLL-DEADLOCK does not exist on the portal path.
      suppressed_by: agent:opencode-hazard-c
      suppressed_at: "2026-09-30T07:29:18Z"
