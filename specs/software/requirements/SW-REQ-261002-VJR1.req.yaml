id: SW-REQ-261002-VJR1
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when summon_over_pending_uninstall the menu_actions shall immediately satisfy pending_uninstall_dismissed
description: A summon can arrive while the uninstall confirmation shows. The menu then closes the confirmation and removes nothing, as its Cancel button does. The summoned prompt or route then takes the next key. So the confirmation cannot answer a request that replaced its rows.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-6642
component: menu
rationale: |-
    Upstream omacom/omarchy quattro 821ae589 has this defect. Delete on an app row opens the uninstall confirmation, with Uninstall preselected. The confirmation state closes only in onOpenedChanged, when the menu closes. A summon goes through open() into openDmenu or openRoute. These replace the rows while opened stays true.

    So the confirmation stays up and still takes every key. Enter then runs confirmDelete. That cancels the summoned request and removes the app.

    The fix cancels a pending confirmation at the top of open(), through cancelDelete, the same path as the Cancel button. open() is the only entry for every summon. A live run on 821ae589 deleted the desktop file of the app; with the fix the file stays and the prompt answers.
