          rationale: 'Worst case: a confirmation raised for the old rows answers the new request, so the Enter meant for a prompt removes an app and cancels the prompt. edge_case: each kind of summon is a case - a select prompt, an input prompt, and a route (witnessed). A summon with no confirmation open leaves all as before. The action-alias route closes the menu through cancel(), which clears the confirmation anyway. Enter on the confirmation itself, with no summon, still removes the app (witnessed). boundary not applicable: the decision is one boolean, with no range or limit. input_domain not applicable: the payload text does not change the decision. concurrency_scale not applicable: summons and key presses run one after the other on the GUI thread. A key that arrives before the summon still answers the confirmation, as the user meant.'
        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: 'Every summon resolves a pending confirmation to one defined state: closed, nothing removed, target cleared. Every summon without one leaves the dialog state unchanged. No path keeps a dialog open over rows it was not raised for.'
        - category: structural
          disposition: not_applicable
          rationale: 'Two QML properties and one guarded call; no memory, encoding or numeric surface.'
        - category: domain
          disposition: not_applicable
          rationale: 'Dialog state only. The removal and its privilege handling are in the shared app library, under its own requirements. This change only stops an unintended call to it.'
