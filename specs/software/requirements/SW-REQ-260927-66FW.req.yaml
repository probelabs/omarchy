id: SW-REQ-260927-66FW
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: the menu_model shall always satisfy trailing_comma_dropped <=> (!comma_in_string & next_char_closes_json)
description: The JSONC stripper looks ahead from each comma outside every string literal. The look-ahead skips whitespace and each // comment up to its line break. The stripper drops the comma only when the next other character is a closing brace or bracket. A comma inside a string literal is data, and the stripper copies it unchanged.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-PPDW
component: menu
rationale: 'PR omacom/omarchy#13968 replaces the two regex passes in MenuModel.js stripJsonc with one string-aware scanner. The upstream comma regex also matched inside strings, so a label such as "x, ]y" changed while the parse still succeeded (#13250). The look-ahead skips comments as well as whitespace. Thus a trailing comma, then a commented-out entry, then the closer still parses, as in the shipped extension template with its examples uncommented. A look-ahead that stops at the first non-whitespace character keeps that comma and empties the menu, which is the #13512 and #13681 regression.'
