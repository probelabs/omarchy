          rationale: 'Worst case: a cancel masquerades as success - exit 0 with empty output would make callers such as confirmation prompts proceed on an answer nobody gave; the -s partition is the whole guard, sending an empty selection file to the unconditional exit 1 arm with nothing on stdout. boundary: selection-file empty versus non-empty is the exact partition this contract names, and done-file-present-but-selection-absent is the cancel encoding it must resolve. edge_case: the selection file vanishing between the -s test and cat fails under set -e to the same observable (nonzero, silent), and a whitespace-only answer counts as non-empty by -s and is passed through verbatim - the caller-side trim is out of this contract. The done-file wait feeding this arm carries the same unbounded poll already tracked on Q6ZS; the identical loop in bin/omarchy-menu-input is that KI''s second site and is deferred, not suppressed. Catalog 1.11.0 re-review: input_domain not applicable, it tests whether the selection file is empty and parses nothing. concurrency_scale not applicable, the client side of one request; request supersession is stated on SYS-REQ-260922-X6Z5.'
        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: Every (done-file, selection-file) combination the protocol can produce resolves to exactly one defined ending - content printed with exit 0, or silence with exit 1 - with no combination leaving the script printing a partial answer or exiting zero on a cancel.
        - category: structural
          disposition: not_applicable
          rationale: A -s file test, cat, and two mktemp'd fixed paths with an EXIT trap; no parsing of file contents, no arithmetic, no encoding transform - the selection bytes pass through verbatim.
        - category: domain
          disposition: not_applicable
          rationale: Same-user local files at mktemp paths plus the omarchy-shell IPC summon owned by the protocol sibling (Q6ZS/C8HX); no network egress, crypto, or privilege surface in the answer-reading arm this requirement governs.
