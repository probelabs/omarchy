            - concurrency_scale
          rationale: 'Worst case: back navigation strands the user or lands somewhere wrong - a stack id or parent id whose menu vanished under a live config reload resolves through the unknown-id guard to root rather than an empty menu, and an empty-parent item falls to root explicitly. boundary: root as the terminal back target (goBack returns false without state change) and the empty-stack arm switching to parent fallback are the two partition edges of back behavior. edge_case: re-entering the current menu pushes nothing (id !== activeMenu gate) so Back cannot bounce in place, entering a menu clears the filter per the subject so a search-narrowed view cannot leak into a submenu, and repeated A-to-B-to-A drilling grows the stack one small string per level - bounded by user interaction and reset on every menu open (navStack cleared in openExistingMenu), graded low. All consequences are display-state only. Catalog 1.11.0 re-review: input_domain not applicable, it reads no external text input. concurrency_scale not applicable, view state recomputed from the current rows on each UI event: no process, timer or lock, and events are handled one at a time.'
        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: Every navigation state (any active menu, any stack depth, any parent chain, any config generation) yields a defined back destination - popped stack entry, declared parent, or root - and every drill-in yields a defined push-and-clear; no state leaves goBack without an answer or the filter uncleared.
        - category: structural
          disposition: not_applicable
          rationale: Array concat/slice on a stack of id strings plus boolean flags; no memory, pointer, encoding, or numeric surface.
        - category: domain
          disposition: not_applicable
          rationale: Pure in-shell navigation state; no IPC, file, network, crypto, or privilege surface - the key events arrive through the menu's own focus handler and the config reload interplay is resolved by the unknown-id fallback recorded under scenario.
