          applied:
            - boundary
            - edge_case
          rationale: 'Worst case: two menu items declare the same alias and the route silently opens whichever comes first in itemOrder - a user summoning power lands on an unrelated item; the scan is order-driven and first-match-wins, which makes the outcome deterministic but the conflict itself is config-author error with a low cosmetic blast radius (a wrong menu opens, nothing executes). boundary: the exact-id beat over any alias is the precedence boundary shared with 74BZ, and excluding app rows from the alias scan is the deliberate trust boundary that keeps .desktop Keywords from shadowing real routes (htop ships Keywords=system). edge_case: underscore-to-dash normalization makes power_menu and power-menu one alias (collision collapses harmlessly), aliases on action and link kinds route through openRoute''s kind handling, and an empty alias string can never match because raw is rooted before the scan.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
          rationale: 'Alias resolution is a pure function of the loaded model: normalization is a fixed string transform and the scan walks itemOrder in a fixed sequence returning the first declared match, so the same config always maps a route to the same target - including its first-match-wins arbitration of duplicate aliases.'
        - category: structural
          disposition: not_applicable
          rationale: toLowerCase/replace over declared alias strings compared for equality; no memory, pointer, numeric, or encoding round-trip surface - the normalization vocabulary is ASCII route names.
        - category: domain
          disposition: not_applicable
          rationale: In-process lookup over already-normalized config data; the IPC receipt of the route string lives with the lifecycle requirement (50RE) and nothing here touches files, network, crypto, or privilege.
