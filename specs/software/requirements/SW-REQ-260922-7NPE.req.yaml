          rationale: 'Worst case: a user extension entry with a JavaScript object-protocol key (__proto__, constructor) is written into the plain nextItems map, where the __proto__ assignment mutates the map''s prototype instead of adding a row - corrupting later lookups menu-wide - and an entry without an id is silently dropped by the !entry.id guard. malformed_input: both shapes are reachable from the user-editable extension JSONC, and silent-drop versus prototype-corruption is the declared handling of each. boundary: the root injection fires exactly when no source declares root - a user-declared root suppressing the Go label is the identity edge, and the merge is last-source-wins per key. edge_case: override preserving the first source''s order slot while later sources append, duplicate ids within one source (first sets order, later merges), and shallow per-key replacement of nested values like aliases are the witnessed corners. Blast radius is same-user config rendering the menu wrong - graded low; no privilege or write surface composes onto it. Catalog 1.11.0 re-review: input_domain not applicable, entries reach it already parsed by SW-REQ-260922-E4J2. concurrency_scale not applicable, a pure function of its arguments, recomputed on each load or keystroke: no state across calls, no process, timer or lock.'
        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: Any pair of source arrays (null, empty, overlapping, malformed entries) yields a defined merged map and order with sequential order indexes assigned to every surviving row; the root item is guaranteed present afterwards either from a source or injected, so downstream tree building never runs against a rootless model.
        - category: structural
          disposition: not_applicable
          rationale: Shallow for-in copies over plain objects; no memory, pointer, encoding, or numeric surface. The plain-object-as-map weakness against protocol keys is a semantic hazard and is dispositioned under scenario/malformed_input rather than as a language-safety class.
        - category: domain
          disposition: not_applicable
          rationale: In-process config merge over two already-parsed arrays; the file watching and JSONC parsing are owned by the source-loading siblings, and nothing here touches network, IPC transport, crypto, or privilege.
