          rationale: 'Worst case: a finish arrives with no active request and the code, unguarded, creates or truncates the done file of a future summons - a forged empty answer delivered to an invocation that has not happened yet; the !requestActive || !doneFile guard is the entire protection, so both disjuncts are the boundary pair (active request but empty doneFile path, and stale request flag with a leftover doneFile). edge_case: double dismissal - scrim click after Esc, or cancel() racing an already-finished request - reaches finishRequest a second time and must be a silent no-op; the compositor test witnesses done-only silence end to end. malformed_input is owned upstream: doneFile provenance and payload parsing live in the summon requirements (C8HX/FGZQ hold the write arm); this requirement only decides the empty-arm behavior. Catalog 1.11.0 re-review: input_domain not applicable, it reads no external text input. concurrency_scale applied, it is part of the menu request lifecycle: a finish can arrive when no request is active (a superseded or repeated finish), and it must close without touching files.'
        - category: property
          disposition: reviewed
          applied:
            - idempotency
          rationale: finishRequest twice is the same observable state as once - opened=false, no file touched - because the first call clears requestActive/doneFile before returning and every entry re-checks them; the QML event loop is single-threaded so no intra-function interleaving can bypass the guard (the interleaving that matters is dismiss-vs-summon, resolved by the same re-check on each entry).
        - category: structural
          disposition: not_applicable
          rationale: Boolean and path-string guard before any write; no parsing, casting, memory, or encoding surface in the silent-close arm - the write arm is string-typed elsewhere.
        - category: domain
          disposition: not_applicable
          rationale: 'This contract is the absence of filesystem effects: no file is created, truncated, or read on the no-request arm. The done/answer file write path, its permissions, and payload-derived path provenance are owned by FGZQ/C8HX and the summon-payload requirements; Menu.qml carries no network egress sink, so no domain class applies_when fires here.'
