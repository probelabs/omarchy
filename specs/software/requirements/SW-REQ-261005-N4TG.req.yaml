rationale: 'Raised by omacom/omarchy#10078 (proof inbox R-995). The validation (report/cmulr91070k6l1gw401lz9v1z, rval-1aeca03bd74654626c6df3e95e77ef51) reproduced the current behaviour with the real LockView.qml. No requirement bounds the length today; SW-REQ-260912-WBS3 only scales the dots. Upstream PR #10082 (draft, by the reporter) proposes B and C. For reference only: Linux-PAM''s PAM_MAX_RESP_SIZE is 512 bytes.'
