description: 'OPEN DECISION (awaiting the Omarchy maintainers): should the lock screen limit the length of a typed or pasted password, and where? Current behaviour (upstream quattro 035ce29f): the password TextInput in LockView.qml (line 164) declares no maximumLength, so it keeps Qt''s default of 32767 characters; the text is mirrored into the masking TextMetrics (LockView.qml:90-96) and through passwordTextEdited into the service (Service.qml:488), and submitPassword forwards any non-empty value to PAM (Service.qml:324-339). Options: (A) keep the current behaviour, no limit of its own; (B) the password field shall accept at most N characters, N chosen by the maintainers; (C) in addition, the lock service shall reject a longer value before PAM. Approving this draft means choosing one option; its text then replaces this description.'
