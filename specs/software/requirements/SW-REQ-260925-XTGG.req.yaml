          rationale: 'The guard is the mitigation for the concurrent-summon hazard: a summon interleaved with an in-flight select/input request now answers the prior request as cancelled before opening, closing the abandoned-request trigger of omacom/omarchy#9057 (KI-MENU-REQUEST-LIFECYCLE re-summon leg). Worst case without the guard: the caller polls its done file forever. Residual: on 0b4fe292 the cancel write went through the shared resultProc and a burst could still drop it (busy-resultProc leg, SX26/C14); head b7bd59c4 writes each answer in a process of its own, which SW-REQ-261001-C19S covers. The peer-death trigger (the shell dies after a summon) stays tracked on KI-MENU-REQUEST-LIFECYCLE.'
        - category: property
          disposition: reviewed
          applied:
            - atomicity
          rationale: The cancel-before-open is ordered strictly ahead of any state mutation by the new open (openDmenu/openRoute), so the prior request is answered from its own captured file paths before they can be overwritten or cleared; finishRequest captures both paths before clearing state.
        - category: domain
          disposition: not_applicable
          rationale: No domain workload tags; the menu dmenu protocol is a local QML plugin plus bash scripts with no network, crypto, or privilege surface.
        - category: structural
          disposition: not_applicable
          rationale: QML/JS (GC'd) plus bash writing a constant-format truncation; no manual memory, pointers, or binary framing.
