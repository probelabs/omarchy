id: SW-REQ-260925-XTGG
version: 1
status: draft
priority: shall
category: functional
req_type: guarantee
fretish: when menu_open_called & ! no_active_request the dmenu_protocol shall eventually satisfy prior_request_cancelled
description: A summon can arrive while a select/input request is still active. The menu then answers that prior request as cancelled (done file only, empty selection) before it opens the new menu. The caller that polls the done file is thus never abandoned by a later summon.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-X6Z5
component: menu
rationale: 'Upstream PR omacom/omarchy#9056 (head 0b4fe292) adds the guard "if (root.requestActive) root.finishRequest(null)" at the top of Menu.qml open(), ahead of the openDmenu/openRoute dispatch that overwrites or clears selectionFile/doneFile/requestActive. Fixes omacom/omarchy#9057 and the re-summon leg (SX26/C06/C07) of KI-MENU-REQUEST-LIFECYCLE.'
tags: []
variables:
    - menu_open_called
    - no_active_request
    - prior_request_cancelled
traces:
    satisfies:
        - SYS-REQ-260922-X6Z5
verification:
    assurance_level: C
    formalization_status: valid
history:
    created_by: agent:v2-third-party-review
    created_at: "2026-10-01T08:00:00Z"
    last_modified_by: agent:v2-third-party-review
    last_modified_at: "2026-10-01T08:00:00Z"
hazard_review:
    reviewed_at: "2026-10-01T08:00:00Z"
    reviewed_by: agent:v2-third-party-review
    reviewed_against_catalog_version: 1.10.1
    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - concurrent
          rationale: 'The guard is the mitigation for the concurrent-summon hazard: a summon interleaved with an in-flight select/input request now answers the prior request as cancelled before opening, closing the abandoned-request trigger of omacom/omarchy#9057 (KI-MENU-REQUEST-LIFECYCLE re-summon leg). Worst case without the guard: the caller polls its done file forever. Residual: the cancel write goes through the shared resultProc; the busy-resultProc leg (SX26/C14) stays tracked on KI-MENU-REQUEST-LIFECYCLE and is not closed by this guard.'
        - category: property
          disposition: reviewed
          applied:
            - atomicity
          rationale: The cancel-before-open is ordered strictly ahead of any state mutation by the new open (openDmenu/openRoute), so the prior request is answered from its own captured file paths before they can be overwritten or cleared; finishRequest captures both paths before clearing state.
        - category: domain
          disposition: not_applicable
          rationale: No domain workload tags; the menu dmenu protocol is a local QML plugin plus bash scripts with no network, crypto, or privilege surface.
        - category: structural
          disposition: not_applicable
          rationale: QML/JS (GC'd) plus bash writing a constant-format truncation; no manual memory, pointers, or binary framing.
