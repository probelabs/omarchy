id: SW-REQ-260925-XTGG
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when menu_open_called & ! no_active_request the dmenu_protocol shall eventually satisfy prior_request_cancelled
description: A summon can arrive while a select/input request is still active. The menu then answers that prior request as cancelled (done file only, empty selection) before it opens the new menu. The caller that polls the done file is thus never abandoned by a later summon.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-X6Z5
component: menu
rationale: 'Upstream PR omacom/omarchy#9056 (commit 0b4fe292, kept unchanged at head b7bd59c4) adds the guard "if (root.requestActive) root.finishRequest(null)" at the top of Menu.qml open(), ahead of the openDmenu/openRoute dispatch that overwrites or clears selectionFile/doneFile/requestActive. Fixes omacom/omarchy#9057 and the re-summon leg (SX26/C06/C07) of KI-MENU-REQUEST-LIFECYCLE.'
