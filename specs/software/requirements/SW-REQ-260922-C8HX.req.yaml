            - concurrency_scale
          not_applicable:
            - input_domain
          rationale: 'Worst case: a dismissal forges an answer - a selection file written where the caller expects done-only - or the done marker lands before the selection content is durable, so the CLI wakes on done and reads an empty selection, converting a real pick into a cancel; the two-arm command (printf selection then truncate done, in one bash -c) plus the null-selection done-only arm are the entire protection. boundary: done-only versus selection+done is the exact two-arm partition this requirement names, and the guard front door (no active request or no done file) is the stale-finish edge shared with 3VTN. concurrent: the request fields are cleared before the write spawns, so a second finish is a silent no-op rather than a second write, and the single-threaded QML event loop serializes entries. edge_case: a selection containing newlines or shell metacharacters passes through Util.shellQuote into the printf verbatim - the quoting helper is the trusted boundary and its own requirements own its correctness; mktemp-unique paths rule out cross-request file collisions. Catalog 1.11.0 re-review: input_domain not applicable, it reads no external text input. concurrency_scale applied, part of the menu request lifecycle: a dismissal can race a superseding summon.'
        - category: property
          disposition: reviewed
          applied:
            - atomicity
          rationale: The done file is the protocol commit marker and it is written last, inside the same bash -c after the selection content is flushed, so a caller waking on done observes either a complete selection or its documented absence (cancel) - never a half-written answer; the fields cleared up front make the operation all-or-nothing against reentry.
        - category: structural
          disposition: not_applicable
          rationale: Two shell-quoted file writes through a spawned bash -c; no parsing, arithmetic, memory, or encoding transform - the selection bytes are quoted and passed verbatim.
        - category: domain
          disposition: not_applicable
          rationale: Same-user mktemp'd files written by the menu's own result process; path provenance is the summon payload's (owned by Q6ZS), the CLI polling side is the protocol siblings, and no network, crypto, or privilege boundary is crossed here.
