id: SW-REQ-261009-RCPT
version: 1
status: draft
priority: shall
category: functional
req_type: guarantee
fretish: when lock_result_read the lock_service shall always satisfy lock_receipt_secured <=> (lock_request_secured & !lock_receipt_expired)
description: When a caller reads the outcome of a tracked lock request, the lock service shall report it secured only if that request, issued by this shell instance, became secure. The secured outcome shall stay readable after the session is unlocked again, for 30 s after the request is released. Another request, a request from an earlier shell instance, and an expired request shall not read secured.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-T0XP
component: lock
rationale: 'Upstream PR omacom/omarchy#9429 (head 3a590ca0) adds the lock request / lock result IPC and the request ledger in shell/plugins/lock/LockRequestModel.js. omarchy-system-lock (SW-REQ-261006-861H) depends on it: a status snapshot cannot tell a request that never secured from one that secured and was unlocked at once, so a script that polls status either re-locks after a fast unlock or misses a stalled request. The ledger records secure before authentication starts, keeps one active token that concurrent callers share, names tokens by a per-start kernel UUID, and expires released outcomes after 30 s.'
