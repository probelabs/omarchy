    formalization_status: valid
    review:
        status: in_review
        reviewer: agent:claude-code
        reviewed_at: "2026-10-09T06:50:00Z"
        ai_generated: true
    not_modeled:
        - predicate: kept.length >= 64
          reason: "Capacity cap in LockRequestModel.js request(): at most 64 receipts are kept, so a burst of requests cannot grow the ledger without bound. A full ledger refuses the new request (receipt-unavailable), which omarchy-system-lock reports as a failed lock (SW-REQ-261006-861H). Reaching it needs 64 lock and unlock cycles within 30 s, so no FRETish variable carries it."
        - predicate: record.finishedAt >= 30000
          reason: "The 30 s retention window in request() and result(). The FRETish variable lock_receipt_expired abstracts this comparison as a boolean; the millisecond arithmetic is not modeled."
