id: SW-REQ-261009-RCPT
version: 1
status: draft
priority: shall
category: functional
req_type: guarantee
fretish: when lock_result_read the lock_service shall always satisfy lock_receipt_secured <=> (lock_request_secured & !lock_receipt_expired)
description: When a caller reads the outcome of a tracked lock request, the lock service shall report it secured only if that request became secure. Only a request from this shell instance can read secured. The service shall keep a secured outcome readable for 30 s after the request ends, also when the user unlocks at once. Another request, a request from an earlier shell instance, and an expired request shall not read secured.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-T0XP
component: lock
rationale: |-
    Upstream PR omacom/omarchy#9429 (head 3a590ca0) adds the lock request and lock result IPC. It also adds the request ledger in shell/plugins/lock/LockRequestModel.js. omarchy-system-lock (SW-REQ-261006-861H) depends on it. A status snapshot cannot tell a request that never became secure from a secure lock that the user already unlocked. A script that polls status therefore either locks again after a fast unlock or misses a stalled request.

    The ledger records secure before authentication starts. Concurrent callers share one active token. Each shell start names its tokens with a new kernel UUID. Released outcomes expire after 30 s.
tags: []
variables:
    - lock_result_read
    - lock_request_secured
    - lock_receipt_expired
    - lock_receipt_secured
traces:
    satisfies:
        - SYS-REQ-260912-T0XP
verification:
    assurance_level: C
    formalization_status: valid
    review:
        status: in_review
        reviewer: agent:claude-code
        reviewed_at: "2026-10-09T06:50:00Z"
        ai_generated: true
    not_modeled:
        - predicate: kept.length >= 64
          reason: "Capacity cap in LockRequestModel.js request(): at most 64 receipts are kept, so a burst of requests cannot grow the ledger without bound. A full ledger refuses the new request (receipt-unavailable), which omarchy-system-lock reports as a failed lock (SW-REQ-261006-861H). Reaching it needs 64 lock and unlock cycles within 30 s, so no FRETish variable carries it."
        - predicate: record.finishedAt >= 30000
          reason: "The 30 s retention window in request() and result(). The FRETish variable lock_receipt_expired abstracts this comparison as a boolean; the millisecond arithmetic is not modeled."
