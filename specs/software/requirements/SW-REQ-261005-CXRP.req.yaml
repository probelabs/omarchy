rationale: 'Raised by omacom/omarchy#9913 (proof inbox R-1029) and omacom/omarchy#12202 (proof inbox R-443); the retry-budget half of omacom/omarchy#10078 asks the same. Validations: report/cmulr91vo0k9f1gw499ic4jis (rval-745154880ad90c47c99d5d68a7d1114c) and report/cmulr8r7a0iwl1gw4uqg4huff (rval-4da3f7f4c6cb4bb2c50649cba8ac53f4). #12202''s premise (no new PAM session after a miss) does not hold at this commit; #9913''s flat 250 ms retry on errors was replaced by #7158''s backoff. Open upstream PRs #12420 and #7179 implement option B; PR #10082 proposes option C.'
