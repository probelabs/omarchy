description: 'OPEN DECISION (awaiting the Omarchy maintainers): when shall the lock screen scan for a fingerprint, and shall retries end? Current behaviour (upstream quattro 035ce29f, after upstream #7158): after an attempt that reached the reader and did not match, the next attempt is armed in 250 ms (FingerprintModel.js:3, Service.qml:420); attempts that do not reach the reader or end in a fast error back off 1 s doubling to a 40 s cap (FingerprintModel.js:7-23); runBlank() leaves a pending retry running (Service.qml:294-298) and startFingerprint() does not check displaysBlank (Service.qml:357-375), so scanning goes on while the displays are blank, for as long as the session is locked. Options: (A) keep the current behaviour; (B) the lock service shall start no fingerprint scan while the displays are blank and shall re-arm the reader on wake; (C) a total attempt or time budget per lock, value chosen by the maintainers. Approving this draft means choosing one option; its text then replaces this description.'
