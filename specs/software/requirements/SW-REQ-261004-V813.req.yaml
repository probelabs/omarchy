id: SW-REQ-261004-V813
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when fingerprint_probe_answered the lock_service shall always satisfy fingerprint_auth_configured <=> (probe_lists_print | (!probe_says_none & fingerprint_was_configured))
description: When the lock screen's enrollment probe finishes, the lock service shall treat fingerprint authentication as configured when the answer lists an enrolled fingerprint. It shall treat it as not configured when the answer says the user has no enrolled fingerprint, or the fingerprint PAM file or fprintd-list is missing. Any other answer, for example an fprintd that cannot be reached, shall leave the state unchanged. While fingerprint authentication is not configured after such an answer, the service shall run the probe again after the attempt backoff.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-T0XP
component: lock
rationale: "The lock screen's probe used to grep the fprintd-list answer for the word \"finger\". An empty enrollment on a reader with Fingerprint in its name (\"has no fingers enrolled for ... Fingerprint Sensor\") then read as enrolled (KI-LOCK-FPRINT-PROBE-FAIL-OPEN), and a probe that could not reach fprintd read as not enrolled and switched fingerprint authentication off. Upstream #7158 (FingerprintModel.classifyProbe, Service.applyFingerprintProbe) classifies the answer: only a listed print or a definite none changes the state, and an unknown answer is asked again with the attempt backoff."
