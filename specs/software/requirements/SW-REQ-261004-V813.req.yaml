id: SW-REQ-261004-V813
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when fingerprint_probe_answered the lock_service shall always satisfy fingerprint_auth_configured <=> (probe_lists_print | (!probe_says_none & fingerprint_was_configured))
description: When the lock screen's enrollment probe finishes, the lock service shall classify the answer. It shall treat fingerprint authentication as configured when the answer lists an enrolled fingerprint. It shall treat it as not configured when the answer says that the user has none. The same applies when the fingerprint PAM file or fprintd-list is missing. Any other answer shall leave the state unchanged, for example when the service cannot reach fprintd. While fingerprint authentication stays unconfigured after such an answer, the service shall run the probe again after the attempt backoff.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-T0XP
component: lock
rationale: "The lock screen's probe used to search the fprintd-list answer for the word \"finger\". An empty enrollment on a reader with Fingerprint in its name then read as enrolled (KI-LOCK-FPRINT-PROBE-FAIL-OPEN). A probe that could not reach fprintd read as not enrolled and switched fingerprint authentication off. Upstream #7158 classifies the answer in FingerprintModel.classifyProbe and Service.applyFingerprintProbe. Only a listed print or a definite none changes the state. The service asks again about an unknown answer, with the attempt backoff."
