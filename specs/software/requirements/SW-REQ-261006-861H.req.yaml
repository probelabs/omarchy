id: SW-REQ-261006-861H
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when user_lock_requested the system_lock shall eventually satisfy (lock_exit_success <=> lock_secure_reported) & (lock_failure_notified <=> !lock_secure_reported)
description: When the user locks the session, omarchy-system-lock shall exit 0 only after the shell's lock status reports the session secure. When the shell refuses the lock, or the session is not secure within 10 s, the script shall exit 1. It shall then also send the critical "Screen did not lock" notification.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-T0XP
component: lock
rationale: Upstream PR omacom/omarchy#9429 (head 3fa17d48) stops omarchy-system-lock from exiting 0 for a lock that did not hold (KI-260930-2FBE). The shell answers a refused lock with exit 0, and it secures the session only after the request returns. The script therefore polls lock status. It asks again while no request is pending, and it gives up after 10 s. The menu row, the keybinding and the idle lock drop the exit code, so the notification is the failure that a user can see. It is shown only while the shell, which owns the notification server, is running.
tags: []
variables:
