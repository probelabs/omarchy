          rationale: 'error_handling: a refused lock (missing-pam or failed), a shell that is not running, and a missing omarchy-shell all end in exit 1 with the notification; a failed notification is ignored, so the exit status still reports the failure. boundary: the 10 s deadline is checked against SECONDS, and the last poll before it can still succeed. concurrent: securing happens after the lock request returns, so a request still being processed reads as locking and the script waits; a dropped request reads as idle and is sent again. input_domain not applicable: the only input is the shell''s own status JSON. concurrency_scale not applicable: one lock call waits for one session.'
        - category: property
          disposition: not_applicable
          rationale: One wait per call with a fixed deadline; no algebraic or repeated-application surface.
        - category: domain
          disposition: not_applicable
          rationale: 'No new trust boundary: the script asks the user''s own shell over the same IPC as before and sends one desktop notification.'
        - category: structural
          disposition: not_applicable
          rationale: Bash and jq over a short JSON reply; no manual memory, pointers or binary framing.
