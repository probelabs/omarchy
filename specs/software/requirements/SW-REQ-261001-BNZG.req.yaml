fretish: when space_outside_string the menu_model shall always satisfy space_passed_as_ascii
description: The JSONC stripper takes any text as input. Outside string literals, each character that JS \s matches is whitespace. This includes ASCII whitespace and a byte order mark U+FEFF at the start or anywhere else. It also includes the Unicode spaces U+00A0, U+1680, U+2000 to U+200A, U+2028, U+2029, U+202F, U+205F and U+3000. The stripper keeps each line feed and emits each other such character as one ASCII space. Inside string literals it copies every character unchanged.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-PPDW
component: menu
rationale: 'This requirement states the input domain of stripJsonc and parseMenuJsonc. JSON.parse accepts only four ASCII whitespace characters. A user file can still carry a byte order mark or a Unicode space from an editor or a paste. Upstream reads such a character as whitespace only before a whole-line comment, because the comment regex ^\s*// is Unicode-aware. The first PR #13968 commit (ff77cd02) lost that, so a file with a byte order mark and a leading comment had no rows. The follow-up commit efa5170b adds the \s branch to the scanner.'
