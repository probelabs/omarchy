fretish: when fingerprint_not_enrolled the apply_lock shall always satisfy fingerprint_pam_removed
description: When /usr/bin/fprintd-list reports that the target user has no enrolled fingerprint, or is not executable, omarchy-apply-lock shall remove /etc/pam.d/omarchy-lock-fingerprint and the fprintd resume hook. When it lists an enrolled fingerprint, the helper shall install the PAM fingerprint stack. An answer that is neither is a failed probe, which keeps the configuration (SW-REQ-261004-SP65).
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-JW2J
component: lock
rationale: "A stale fingerprint PAM stack without an enrolled finger would offer an authentication path that can never succeed and can shadow the password path. Upstream #7158 narrowed \"not enrolled\" to the explicit empty-enrollment answer of fprintd or a missing fprintd-list. An enrolled print is now a listed row ( - #N:). An answer that only contains the word \"finger\" no longer counts."
