            - malformed_input
            - boundary
            - edge_case
          rationale: 'malformed_input: a top-level JSON array is legal JSON but not a menu entry map; the parser must reject it like every scalar root instead of iterating indices. Both FMEA modes (phantom rows id 0,1,...; an unintended user-privilege action on a phantom row) lived here pre-fix and the guarded rows now forbid them. boundary: empty array [] and empty object {} both yield zero rows (witnessed). edge_case: an array nested under "items" is rejected by the same pre-existing items-shape check, witnessed as a negative row.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
          rationale: The guard is a pure type check on the parsed root with no environment, ordering, or timing inputs. Identical bytes always yield the same item set. Differential fuzz of the fix branch against the pre-fix quattro baseline is scheduled for Phase 3 of this campaign.
        - category: domain
          disposition: not_applicable
          rationale: No domain workload tags (HTTP/crypto/IPC frameworks); the component parses a local user-authored config file into a menu model.
        - category: structural
          disposition: not_applicable
          rationale: Implementation is GC'd JavaScript (QML JS engine). No manual memory, pointer arithmetic, binary framing, or format strings exist here. The structural catalog targets C-family hazards that cannot exist here.
