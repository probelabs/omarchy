          rationale: 'Worst case: a second update enters its pre-update snapshot while the first runs, interleaving snapshots and package transactions. concurrent: flock -n on a dedicated descriptor is the mutual-exclusion arbiter; contention is the trigger. error_handling: a failed flock prints a diagnostic and exits 1, and a missing command answers usage with exit 2. access_denied: an unopenable lock file, including permission denial on the runtime directory, refuses the run under set -e with the failure on stderr rather than running unlocked. boundary: the zero-argument edge and the missing lock directory (mkdir best-effort) are the tested edges of the open path.'
