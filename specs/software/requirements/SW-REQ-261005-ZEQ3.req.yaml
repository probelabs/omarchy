description: 'OPEN DECISION (awaiting the Omarchy maintainers): may a search result that runs a destructive action (remove, uninstall) be the default Enter target? Current behaviour (upstream quattro 035ce29f): searchScore (MenuModel.js:341-363) puts an exact label match in the best tier, so with ~/.rustup present and RustDesk installed, ''rust'' ranks Remove > Development > Rust first; the menu selects row 0 on a query change (Menu.qml:722-726) and Enter activates it (Menu.qml:1153-1157), which runs omarchy-remove-dev-env rust (default/omarchy/omarchy-menu.jsonc:343) and rustup self uninstall -y with no confirmation (bin/omarchy-remove-dev-env:111-114). Options: (A) keep the current ranking (SW-REQ-260922-SJ7P); (B) a destructive row shall rank below the other matches unless the query names the action; (C) install/remove rows shall not appear in global search; (D) a destructive row activated from search shall ask for confirmation, as SW-REQ-260922-8CQ4 does for uninstalling an app. Approving this draft means choosing one option; its text then replaces this description.'
