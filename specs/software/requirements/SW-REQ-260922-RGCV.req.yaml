hazard_review:
    reviewed_at: "2026-10-01T21:26:21Z"
    reviewed_by: agent:claude-baseline-pass
    reviewed_against_catalog_version: 1.11.0
    categories:
        - category: scenario
          disposition: reviewed
          applied:
            - boundary
            - edge_case
            - error_handling
            - input_domain
          not_applicable:
            - concurrency_scale
          rationale: 'Worst case: pacman -Qq fails (broken db) and stderr is suppressed, so the mapfile seeds empty and every plain package name reads missing - Install rows flip to installable and already-installed marks vanish; consequence is wrong UI state until the next open, with no destructive action firing automatically (installs are user-clicked) and the guarded verb re-evaluating each refresh. boundary: the no-argument case is pinned by contract - present of nothing is true (vacuous all-loop), missing of nothing is false - and the tested half matches the implementation exactly. edge_case: provides entries are extracted by the awk field split with version operations stripped, multi-provide lists split on spaces, and the literal None skipped; version-constraint arguments (containing <,>,=) bypass the snapshot and defer to a live pacman -Q, so a mid-session install makes constrained args fresh while plain names stay snapshot-stale - bounded staleness inherent to the one-shot mapfile design. error_handling is the declared class: the all-missing degrade above is the failure mode, silent but recoverable and UI-level. Catalog 1.11.0 re-review: input_domain applied, it reads pacman -Q answers through the prelude shadows; the producer emits machine-generated text and only the exit status decides. concurrency_scale not applicable, a pure function of its arguments, recomputed on each load or keystroke: no state across calls, no process, timer or lock.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
            - totality
          rationale: 'determinism: the shadow map is a pure function of the pacman database state at read time - same db, same answers, sorted input order irrelevant to the associative array. totality: every (argument list, argument form) combination resolves to one boolean - snapshot hit, live constraint check, or plain miss - with no form falling through undefined, and the no-arg extremes pinned.'
        - category: structural
          disposition: not_applicable
          rationale: Generated bash with quoted expansions, literal associative-array keys, and a character-class test routing constraint forms to pacman; no eval of package names, no arithmetic, no encoding transform - names with glob metacharacters are impossible in arch package names.
        - category: domain
          disposition: not_applicable
          rationale: Read-only pacman queries against the local package database; -Q takes no database lock and performs no network access, and the shadow adds no authority - it only answers what pacman would answer, faster.
