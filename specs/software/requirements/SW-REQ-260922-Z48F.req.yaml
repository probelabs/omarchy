          rationale: 'Worst case: the cursor parks on a disabled row where Enter silently does nothing - a cursor trap that reads as a dead menu. Closed on both input paths: movement scans rowSelectable and Enter and pointer activation gate on it too, so a skipped row cannot be fired from any direction, and the all-disabled menu ends at -1 with the cursor hidden rather than parked (settleCursor keeps the index defined but cursorActive false). boundary: the declared class covers the exact edges the scan exists for - count 0 and 1, from below zero or past the end normalized by double modulo, and the wrap scan bounded at count iterations. edge_case: a non-unit direction normalizes to a ±1 step, and a menu that grows a selectable row immediately grows a cursor on the next settle. Catalog 1.11.0 re-review: input_domain not applicable, it reads no external text input. concurrency_scale not applicable, view state recomputed from the current rows on each UI event: no process, timer or lock, and events are handled one at a time.'
        - category: property
          disposition: reviewed
          applied:
            - totality
            - determinism
          rationale: 'totality: every (from, direction, disabled-set) combination returns a defined index or -1, with the all-disabled -1 as the named third outcome. determinism: the scan walks one fixed step from a normalized start, so the same rows and cursor state always land on the same target.'
        - category: structural
          disposition: not_applicable
          rationale: The bounded for-loop is itself the termination argument (at most count iterations, no while-true wrap), double-modulo normalizes any integer from, and no arithmetic beyond index stepping exists in the slice.
        - category: domain
          disposition: not_applicable
          rationale: Cursor placement is display state inside one shell window; no trust boundary, network, crypto, or privilege surface, and no cross-process wait exists in the traced functions.
