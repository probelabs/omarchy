obligation_suppressions:
    - id: error_handling
      reason: 'bin/omarchy-menu-keybindings is a read-only display-formatting script: it runs hyprctl/xkbcli/awk pipelines whose worst-case failure is an empty or partial keybinding list presented in the menu. It mutates no state. set -e/pipefail would turn a transient tooling failure (missing xkbcli off Hyprland) into a hard abort of a menu the user invoked for something else. Recorded as an intentional degradation-not-corruption contract; no per-call guards exist upstream, which this suppression documents rather than excuses.'
      suppressed_by: agent:kimi-dogfood
      suppressed_at: "2026-09-22T17:37:30Z"
