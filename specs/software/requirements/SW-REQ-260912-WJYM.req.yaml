          rationale: 'Worst case: a shell restart leaves an orphan ext-session-lock nobody can unlock, or the recovery itself flaps, taking the lock repeatedly. error_handling: an undetermined probe answer (exit 2) leaves the strand unresolved instead of acting, and recovery refuses without passwordPamConfigured, deferring to the J8SX fail-closed denial. concurrent: checkStrandedLock refuses to probe while locked or lockRequested, and the probe onExited verdict re-checks the same flags, closing the probe-in-flight versus lock-taken race. boundary: recovered-once is the strandedLock plus strandedLockResolved latch. Catalog 1.11.0 re-review: input_domain not applicable, it reads no external text input. concurrency_scale applied, the recovery must take the session lock exactly once under repeated probe ticks.'
        - category: property
          disposition: reviewed
          applied:
            - idempotency
          rationale: 'recoverStrandedLock is idempotent per strand: the flag pair plus the probe running guard make every repeated trigger, whether the screens-changed re-arm, the retry timer, or the PAM reload, converge on at most one beginLock and one journal line.'
        - category: structural
          disposition: not_applicable
          rationale: QML flags plus one guarded beginLock call; no memory, encoding, or numeric surface.
        - category: domain
          disposition: not_applicable
          rationale: In-process recovery plus a local probe process; no external call, transport, or trust boundary.
