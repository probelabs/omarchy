id: SW-REQ-260912-41VV
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when fingerprint_sensor_configured the lock_view shall always satisfy fingerprint_indicator_tracks_sensor
description: When fingerprint authentication is available, the lock view shall show the fingerprint indicator next to the password field. When the lock service reports the reader unavailable, the lock view shall show the indicator crossed out in the error colour. It shall also show the notice "Fingerprint reader unavailable" under the field. When no fingerprint sensor is available, the lock view shall reserve no space for the indicator.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-T0XP
component: lock
rationale: 'An indicator without a working sensor invites a touch that can never authenticate. Space reserved for a missing sensor shifts the password field. Upstream #7158 added the unavailable state. A reader that the shell cannot reach now shows a crossed-out icon, not no icon. The notice explains what the icon means.'
