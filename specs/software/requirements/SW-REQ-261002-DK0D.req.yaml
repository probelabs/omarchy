id: SW-REQ-261002-DK0D
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when route_fell_back_before_load & pending_route_resolves & menu_untouched_on_root the menu_router shall eventually satisfy pending_route_opened
description: A summon can reach the menu while the shell starts, before the menu files have loaded. Its route then cannot resolve, and the menu falls back to root. The menu keeps that route pending. When a later load makes the route resolve, the menu opens it. This happens only while the menu still shows root and nothing has been typed into it.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-R8DQ
component: menu
rationale: |-
    Upstream omacom/omarchy quattro 821ae589 has this defect. The shell queues a summon that arrives before the menu plugin loads. It hands the summon to open() as soon as the plugin loads (shell.qml registerPanelLoader, deliverIfLoaded). Neither FileView has read its JSONC file at that point, and the user extension usually answers first.

    So openRoute cannot resolve the route, and openExistingMenu falls back to root. Nothing opens the route when the files land. Super+Escape right after login or a shell restart shows the main menu, and an action alias never runs.

    openRoute already writes the route to pendingInitialMenu, which nothing read since the bash menu went away (edfd68d4, 4cd6593b). The fix keeps the route pending only when the menu fell back to root. rebuildItemsFromSources opens it through openRoute once it resolves, so aliases, links and action aliases behave as for any summon.
tags: []
variables:
    - route_fell_back_before_load
    - pending_route_resolves
    - menu_untouched_on_root
    - pending_route_opened
