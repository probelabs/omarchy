          not_applicable:
            - boundary
            - input_domain
            - concurrency_scale
          rationale: 'Worst case: a summon made during startup opens the main menu, runs the default command that the user file overrides, or a pending route later pulls the user out of a menu they chose. edge_case: each load order is a case - the default file first, the user file first, a missing user file, and a menu or action override that only the user file defines (witnessed). The route waits until both files answered and gets one try. A route that resolves at once, a missing id (also when a later edit adds it), a summon after both files answered, a summon with no route, a select prompt that replaced the summon, a summon closed before the files load, and a user who typed, opened another menu, or opened one and went back to root do not replay (witnessed). An action alias runs once. boundary not applicable: the decision is a set of booleans, with no range or limit. input_domain not applicable: the route string goes through the same resolveRoute as any summon. concurrency_scale not applicable: both FileView handlers and the summon run one after the other on the GUI thread; only their order varies, which the edge cases cover.'
        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: 'Every summoned route ends in one defined state: opened at once, opened by its one try after both menu files answered while the menu is still open in menu mode and untouched, or left on root and dropped. No path opens a route the user did not summon, opens it twice, or opens it after the user typed or opened another menu.'
        - category: structural
          disposition: not_applicable
          rationale: 'One string property and one guarded call; no memory, encoding or numeric surface.'
        - category: domain
          disposition: not_applicable
          rationale: 'Menu navigation state only. Action aliases run through the same runAction path as any summon, under their own requirements.'
