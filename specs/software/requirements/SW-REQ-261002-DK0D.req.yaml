id: SW-REQ-261002-DK0D
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when route_fell_back_before_load & pending_route_resolves & menu_untouched_on_root the menu_router shall eventually satisfy pending_route_opened
description: |-
    A summon can reach the menu while the shell starts, before both menu files have answered. The default file answers when it loads. The optional user file answers when it loads or when it fails to load. Until both files answer, the route cannot resolve, so the menu falls back to root and keeps the route pending.

    When both files have answered, the menu tries the pending route one time. It opens the route if the route resolves and the menu is still open in menu mode. Then the menu drops the route, also when it did not open. The menu drops the route earlier if the user types into the menu or opens another menu.

    A summon that arrives after both files have answered does not wait. If its route does not resolve, the menu shows root and does not open the route later.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-R8DQ
component: menu
rationale: |-
    Upstream omacom/omarchy quattro 821ae589 has this defect. The shell queues a summon that arrives before the menu plugin loads. It hands the summon to open() as soon as the plugin loads (shell.qml registerPanelLoader, deliverIfLoaded). Neither FileView has read its JSONC file at that point, and the user extension usually answers first.

    So openRoute cannot resolve the route, and openExistingMenu falls back to root. Nothing opens the route when the files land. Super+Escape right after login or a shell restart shows the main menu, and an action alias never runs.

    openRoute already writes the route to pendingInitialMenu, which nothing read since the bash menu went away (edfd68d4, 4cd6593b). The fix keeps the route pending only when the menu fell back to root. rebuildItemsFromSources opens it through openRoute once it resolves, so aliases, links and action aliases behave as for any summon.

    The first version of the fix (43d787d4) opened the route as soon as it resolved. That could happen against the default file alone. So an early summon of about ran the default command when the user file overrides it. The route also stayed pending after the user opened another menu and went back to root. So a later load or a live edit could still open it.

    Review of #14055 found both. The follow-up (48405669) waits for both files, tries the route once, and drops it when the user types or opens another menu. setFilter and setActiveMenu clear it, and onLoadFailed records that the user file answered.
tags: []
variables:
    - route_fell_back_before_load
    - pending_route_resolves
    - menu_untouched_on_root
    - pending_route_opened
