        - category: property
          disposition: reviewed
          applied:
            - totality
          rationale: 'split/join over a JS string is defined for every expression value, so substitution is total: any guard expression yields a defined rewritten string; no input partition crashes or hangs the transform. malformed_input needs no separate class here - the transform never parses the expression, it only rewrites an exact literal, so unparsable shell is out of scope for this requirement and lands in the guard-execution requirements downstream.'
        - category: structural
          disposition: not_applicable
          rationale: Pure in-process JS string splitting and joining; no manual memory, pointers, format-string sinks, numeric casts, or encoding round-trips - the substitution is byte-level on an already-parsed string.
        - category: domain
          disposition: not_applicable
          rationale: In-process string transform over menu config text; no network, IPC, crypto, SQL, browser, or filesystem surface, and no domain tag on the requirement fires an applies_when.
