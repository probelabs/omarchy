          rationale: "Worst case: a transient fprintd failure during setup or an upgrade removes working fingerprint authentication, or a failure is read as an enrollment and installs a stack for a user with no print. error_handling: any answer that is neither a listed print row nor fprintd's \"has no fingers enrolled\" keeps the PAM stack, the resume hook and the drop-in byte for byte and prints the could-not-check line (witnessed: \"an unknown enrollment probe preserves existing recovery files\"). boundary: the classifier is the anchored row match ( - #N:) and the fixed phrase; a header that mentions \"- #0:\" mid-line, a non-numeric index or a reader named Fingerprint do not count as enrolled. input_domain not applicable: the answer comes from the packaged /usr/bin/fprintd-list run as root, and only an anchored pattern and a fixed phrase are matched. concurrency_scale not applicable: one probe per helper run. edge_case not applicable beyond the boundary rows above."
        - category: property
          disposition: reviewed
          applied:
            - idempotency
          rationale: 'idempotency: rerunning the helper while fprintd keeps failing leaves the same files in place every time.'
        - category: structural
          disposition: not_applicable
          rationale: A grep over the probe answer and a branch; no memory, encoding or format-string surface.
        - category: domain
          disposition: not_applicable
          rationale: Local root helper; the answer is read from a packaged binary, not from a user-writable source.
