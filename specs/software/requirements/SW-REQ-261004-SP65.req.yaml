id: SW-REQ-261004-SP65
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when fingerprint_probe_failed the apply_lock shall always satisfy fingerprint_config_kept
description: When /usr/bin/fprintd-list answers with neither an enrolled fingerprint nor an explicit report that the target user has no enrolled fingerprint, omarchy-apply-lock shall keep the existing fingerprint configuration. It shall not write or remove the PAM fingerprint stack, the fprintd resume hook or the stop-timeout drop-in, and it shall print that it could not check the enrollment.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-JW2J
component: lock
rationale: "Upstream #7158 (879d6583) stopped treating a failed enrollment probe as an empty enrollment. A transient fprintd failure during setup or an upgrade (fprintd not activatable, a D-Bus timeout) used to remove working fingerprint authentication and its recovery; now only a definite answer changes the configuration, and the helper says it could not check."
