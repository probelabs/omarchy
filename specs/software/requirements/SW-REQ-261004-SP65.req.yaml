id: SW-REQ-261004-SP65
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when fingerprint_probe_failed the apply_lock shall always satisfy fingerprint_config_kept
description: A failed probe is an answer from /usr/bin/fprintd-list that neither lists an enrolled fingerprint nor reports that the target user has none. After a failed probe, omarchy-apply-lock shall keep the existing fingerprint configuration. It shall not write or remove the PAM fingerprint stack, the fprintd resume hook or the stop-timeout drop-in. It shall print that it could not check the enrollment.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260912-JW2J
component: lock
rationale: "Upstream #7158 (879d6583) stopped treating a failed enrollment probe as an empty enrollment. Before, a transient fprintd failure during setup or an upgrade removed working fingerprint authentication and its recovery. Examples are an fprintd that the system cannot activate and a D-Bus timeout. Now only a definite answer changes the configuration, and the helper says that it could not check."
