id: SW-REQ-261004-H41S
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: when emoji_query_typed the emoji_picker shall immediately satisfy emoji_results_ranked
description: |-
    The emoji picker lists the emojis whose keywords hold the search text, and Enter picks the first emoji of the list. The picker reads emojis.json as a JSON array; text that is not a JSON array gives an empty list. The picker trims the search text and ignores case. The list has three groups in this order.

    First come the emojis that hold the search text as whole words. Next come the emojis with a keyword that starts with the search text. Last come the emojis that hold the search text inside a keyword. Each group keeps the order of emojis.json. When the search text shows in more than one place, the best place decides the group.

    A word is a run of the characters a to z, 0 to 9 and every character above U+007F. Any other character ends a word: a space, the end of the keywords, an underscore, a hyphen, a colon. So man: beard, red_haired_man and t-man hold man as a whole word. A curly apostrophe or quote is above U+007F, so it does not end a word.

    The picker shows at most 1000 emojis, from the start of this list. filterEmojis rounds a fractional limit up, as before the fix. When more emojis match, as for a single letter such as e, the picker shows the first 1000 of the ranked list. With an empty search text the picker lists emojis.json in file order, up to 1000.

    An emoji matches the search text when it matched before the fix. The fix changes the order of the list, and so it also changes which 1000 emojis show when more than 1000 match.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-260922-6642
component: menu
rationale: |-
    Upstream omacom/omarchy quattro 393a43d4 has this defect. filterEmojis in shell/plugins/emojis/EmojiSearch.js keeps every emoji whose keywords contain the search text anywhere, in the order of emojis.json. The picker selects the first result, and Enter hands it to the insert helper. So a match inside an unrelated word can come first.

    In the real shell on 393a43d4, Enter picks the broken heart for ok (from broken). It picks the face with tears of joy for tea (from tears) and the cold face for fr (from freezing). With the fix, the behaviour-diff harness shows that Enter picks the OK hand, the teacup and the flag of France.

    The fix sorts the matches into three lists while it reads emojis.json, and joins them at the end. matchRank looks at each place the search text shows and keeps the best group. isWordChar tells where a word ends. The loop stops early only when the whole-word list holds the limit. Only an empty search text puts every emoji in that list.

    The behaviour-diff harness runs the picker functions of Emojis.qml with the real filterEmojis and the real emojis.json of each revision. The witness test test/shell.d/menu-emoji-search-bdiff-test.sh checks its output for each input. The upstream test test/shell.d/emojis-test.sh checks the three groups, the limit after the ranking, the separators, a fractional limit and the OK hand for ok.
