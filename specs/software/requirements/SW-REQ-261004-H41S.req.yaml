          rationale: 'Worst case: Enter hands the insert helper an emoji the user did not ask for, such as the broken heart for ok. edge_case: a search text that is a whole keyword, the start of a keyword, or only inside a keyword; a phrase of several words; keywords that a colon, an underscore or a hyphen splits (man, rex); a search text that shows inside a word and later as a whole word; capitals and a leading space; a search text that matches nothing (all witnessed). empty_input: with no search text the picker lists emojis.json in file order up to the limit (witnessed, no-action row). boundary: more matches than the limit of 1000, as for the letter e; the picker keeps the first 1000 of the ranked list (witnessed). input_domain is not applicable: the search text is plain typed text, and filterEmojis only trims it, lowercases it and looks for it in the keywords. concurrency_scale is not applicable: one picker runs filterEmojis synchronously on each key, over one fixed list of 1870 emojis.'
        - category: property
          disposition: reviewed
          applied:
            - determinism
            - totality
          rationale: 'determinism: the same search text and the same emojis.json give the same list, because each group keeps the file order and nothing else decides the order. totality: every search text gives a list, maybe empty; an emoji with no keywords matches only the empty search text.'
        - category: structural
          disposition: not_applicable
          rationale: Three arrays and substring checks on strings that are already decoded. No memory, numeric or encoding transform beyond lowercasing, which the code also did before the fix.
        - category: domain
          disposition: not_applicable
          rationale: The order of the emojis inside the picker window only. No trust boundary, privilege, network, crypto or process surface; the insert helper and its clipboard use are outside this requirement.
