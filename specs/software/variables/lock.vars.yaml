component: lock
variables:
    - name: user_lock_requested
      type: bool
      direction: input
      description: The user invoked the session lock entry point.
    - name: ttfx_running
      type: bool
      direction: input
      description: The ttfx screensaver process is running.
    - name: ttfx_signalled
      type: bool
      direction: output
      description: SIGTERM was delivered to ttfx.
    - name: ttfx_wait_bounded
      type: bool
      direction: output
      description: The wait for ttfx exit is bounded at 1 s.
    - name: suspend_imminent
      type: bool
      direction: input
      description: logind signalled PrepareForSleep and the delay inhibitor is held.
    - name: lock_requested_before_clamshell_sync
      type: bool
      direction: output
      description: The lock IPC request precedes the clamshell helper call.
    - name: budget_bounded
      type: bool
      direction: output
      description: The wait budget is derived from logind InhibitDelayMaxUSec, reserves a fifth or at least 1000 ms, and is capped at 12000 ms.
    - name: budget_fallback_on_invalid
      type: bool
      direction: output
      description: A missing or invalid budget argument falls back to the derived budget.
    - name: budget_expired_without_secure
      type: bool
      direction: input
      description: The wait budget expired before the session reported secure.
    - name: unsecured_reported
      type: bool
      direction: output
      description: The unsecured-suspend diagnostic and critical notification were emitted.
    - name: exit_failure
      type: bool
      direction: output
      description: The script exits with status 1.
    - name: running_as_root
      type: bool
      direction: input
      description: The helper runs with EUID 0.
    - name: trusted_path_only
      type: bool
      direction: output
      description: PATH is replaced with trusted system directories before optional commands run.
    - name: fingerprint_enrollment_queried
      type: bool
      direction: input
      description: The helper tests whether the target user has an enrolled fingerprint.
    - name: fprintd_absolute_path_only
      type: bool
      direction: output
      description: fprintd-list is invoked only as /usr/bin/fprintd-list.
    - name: fingerprint_not_enrolled
      type: bool
      direction: input
      description: No enrolled fingerprint exists or /usr/bin/fprintd-list is not executable.
    - name: fingerprint_pam_removed
      type: bool
      direction: output
      description: /etc/pam.d/omarchy-lock-fingerprint is removed.
    - name: lock_state_queried
      type: bool
      direction: input
      description: A caller asked for the compositor session-lock state.
    - name: exit_zero_on_lock
      type: bool
      direction: output
      description: Exit 0 when any monitor lists LOCK in solitaryBlockedBy.
    - name: exit_one_on_answerable_unlocked
      type: bool
      direction: output
      description: Exit 1 when no monitor shows LOCK and a monitor is not blocked by WORKSPACE.
    - name: exit_two_on_undetermined
      type: bool
      direction: output
      description: Exit 2 when hyprctl fails or no monitor answer is determined.
    - name: stranded_lock_detected
      type: bool
      direction: input
      description: The stranded-lock probe found a lock this shell did not take.
    - name: stranded_lock_recovered_once
      type: bool
      direction: output
      description: The service takes the stranded lock exactly once.
    - name: recovery_logged
      type: bool
      direction: output
      description: A lock-stranded recovery event is written to the journal log.
    - name: password_pam_configured
      type: bool
      direction: input
      description: /etc/pam.d/omarchy-lock-password loaded successfully.
    - name: lock_requested
      type: bool
      direction: input
      description: The lock IPC handler received a lock request.
    - name: lock_denied_missing_pam
      type: bool
      direction: output
      description: The lock request is answered missing-pam and no session lock engages.
    - name: idle_timeout_expired
      type: bool
      direction: input
      description: The idle blank timer expired.
    - name: blank_displays
      type: bool
      direction: output
      description: The displays are blanked behind the lock.
    - name: password_auth_in_flight
      type: bool
      direction: input
      description: A password authentication is in progress.
    - name: timer_rearmed_after_suspend
      type: bool
      direction: output
      description: The blank timer is re-armed because wall-clock time shows a suspend gap.
    - name: password_text_overflows
      type: bool
      direction: input
      description: The entered password dot row is wider than the password field.
    - name: dots_scaled_within_field
      type: bool
      direction: output
      description: The password dots are scaled so the row stays inside the field.
    - name: update_run_requested
      type: bool
      direction: input
      description: A caller asked omarchy-update-lock to run a command under the update lock.
    - name: lock_unavailable
      type: bool
      direction: input
      description: Another process holds the update lock.
    - name: run_refused_with_diagnostic
      type: bool
      direction: output
      description: The run is refused with a diagnostic and exit 1 when the lock is taken.
    - name: held_state_queried
      type: bool
      direction: input
      description: A caller asked whether it holds the update lock.
    - name: held_true_only_for_owning_fd
      type: bool
      direction: output
      description: held exits 0 only for the descriptor that owns the lock.
    - name: fingerprint_sensor_configured
      type: bool
      direction: input
      description: A fingerprint sensor is enrolled and its PAM stack is installed.
    - name: fingerprint_indicator_tracks_sensor
      type: bool
      direction: output
      description: The lock view shows the fingerprint indicator exactly when a sensor is configured.
    - name: fingerprint_probe_failed
      type: bool
      direction: input
      description: The enrollment probe answered with neither an enrolled fingerprint nor an explicit empty enrollment (for example fprintd could not be reached).
    - name: fingerprint_config_kept
      type: bool
      direction: output
      description: The fingerprint PAM stack, the fprintd resume hook and the stop-timeout drop-in are left as they were.
    - name: fingerprint_pam_installed
      type: bool
      direction: input
      description: The helper writes the PAM fingerprint stack in this run.
    - name: resume_recovery_installed
      type: bool
      direction: output
      description: The fprintd resume hook and the stop-timeout drop-in are installed, and systemd reloaded, before the PAM fingerprint stack is written.
    - name: fingerprint_probe_answered
      type: bool
      direction: input
      description: "The lock screen's enrollment probe finished."
    - name: probe_lists_print
      type: bool
      direction: input
      description: The probe answer lists an enrolled fingerprint.
    - name: probe_says_none
      type: bool
      direction: input
      description: The probe answer says the user has no enrolled fingerprint, or the fingerprint PAM file or fprintd-list is missing.
    - name: fingerprint_was_configured
      type: bool
      direction: input
      description: The lock service treated fingerprint authentication as configured before the probe answered.
    - name: fingerprint_auth_configured
      type: bool
      direction: output
      description: The lock service treats fingerprint authentication as configured.
    - name: probe_miss_streak_reached
      type: bool
      direction: input
      description: At least 3 probe answers in a row were neither a listed fingerprint nor a definite none.
    - name: attempt_usable
      type: bool
      direction: input
      description: The last fingerprint attempt reached the reader (it showed a finger prompt) and did not end in a device error within 2 s of the prompt.
    - name: attempt_miss_streak_reached
      type: bool
      direction: input
      description: At least 3 fingerprint attempts in a row were not usable.
    - name: fingerprint_reader_unavailable
      type: bool
      direction: output
      description: The lock service reports the fingerprint reader unavailable to the lock view.
    - name: key_autorepeat
      type: bool
      direction: input
      description: A key press in the password field is an auto-repeat of a held key.
    - name: key_erases
      type: bool
      direction: input
      description: The key is Backspace or Delete.
    - name: key_press_dropped
      type: bool
      direction: output
      description: The password field consumes the key press without editing the text.
    - name: lock_secure_reported
      type: bool
      direction: input
      description: The shell's lock status reported the session secure within the 10 s deadline of omarchy-system-lock.
    - name: lock_exit_success
      type: bool
      direction: output
      description: omarchy-system-lock exited 0.
    - name: lock_failure_notified
      type: bool
      direction: output
      description: omarchy-system-lock sent the critical "Screen did not lock" notification.
independence:
    declared: true
    reason: 'All formalized lock guarantees at both layers constrain pairwise-disjoint output variables (verified 2026-09-27: software 0/105 pairs, system 0/10 pairs share a consequent variable, matching the engine''s connected-component pruning). The two layers now hold per-layer vars files (split 2026-09-28): each layer declares exactly the variables its own requirements consume; 5 cross-layer variables (fingerprint_pam_removed, lock_state_queried, suspend_imminent, update_run_requested, user_lock_requested) are declared in both. Cross-requirement conflicts over outputs are structurally impossible.'
