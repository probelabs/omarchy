component: notifications
variables:
    - name: chromium_sender
      type: bool
      direction: input
      description: The app name or the app icon of the notification contains chrom, brave, vivaldi, microsoft-edge or opera (case is ignored).
    - name: origin_link_at_start
      type: bool
      direction: input
      description: 'After optional white space, the body starts with an <a> tag whose content, apart from white space around it, is only a web address of this form, then </a>: an optional http:// or https:// or www., one or more labels of ASCII letters, digits and hyphens each followed by a dot, a last label of two or more ASCII letters, an optional :port and an optional path that starts with / and holds no < or white space. Case does not matter.'
    - name: message_after_link_kept
      type: bool
      direction: output
      description: sanitizeBody returns the image-stripped body without the white space before that link, the link and all the white space after it, with no other change. White space that the message starts with goes too.
